DAY=MO,TU</code> às 8h15 produz ocorrências às 8h15 locais antes e depois da mudança de horário de verão, com instantes UTC diferentes","Horário local inexistente ou repetido na virada é resolvido por regra documentada, com teste","A expansão de uma semana de 7 dias lê só os modelos do aluno e as exceções do intervalo, em uma consulta"]},"p2:ROT-03":{"c":"Plano de estudo, sessões, capítulos lidos e progresso no Postgres, com a sugestão do próximo item e a leitura da semana calculadas no Go","q":"(Go) Sem escrever o planejador, monte à mão no Postgres a semana 4 do ciclo com 7h20 estudadas e um item feito fora de ordem. Descubra qual deve ser o \"próximo sugerido\" e se ele muda quando o aluno marca o item da semana seguinte antes de fechar o atual.","a":["O próximo sugerido é o primeiro item não feito na ordem da rota, e a mesma entrada dá sempre a mesma saída","A leitura da semana é derivada dos itens: a união dos capítulos dos dois itens, sem repetir, com os já lidos marcados; não existe \"capítulo atual\" gravado à parte","A semana 6 do ciclo é marcada como leve, com a meta reduzida, e o contador reinicia depois dela","Sessões e progresso persistem no Postgres, e o total de horas é a soma das sessões, não um contador solto"]},"p2:ROT-04":{"c":"Planejador de lotes em Go com a restrição de validade, testado com semanas de escritório diferentes","q":"(Go) Planeje com uma regra só: \"tudo na geladeira\". Rode para uma semana com escritório na segunda e na terça e liste as porções que seriam comidas no quarto dia ou depois.","a":["Nenhuma porção na geladeira é consumida mais de 3 dias depois de cozida, em qualquer combinação de dias de escritório","O total de porções cobre as refeições do plano até a próxima janela, sem sobra de mais de uma porção","Trocar um dia de escritório recalcula só as janelas afetadas"]},"p2:ROT-05":{"c":"Reorganização gulosa por prioridade com detecção de sobreposição, explicada ao aluno","q":"Escreva o dia da quarta com a reunião até 20h e rode um detector de sobreposição que só diz \"conflito\". Conte quantas decisões ainda dependem de uma pessoa para o dia ficar válido.","a":["Sobreposições são detectadas ordenando os blocos pelo início, em O(n log n), e dois blocos que só se tocam (um termina às 19h30, outro começa às 19h30) não conflitam","O sono às 23h30 nunca é movido; o treino é deslocado antes de ser cortado; o estudo é cortado antes do trabalho","A revisão encolhe até 25 min e nunca some","Nenhum bloco é movido para o domingo, e se não cabe em outro dia a resposta diz isso","Cada corte ou deslocamento vem com a razão (\"prática cortada: sono tem prioridade e acabaria às 23h40\")"]},"p2:BD-04":{"c":"Pool dimensionado, statement_timeout e pool separado para relatórios","q":"Dispare 15 relatórios simultâneos com o k6 e observe as estatísticas do pgxpool (espera para adquirir conexão) e as sessões ativas no <code>pg_stat_activity</code>.","a":["Tamanho do pool justificado pela Lei de Little com números medidos (vazão × tempo com a conexão)","<code>statement_timeout</code> e <code>idle_in_transaction_session_timeout</code> configurados, com o erro tratado na API","Pool separado para relatórios, de modo que o p95 de \"Hoje\" não muda com 15 relatórios rodando","O relatório sai do caminho quente: roda em segundo plano ou numa tabela de resumo pré-calculada"]},"p2:CON-01":{"c":"Data race achado com -race e resolvido com mutex, atomic ou canal, com benchmark","q":"Teste com 1.000 goroutines incrementando o mesmo contador; rode com e sem <code>-race</code> e compare o total final e o relatório do detector.","a":["<code>go test -race</code> limpo, rodando no <code>make verify</code>","Benchmark de <code>Mutex</code>, <code>RWMutex</code>, <code>atomic</code> e mapa fatiado com 1, 8 e 64 goroutines, com o gráfico no registro","O contador por academia usa a opção que o benchmark justifica, e o número nunca fica negativo","O estado em memória é reconstruído a partir dos check-ins abertos quando o processo reinicia"]},"p2:TRE-07":{"c":"Traces OpenTelemetry no Go, do handler à query e ao publish","q":"","a":["Painel com taxa, erros e p50/p95/p99 por endpoint","O trace de uma finalização mostra o handler HTTP, cada query do pgx e o publish do evento, cada um como um span","Alerta quando o p95 de \"Finalizar treino\" passa de 1 s por 2 min"]},"p2:CON-02":{"c":"Importação em pipeline com worker pool e errgroup, com o speedup medido","q":"Rode com 1, 4, 16, 64 e 256 workers e plote vazão e erros; ache onde a curva para de subir e quem passa a ser o gargalo (banco ou disco).","a":["Pipeline em estágios (ler, normalizar, gravar) com canais com buffer e workers por estágio, com a gravação em lotes","Cancelar com Ctrl+C para tudo em menos de 2 s, sem goroutine vazando (<code>goleak</code> no teste)","Erro numa linha não derruba a importação; as falhas saem num relatório","Speedup medido e explicado no registro, com o ponto em que deixa de escalar"]},"p2:CON-03":{"c":"Relatórios gerados por workers com fila, sem afetar a API, com pprof","q":"Gere os relatórios no processo da API e meça o p95 de \"Hoje\" durante o lote. Depois rode com <code>GOMAXPROCS</code> 1, 2, 4 e 8 e calcule o speedup.","a":["Relatórios gerados por workers dedicados, consumindo uma fila, em processo separado da API","O p95 da API não muda de forma mensurável enquanto o lote roda","Perfil de CPU no pprof e uma otimização tirada do perfil, não de palpite","Speedup medido e explicado no registro, separando a parte limitada por CPU (agregação) da limitada por I/O (consultas e gravação)"]},"p2:CON-04":{"c":"Cancelamento propagado do handler à query, sem goroutine órfã","q":"Dispare o envio de 40 séries, cancele a requisição no cliente e veja no <code>pg_stat_activity</code> que as queries seguem vivas.","a":["O <code>context.Context</code> da requisição chega do handler ao pgx; a query some do <code>pg_stat_activity</code> em menos de 1 s após o cancelamento","Teste com <code>goleak</code> mostra que nenhuma goroutine fica órfã depois do cancelamento","Orçamento de tempo por rota, dividido entre as chamadas internas por deadline","Cancelar no meio não deixa metade das séries gravadas: a transação desfaz tudo ou o lote é idempotente"]},"p2:ASS-03":{"c":"Timeouts, circuit breaker e bulkhead em volta do gateway, medidos com o gateway lento","q":"Ponha o gateway simulado em 8 s de latência, dispare 100 assinaturas por segundo e observe o número de goroutines, as conexões livres do pool e o p95 da rota \"Hoje\".","a":["Com o gateway em 8 s, a assinatura responde com p95 ≤ 300 ms, com o pagamento em PENDENTE","Cada chamada ao gateway tem timeout de 3 s e propaga o contexto: cancelar a requisição cancela a chamada","O circuit breaker abre após 5 falhas seguidas, testa em meio-aberto e fecha quando o gateway volta","O bulkhead limita a 20 chamadas simultâneas ao gateway; o p95 da rota \"Hoje\" não muda durante o teste","Goroutines e conexões livres do pool ficam estáveis durante a lentidão"]},"p2:AGE-04":{"c":"Check-in por QR assinado, validado sem banco, aguentando o pico com k6","q":"Escreva um teste k6 em TypeScript que simula 400 check-ins em 60 segundos contra a versão atual, com a consulta ao banco no caminho, e registre p95 e p99. Esse é o 4 s que vamos derrubar.","a":["O token do QR é assinado (Ed25519), com validade de 30 s, e a verificação não faz nenhuma consulta ao banco (contador de queries em zero no teste)","Token expirado ou adulterado recebe 401 em menos de 5 ms de CPU","Com 400 check-ins em 60 s, p95 ≤ 100 ms, e o serviço é stateless com 3 réplicas atrás do balanceador","O registro vai para uma fila e é gravado de forma idempotente por aluno e janela; com a fila fora do ar, a catraca ainda libera e o registro é recuperado depois","O k6 roda no CI com limite de p95 que quebra o build"]},"p2:MSG-01":{"c":"Consumidor de recordes idempotente, testado com reentrega","q":"Mate o consumidor com kill -9 entre o efeito e o ack, em loop, e conte as medalhas duplicadas no aluno do seed.","a":["Tabela de eventos processados (id do evento, consumidor) gravada na mesma transação do efeito; a duplicata é ignorada","Caos: 1.000 eventos de treino, consumidor morto 50 vezes, zero medalha duplicada e zero perdida","Registro apontando a linha exata do código em que a entrega pelo menos uma vez vira efeito único","Teste de reentrega no CI: o mesmo evento entregue três vezes produz um único recorde"]},"p2:MSG-02":{"c":"Ordem por aluno garantida pela chave de partição e eventos atrasados tratados","q":"Publique os eventos de um mesmo treino em partições diferentes (ou com dois consumidores numa fila) e reproduza a inversão.","a":["Chave de partição = id do aluno; os eventos de um aluno chegam na ordem em que foram gravados","Cada evento carrega um número de sequência por treino; o consumidor descarta o de sequência menor que a já aplicada e segura o que pula uma posição","Evento atrasado depois de \"treino.finalizado\" reabre o resumo e o recalcula, em vez de ser ignorado","Subir e derrubar consumidores do grupo (rebalance) sem inverter nem perder evento"]},"p2:MSG-03":{"c":"Outbox transacional com relay, sem perda nem vazamento","q":"Coloque um os.Exit entre o COMMIT e o publish, rode 1.000 treinos e conte quantos ficaram sem evento.","a":["O evento é gravado na tabela outbox na mesma transação do treino; o treino sem evento passa a ser impossível","Relay publica as linhas pendentes e as marca como enviadas; duas instâncias em paralelo não disputam as mesmas linhas nem inventam duplicata (a duplicata que sobrar é absorvida pelo MSG-01)","Caos: processo morto 50 vezes entre o commit e o publish, zero evento perdido","A outbox é limpa sem DELETE gigante (em lote ou por partição)"]},"p2:MSG-04":{"c":"Evolução do evento com compatibilidade nos dois sentidos, testada","q":"Publique a versão nova com o consumidor antigo rodando e veja o ranking absurdo.","a":["Contrato do evento versionado (Protobuf ou JSON Schema) e checado no CI contra a versão anterior","Regra registrada: só mudança compatível (campo novo opcional); mudar a unidade ou o significado exige evento novo (por exemplo \"treino.finalizado.v2\"), publicado em paralelo até migrar todos","Compatibilidade nos dois sentidos testada: consumidor novo lê evento antigo e consumidor antigo lê evento novo sem quebrar","Um consumidor novo reprocessa um dia de eventos a partir do offset zero, provando que o histórico serve de fonte"]},"p2:MSG-05":{"c":"SQS com visibilidade certa, DLQ e redrive no LocalStack","q":"No LocalStack, crie a fila com 30 s de visibilidade, rode dois workers e conte quantos lembretes saem por refeição; depois publique uma mensagem inválida e veja quantas vezes ela volta.","a":["O worker estende a visibilidade enquanto trabalha (ChangeMessageVisibility em heartbeat) e o efeito é idempotente, como no MSG-01","Long polling e leitura e exclusão em lote, com as requisições por mil mensagens anotadas antes e depois","DLQ com maxReceiveCount = 5 e redrive de volta para a fila depois de corrigir o bug","Alarme de profundidade da DLQ no Grafana"]},"p2:MSG-06":{"c":"Fan-out SNS para SQS com três consumidores independentes","q":"Ponha os três consumidores numa fila só e veja quem recebe cada mensagem e quanto o ranking espera.","a":["Um tópico SNS com uma fila SQS por consumidor (fan-out), cada fila com DLQ própria","Filter policy: o ranking só recebe treinos de alunos que aderiram a um desafio, filtrado no SNS, sem código no consumidor","Derrubar o resumo semanal por uma hora não atrasa os outros dois, e ele recupera o atraso sozinho ao voltar","Os três consumidores idempotentes, como no MSG-01"]},"p2:MSG-07":{"c":"Kafka com partições por aluno, consumer group e lag medido","q":"Suba 3 brokers, produza 5.000 eventos de treino com acks=1, derrube o líder no meio e conte as perdas; repita com acks=all. Depois escale o consumidor e conte os reprocessados.","a":["Chave = id do aluno, 12 partições, fator de replicação 3, min.insync.replicas=2 e acks=all com produtor idempotente: nenhuma perda ao derrubar um broker","Consumer group com commit de offset depois do efeito e rebalance cooperativo; o reprocessamento do rebalance é absorvido pela idempotência do MSG-01","Lag por grupo e partição no Grafana, com alerta acima de 30 s","Retenção por tempo no tópico de treinos, justificada por escrito"]},"p2:MSG-08":{"c":"ADR comparando fila, log e pub/sub para os fluxos do app","q":"Implemente o mesmo fluxo (\"treino finalizado\" até o recorde) na fila, no SNS com SQS e no Kafka, e meça a latência p99, as perdas no caos do MSG-01 e as linhas de código de cada um.","a":["Registro de decisão (ADR) com cada fluxo do app e a tecnologia escolhida por critério (ordem, replay, retenção, fan-out, quem opera), não por gosto","Custo estimado de cada opção para 50 mil alunos ativos, com as premissas escritas","O registro responde o que mudaria cada escolha (volume, replay, ordem, equipe de operação)","Tabela de decisão cruzando os resultados medidos do MSG-06 e do MSG-07"]},"p2:MSG-09":{"c":"Lembretes agendados com jitter e rate limit, sem thundering herd","q":"Com o k6, dispare 25 mil lembretes no mesmo segundo contra um provedor falso que aceita 500 por segundo, e meça quantos chegam, em quanto tempo e quantos retries a rajada gera.","a":["Agendamento com jitter: o lembrete de 8h45 sai espalhado numa janela de 5 minutos, sem passar do horário local de cada aluno","Rate limit no envio ao provedor, com as mensagens excedentes esperando em fila atrasada em vez de falhar","Retry com backoff exponencial e jitter, com teto de tentativas e DLQ","Provedor fora do ar por 2 minutos: nenhum lembrete perdido e nenhuma rajada de retry quando ele volta"]},"p2:ASS-04":{"c":"Webhook do gateway vira evento e chega ao SSE pelo outbox","q":"","a":["O webhook do gateway vira evento pelo outbox (MSG-03) e chega ao SSE","Webhook entregue duas vezes gera um só evento, e os ids dos eventos são crescentes por assinatura"]},"p2:ASS-05":{"c":"Retry com backoff e jitter pelo outbox, sem cobrança dupla","q":"","a":["As chamadas ao gateway caem para &lt; 1/s em até 10 s depois da queda","Pendentes processados em ≤ 5 min depois da volta, com 5 falhas seguidas indo para a DLQ visível no dashboard","Em 1.000 assinaturas durante a queda, nenhuma cobrança duplicada"]},"p2:AGE-03":{"c":"Fila de espera por aula com janela de 15 min, dirigida por eventos","q":"","a":["Cancelamento com 5 pessoas na fila: só o primeiro recebe o aviso, e a vaga fica reservada a ele","Sem confirmação em 15 minutos (relógio controlado no teste), a reserva expira e o segundo é avisado; o primeiro volta ao fim ou sai, conforme a regra definida","O evento de vaga liberada entregue duas vezes avisa uma vez só","Matar o consumidor no meio da passagem de vez não perde nem duplica o aviso","Fila vazia devolve a vaga ao público, e a ordem da fila é a do instante de entrada"]},"p2:ROT-06":{"c":"Resumo das 22h por aluno, dirigido por eventos e idempotente","q":"Faça o consumidor processar a mesma mensagem duas vezes, como acontece quando a fila reentrega por timeout, e veja o aluno receber dois resumos. Depois mude o fuso do perfil de um aluno para <code>Europe/Lisbon</code> e veja a que hora o job dispara.","a":["O resumo sai às 22h no fuso do aluno, e uma mudança de fuso reagenda o próximo disparo","Reentrega da mesma mensagem resulta em um só envio, com chave por aluno e data local","O conteúdo vem dos eventos do dia (blocos feitos, treino, estudo) e do plano de amanhã, sem varrer o histórico","Uma falha no envio vai para nova tentativa e, esgotada, para a DLQ, sem duplicar o resumo","O disparo de 50 mil alunos distribui a carga ao longo da hora, sem pico em um único segundo"]},"p2:DIS-01":{"c":"Fronteiras dos módulos revistas e um serviço extraído, com ADR","q":"Liste toda query que cruza as fronteiras (JOIN entre assinatura, cobrança e acesso) e toda transação que abrange as três.","a":["Fronteiras dos módulos redesenhadas no monólito modular, com dependências só por interface; teste de arquitetura no CI falhando em import proibido","Um serviço extraído em Go (o candidato mais óbvio é o acesso da catraca, por ter perfil de carga e deploy próprios) com banco próprio, chamado por API; nenhum JOIN cruza a fronteira","Migração estilo strangler: tráfego desviado por feature flag, com volta imediata","ADR com o mapa de contextos, a quanta resultante e o que ficou pior (latência, consistência, operação)"]},"p2:DIS-02":{"c":"Saga orquestrada com estado persistido e compensações idempotentes","q":"Injete falha em cada passo; depois mate o orquestrador entre os passos e anote o estado final de cada banco.","a":["Orquestrador com máquina de estados persistida; ao reiniciar, retoma do passo em que parou","Uma compensação idempotente e testada para cada passo (estornar, revogar o acesso, desatribuir os profissionais); as boas-vindas ficam por último, porque não têm compensação","Caos: falha em qualquer passo ou queda do orquestrador sempre termina em ATIVA ou CANCELADA, com cobrança e acesso conciliados","Cada comando do orquestrador carrega uma chave de idempotência, como no ASS-02"]},"p2:DIS-03":{"c":"Saga coreografada comparada com a orquestrada em ADR","q":"Reimplemente o fluxo do DIS-02 só com eventos, num branch, e tente responder \"em que passo está a assinatura do aluno 123?\".","a":["O fluxo coreografado passa no mesmo teste de caos do DIS-02","Todos os eventos de uma assinatura ligados no mesmo trace do OpenTelemetry por um correlation id","ADR comparando as duas versões em código, testes, acoplamento e tempo para diagnosticar uma falha","Consulta que lista as assinaturas paradas há mais de 10 minutos em algum passo"]},"p2:CON-05":{"c":"Job com SKIP LOCKED, desligamento gracioso e lease entre instâncias","q":"Suba 2 instâncias e conte quantas vezes cada vaga foi liberada; depois pause com <code>SIGSTOP</code> a instância que segura o lease, espere o TTL vencer e retome.","a":["Cada vaga liberada exatamente uma vez, com 2 instâncias e uma delas pausada no meio","Desligamento gracioso: no <code>SIGTERM</code>, o job termina o item em andamento em até 10 s e para de pegar novos","Fencing token: a escrita de quem perdeu o lease é recusada pelo banco","Registro explicando por que um lock com TTL sozinho não garante exclusão"]},"p2:ASS-02":{"c":"Renovação com eleição de dono, lease, fencing token e idempotência por ciclo","q":"Suba 3 réplicas e conte quantas vezes cada assinatura foi cobrada no ciclo. Depois pause com SIGSTOP a réplica que detém o lock, espere o TTL vencer, deixe outra assumir e retome a pausada.","a":["Cada assinatura é cobrada exatamente uma vez por ciclo, com 3 réplicas e uma delas pausada no meio","Fencing token: a escrita de quem perdeu a liderança é recusada pelo banco","A chave de idempotência é (assinatura, ciclo) e vai também ao gateway, de modo que um retry depois de timeout não cobra de novo","Registro explicando por que um lock com TTL sozinho não garante exclusão"]},"p2:DIS-04":{"c":"Modelo de leitura do painel alimentado por eventos, reconstruível","q":"Rode o painel junto com o k6 do registro de treino e meça o p95 do registro com e sem ele.","a":["Modelo de leitura separado (tabela desnormalizada por aluno e semana) alimentado pelos eventos da trilha MSG","Painel abre em menos de 300 ms para 40 alunos","Projeção reconstruída do zero a partir do log em menos de 10 minutos","O painel mostra \"atualizado há X s\", e o atraso da projeção aparece no dashboard"]},"p2:DIS-05":{"c":"Ledger de créditos com event sourcing e saldo projetado","q":"Tente responder \"por que meu saldo é 7?\" com o modelo atual para três alunos.","a":["O ledger guardado como eventos (comprado, usado, devolvido, expirado, estornado), com o saldo como projeção","Snapshot a cada 50 eventos, com saldo idêntico com e sem snapshot","Concorrência otimista no stream (versão esperada) impedindo o uso da mesma aula por duas reservas simultâneas, como na última vaga do AGE-02","Consulta de auditoria que lista, em ordem, todo evento do saldo de um aluno"]},"p2:DIS-06":{"c":"Cancelamento durante a saga com lock semântico e estados intermediários","q":"Dispare o cancelamento em cada passo da saga, com atrasos aleatórios, e anote o estado final do pagamento e da catraca.","a":["Estados intermediários explícitos (COBRANDO, CANCELANDO) e lock semântico: enquanto a saga está em curso, o cancelamento vira um pedido registrado, não uma escrita concorrente","Cancelamento durante a cobrança espera o resultado do gateway e depois compensa (estorna e revoga o acesso)","Caos: cancelamento em qualquer ponto da saga termina com pagamento e acesso conciliados, nunca cobrança sem acesso nem acesso sem cobrança","Cancelamento repetido pelo aluno não gera dois estornos"]},"p2:ROT-07":{"c":"Modelo de leitura semanal alimentado por eventos dos módulos","q":"(Go) Escreva a revisão como uma consulta que une estudo, treinos, refeições e pesagens, e meça o tempo com o histórico do seed de 5 anos. Anote quantas tabelas ela toca e o que quebra se um módulo mudar o schema.","a":["O modelo de leitura é uma linha por aluno e semana, atualizada por eventos dos módulos","Reprocessar os eventos de uma semana produz a mesma linha, e um evento repetido não soma duas vezes","Abrir a revisão lê uma linha, em p95 abaixo de 50 ms com o seed completo"]},"p2:BD-05":{"c":"Bloat medido e controlado com autovacuum, fillfactor e HOT updates","q":"Rode 1 hora de carga de updates com o autovacuum padrão e meça o tamanho da tabela, <code>n_dead_tup</code> e a fração de HOT updates em <code>pg_stat_user_tables</code>.","a":["Tamanho da tabela estável depois de 1 hora de carga","Mais de 90% dos updates como HOT, com <code>fillfactor</code> e índices ajustados","Registro explicando, com <code>xmin</code> e <code>xmax</code>, por que um <code>UPDATE</code> grava uma linha nova","Autovacuum configurado por tabela, com o tempo entre execuções visível no dashboard"]},"p2:BD-06":{"c":"Réplica de leitura com ler a própria escrita garantido","q":"Suba primário e réplica por streaming replication no Compose, injete atraso de rede na réplica e reproduza a leitura antiga.","a":["Lag da réplica no dashboard, a partir de <code>pg_stat_replication</code>","Ler a própria escrita: quem acabou de finalizar um treino o enxerga no histórico, por janela no primário ou esperando o LSN","Teste que falha sem a solução e passa com ela, com a réplica atrasada em 5 s","Leituras de outros alunos continuam indo para a réplica, com a fração medida"]},"p2:BD-07":{"c":"Séries particionadas por mês com BRIN e pruning medidos","q":"Meça a consulta do último mês, o gráfico de um aluno com cinco anos de dados e um <code>DELETE</code> de um ano inteiro na tabela única.","a":["Séries particionadas por mês, com partition pruning visível no <code>EXPLAIN</code> (só as partições do período aparecem)","Índice BRIN na data comparado ao B-tree, com tamanho e tempo medidos","Arquivar um mês é <code>DETACH PARTITION</code> mais exportação, sem <code>DELETE</code>","Registro com o que a chave de partição impede (unicidade global, chaves estrangeiras) e como você contornou"]},"p2:BD-08":{"c":"Restauração PITR ensaiada, com RPO e RTO medidos","q":"Na massa grande, rode o <code>DELETE</code> e tente voltar só com o <code>pg_dump</code> noturno; anote o que se perdeu e quanto tempo levou.","a":["Backup base e arquivamento contínuo do WAL (pgBackRest ou WAL-G), guardados num bucket do LocalStack","Restauração para um instante (PITR) um minuto antes do <code>DELETE</code>, com RPO de 5 min e RTO de 30 min medidos e registrados","Restauração ensaiada com cronômetro e repetida automaticamente toda semana, conferindo contagens e somas das tabelas principais","Registro dos passos do ensaio, de modo que outra pessoa consiga repetir sem você"]},"p2:BD-09":{"c":"Migração expand and contract com backfill em lotes, sem downtime","q":"Rode a migração direta com o k6 ligado e duas versões da API ao mesmo tempo; conte os erros 5xx e capture o lock no <code>pg_locks</code>.","a":["Migração em expandir e contrair (coluna nova, escrita nas duas, backfill em lotes, leitura na nova, remoção da antiga), com zero erro 5xx no k6 durante o deploy","Backfill em lotes de 10 mil linhas, retomável e sem segurar lock por mais de 100 ms","<code>CREATE INDEX CONCURRENTLY</code> para índices novos e <code>lock_timeout</code> em toda migração","A remoção da coluna antiga só acontece depois que nenhuma versão da API a lê, confirmado por métrica"]},"p2:SEC-01":{"c":"Autorização por recurso em toda consulta, com testes de acesso a dado alheio","q":"Com dois alunos de teste, percorra todos os endpoints de recurso (avaliação, peso, medidas, dieta, treino) trocando os ids de um pelos do outro e liste o que vaza.","a":["Todo endpoint de recurso do aluno filtra pelo dono, e id de outro aluno responde 404","Um teste gerado a partir do contrato do BASE-02 tenta o acesso cruzado em todos os endpoints e roda no make verify","Ids expostos não são sequenciais (UUIDv7), sem tratar isso como controle de acesso","Uma consulta nova sem filtro de dono faz o teste falhar"]},"p2:SEC-02":{"c":"Senhas com argon2id, sessões seguras e limite de tentativas","q":"Entre com uma senha fraca, copie o cookie para outro navegador, troque a senha e veja se o cookie copiado ainda funciona. Depois tente cem senhas seguidas numa conta.","a":["Senha guardada com argon2id e parâmetros registrados; senhas fracas recusadas","Sessão em cookie HttpOnly, Secure e SameSite=Lax, com expiração por inatividade e rotação do identificador no login; todas as sessões são revogadas quando a senha muda","Limite de tentativas por conta e por IP, com espera crescente e sem revelar se o e-mail existe","Passkeys (WebAuthn) como opção de entrada"]},"p2:SEC-03":{"c":"Papéis e vínculos aplicados no servidor e auditoria imutável","q":"Liste as ações sobre o aluno (ver peso, editar dieta, editar treino, exportar dados) e, para cada papel (aluno, treinador, nutricionista, gestor, suporte), teste no servidor quem consegue fazê-las hoje, com e sem vínculo.","a":["Papel e vínculo ativo, com consentimento do aluno, conferidos no servidor em toda leitura e escrita de dado de saúde","Trilha de auditoria só de acréscimo, com quem, o quê, quando, antes e depois, consultável por aluno e por recurso","A aplicação não consegue alterar nem apagar linhas da auditoria"]},"p2:SEC-04":{"c":"Exclusão por crypto-shredding cobrindo banco, eventos e modelo de leitura","q":"Faça o pedido de exclusão de um aluno de teste e procure o peso e o e-mail dele em tabelas, tópicos, projeções e no último backup restaurado.","a":["Dado de saúde cifrado com uma chave por aluno; na exclusão, a chave é apagada e os eventos antigos ficam ilegíveis","Tabelas e modelo de leitura apagam ou anonimizam o que é do aluno, e o pedido tem estado rastreável (recebido, em andamento, concluído) com data","Backups não são reescritos: a chave apagada os torna ilegíveis depois de restaurados","Exportação dos dados do aluno em JSON antes da exclusão, e lista documentada do que precisa ser mantido por obrigação legal, só com o mínimo exigido"]},"p2:SEC-05":{"c":"Rate limit por token bucket por IP e por conta, com 429 correto","q":"Rode o robô no k6 junto com a carga normal e meça o p95 da busca dos alunos reais com e sem o robô.","a":["Limite por IP e por conta com token bucket, com estado compartilhado entre as réplicas da API","Resposta 429 com Retry-After quando o limite estoura, sem consultar o banco","Com o robô ativo, o p95 dos alunos reais na busca não muda de forma mensurável","Requisições limitadas aparecem em métrica e no dashboard, com alerta"]},"pi:INT-01":{"c":"O front aponta para o Go mudando só a URL base, e a suíte e2e passa","q":"","a":["Cada divergência achada vira primeiro um caso no teste de contrato e só depois é corrigida, no Go ou no contrato"]},"pi:DIE-05":{"c":"O Go dispara o webhook de revalidação quando um alimento muda","q":"","a":["Na integração, o Go dispara o webhook de revalidação quando o alimento muda, com assinatura que o front confere","Se o webhook falhar, há nova tentativa e um registro do alimento pendente; o dado não fica velho em silêncio"]},"pi:TRE-07":{"c":"O trace começa no toque do front e vai até a query","q":"","a":["Painel com taxa, erros e p50/p95/p99 por endpoint","O trace de uma finalização mostra o handler HTTP, cada query do pgx e o publish do evento, cada um como um span","Alerta quando o p95 de \"Finalizar treino\" passa de 1 s por 2 min"]},"pi:PERF-01":{"c":"O RUM vai para o Go e vira p75 por página no Grafana","q":"Abra o Hoje e a Biblioteca com a rede limitada a 4G lento e CPU 6x mais lenta, e compare com a medição sem limitação no seu notebook. Anote a diferença de LCP antes de mexer em qualquer coisa.","a":["O endpoint de RUM grava as medidas e o p75 por página aparece no Grafana, separado por tipo de conexão (INT-01)","Medidas de usuários que não consentiram na coleta (CNT-03) são descartadas no servidor"]},"pi:SEC-02":{"c":"O login do front passa a usar a sessão do Go","q":"Entre com uma senha fraca, copie o cookie para outro navegador, troque a senha e veja se o cookie copiado ainda funciona. Depois tente cem senhas seguidas numa conta.","a":["Senha guardada com argon2id e parâmetros registrados; senhas fracas recusadas","Sessão em cookie HttpOnly, Secure e SameSite=Lax, com expiração por inatividade e rotação do identificador no login; todas as sessões são revogadas quando a senha muda","Limite de tentativas por conta e por IP, com espera crescente e sem revelar se o e-mail existe","Passkeys (WebAuthn) como opção de entrada"]},"pi:SEC-03":{"c":"O painel da Parte 1 passa a respeitar os papéis do Go","q":"Liste as ações sobre o aluno (ver peso, editar dieta, editar treino, exportar dados) e, para cada papel (aluno, treinador, nutricionista, gestor, suporte), teste no servidor quem consegue fazê-las hoje, com e sem vínculo.","a":["Papel e vínculo ativo, com consentimento do aluno, conferidos no servidor em toda leitura e escrita de dado de saúde","Trilha de auditoria só de acréscimo, com quem, o quê, quando, antes e depois, consultável por aluno e por recurso","A aplicação não consegue alterar nem apagar linhas da auditoria"]},"p3:PWA-01":{"c":"Manifesto, service worker e app shell offline com o treino do dia","q":"Com o app rodando contra o Go (INT-01), ative o modo avião no DevTools e abra <code>/hoje</code>. Anote o que quebra: o HTML, os scripts, a fonte ou a lista de exercícios. Cada falha é uma estratégia de cache que falta.","a":["Manifesto com nome, ícones de 192 e 512 px, <code>display: standalone</code> e <code>start_url</code> em <code>/hoje</code>; o navegador oferece \"Instalar\" e o app abre sem barra de endereço","Service worker faz precache do app shell; com a rede desligada, o <code>/hoje</code> abre em menos de 1 s e mostra o treino do dia","O treino do dia (exercícios, séries-alvo e carga sugerida em gramas) é baixado ao abrir o \"Hoje\" com rede e guardado para uso offline","Sem o treino baixado, a página offline diz isso e oferece o último treino concluído, em vez de um erro genérico","Sair da conta apaga os caches com dados do aluno, porque peso e dieta são dados de saúde"]},"p3:PWA-02":{"c":"Séries no IndexedDB com fila de sincronização idempotente","q":"Registre 8 séries com a rede desligada, feche a aba, ligue a rede e reenvie o lote duas vezes. Conte quantas séries existem no histórico: se passar de 8, o servidor não é idempotente.","a":["(tela) Cada série é gravada no IndexedDB antes de qualquer chamada de rede, com um UUID gerado no aparelho; o botão responde em menos de 100 ms mesmo offline","(tela) Uma fila de envio guarda os lotes pendentes e mostra \"3 séries aguardando sincronização\"; ao voltar a rede, esvazia sozinha, com recuo exponencial entre tentativas","(Go) O endpoint de sync aceita um lote com chave de idempotência por série; reenviar o mesmo lote cinco vezes grava 8 séries, não 40","(Go) Se parte do lote já foi gravada, a resposta diz o que entrou e o que já existia, e o cliente remove da fila só o que foi confirmado","(tela) Fechar o app no meio do envio e abrir de novo retoma sem perder nem duplicar (o mesmo teste do TRE-05, agora com a rede caindo)"]},"p3:PWA-03":{"c":"Web Push com VAPID enviado pelo Go, com preferências por tipo","q":"","a":["(tela) A permissão só é pedida depois de uma ação que a justifica, como ativar \"Lembrar do café\" nas preferências, com uma explicação antes do diálogo do navegador","(tela) Preferências por tipo (refeição, suplemento, treino, aula) e por horário, gravadas por aluno; desligar um tipo não desliga os outros","(Go) A inscrição Web Push do aparelho é guardada por aluno, com várias inscrições por conta; o envio usa chaves VAPID e remove a inscrição que o serviço de push devolve como expirada","(Go) O horário vem da hora local e do fuso do aluno: 8h45 em São Paulo chega às 8h45, inclusive na troca de horário de um aluno que viaja","(tela) Tocar na notificação abre o app na refeição ou no treino certo, e uma notificação já visualizada não reaparece"]},"p3:PWA-04":{"c":"Escritas concorrentes detectadas e mescladas por série","q":"Faça as duas edições offline e sincronize na ordem tablet, celular. Com last-writer-wins por treino inteiro, a edição do tablet some. Registre isso como teste vermelho.","a":["(Go) Cada treino carrega uma versão por aparelho (vetor de versões ou contador por réplica); o servidor detecta que duas escritas partiram da mesma base e não as trata como sequenciais","(Go) O merge é por série: cargas e repetições de séries diferentes se combinam; só a mesma série editada nos dois aparelhos é conflito real","(Go) O conflito real mantém as duas versões e marca a série, em vez de descartar uma pelo relógio do aparelho","(tela) O aluno vê \"esta série foi alterada em dois aparelhos\" com as duas opções e escolhe com um toque","(tela) O teste acima termina com a carga de 62500 g e a quarta série removida, sem perda"]},"p3:PERF-04":{"c":"Abertura do PWA instalado medida em campo e abaixo de 1,5 s","q":"Instale o PWA, feche-o, ative o modo avião e abra de novo; depois repita com rede 4G lenta. Meça o tempo até o treino do dia aparecer, em build de produção.","a":["App shell servido do cache pelo service worker, sem esperar a rede para pintar a estrutura (PWA-01)","Treino do dia pré-carregado no cache quando o app abre, para que o próximo acesso não dependa de rede","Código dividido por rota, com o JavaScript inicial de cada tela medido e registrado","Tempo de abertura do PWA instalado medido em campo, com p75 abaixo de 1,5 s"]},"p3:IMP-01":{"c":"Upload de FIT e GPX com parse em streaming e deduplicação","q":"","a":["(tela) Upload de arquivo FIT ou GPX com barra de progresso e prévia (data, distância, voltas) antes de confirmar","(Go) O arquivo é lido em streaming, sem carregar tudo na memória: um arquivo de 50 MB não passa de poucos MB de heap, medido no teste","(Go) Distância em metros e ritmo em segundos por 100 m, em inteiros; arquivo truncado ou com campos fora do perfil devolve erro claro, sem gravar atividade pela metade","(Go) A mesma atividade enviada duas vezes (mesmo hash do conteúdo, ou mesma origem, início e duração) resulta em uma só atividade; o segundo envio responde \"já importada\" com a referência da primeira","(tela) A natação importada aparece na semana de sábado, ao lado dos treinos de academia"]},"p3:IMP-02":{"c":"Importação em lote em etapas, com progresso e retomada","q":"Derrube o processo do Go na metade e rode de novo. Se as séries já gravadas aparecem em dobro, ou se nada foi gravado e o trabalho todo se perdeu, a retomada não existe.","a":["(Go) A importação roda em etapas (validar, normalizar, mapear exercícios, gravar), cada uma gravando o ponto em que parou; matar o processo e reiniciar continua da última etapa concluída","(Go) Cargas viram gramas inteiras (\"62,5\" vira 62500) e datas viram instantes UTC com o fuso do aluno; linha inválida vai para um relatório de rejeitadas, sem derrubar o lote","(Go) O mapeamento de exercícios usa o catálogo (EXE-02) e deixa os não reconhecidos para o aluno decidir","(tela) Progresso por etapa e por contagem (\"mapeando: 410 de 600 treinos\"), com opção de baixar as linhas rejeitadas","(Go) Rodar a importação duas vezes não duplica nenhum treino; o resultado final aparece no histórico do CNT-02"]},"p3:ROT-08":{"c":"Feed iCalendar da rotina gerado em Go, com token revogável","q":"(Go) Gere um <code>.ics</code> com horários em UTC, sem VTIMEZONE nem RRULE, e assine o feed no celular. Mude o modelo da segunda e veja o que acontece com os eventos antigos e com o horário depois de uma viagem de fuso.","a":["(Go) O feed valida contra a RFC 5545: linhas terminadas em CRLF, dobra de linha em 75 octetos, <code>UID</code> estável por bloco e <code>VTIMEZONE</code> do fuso do aluno","(Go) Uma exceção de viagem ou feriado vira <code>EXDATE</code> ou evento próprio, sem duplicar o bloco","(Go) O token tem 32 bytes aleatórios, é guardado como hash e um token revogado responde 404 no pedido seguinte","(Go) O token não aparece em log nem em trace","(tela) A tela mostra o link, um botão de copiar, as instruções de assinar e um botão de revogar que gera outro link"]},"p3:SOC-01":{"c":"Ranking incremental do desafio, com chave quente tratada","q":"Com k6 em TypeScript, simule 2 mil participantes terminando treino nos últimos 10 minutos do mês e meça o p95 da leitura do ranking. Anote quanto da latência vem do cálculo e quanto da contenção em uma linha só.","a":["(Go) O ranking é uma estrutura ordenada (por exemplo, sorted set por desafio), atualizada de forma incremental a cada treino finalizado, sem varrer as séries; ler o top 50 custa O(log n + 50)","(Go) O desafio é gravado uma vez por treino, com a mesma chave de idempotência do TRE-05 e do MSG-01: reenviar o evento não soma duas vezes","(Go) Empate é decidido por regra explícita (maior volume, depois quem atingiu primeiro), igual em toda leitura","(Go) A chave quente do fim do mês é tratada, por exemplo dividindo o contador em N partes somadas na leitura","(tela) O ranking mostra a posição do aluno mesmo fora do top 50 e atualiza sem recarregar a página; no teste, p95 da leitura abaixo de 100 ms"]},"p3:SOC-02":{"c":"Feed com fan-out na escrita e exceção para contas grandes","q":"","a":["(Go) Fan-out na escrita: ao finalizar um treino, o evento é distribuído para o feed de cada seguidor; abrir o feed é uma leitura de uma lista já pronta, p95 abaixo de 100 ms","(Go) Contas com mais de 1.000 seguidores usam fan-out na leitura: seus treinos são mesclados ao feed no momento de abrir, em vez de copiados 10 mil vezes","(Go) Um treino publicado e depois apagado ou ocultado some dos feeds; mostre como a regra chega aos feeds já copiados","(tela) Paginação por cursor, nunca por deslocamento: um treino novo no topo não repete nem pula item na página seguinte","(tela) O teste mede o custo de escrita (cópias por treino) e de leitura (consultas por abertura) nos dois modelos e mostra o ponto de virada"]}},"espinha":[["kleppmann",1,"Kleppmann","Soluções de compromisso na arquitetura de sistemas de dados","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch01.html","Como projetar aplicativos com uso intensivo de dados, 2ª ed.",false,[],2],["kleppmann",2,"Kleppmann","Definindo requisitos não funcionais","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch02.html","Como projetar aplicativos com uso intensivo de dados, 2ª ed.",false,["EXE-01","HOJ-01","TRE-07","AGE-04","PERF-01","PERF-02","PERF-04","SOC-02"],2],["kleppmann",3,"Kleppmann","Modelos de dados e linguagens de consulta","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch03.html","Como projetar aplicativos com uso intensivo de dados, 2ª ed.",false,["BASE-02","EXE-03","HOJ-03","DIE-01","EVO-01","ROT-02","ROT-03","ROT-07","AGE-01","DIS-04","DIS-05"],2],["kleppmann",4,"Klepp zes: acrescente um campo opcional e renomeie um campo existente.","Escreva um teste de contrato que roda o cliente antigo contra o servidor novo."],"meca":"Quantas sessões nascem em 1.000 reenvios concorrentes, com e sem a chave.","pronto":["Zero duplicatas com a chave","O teste de contrato reprova a renomeação e aceita o campo opcional"],"fontes":[["Stripe: idempotência em APIs","https://stripe.com/blog/idempotency"]]},"3":{"t":"Um motor de layout de brinquedo","lang":"TypeScript","h":4,"obj":"Entender o caminho análise, estilo, layout e pintura escrevendo uma versão mínima dele.","passos":["Escreva um parser de HTML mínimo (elementos e texto) e de CSS mínimo (seletor de tag e de classe, width, padding, margin, background).","Monte a árvore de estilo casando os seletores com os elementos.","Calcule o layout de blocos pelo box model: largura vinda do pai, margens e altura pelo conteúdo.","Pinte os retângulos num canvas.","No navegador de verdade, provoque layout forçado lendo offsetHeight dentro de um laço que escreve estilo em 1.000 cards; depois separe leituras e escritas."],"meca":"Tempo do laço com e sem layout forçado, com performance.now().","pronto":["Seu motor desenha a página de teste corretamente","A queda de tempo ao separar leitura de escrita está medida e explicada"],"fontes":[["Let's build a browser engine (Matt Brubeck)","https://limpet.net/mbrubeck/2014/08/08/toy-layout-engine-1.html"]]},"4":{"t":"Estado a partir de eventos","lang":"TypeScript","h":3,"obj":"Comparar guardar o estado atual com guardar os eventos que o produziram.","passos":["Modele a sessão de treino como máquina de estados (aberta, em andamento, finalizada) com as transições válidas.","Implemente uma store que guarda só eventos (SerieRegistrada, TreinoFinalizado) e reconstrói o estado por replay.","Acrescente um snapshot a cada 100 eventos.","Implemente desfazer e uma projeção nova (volume por semana) sem mudar os eventos gravados."],"meca":"Tempo de reconstrução com 100 mil eventos, da operação e achar o ponto em que a estrutura certa passa a ganhar.","passos":["Implemente um cache LRU com mapa e lista duplamente ligada, tudo em O(1).","Implemente um top-k com heap de tamanho k e compare com ordenar tudo.","Implemente uma trie para busca por prefixo nos nomes de exercício e compare com varrer a lista.","Escreva benchmarks com testing.B de mil a um milhão de itens."],"meca":"ns/op e alocações de cada par de soluções, em cada tamanho.","pronto":["A tabela mostra onde as curvas se cruzam","Você aponta o caso pequeno em que o slice simples ganha"],"fontes":[["Benchmarks no pacote testing","https://pkg.go.dev/testing#hdr-Benchmarks"]]},"8":{"t":"Bytes na mão","lang":"Go","h":3,"obj":"Ver como dado vira byte: codificação, unidades inteiras e tempo.","passos":["Codifique à mão a struct Serie (exercício, carga em gramas, repetições, instante) em binário com varints.","Compare tamanho e tempo com JSON e com Protocol Buffers.","Some 0,1 kg dez mil vezes em float64 e em gramas inteiros.","Converta 8h15 de São Paulo para UTC e para Nova York em datas antes e depois da mudança de horário de lá, com time.LoadLocation."],"meca":"Bytes por série e ns por codificação nos três formatos; o erro acumulado do float.","pronto":["O decodificador lê o que o codificador escreveu, inclusive com um campo novo","Você explica cada byte de uma série codificada"],"fontes":[["Protocol Buffers: encoding","https://protobuf.dev/programming-guides/encoding/"]]},"9":{"t":"O processador por baixo do Go","lang":"Go","h":3,"obj":"Medir cache, previsão de desvio e coerência de cache, em vez de só ler sobre eles.","passos":["Some um campo de 10 milhões de structs grandes e o mesmo campo guardado num slice só dele.","Some os valores acima de um limite num slice ordenado e no mesmo slice desordenado.","Coloque dois contadores atômicos na mesma linha de cache, em goroutines diferentes, e depois separe-os com 64 bytes de padding.","Rode com perf stat (cache-misses e branch-misses) e com pprof."],"meca":"Tempo e contadores de hardware de cada par.","pronto":["Cada diferença está explicada por cache, previsão de desvio ou coerência, com o número que prova"],"fontes":[["Ulrich Drepper: What Every Programmer Should Know About Memory","https://people.freebsd.org/~lstewart/articles/cpumemory.pdf"]]},"10":{"t":"Acompanhando o coletor","lang":"Go","h":3,"obj":"Ler o que o garbage collector faz e mudar o programa para alocar menos.","passos":["Escreva um programa que aloca muitos objetos pequenos de vida curta e alguns de vida longa.","Rode com GODEBUG=gctrace=1 e leia cada campo de uma linha.","Varie GOGC e GOMEMLIMIT e observe a frequência dos ciclos e o pico de memória.","Use -gcflags=-m para ver o que escapa para o heap e corrija dois casos.","Experimente sync.Pool no objeto mais alocado."],"meca":"Ciclos de GC por segundo, pico de heap e alocações por operação, antes e depois.","pronto":["As alocações por operação caem pela metade","Você explica o trade-off entre memória e CPU que o GOGC controla"],"fontes":[["Guia do garbage collector do Go","https://go.dev/doc/gc-guide"]]},"11":{"t":"Corrida, trava e contador","lang":"Go","h":3,"obj":"Provocar os defeitos clássicos de concorrência e corrigi-los com medição.","passos":["Escreva um contador compartilhado sem sincronização e rode com -race.","Corrija de três jeitos (mutex, atomic e contador fragmentado por núcleo) e faça benchmark de 1 a 64 goroutines.","Monte um worker pool com fila limitada, errgroup e cancelamento por context.","Provoque um deadlock com dois mutex travados em ordens diferentes e corrija com ordem fixa."],"meca":"ns/op dos três contadores por número de goroutines.","pronto":["-race limpo","A tabela mostra onde o mutex para de escalar","Cancelar o context encerra todos os workers"],"fontes":[["O modelo de memória do Go","https://go.dev/ref/mem"]]},"12":{"t":"Um cache que aguenta a debandada","lang":"Go","h":3,"obj":"Ver o stampede acontecer e controlá-lo.","passos":["Monte um cache em memória com TTL e evicção LRU (reaproveite o LRU do laboratório 7).","Ponha atrás dele uma origem lenta (50 ms) e dispare 1.000 goroutines pedindo a mesma chave no instante em que ela expira.","Acrescente singleflight.","Acrescente TTL com variação aleatória e renovação antecipada."],"meca":"Chamadas à origem por expiração e p99 dos clientes, antes e depois.","pronto":["A debandada cai de cerca de mil chamadas para uma","A taxa de acerto está medida"],"fontes":[["singleflight","https://pkg.go.dev/golang.org/x/sync/singleflight"]]},"13":{"t":"HTTP na mão, por cima do TCP","lang":"Go","h":4,"obj":"Ver o que acontece entre o socket e a resposta HTTP.","passos":["Escreva um servidor HTTP/1.1 mínimo sobre net.Listen: linha de requisição, cabeçalhos, Content-Length e conexão mantida viva.","Capture com tcpdump o handshake de três vias, o keep-alive e o encerramento.","Meça com curl -w as fases de conexão, TLS e primeiro byte contra um servidor HTTPS.","Ligue e desligue TCP_NODELAY numa resposta escrita em duas partes."],"meca":"Tempo de cada fase e o atraso do algoritmo de Nagle somado ao ACK atrasado.","pronto":["curl e o navegador conversam com o seu servidor","Você explica cada pacote da captura"],"fontes":[["RFC 9112: HTTP/1.1","https://www.rfc-editor.org/rfc/rfc9112"]]},"14":{"t":"Fila não resolve sobrecarga","lang":"Go","h":3,"obj":"Entender por que a fila só adia o problema e o que é backpressure.","passos":["Ponha um produtor a 300 mensagens por segundo e um consumidor a 200, com fila ilimitada, e acompanhe tamanho e latência.","Troque por uma fila limitada e teste três políticas: bloquear o produtor, descartar e responder 429.","Confira a lei de Little: itens na fila = taxa de chegada × tempo de espera.","Implemente o backpressure com canal de buffer limitado."],"meca":"Latência e memória ao longo do tempo em cada política.","pronto":["A fila ilimitada cresce sem fim e as limitadas ficam estáveis","A lei de Little bate com a medição"],"fontes":[["Fred Hébert: Queues Don't Fix Overload","https://ferd.ca/queues-don-t-fix-overload.html"]]},"15":{"t":"Retry que não derruba ninguém","lang":"Go","h":3,"obj":"Ver retry sem cuidado virar ataque, e o que timeout, jitter e circuit breaker mudam.","passos":["Escreva uma dependência falsa que falha 30% das vezes e às vezes demora 2 s.","Escreva um cliente com timeout por chamada, retry com backoff exponencial e jitter, e limite de tentativas.","Implemente um circuit breaker com os estados fechado, aberto e meio aberto.","Simule 500 clientes no momento em que a dependência volta, sem jitter e com jitter."],"meca":"Carga na dependência quando ela volta e taxa de sucesso dos clientes.","pronto":["Com jitter, o pico na volta some","O breaker abre e fecha nos limites que você definiu"],"fontes":[["AWS: Exponential Backoff And Jitter","https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/"]]},"16":{"t":"Raft: eleição e log","lang":"Go","h":8,"obj":"Entender consenso implementando a parte central do Raft. Ocupa duas semanas de laboratório.","passos":["Leia o artigo do Raft, seções 5.1 a 5.4.","Faça o laboratório de Raft do MIT 6.5840: eleição de líder e replicação do log.","Rode os testes com rede instável muitas vezes seguidas.","Anote um bug de concorrência que você achou e como achou."],"meca":"Quantas execuções seguidas dos testes passam.","pronto":["Eleição e replicação passam 100 vezes seguidas","Você explica por que um líder antigo não consegue confirmar entradas"],"fontes":[["Artigo do Raft","https://raft.github.io/raft.pdf"],["MIT 6.5840 (laboratórios)","https://pdos.csail.mit.edu/6.824/"]]},"17":{"t":"Assinar, verificar e guardar senha","lang":"Go","h":3,"obj":"Construir as peças de confiança que o app usa: assinatura de webhook e senha.","passos":["Assine webhooks com HMAC-SHA256 sobre instante e corpo, no cabeçalho x-fit-signature.","Verifique com comparação em tempo constante e rejeite instantes com mais de 5 minutos (replay).","Mostre o vazamento de tempo de uma comparação ingênua.","Guarde senhas com argon2id e escolha os parâmetros pelo custo medido."],"meca":"Tempo de verificação e tempo de hash por parâmetro do argon2id.","pronto":["Replay e assinatura alterada são rejeitados","Os parâmetros do argon2id foram escolhidos por medição"],"fontes":[["OWASP: Password Storage Cheat Sheet","https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"],["crypto/hmac","https://pkg.go.dev/crypto/hmac"]]},"18":{"t":"Do p99 ao culpado","lang":"Go","h":4,"obj":"Juntar tudo: medir, achar o caminho crítico e provar a melhoria.","passos":["Escreva um serviço pequeno em Go com três etapas: uma consulta simulada, um cálculo e a serialização.","Gere carga com o gerador do laboratório 1 e anote p50 e p99.","Tire perfis de CPU e de alocação com pprof e um runtime/trace.","Ache o caminho crítico, faça uma mudança e prove com antes e depois."],"meca":"p99, CPU por requisição e alocações por requisição, antes e depois.","pronto":["Relatório de uma página com hipótese, perfil, mudança e números"],"fontes":[["Diagnósticos no Go","https://go.dev/doc/diagnostics"]]}},"ia":{"mods":[{"id":"RAG-1","t":"A ideia de RAG e a família de modelos","q":"Por que buscar conhecimento fora do modelo, e o que muda entre RAG, REALM, FiD, RETRO e Atlas?","prod":"Quase todo RAG em produção é um buscador congelado ligado a um LLM congelado. Saber o que os modelos originais treinavam juntos explica o que se perde com isso e onde o sistema costuma falhar.","conceitos":"Memória paramétrica e não paramétrica; buscador e gerador; treinar os dois juntos ou congelar o buscador; fusão no decodificador; recuperação já no pré-treino; atualizar o conhecimento sem treinar de novo.","leituras":[["huyen-ai:6:rag","huyen-ai","RAG e agentes","https://www.oreilly.com/library/view/engenharia-de-ia/9798341637870/ch06.html","a primeira metade, sobre RAG: arquitetura, buscadores e quando usar","Chip Huyen, cap. 6 · RAG e agentes, a parte de RAG","O'Reilly · Engenharia de IA",true],["artigo:2005-11401","artigo","Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks (Lewis et al., 2020)","https://arxiv.org/abs/2005.11401","o artigo que deu nome ao RAG: buscador denso e gerador treinados juntos","Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks (Lewis et al., 2020)","Artigo · arXiv 2005.11401",false],["artigo:2002-08909","artigo","REALM: Retrieval-Augmented Language Model Pre-Training (Guu et al., 2020)","https://arxiv.org/abs/2002.08909","a recuperação aprendida já no pré-treino","REALM: Retrieval-Augmented Language Model Pre-Training (Guu et al., 2020)","Artigo · arXiv 2002.08909",false],["artigo:2007-01282","artigo","Leveraging Passage Retrieval with Generative Models for Open Domain QA, o FiD (Izacard e Grave, 2020)","https://arxiv.org/abs/2007.01282","como juntar muitas passagens no decodificador","Leveraging Passage Retrieval with Generative Models for Open Domain QA, o FiD (Izacard e Grave, 2020)","Artigo · arXiv 2007.01282",false],["artigo:2112-04426","artigo","Improving language models by retrieving from trillions of tokens, o RETRO (Borgeaud et al., 2021)","https://arxiv.org/abs/2112.04426","um modelo menor que busca vence um maior que não busca","Improving language models by retrieving from trillions of tokens, o RETRO (Borgeaud et al., 2021)","Artigo · arXiv 2112.04426",false],["artigo:2208-03299","artigo","Atlas: Few-shot Learning with Retrieval Augmented Language Models (Izacard et al., 2022)","https://arxiv.org/abs/2208.03299","poucos exemplos e atualização do índice","Atlas: Few-shot Learning with Retrieval Augmented Language Models (Izacard et al., 2022)","Artigo · arXiv 2208.03299",false]],"perguntas":["O que é memória paramétrica e não paramétrica, e qual delas você atualiza sem treinar o modelo?","Em que etapa cada modelo usa a recuperação: pré-treino, ajuste fino ou inferência?","O que o FiD faz com 100 passagens que um prompt comum não faz?","Por que o RAG das aplicações de hoje costuma congelar o buscador, e o que isso custa em qualidade?"],"pratica":{"tipo":"exercicio","t":"A árvore genealógica do RAG","contexto":"Uma página sua, sem código.","passos":["Monte uma tabela com RAG, REALM, FiD, RETRO e Atlas: onde a busca entra, o que é treinado, a unidade recuperada e o custo de atualizar o conhecimento.","Para cada um, escreva em duas frases a ideia que ele trouxe.","Explique onde o \"RAG de aplicação\" (buscador e LLM congelados) se encaixa na tabela e o que ele abre mão.","Escreva três situações em que você preferiria ajustar o modelo em vez de buscar, e três em que buscar ganha."],"meca":"Uma tabela e uma página de texto.","pronto":["A tabela está completa sem consultar","Você explica a diferença entre treinar junto e congelar o buscador"]},"fase":1},{"id":"RAG-2","t":"Recuperação: esparsa, densa, híbrida e reranking","q":"Como achar o trecho certo entre milhões, e quando cada tipo de busca falha?","prod":"A maior parte das respostas ruins de um RAG nasce na busca, não no modelo. Escolher a busca e o índice é escolher que erros você aceita, com que latência.","conceitos":"BM25 (frequência do termo, saturação e normalização pelo tamanho); embeddings de duas torres; similaridade de cosseno; índices aproximados (HNSW, IVF, quantização por produto) e a troca entre recall e latência; interação tardia (ColBERT); cross-encoder como reranker; busca híbrida e Reciprocal Rank Fusion.","leituras":[["pai:11","pai","Aprendizagem de representações e embeddings","https://www.oreilly.com/library/view/concebe-grandes-aplicacoes/9798341637887/ch11.html","como os embeddings são aprendidos e onde falham","Suhas Pai, cap. 11 · Aprendizagem de representações e embeddings","O'Reilly · Concebe grandes aplicações de modelos de linguagem (Designing Large Language Model Applications)",true],["alammar:8","alammar","Semantic Search and Retrieval-Augmented Generation","https://www.oreilly.com/library/view/hands-on-large-language/9781098150952/ch08.html","busca semântica, reranking e RAG, com figuras","Alammar e Grootendorst, cap. 8 · Semantic Search and Retrieval-Augmented Generation","O'Reilly · Hands-On Large Language Models",false],["artigo:2004-04906","artigo","Dense Passage Retrieval for Open-Domain Question Answering, o DPR (Karpukhin et al., 2020)","https://arxiv.org/abs/2004.04906","duas torres treinadas com negativos difíceis","Dense Passage Retrieval for Open-Domain Question Answering, o DPR (Karpukhin et al., 2020)","Artigo · arXiv 2004.04906",false],["artigo:2004-12832","artigo","ColBERT: Efficient and Effective Passage Search via Contextualized Late Interaction (Khattab e Zaharia, 2020)","https://arxiv.org/abs/2004.12832","por que comparar token a token ganha do vetor único","ColBERT: Efficient and Effective Passage Search via Contextualized Late Interaction (Khattab e Zaharia, 2020)","Artigo · arXiv 2004.12832",false],["artigo:1603-09320","artigo","Efficient and robust approximate nearest neighbor search using HNSW graphs (Malkov e Yashunin, 2016)","https://arxiv.org/abs/1603.09320","a ideia das camadas do grafo; os experimentos só por cima","Efficient and robust approximate nearest neighbor search using HNSW graphs (Malkov e Yashunin, 2016)","Artigo · arXiv 1603.09320",false]],"perguntas":["Por que o BM25 acha \"BD-02\" e um embedding pode não achar?","O que um bi-encoder ganha e perde em relação a um cross-encoder?","Como o HNSW troca recall por latência, e qual parâmetro controla isso?","O que a Reciprocal Rank Fusion faz quando a busca densa e o BM25 discordam?"],"pratica":{"tipo":"exercicio","t":"Onde cada busca erra","contexto":"Perguntas sobre o livro Fundamentos que não mudam e a especificação do Fitness Evolutivo.","passos":["Escreva 12 perguntas variadas: com termo exato, com sinônimo, por paráfrase, com código de item e em inglês.","Para cada uma, preveja se o BM25, a busca densa ou a híbrida acerta, e por quê.","Desenhe o pipeline híbrido com RRF e um reranker, com a latência estimada de cada etapa.","Escreva quando o reranker paga o próprio custo e quando não paga."],"meca":"A tabela de previsões e o desenho do pipeline.","pronto":["Cada previsão tem o motivo","O pipeline tem latência estimada por etapa"]},"fase":1},{"id":"RAG-3","t":"O pipeline: indexar, consultar e entregar o contexto","q":"O que fazer antes, durante e depois da busca para o contexto certo chegar ao modelo?","prod":"Chunking e transformação de consulta são as alavancas mais baratas que existem; a ordem do contexto decide se o modelo usa o que você achou.","conceitos":"RAG ingênuo, avançado e modular; chunking fixo, recursivo, semântico, por estrutura, pai e filho, janela de sentença, late chunking e contextual retrieval; reescrita de consulta, múltiplas consultas, HyDE, step-back e decomposição; reranking, compressão e ordem do contexto; citação.","leituras":[["pai:12","pai","Geração aumentada por recuperação","https://www.oreilly.com/library/view/concebe-grandes-aplicacoes/9798341637887/ch12.html","o pipeline de RAG de ponta a ponta","Suhas Pai, cap. 12 · Geração aumentada por recuperação","O'Reilly · Concebe grandes aplicações de modelos de linguagem (Designing Large Language Model Applications)",true],["huyen-ai:6:rag-otimizacao","huyen-ai","RAG e agentes","https://www.oreilly.com/library/view/engenharia-de-ia/9798341637870/ch06.html","a parte de otimização da busca: chunking, reescrita de consulta, reranking e contextual retrieval","Chip Huyen, cap. 6 · RAG e agentes, a parte de otimização da busca","O'Reilly · Engenharia de IA",true],["artigo:2312-10997","artigo","Retrieval-Augmented Generation for Large Language Models: A Survey (Gao et al., 2023)","https://arxiv.org/abs/2312.10997","a taxonomia ingênuo, avançado e modular, e as técnicas de cada etapa","Retrieval-Augmented Generation for Large Language Models: A Survey (Gao et al., 2023)","Artigo · arXiv 2312.10997",false],["artigo:2212-10496","artigo","Precise Zero-Shot Dense Retrieval without Relevance Labels, o HyDE (Gao et al., 2022)", eu livro\".","passos":["Escreva 15 perguntas: simples, de vários saltos, ambíguas e fora do livro.","Associe cada uma à variante que melhor a trata e diga por quê.","Desenhe a máquina de estados de um pipeline adaptativo com correção: classificar, buscar, avaliar, buscar de novo ou recusar.","Estime chamadas ao modelo e latência de cada caminho."],"meca":"A tabela de perguntas, a máquina de estados e o custo por caminho.","pronto":["Toda pergunta fora do livro termina em recusa ou em outra fonte, nunca em invenção","Cada caminho tem custo estimado"]},"fase":1},{"id":"RAG-5","t":"RAG com estrutura, e RAG contra contexto longo","q":"E quando a resposta depende do corpus inteiro, de relações entre as partes, ou nem precisa de busca?","prod":"Perguntas globais (\"quais os temas do livro?\") quebram o RAG por trechos; janelas longas e cache mudam a conta de quando buscar.","conceitos":"GraphRAG: entidades, comunidades, resumos e busca local ou global; LightRAG; RAPTOR e a árvore de resumos; RAG sobre dados estruturados (texto para SQL); contexto longo contra RAG; Cache-Augmented Generation; context rot.","leituras":[["graphrag:0","graphrag","Essential GraphRAG (Manning)","https://www.oreilly.com/search/?q=Essential%20GraphRAG","o livro é curto: leia as partes sobre grafos de conhecimento, o GraphRAG da Microsoft e o RAG agêntico","Bratanič e Hane · Essential GraphRAG (Manning), pela busca da O'Reilly","O'Reilly · Essential GraphRAG (Manning)",false],["huyen-ai:6:rag-alem-do-texto","huyen-ai","RAG e agentes","https://www.oreilly.com/library/view/engenharia-de-ia/9798341637870/ch06.html","a parte de RAG além do texto: dados tabulares, texto para SQL e multimodal","Chip Huyen, cap. 6 · RAG e agentes, a parte de RAG além do texto","O'Reilly · Engenharia de IA",true],["artigo:2404-16130","artigo","From Local to Global: A Graph RAG Approach to Query-Focused Summarization, o GraphRAG (Edge et al., 2024)","https://arxiv.org/abs/2404.16130","comunidades e respostas globais","From Local to Global: A Graph RAG Approach to Query-Focused Summarization, o GraphRAG (Edge et al., 2024)","Artigo · arXiv 2404.16130",false],["artigo:2401-18059","artigo","RAPTOR: Recursive Abstractive Processing for Tree-Organized Retrieval (Sarthi et al., 2024)","https://arxiv.org/abs/2401.18059","resumos em árvore para perguntas de vários níveis","RAPTOR: Recursive Abstractive Processing for Tree-Organized Retrieval (Sarthi et al., 2024)","Artigo · arXiv 2401.18059",false],["artigo:2410-05779","artigo","LightRAG: Simple and Fast Retrieval-Augmented Generation (Guo et al., 2024)","https://arxiv.org/abs/2410.05779","grafo mais leve e atualização incremental","LightRAG: Simple and Fast Retrieval-Augmented Generation (Guo et al., 2024)","Artigo · arXiv 2410.05779",false],["artigo:2407-16833","artigo","Retrieval Augmented Generation or Long-Context LLMs? A Comprehensive Study and Hybrid Approach (Li et al., 2024)","https://arxiv.org/abs/2407.16833","quando a janela longa ganha, e o roteamento entre os dois","Retrieval Augmented Generation or Long-Context LLMs? A Comprehensive Study and Hybrid Approach (Li et al., 2024)","Artigo · arXiv 2407.16833",false],["artigo:2412-15605","artigo","Don't Do RAG: When Cache-Augmented Generation is All You Need for Knowledge Tasks (Chan et al., 2024)","https://arxiv.org/abs/2412.15605","pré-carregar o conhecimento no cache","Don't Do RAG: When Cache-Augmented Generation is All You Need for Knowledge Tasks (Chan et al., 2024)","Artigo · arXiv 2412.15605",false]],"perguntas":["Por que o RAG por trechos não responde \"quais temas atravessam o livro inteiro?\"","Qual a diferença entre a busca local e a global no GraphRAG?","Quando o contexto longo dispensa o RAG, e quando ele sai mais caro e pior?","O que o CAG pressupõe sobre o tamanho e a mudança do conhecimento?"],"pratica":{"tipo":"exercicio","t":"A matriz de decisão","contexto":"Os seus documentos de estudo e o app.","passos":["Escreva três perguntas globais sobre o livro e explique por que o RAG por trechos erra cada uma.","Mostre como o GraphRAG e o RAPTOR responderiam a uma delas.","Monte a matriz: tamanho do corpus, frequência de mudança e tipo de pergunta, levando a RAG, GraphRAG, RAPTOR, CAG ou contexto longo.","Classifique três usos do app com a matriz: dúvidas sobre o livro, a base de 300 mil alimentos e o histórico de treinos do aluno."],"meca":"A matriz e as três classificações.","pronto":["Cada célula da matriz tem um porquê","As três classificações estão justificadas"]},"fase":1},{"id":"EVAL-1","t":"Avaliar sistemas com LLM","q":"Como saber, com evidência, que o sistema está bom e que uma mudança não piorou nada?","prod":"Sem avaliação, trocar modelo, prompt ou chunking é aposta. Com ela, vira teste que roda no CI e alerta que dispara em produção.","conceitos":"Análise de erros antes de métrica; avaliação com e sem referência; métrica exata contra juiz; LLM como juiz e seus vieses (posição, tamanho, autopreferência); concordância com humano; avaliação offline e online; desenvolvimento guiado por avaliação; teste de regressão.","leituras":[["huyen-ai:3","huyen-ai","Metodologia de avaliação","https://www.oreilly.com/library/view/engenharia-de-ia/9798341637870/ch03.html","a metodologia: o que dá e o que não dá para medir","Chip Huyen, cap. 3 · Metodologia de avaliação","O'Reilly · Engenharia de IA",true],["huyen-ai:4","huyen-ai","Avaliação de sistemas de IA","https://www.oreilly.com/library/view/engenharia-de-ia/9798341637870/ch04.html","critérios, escolha de métricas e o pipeline de avaliação","Chip Huyen, cap. 4 · Avaliação de sistemas de IA","O'Reilly · Engenharia de IA",true],["berryman:10","berryman","Evaluating LLM Applications","https://www.oreilly.com/library/view/prompt-engineering-for/9781098156145/ch10.html","avaliação offline e online de aplicações com LLM","Berryman e Ziegler, cap. 10 · Evaluating LLM Applications","O'Reilly · Prompt Engineering for LLMs",false],["artigo:2306-05685","artigo","Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena (Zheng et al., 2023)","https://arxiv.org/abs/2306.05685","os vieses do juiz e como mitigá-los","Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena (Zheng et al., 2023)","Artigo · arXiv 2306.05685",false],["post:hamel-evals","post","Hamel Husain: Your AI Product Needs Evals","https://hamel.dev/blog/posts/evals/","o processo: traces, análise de erros e níveis de teste","Hamel Husain: Your AI Product Needs Evals","Texto de engenharia",false],["post:yan-judges","post","Eugene Yan: Evaluating the Effectiveness of LLM-Evaluators","https://eugeneyan.com/writing/llm-evaluators/","o que a pesquisa diz sobre juízes","Eugene Yan: Evaluating the Effectiveness of LLM-Evaluators","Texto de engenharia",false]],"perguntas":["Por que começar pela leitura dos erros e não pela escolha da métrica?","Quais vieses um LLM juiz tem, e como cada um é mitigado?","Como você valida que o juiz concorda com você?","O que entra num teste de regressão de prompt, e o que faz ele falhar?"],"pratica":{"tipo":"exercicio","t":"O plano de avaliação","contexto":"O \"Pergunte ao seu livro\" desenhado no RAG-3.","passos":["Imagine 20 respostas ruins e agrupe as falhas numa taxonomia.","Para cada falha, escolha a medida: exata, por regra ou por juiz.","Escreva a rubrica do juiz como aprovado ou reprovado, com a crítica, e o plano para medir a concordância com os seus rótulos.","Defina o que roda a cada mudança, o que roda toda noite e o que se observa em produção."],"meca":"O plano de avaliação, em uma ou duas páginas.","pronto":["Toda falha da taxonomia tem uma medida","O juiz tem rubrica e plano de validação"]},"fase":1},{"id":"EVAL-2","t":"Avaliar RAG e avaliar agentes","q":"Como separar o erro da busca do erro da geração, e avaliar um agente que dá vários passos?","prod":"Medir só a resposta final esconde onde está o defeito; em agente, um acerto em uma tentativa não diz se ele acerta sempre.","conceitos":"Métricas de recuperação (recall@k, precisão@k, MRR, nDCG); RAGAS: fidelidade, relevância da resposta, precisão e recall de contexto; ARES; avaliação de agente pelo resultado ou pela trajetória; acerto de ferramenta e de argumentos; pass^k; simulação de usuário; custo e número de passos.","leituras":[["albada:9","albada","Validation and Measurement","https://www.oreilly.com/library/view/building-applications-with/9781098176495/ch09.html","validação e medição de sistemas agênticos","Michael Albada, cap. 9 · Validation and Measurement","O'Reilly · Building Applications with AI Agents",false],["llmops:7","llmops","Avaliação de LLMs","https://www.oreilly.com/library/view/llmops/9798341663817/ch07.html","avaliação na operação","Abi Aryan, cap. 7 · Avaliação de LLMs","O'Reilly · LLMOps (edição em português)",true],["artigo:2309-15217","artigo","RAGAS: Automated Evaluation of Retrieval Augmented Generation (Es et al., 2023)","https://arxiv.org/abs/2309.15217","as métricas e como cada uma é calculada","RAGAS: Automated Evaluation of Retrieval Augmented Generation (Es et al., 2023)","Artigo · arXiv 2309.15217",false],["artigo:2311-09476","artigo","ARES: An Automated Evaluation Framework for RAG Systems (Saad-Falcon et al., 2023)","https://arxiv.org/abs/2311.09476","juízes treinados e intervalos de confiança","ARES: An Automated Evaluation Framework for RAG Systems (Saad-Falcon et al., 2023)","Artigo · arXiv 2311.09476",false],["artigo:2406-12045","artigo","τ-bench: A Benchmark for Tool-Agent-User Interaction in Real-World Domains (Yao et al., 2024)","https://arxiv.org/abs/2406.12045","usuário simulado, regras de negócio e pass^k","τ-bench: A Benchmark for Tool-Agent-User Interaction in Real-World Domains (Yao et al., 2024)","Artigo · arXiv 2406.12045",false],["artigo:2308-03688","artigo","AgentBench: Evaluating LLMs as Agents (Liu et al., 2023)","https://arxiv.org/abs/2308.03688","onde os agentes falham","AgentBench: Evaluating LLMs as Agents (Liu et al., 2023)","Artigo · arXiv 2308.03688",false]],"perguntas":["Qual a diferença entre fidelidade e relevância da resposta?","Como o recall de contexto separa erro de busca de erro de geração?","O que o pass^k mede que o pass@1 esconde?","Quando avaliar a trajetória do agente, e quando só o resultado basta?"],"pratica":{"tipo":"exercicio","t":"Uma métrica para cada falha","contexto":"O RAG e um agente com ferramentas.","passos":["Liste oito falhas: busca que não acha, contexto certo com resposta errada, citação inventada, ferramenta errada, argumento errado, laço infinito, desistência cedo e acerto com custo dez vezes maior.","Para cada uma, escolha a métrica que a pega e onde medir: no componente ou de ponta a ponta.","Defina uma tarefa de agente e calcule, com números inventados, o pass@1 e o pass^4.","Escreva por que o pass@1 alto pode enganar."],"meca":"A tabela de falhas e métricas, e o exemplo de pass^k.","pronto":["Cada falha tem métrica e lugar de medição","Você explica o pass^k sem consultar"]},"fase":1},{"id":"TOOL-1","t":"Tool use: como o modelo usa ferramentas","q":"O que acontece quando um modelo \"chama\" uma ferramenta, e o que torna uma ferramenta fácil de usar para um agente?","prod":"O modelo não executa nada: ele escreve uma intenção estruturada, e o seu código executa. Ferramenta mal descrita ou com resposta inchada derruba a precisão e enche o contexto.","conceitos":"Function calling e saída estruturada; JSON Schema; quem executa e quem decide; Toolformer; ReAct; interface agente-computador; nomes, descrições, granularidade, respostas enxutas e erros que orientam; muitas ferramentas e recuperação de ferramentas; MCP e A2A como protocolos; menor privilégio.","leituras":[["albada:4","albada","Tool Use","https://www.oreilly.com/library/view/building-applications-with/9781098176495/ch04.html","tool use em sistemas de agentes","Michael Albada, cap. 4 · Tool Use","O'Reilly · Building Applications with AI Agents",false],["pai:10","pai","Interface dos LLMs com ferramentas externas","https://www.oreilly.com/library/view/concebe-grandes-aplicacoes/979 nceitos":"Contexto como recurso finito; context rot e lost in the middle; as partes do contexto (instruções, ferramentas, exemplos, histórico, resultados de ferramenta, memória e documentos); buscar na hora contra pré-carregar; compactação e resumo; anotações estruturadas fora da janela; subagentes para isolar contexto; prefixo estável e cache; limpar resultados antigos de ferramenta.","leituras":[["berryman:6","berryman","Assembling the Prompt","https://www.oreilly.com/library/view/prompt-engineering-for/9781098156145/ch06.html","montar o prompt: o que entra e em que ordem","Berryman e Ziegler, cap. 6 · Assembling the Prompt","O'Reilly · Prompt Engineering for LLMs",false],["berryman:5","berryman","Prompt Content","https://www.oreilly.com/library/view/prompt-engineering-for/9781098156145/ch05.html","o conteúdo do prompt","Berryman e Ziegler, cap. 5 · Prompt Content","O'Reilly · Prompt Engineering for LLMs",false],["huyen-ai:5","huyen-ai","Engenharia imediata (engenharia de prompt)","https://www.oreilly.com/library/view/engenharia-de-ia/9798341637870/ch05.html","a parte sobre contexto e instruções do sistema","Chip Huyen, cap. 5 · Engenharia imediata (engenharia de prompt)","O'Reilly · Engenharia de IA",true],["post:context-engineering","post","Anthropic: Effective context engineering for AI agents","https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","as técnicas para tarefas longas","Anthropic: Effective context engineering for AI agents","Texto de engenharia",false],["post:manus-context","post","Manus: Context Engineering for AI Agents: Lessons from Building Manus","https://manus.im/blog/Context-Engineering-for-AI-Agents-Lessons-from-Building-Manus","cache, sistema de arquivos como memória e manter os erros no contexto","Manus: Context Engineering for AI Agents: Lessons from Building Manus","Texto de engenharia",false],["post:context-rot","post","Chroma: Context Rot","https://www.trychroma.com/research/context-rot","como o desempenho cai com a entrada maior","Chroma: Context Rot","Texto de engenharia",false],["artigo:2307-03172","artigo","Lost in the Middle: How Language Models Use Long Contexts (Liu et al., 2023)","https://arxiv.org/abs/2307.03172","revisite com o olhar de agente","Lost in the Middle: How Language Models Use Long Contexts (Liu et al., 2023)","Artigo · arXiv 2307.03172",false]],"perguntas":["O que é context rot, e por que uma janela maior não resolve?","Quando buscar na hora é melhor do que pré-carregar?","O que muda no custo quando o prefixo do contexto fica estável?","Como um subagente ajuda a manter o contexto do agente principal limpo?"],"pratica":{"tipo":"exercicio","t":"O orçamento de tokens de um agente longo","contexto":"Um agente que trabalha 100 passos.","passos":["Desenhe o contexto nos passos 1, 30 e 90: o que fica, o que foi compactado, o que foi para as anotações e o que é buscado na hora.","Some os tokens de cada passo, com e sem compactação.","Estime o efeito no custo de manter o prefixo estável para o cache.","Escreva cinco regras de contexto para o agente."],"meca":"Os três desenhos, a soma de tokens e as cinco regras.","pronto":["O contexto do passo 90 cabe no orçamento que você definiu","Cada regra tem a fonte que a sustenta"]},"fase":1},{"id":"PROJ-1","t":"Projeto integrador, no papel","q":"Como juntar RAG, ferramentas, contexto, workflow e avaliação num sistema que dá para operar?","prod":"É o documento que você levaria a uma revisão de arquitetura antes de escrever uma linha de código.","conceitos":"Todos os anteriores, mais custo, latência, segurança, monitoramento e melhoria contínua.","leituras":[["huyen-ai:10","huyen-ai","Arquitetura de engenharia de IA e feedback do usuário","https://www.oreilly.com/library/view/engenharia-de-ia/9798341637870/ch10.html","arquitetura de uma aplicação de IA e o ciclo de feedback","Chip Huyen, cap. 10 · Arquitetura de engenharia de IA e feedback do usuário","O'Reilly · Engenharia de IA",true],["albada:10","albada","Mon thon-for-data/9781098104023/ch07.html","dados faltantes, duplicados e transformação","Wes McKinney, cap. 7 · Data Cleaning and Preparation","O'Reilly · Python for Data Analysis, 3rd Edition",false],["mckinney:10","mckinney","Data Aggregation and Group Operations","https://www.oreilly.com/library/view/python-for-data/9781098104023/ch10.html","groupby e agregações","Wes McKinney, cap. 10 · Data Aggregation and Group Operations","O'Reilly · Python for Data Analysis, 3rd Edition",false]],"extra":[["Dados do Open Food Facts","https://world.openfoodfacts.org/data"]],"pratica":{"t":"A base de alimentos por dentro","contexto":"Os alimentos vendidos no Brasil, da base aberta do Open Food Facts.","passos":["Carregue uma amostra dos produtos vendidos no Brasil e limpe faltantes e valores impossíveis.","Explore a proteína por 100 kcal por categoria, com outliers e correlações.","Calcule por bootstrap o intervalo de confiança da proteína média de duas categorias.","Faça um teste de permutação entre elas e escreva o que dá e o que não dá para concluir.","Planeje um teste A/B do horário do lembrete do café: tamanho da amostra para detectar 5 pontos de diferença."],"meca":"Intervalos, valor-p e o tamanho de amostra necessário.","pronto":["As conclusões vêm com intervalo e valor-p","Você escreve uma frase sobre o que a correlação não prova"]},"fase":2},{"id":"IA-3","t":"Machine learning de ponta a ponta","q":"Como saber se um modelo aprendeu algo, e não decorou?","prod":"Vazamento de dados e conjunto de teste reutilizado são as causas mais comuns de modelo que brilha no notebook e falha em produção.","conceitos":"Aprendizado supervisionado, divisão treino/validação/teste, validação cruzada, regressão linear e logística, métricas de classificação, overfitting, viés e variância, vazamento.","leituras":[["geron:1","geron","The Machine Learning Landscape","https://www.oreilly.com/library/view/hands-on-machine-learning/9798341607972/ch01.html","o mapa: tipos de aprendizado e os principai ary/view/concebe-grandes-aplicacoes/9798341637887/ch03.html","vocabulário e tokenização em português","Suhas Pai, cap. 3 · Vocabulário e Tokenização","O'Reilly · Concebe grandes aplicações de modelos de linguagem (Designing Large Language Model Applications)",true]],"extra":[["tiktoken","https://github.com/openai/tiktoken"]],"pratica":{"t":"Um GPT de brinquedo em português","contexto":"Treinado com o texto do livro Fundamentos que não mudam.","passos":["Conte os tokens do livro em português e de um trecho equivalente em inglês com o tiktoken e compare.","Implemente a atenção escalada por produto escalar com máscara causal e confira o formato de cada tensor.","Monte o GPT pequeno do Raschka e treine no texto do livro, na CPU ou no Colab.","Gere texto e visualize os pesos de atenção de uma frase."],"meca":"Perda por época; tokens por palavra em português contra inglês; tempo por passo conforme o contexto cresce.","pronto":["A perda cai e o texto gerado tem o estilo do livro","Você explica por que a atenção custa O(n²) no tamanho do contexto"]},"fase":2},{"id":"IA-7","t":"LLMs em aplicações: prompts, RAG e agentes","q":"Como dar ao modelo o contexto certo, na hora certa, e deixá-lo agir com segurança?","prod":"É o que a maior parte das aplicações de IA em produção faz: busca, contexto, ferramentas e saída estruturada.","conceitos":"Engenharia de prompt, saída estruturada, chamada de ferramentas, busca híbrida (BM25 e vetores), chunking, reranking, RAG, agentes e MCP.","leituras":[["huyen-ai:5","huyen-ai","Engenharia imediata (engenharia de prompt)","https://www.oreilly.com/library/view/engenharia-de-ia/9798341637870/ch05.html","técnicas de prompt e prompt defensivo","Chip Huyen, cap. 5 · Engenharia imediata (engenharia de prompt)","O'Reilly · Engenharia de IA",true],["huyen-ai:6","huyen-ai","RAG e agentes","https://www.oreilly.com/library/view/engenharia-de-ia/9798341637870/ch06.html","RAG e agentes, de ponta a ponta","Chip Huyen, cap. 6 · RAG e agentes","O'Reilly · En
