lation using shuffle-sharding","https://aws.amazon.com/builders-library/workload-isolation-using-shuffle-sharding/"]],"labs":[11,14],"reusa":"Coloque o middleware na frente da API do encurtador e meça o p99 do GET antes e depois."},{"id":"feed","n":3,"g":"social","t":"Feed social","q":"Como montar a página inicial de 100 milhões de pessoas em menos de 200 ms, se cada uma segue centenas de outras?","nivel":"Intermediário","horas":5,"cenario":"O Fitness Evolutivo ganhou uma rede social: você segue amigos e treinadores, e a tela inicial mostra os treinos e posts deles, do mais recente para o mais antigo (e, depois, por relevância). É o problema da home timeline do Twitter. A dificuldade não é guardar posts; é juntar, a cada abertura do app, os posts recentes de centenas de contas, sabendo que algumas contas têm 20 milhões de seguidores.","req":["Publicar um post (texto, foto, treino).","Seguir e deixar de seguir.","Ver a timeline: posts de quem eu sigo, paginada, mais recentes primeiro.","Curtir e comentar, com contadores.","Ver os próprios posts imediatamente depois de publicar."],"nreq":["100 milhões de usuários ativos por dia.","Timeline com p99 abaixo de 200 ms.","Um post aparece para os seguidores em até alguns segundos (consistência eventual aceita).","Disponibilidade de 99,9% na leitura; publicar pode atrasar, ler não pode cair."],"numeros":[["Leituras de timeline","100 mi × 10 aberturas por dia","1 bilhão por dia, ~12 mil/s na média, ~35 mil/s no pico"],["Posts novos","10% publicam 1 por dia","10 milhões por dia, ~115/s na média"],["Entregas na escrita (fan-out)","10 mi posts × 200 seguidores em média","2 bilhões de inserções em timelines por dia, ~23 mil/s"],["Conta famosa","1 post × 20 milhões de seguidores","20 milhões de inserções para um post só"],["Timeline em memória","100 mi × 800 ids × 8 bytes","~640 GB só de ids, antes de overhead da estrutura"]],"base":"A primeira versão monta a timeline na leitura: busca quem o usuário segue, busca os posts recentes de cada um e ordena. Funciona com milhares de usuários, mas cada abertura vira centenas de consultas. A versão que escala inverte o trabalho: quando alguém publica, o id do post é empurrado para a timeline pronta de cada seguidor, guardada em memória, e a leitura vira uma consulta só.","fluxo":["O app publica pelo API Gateway; o serviço de posts grava o post no DynamoDB e a mídia no S3 (upload direto com URL pré-assinada).","O DynamoDB Streams dispara o fan-out: um worker lê os seguidores do autor e enfileira lotes no SQS.","Workers inserem o id do post na timeline de cada seguidor ativo, num sorted set do ElastiCache (Valkey) limitado aos 800 mais recentes.","Na leitura, o serviço de timeline pega os ids no Valkey, junta os posts das contas famosas que a pessoa segue (buscados na hora) e hidrata os posts em lote, com cache.","Mídia sai pelo CloudFront; contadores de curtidas vêm de um serviço à parte, com cache."],"decisoes":[{"q":"Montar a timeline na escrita (fan-out on write) ou na leitura (fan-out on read)?","e":"Híbrido: na escrita para contas comuns, na leitura para as famosas.","por":"Leitura é 100 vezes mais frequente que escrita, então vale pagar na escrita: um post de alguém com 200 seguidores custa 200 inserções uma vez, e as 10 aberturas diárias de cada seguidor ficam baratas. Mas um treinador famoso com 20 milhões de seguidores transformaria cada post em 20 milhões de inserções, atrasando a entrega de todo mundo na fila. Para essas contas (acima de, digamos, 100 mil seguidores), o post não é empurrado: quem as segue busca os posts recentes delas na hora de ler e junta com a timeline pronta. Como cada pessoa segue poucas contas famosas, a junção é barata.","contra":"Só na leitura é simples e não tem atraso, mas cada abertura vira uma consulta por conta seguida, e o p99 explode com quem segue 2 mil contas. Só na escrita é rápida para ler, mas a conta famosa trava a fila e gasta armazenamento com timelines que ninguém vai abrir.","muda":"Se quase ninguém tem muitos seguidores (uma rede de amigos próximos), fan-out na escrita puro basta; se o feed é por relevância global (descoberta), o trabalho pesado vira geração de candidatos, não fan-out."},{"q":"Onde guardar a timeline pronta?","e":"ElastiCache (Valkey) com sorted sets de ids, limitados a 800 itens, só para usuários ativos.","por":"A timeline é uma lista curta de ids ordenada por tempo, lida o tempo todo: sorted set em memória responde em menos de um milissegundo e aparar para 800 itens (ZREMRANGEBYRANK) mantém a memória previsível. Quem não abre o app há 30 dias não recebe fan-out; se voltar, a timeline é reconstruída na leitura uma vez. Isso corta grande parte das inserções, porque muitos seguidores são contas paradas.","contra":"Uma tabela do DynamoDB com a timeline (chave do usuário, ordenação por tempo) é durável e não precisa ser reconstruída, mas 23 mil inserções por segundo em itens pequenos custam caro em unidades de escrita, e cada leitura custa outra consulta. O MemoryDB dá durabilidade com a mesma interface, mais caro, e a timeline é reconstruível: perder o cache não perde dado, só esquenta a leitura.","muda":"Se reconstruir em massa depois de perder o cache for caro demais para o seu pico, guarde a timeline também no DynamoDB e use o Valkey como cache dela."},{"q":"Onde guardar o grafo de quem segue quem?","e":"DynamoDB com lista de adjacência: uma tabela \"segue\" e um índice invertido para \"seguidores\".","por":"O acesso é sempre por vizinho direto: quem eu sigo (para a leitura das famosas) e quem me segue (para o fan-out). Uma tabela com partição pelo usuário e ordenação pelo seguido responde ao primeiro, e um índice secundário global invertido responde ao segundo. O fan-out lê os seguidores em páginas, com paralelismo.","contra":"O Neptune (banco de grafos) brilha em travessias de vários saltos, como \"amigos de amigos que treinam perna\", que este caso não pede no caminho quente. O Aurora com tabela de arestas funciona bem até algumas dezenas de milhões de arestas, depois a partição vira trabalho seu. Atenção à partição quente: a lista de seguidores de uma conta com 20 milhões de seguidores é uma partição enorme; distribua com sufixo (write sharding).","muda":"Se o produto precisar de recomendações por vizinhança no grafo, mantenha o DynamoDB no caminho quente e alimente um Neptune ou um job de análise por fora."},{"q":"Como executar o fan-out sem que um post grande atrase os outros?","e":"DynamoDB Streams aciona um distribuidor, que quebra o trabalho em lotes de 1.000 seguidores no SQS; workers em paralelo inserem em pipeline no Valkey.","por":"Quebrar em lotes transforma um post de 50 mil seguidores em 50 mensagens independentes, que dezenas de workers consomem em paralelo. Uma fila separada para autores com muitos seguidores evita que eles atrasem a fila dos posts comuns. Cada lote é idempotente: inserir o mesmo id duas vezes num sorted set não duplica.","contra":"Fazer o fan-out na própria requisição de publicar prende o autor esperando 200 escritas. Kinesis em vez de SQS daria ordem por partição, mas o fan-out não precisa de ordem (a timeline ordena pelo tempo do post), e o SQS escala sem gerenciar shards.","muda":"Se você precisa reprocessar (reconstruir timelines de um dia), um log com retenção como Kinesis ou MSK ajuda; o SQS não relê o que já foi consumido."},{"q":"Cronológico ou por relevância?","e":"Começar cronológico; depois, ranquear na leitura um conjunto de candidatos.","por":"O cronológico é previsível, fácil de paginar e de explicar. Quando o produto quiser relevância, o desenho muda pouco: a timeline pronta vira a lista de candidatos (os 800 mais recentes), e na leitura um modelo dá nota a cada um (interação com o autor, tipo de post, recência) e reordena. O ranqueamento pode rodar num serviço com o modelo em memória ou no SageMaker; o Amazon Personalize resolve casos mais simples.","contra":"Ranquear tudo na escrita não funciona porque a nota depende de quem lê e de quando lê. Ranquear sobre todos os posts possíveis é caro demais; por isso a separação entre gerar candidatos e ordenar.","muda":"Com ranqueamento, pagine com um \"snapshot\" da ordem (guardado por alguns minutos), senão a próxima página repete ou pula posts."},{"q":"Como paginar?","e":"Cursor com o score (tempo) e o id do último item visto, nunca offset.","por":"Com posts novos chegando no topo, \"página 2 = itens 21 a 40\" muda enquanto a pessoa rola, e ela vê post repetido. O cursor diz \"me dê os 20 itens mais antigos que (tempo X, id Y)\", que é estável e barato no sorted set (ZREVRANGEBYSCORE com limite).","contra":"Offset é simples de implementar e de testar, e é a resposta errada em qualquer lista que muda enquanto é lida.","muda":"Nunca, para esse tipo de lista."},{"q":"Como contar curtidas sem uma linha quente?","e":"Contadores em fragmentos (sharded counters) no DynamoDB, somados e cacheados, com número aproximado na tela.","por":"Um post viral recebe milhares de curtidas por segundo; um contador único é uma partição quente que estoura o limite de escrita por partição. Dividindo em N fragmentos (post#0 a post#9) escolhidos ao acaso, a escrita se espalha, e a leitura soma os N e guarda em cache por alguns segundos. Ninguém percebe se o número está 3 segundos atrasado.","contra":"Incrementar no Valkey é rápido e simples, mas perde contagem num failover se você não persistir; dá para combinar: incrementa no Valkey e descarrega em lote no DynamoDB. Contar exato e na hora custa caro e não muda nada para o usuário.","muda":"Se o número vira dinheiro (pagamento por visualização), conte por eventos num pipeline auditável, como no case de agregação em tempo real."},{"q":"E o autor, que precisa ver o próprio post na hora?","e":"Ler-o-que-escrevi: na leitura do próprio autor, juntar os posts dele dos últimos minutos direto do banco.","por":"O fan-out pode levar segundos, e o autor que publica e não vê o post acha que falhou e publica de novo. Na timeline dele, o serviço junta os posts recentes do próprio autor (uma consulta pela chave dele), garantindo a percepção de consistência sem esperar o fan-out.","contra":"Esperar o fan-out terminar antes de responder ao autor atrela a publicação ao seguidor mais lento.","muda":"Mesma ideia para \"acabei de seguir alguém\": busque os posts recentes da nova conta na primeira leitura."},{"q":"Como lidar com post apagado, bloqueio e privacidade, se os ids já foram copiados para milhões de timelines?","e":"Filtrar na leitura: a hidratação descarta posts apagados, de contas bloqueadas ou que viraram privados.","por":"Remover um id de 20 milhões de timelines é outro fan-out caro e lento. Como toda leitura hidrata os posts, o filtro na hidratação (post existe, não está apagado, o leitor não está bloqueado) resolve na hora. A limpeza física dos ids pode acontecer depois, ou nunca, já que as timelines são aparadas.","contra":"Confiar só na remoção assíncrona deixa o post visível por minutos, o que é inaceitável para bloqueio e moderação.","muda":"Para conteúdo ilegal, além do filtro, purgue a mídia do CloudFront por invalidação."}],"dados":"Posts no DynamoDB com chave pelo id do post (UUID v7, que ordena por tempo) e um índice por autor e tempo. O grafo em duas visões (segue e seguidores). As timelines no Valkey, com chave timeline:{usuario} e score igual ao tempo do post. Contadores fragmentados numa tabela própria.","tabelas":[["posts","post_id","por id em lote (BatchGetItem) na hidratação; por autor + tempo (GSI) para as contas famosas e para o próprio autor"],["segue","usuario_id + seguido_id","quem eu sigo; GSI invertido para quem me segue"],["timeline:{usuario} (Valkey)","sorted set: score = tempo, membro = post_id","ler 20 a partir do cursor; aparar em 800"],["contadores","post_id#fragmento","soma dos fragmentos, com cache"]],"falhas":[["O cluster do Valkey perde um nó","As timelines daquele fragmento somem; a leitura cai para o modo \"montar na leitura\" até a reconstrução. Medir quanto o banco aguenta esse modo é parte do teste de carga."],["Um famoso publica no pico","Nada de fan-out para ele; o custo vai para a leitura dos seguidores, que buscam o post dele por autor, com cache."],["A fila de fan-out acumula","Os posts chegam atrasados às timelines; o autor continua vendo o próprio post. Alarme pela idade da mensagem mais antiga, não pelo tamanho da fila."],["Um post viral derruba o contador","Os fragmentos espalham a escrita; o cache absorve a leitura."]],"custo":"O custo maior é memória: centenas de GB de timelines no ElastiCache, replicadas. Restringir o fan-out a usuários ativos e aparar as listas é o que mantém isso sob controle. Depois vêm as escritas do fan-out e a transferência de mídia pelo CloudFront, que, numa rede com fotos, costuma passar o custo do banco.","evolucao":[["v1","Montar na leitura com o Aurora e cache; serve para dezenas de milhares de usuários."],["v2","Fan-out na escrita para todos, timelines no Valkey, paginação por cursor."],["v3","Híbrido para as contas famosas, só usuários ativos, contadores fragmentados."],["v4","Ranqueamento na leitura sobre os candidatos, com features em tempo real e testes A/B."]],"perguntas":["Calcule as inserções por segundo do fan-out com os números do case e diga o que muda se a média de seguidores dobrar.","Por que a conta famosa vai para a leitura, e quantas contas famosas uma pessoa pode seguir antes de isso ficar caro?","Por que offset quebra a paginação de um feed?","O que acontece com o p99 quando o cache de timelines é perdido, e como você testaria isso?","Como o autor vê o próprio post antes de o fan-out terminar?"],"pratica":{"t":"Fan-out híbrido no seu computador","passos":["Em Go, com Valkey em Docker, gere 10 mil usuários com seguidores numa distribuição de cauda longa (poucos com muitos).","Implemente o fan-out na escrita com limite de 800 e o caminho de leitura para quem tem mais de 1.000 seguidores.","Meça o p99 da leitura e as escritas por post nos dois modos e no híbrido.","Simule a perda do cache e meça o tempo de reconstrução."],"pronto":["Uma tabela com p99 de leitura e custo de escrita nos três modos","A paginação por cursor não repete itens com posts chegando durante a leitura"]},"caps":[12,16,7,1],"livros":[["Kleppmann",2,"Definindo requisitos não funcionais","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch02.html","o case das home timelines e a diferença entre média e percentil","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"],["Kleppmann",7,"Fragmentação","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch07.html","fragmentação e partição quente","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"],["Burns",7,"Serviços fragmentados","https://www.oreilly.com/library/view/projetando-sistemas-distribuidos/9798341637856/ch07.html","serviços fragmentados","Projetando Sistemas Distribuídos, 2ª ed.","burns"]],"links":[["InfoQ: Timelines at Scale (Raffi Krikorian, Twitter)","https://www.infoq.com/presentations/Twitter-Timeline-Scalability"],["DynamoDB: write sharding para distribuir carga","https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-sharding.html"],["Amazon Builders' Library: Caching challenges and strategies","https://aws.amazon.com/builders-library/caching-challenges-and-strategies/"]],"labs":[12]},{"id":"notificacoes","n":4,"g":"tempo-real","t":"Notificações em massa","q":"Como mandar 30 milhões de notificações por push, e-mail e SMS sem atrasar o código de verificação de quem está tentando entrar?","nivel":"Intermediário","horas":4,"cenario":"O app avisa de tudo: código de login por SMS, recibo de pagamento por e-mail, \"seu treino de hoje\" às 7h no fuso de cada um, e campanhas para toda a base. Cada canal tem um provedor com limite próprio (APNs, FCM, SES, operadoras de SMS), cada pessoa tem preferências, e uma campanha de 30 milhões não pode atrasar o código de login que alguém está esperando agora.","req":["Push, e-mail e SMS.","Transacionais (login, pagamento) e em massa (campanhas, lembretes).","Respeitar preferências, descadastro e horário de silêncio.","Agendar para um horário no fuso de cada pessoa.","Saber o que foi entregue, aberto ou falhou."],"nreq":["Transacional entregue ao provedor em menos de 5 segundos, sempre.","Campanha de 30 milhões concluída em até 1 hora.","Nunca mandar a mesma notificação duas vezes à mesma pessoa."],"numeros":[["Campanha","30 milhões em 1 hora","~8.300 por segundo, sustentados"],["Transacionais","5 milhões por dia","~60/s na média, picos de centenas"],["Lembrete diário","10 milhões às 7h locais","picos por fuso horário, a cada hora cheia"]],"base":"O centro é uma API de notificações que recebe \"mande X para a pessoa Y\", consulta preferências, monta o conteúdo e põe na fila do canal certo, com filas separadas por prioridade. Workers por canal respeitam o limite de cada provedor. Desde o fim do suporte ao Amazon Pinpoint, em 30 de outubro de 2026, os canais na AWS são o SES para e-mail e o AWS End User Messaging para SMS e push.","fluxo":["Os serviços publicam um evento (\"pagamento aprovado\", \"campanha 42\") no EventBridge ou chamam a API de notificações.","A API resolve a pessoa, confere preferências e descadastro (DynamoDB, com cache) e grava um registro com o id da notificação (deduplicação).","Monta o conteúdo pelo modelo e idioma e põe na fila SQS do canal e da prioridade (sms-alta, email-baixa...).","Workers por canal consomem respeitando um balde de fichas por provedor e chamam o End User Messaging (SMS, push) ou o SES (e-mail).","Eventos de entrega, abertura e falha voltam pelo SNS/Kinesis e atualizam o registro; tokens de push inválidos são apagados.","Campanhas grandes são disparadas por um Step Functions com mapa distribuído sobre a lista de destinatários no S3."],"decisoes":[{"q":"Como impedir que a campanha atrase o código de login?","e":"Filas separadas por prioridade e canal, com workers e limites próprios.","por":"Se tudo cai numa fila, os 30 milhões da campanha entram na frente do código de login que alguém pediu agora, e ele chega 40 minutos depois. Com uma fila de alta prioridade por canal, com workers reservados e uma fatia garantida do limite do provedor, o transacional sai em segundos mesmo no meio da campanha.","contra":"Uma fila com prioridade dentro da mensagem não existe no SQS; ordenar por prioridade exigiria um banco como fila, mais lento e mais frágil. Contas separadas do provedor por tipo (um remetente de e-mail para transacional, outro para marketing) também protegem a reputação: spam de campanha não derruba a entrega do recibo.","muda":"Volume pequeno e sem campanhas: uma fila por canal basta."},{"q":"SNS, EventBridge ou SQS: quem distribui?","e":"EventBridge para receber eventos dos serviços; SQS por canal e prioridade para o trabalho; SNS só onde há fan-out para várias filas.","por":"O EventBridge recebe eventos de negócio de vários serviços e roteia por regras (\"pagamento aprovado\" vai para notificações). O SQS dá o que os workers precisam: retentativa com visibilidade, fila de mensagens mortas e controle de vazão. O SNS com filtro de mensagens faz fan-out de um evento para várias filas (e-mail e push do mesmo recibo).","contra":"Mandar direto do serviço de origem para o provedor acopla todo mundo ao limite do provedor e espalha a regra de preferências. O SNS mobile push sozinho manda push, mas não guarda histórico nem respeita preferências.","muda":"Se você precisa reprocessar notificações de ontem, mantenha um log (Kinesis ou S3) além das filas."},{"q":"Como garantir \"nunca duas vezes\"?","e":"Id determinístico por notificação e escrita condicional antes de enviar.","por":"Filas entregam pelo menos uma vez: um worker que morre depois de enviar e antes de apagar a mensagem faz outro worker enviar de novo. O id da notificação nasce do evento (campanha42:usuario123, ou pagamento789:recibo), e o worker grava \"enviando\" com condição de que o id não exista; se já existe, pula.","contra":"A janela de deduplicação da fila FIFO é de 5 minutos e limita a vazão; serve para duplicatas próximas, não para um reprocessamento de horas depois. Ainda sobra uma janela pequena (enviou e caiu antes de marcar), e para push de lembrete isso é aceitável; para SMS caro, consulte o provedor antes de reenviar.","muda":"Notificações sem dano se repetidas (um badge de contador) dispensam o registro."},{"q":"Como respeitar o limite de cada provedor?","e":"Balde de fichas por provedor e conta, compartilhado pelos workers, e backoff quando o provedor reclama.","por":"O SES tem uma taxa máxima de envio por segundo na sua conta, o SMS depende do tipo de número e da operadora, e o APNs e o FCM devolvem erro quando você exagera. Um balde no Valkey por provedor garante que os 200 workers juntos não passem do limite, e a fatia reservada para a alta prioridade fica de fora.","contra":"Deixar cada worker ir no máximo e tratar o erro de limite com retry vira tempestade: todos batem no limite e todos tentam de novo ao mesmo tempo.","muda":"Peça aumento de limite ao provedor antes de campanhas grandes; o controle de vazão continua necessário."},{"q":"Como disparar uma campanha para 30 milhões?","e":"Step Functions com mapa distribuído lendo a lista de destinatários do S3 em lotes.","por":"A segmentação (quem recebe) é uma consulta no data lake que gera um arquivo no S3. O mapa distribuído lê o arquivo em lotes, roda milhares de execuções filhas em paralelo, controla a concorrência e registra quais lotes falharam para refazer só eles. Cada lote enfileira as mensagens nas filas de baixa prioridade.","contra":"Um único processo lendo 30 milhões de linhas e enfileirando leva horas e, se cair no meio, você não sabe de onde retomar. As campanhas e jornadas do Pinpoint deixaram de existir com o fim do suporte; a AWS indica o Amazon Connect para campanhas de marketing, que é outra família de produto.","muda":"Se o time de marketing precisa de editor visual de jornadas, um produto de engajamento (Connect ou de terceiros) por cima, e este pipeline só para o envio."},{"q":"Como mandar às 7h no fuso de cada pessoa?","e":"Agrupar por fuso e disparar um lote por fuso na hora certa com o EventBridge Scheduler.","por":"São poucos fusos e milhões de pessoas: 30 agendamentos (um por fuso relevante) disparam lotes, em vez de 10 milhões de agendamentos individuais. O EventBridge Scheduler roda o lote no horário, e o lote segue o mesmo caminho da campanha.","contra":"Um agendamento por pessoa no EventBridge Scheduler funciona (ele aguenta muitos agendamentos de uma vez só) e é o certo para horários individuais (\"me lembre às 18h12\"), mas, para \"todo mundo às 7h locais\", é desperdício. Mensagem com atraso no SQS só vai até 15 minutos.","muda":"Lembretes com horário escolhido por cada pessoa: um agendamento por pessoa no Scheduler."},{"q":"Onde ficam preferências e horário de silêncio?","e":"DynamoDB por usuário, em cache de curta duração no serviço; checados no momento do envio, não só no enfileiramento.","por":"Quem se descadastrou às 10h não pode receber a campanha que estava na fila desde as 9h. Conferir de novo no worker, com cache de um minuto, fecha essa janela. O horário de silêncio adia (volta para a fila com atraso ou agenda), não descarta, para o que é importante.","contra":"Checar só ao enfileirar é mais barato e erra exatamente nos descadastros recentes, que são os que geram reclamação.","muda":"Transacionais obrigatórios (segurança da conta) ignoram preferência de marketing e respeitam só o canal."},{"q":"Como lidar com tokens de push que morreram?","e":"Apagar o token quando o APNs ou o FCM disser que ele não é mais válido.","por":"Quem desinstalou o app deixa um token morto, e mandar para ele gasta vazão e piora sua reputação no provedor. O retorno de token inválido (no APNs, o status 410) volta pelos eventos de entrega e o token é apagado.","contra":"Manter tokens velhos infla a base e o custo das campanhas sem entregar nada.","muda":"Nunca; é higiene básica."}],"dados":"Preferências e tokens por usuário no DynamoDB, registro de envios com TTL de 30 dias, listas de campanha no S3.","tabelas":[["preferencias","usuario_id","por canal e tipo; cache de 1 minuto"],["tokens_push","usuario_id + token","todos os aparelhos de uma pessoa"],["envios","notificacao_id","deduplicação e estado; TTL de 30 dias"]],"falhas":[["O SES limita a taxa no meio da campanha","O balde reduz a vazão, a fila de baixa prioridade acumula, a de alta continua com a fatia reservada."],["Um worker cai depois de enviar","A mensagem volta à fila; o registro condicional impede o segundo envio."],["Um lote da campanha falha","O mapa distribuído registra o lote e você refaz só ele."],["O provedor de SMS fica fora do ar","Fila acumula com retry e backoff; para códigos de login, troque para outro canal (e-mail ou push) depois de um tempo."]],"custo":"SMS é de longe o canal mais caro por mensagem, e o custo varia por país; e-mail pelo SES é barato; push quase não tem custo de envio. Por isso a regra de produto \"push primeiro, SMS só quando necessário\" economiza mais que qualquer otimização técnica.","evolucao":[["v1","API de notificações, uma fila por canal, SES e push."],["v2","Prioridades, deduplicação, preferências, eventos de entrega."],["v3","Campanhas com mapa distribuído, agendamento por fuso, balde por provedor."],["v4","Vários provedores por canal com troca automática, e envio otimizado pelo horário em que cada pessoa costuma abrir."]],"perguntas":["Por que uma fila só faz o código de login chegar atrasado?","De onde vem o id da notificação, e por que ele precisa ser determinístico?","Por que conferir a preferência de novo no worker?","O que mudou para quem usava o Amazon Pinpoint, e o que você usaria hoje para SMS, e-mail e push?"],"pratica":{"t":"Filas com prioridade e deduplicação","passos":["Em Go, um produtor que enfileira 100 mil notificações de campanha e, no meio, 100 transacionais (use SQS de verdade ou o ElasticMQ local).","Workers com balde de fichas compartilhado no Valkey e registro condicional no DynamoDB Local.","Meça o tempo das transacionais durante a campanha com uma fila só e com filas por prioridade."],"pronto":["Transacionais abaixo de 5 segundos durante a campanha","Zero duplicatas depois de matar workers no meio"]},"caps":[14,15,16],"livros":[["Burns",11,"Sistemas de filas de trabalho","https://www.oreilly.com/library/view/projetando-sistemas-distribuidos/9798341637856/ch11.html","filas de trabalho","Projetando Sistemas Distribuídos, 2ª ed.","burns"],["Burns",9,"Funções e processamento acionado por eventos","https://www.oreilly.com/library/view/projetando-sistemas-distribuidos/9798341637856/ch09.html","processamento acionado por eventos","Projetando Sistemas Distribuídos, 2ª ed.","burns"],["Richards e Ford",15,"Estilo de arquitetura orientado para eventos","https://www.oreilly.com/library/view/fundamentos-da-arquitetura/9798341637955/ch15.html","arquitetura orientada a eventos","Fundamentos da arquitetura de software, 2ª ed.","richards-ford"]],"links":[["Amazon Pinpoint: fim do suporte e para onde migrar","https://docs.aws.amazon.com/pinpoint/latest/userguide/migrate.html"],["SNS: fan-out para filas SQS","https://docs.aws.amazon.com/sns/latest/dg/SendMessageToSQS.html"],["Amazon EventBridge Scheduler","https://docs.aws.amazon.com/scheduler/latest/UserGuide/what-is-scheduler.html"],["Amazon Builders' Library: Avoiding insurmountable queue backlogs","https://aws.amazon.com/builders-library/avoiding-insurmountable-queue-backlogs/"]],"labs":[14,15],"reusa":"O balde de fichas compartilhado é o do case de rate limit: reaproveite o script Lua."},{"id":"autocomplete","n":5,"g":"dados","t":"Autocomplete de busca","q":"Como sugerir as melhores buscas a cada letra digitada, em menos de 50 ms, para milhões de pessoas?","nivel":"Intermediário","horas":4,"cenario":"A busca de exercícios, treinos e alimentos do app sugere enquanto você digita: \"ag\" vira \"agachamento\", \"agachamento búlgaro\", \"agachamento livre\". As sugestões vêm das buscas mais populares, com um toque do que está em alta e do histórico de cada pessoa. Cada tecla é uma requisição, então o volume é várias vezes o das buscas, e a resposta precisa chegar antes da próxima tecla.","req":["Até 10 sugestões por prefixo, ordenadas por popularidade.","Termos em alta aparecem em horas, não em dias.","Tolerar acentos e pequenos erros.","Não sugerir termos ofensivos.","Misturar sugestões pessoais (buscas recentes da pessoa)."],"nreq":["p99 abaixo de 50 ms no servidor.","Pico de dezenas de milhares de requisições por segundo.","Disponibilidade de 99,9%: sem sugestão a busca ainda funciona, mas pior."],"numeros":[["Requisições","10 mi de pessoas × 5 buscas × 6 teclas","300 milhões por dia, ~3,5 mil/s na média, ~15 mil/s no pico"],["Termos distintos","top 5 milhões de buscas","é isso que vira sugestão"],["Prefixos","5 mi termos × ~10 prefixos úteis","~50 milhões de prefixos com top 10 pré-calculado, alguns GB"]],"base":"Duas partes independentes: a coleta, que transforma os logs de busca numa tabela de termos com popularidade, e o serviço, que responde a um prefixo com os 10 melhores termos. O truque central é pré-calcular o top 10 de cada prefixo, para que a leitura seja uma busca por chave, e não uma ordenação na hora.","fluxo":["O app manda cada busca feita para o Kinesis Data Firehose, que grava no S3 em Parquet.","Um job diário (Athena ou Glue) conta os termos, aplica decaimento por idade e a lista de bloqueio, e gera o top 10 de cada prefixo.","Um job no Flink soma o que está em alta na última hora e gera um pequeno conjunto de termos quentes.","O índice do dia é carregado num cluster novo (ou índice novo) e o tráfego troca por alias, sem janela de inconsistência.","O app espera 100 ms sem teclas antes de chamar GET /sugestoes?q=agach; o CloudFront responde prefixos curtos do cache.","O serviço busca o top 10 do prefixo, junta os termos em alta e as buscas recentes da pessoa (guardadas no aparelho) e responde."],"decisoes":[{"q":"Que estrutura responde ao prefixo?","e":"Top 10 pré-calculado por prefixo, servido de chave e valor; o OpenSearch com completion suggester se precisar de tolerância a erros.","por":"Uma trie em que cada nó já guarda o top 10 dos termos abaixo dele transforma a sugestão em busca por chave: o prefixo \"agach\" aponta para uma lista pronta. Materializada como tabela (prefixo → lista), cabe no ElastiCache ou no DynamoDB e responde em um milissegundo. O completion suggester do OpenSearch guarda uma estrutura parecida em memória (uma FST), com pesos e a opção de fuzzy para erros de digitação, ao preço de operar um cluster.","contra":"Fazer busca de texto completo com \"começa com\" (edge n-grams, search_as_you_type) e ordenar na hora é flexível e muito mais caro por requisição. Um LIKE \"agach%\" num banco relacional ordenado por popularidade funciona com milhares de termos, não com milhões a 15 mil por segundo.","muda":"Se as sugestões são resultados (os próprios exercícios, com filtros) e não buscas populares, o OpenSearch com search_as_you_type é o caminho."},{"q":"De onde vem a popularidade, e com que frequência atualizar?","e":"Lote diário sobre os logs no S3, com decaimento por idade, mais uma camada de \"em alta\" por hora no Flink.","por":"Contar 30 dias de buscas e recalcular o top 10 de 50 milhões de prefixos é um job em lote de minutos no Athena ou no Glue, barato e reprocessável. Mas um termo que estourou hoje (um treino que viralizou) demoraria um dia; a camada horária do Flink soma as buscas da última hora e injeta os termos quentes, que são poucos.","contra":"Atualizar o índice inteiro em tempo real a cada busca gera escrita contínua em milhões de prefixos (cada busca afeta todos os prefixos do termo) para um ganho que quase ninguém nota.","muda":"Produto de notícias, em que tudo importante é de hoje: a camada em tempo real vira a principal."},{"q":"Como trocar o índice do dia sem servir metade velho e metade novo?","e":"Construir o índice novo ao lado e trocar por um ponteiro (alias no OpenSearch, versão da chave no cache).","por":"Atualizar prefixo por prefixo deixa uma janela em que \"ag\" mostra a lista nova e \"aga\" a velha, e se o job falha no meio, fica assim. Construindo uma versão nova completa e trocando o alias (ou o prefixo das chaves, v42:agach) numa operação, a troca é atômica, e voltar é trocar o ponteiro de novo.","contra":"Escrever por cima do índice em uso é mais barato em espaço e arrisca exatamente o meio-termo inconsistente.","muda":"Índices pequenos que carregam em segundos podem ser substituídos em memória de uma vez."},{"q":"Dá para usar cache de CDN numa resposta que muda a cada tecla?","e":"Sim: os prefixos curtos são iguais para todo mundo e são os mais pedidos; cache no CloudFront por alguns minutos.","por":"\"a\", \"ag\", \"aga\" respondem igual para todos (a parte pessoal é juntada no aparelho), e uma fração enorme das requisições é de prefixos de 1 a 3 letras. Com a resposta pública e cacheável no CloudFront por 5 minutos, a maior parte do tráfego nem chega ao serviço.","contra":"Misturar a parte pessoal no servidor torna cada resposta única e mata o cache.","muda":"Se a sugestão depende da localização ou do idioma, inclua isso na chave de cache e o cache continua valendo."},{"q":"O que o cliente faz?","e":"Espera 100 a 150 ms sem teclas, cancela a requisição anterior, guarda as respostas em memória e filtra localmente quando dá.","por":"Sem espera, digitar \"agachamento\" rápido faria 11 requisições e mostraria sugestões fora de ordem. Com espera e cancelamento, são duas ou três. Se o app já tem as sugestões de \"agach\", pode filtrá-las para \"agacha\" sem perguntar ao servidor.","contra":"Resolver tudo no servidor ignora que o cliente é o lugar mais barato e rápido para cortar requisições.","muda":"Nunca; é o que mais reduz carga."},{"q":"Como lidar com acentos e erros?","e":"Normalizar (minúsculas, sem acento) na construção e na consulta; fuzzy só se o prefixo exato não achar nada.","por":"Em português, \"agachamento\" e \"agachámento\", ou \"proteina\" e \"proteína\", precisam cair no mesmo prefixo: normalizar dos dois lados resolve sem custo na consulta. O fuzzy do completion suggester tolera uma letra trocada, mas custa mais; usá-lo só como segunda tentativa mantém o caminho comum rápido.","contra":"Fuzzy sempre ligado melhora alguns casos e aumenta a latência de todos.","muda":"Se os logs mostram muitos erros de digitação nos mesmos termos, adicione as variações erradas como sinônimos na construção."},{"q":"Como evitar sugestões ofensivas ou perigosas?","e":"Lista de bloqueio aplicada na construção do índice, mais um botão de remoção que tira o termo em minutos.","por":"Sugestões vêm do que as pessoas digitam, e as pessoas digitam de tudo. Filtrar na construção impede que o termo entre; uma lista de remoção urgente, lida pelo serviço com cache curto, tira um termo do ar sem esperar o lote do dia.","contra":"Filtrar só na resposta deixa o termo ocupando uma das 10 vagas e aparecendo se o filtro falhar.","muda":"Nunca; é obrigatório para qualquer sugestão vinda de usuários."}],"dados":"Logs de busca no S3 (Parquet, por data), tabela de termos com contagem e decaimento, e o top 10 por prefixo no serviço.","tabelas":[["S3 buscas","particionado por data","Athena: contagem por termo"],["sugestoes:v{versao}:{prefixo} (Valkey)","lista com os 10 termos","GET por requisição"],["em_alta (Valkey)","sorted set por hora","união com o top 10 do prefixo"]],"falhas":[["O job do dia falha","O ponteiro continua na versão de ontem; ninguém percebe."],["O serviço fica lento","O app mostra só as buscas recentes da pessoa (locais) e a busca continua funcionando."],["Um termo ofensivo entra em alta","A camada horária aplica a mesma lista de bloqueio; a remoção urgente cobre o resto."]],"custo":"O cache do CloudFront corta a maior parte das requisições. O resto é um cluster pequeno de Valkey (ou OpenSearch) e um job diário barato no Athena. A camada em tempo real no Flink costuma ser a linha mais cara para o valor que entrega; ligue-a só se o produto precisar.","evolucao":[["v1","Top 10 por prefixo calculado à mão a partir de uma lista de termos, em memória no serviço."],["v2","Logs no S3, lote diário, índice versionado, cache no CloudFront."],["v3","Camada em alta no Flink, fuzzy no OpenSearch, sugestões pessoais no aparelho."]],"perguntas":["Por que pré-calcular o top 10 por prefixo em vez de ordenar na hora?","Que fração do tráfego o CloudFront pode absorver, e por quê?","Como trocar o índice do dia de forma atômica?","Onde fica a parte pessoal das sugestões, e por que não no servidor?"],"pratica":{"t":"Uma trie com top 10 em Go","passos":["Gere 1 milhão de buscas falsas com distribuição de cauda longa.","Construa a trie com top 10 por nó e meça memória e tempo de construção.","Sirva por HTTP e meça o p99 com k6; depois materialize a tabela de prefixos no Valkey e compare."],"pronto":["p99 abaixo de 5 ms local","Troca de versão sem nenhuma resposta misturada durante o teste de carga"]},"caps":[7,12,6],"livros":[["Kleppmann",4,"Armazenamento e recuperação","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch04.html","índices e estruturas de armazenamento","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"],["Kleppmann",11,"Processamento em lote","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch11.html","processamento em lote","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"],["Head First Algoritmos",6,"Tabelas hash, pilhas e filas","https://www.oreilly.com/library/view/head-first-algorithms/9781098174071/ch06.html","tabelas hash e estruturas de busca","Head First Algorithms (edição em inglês)","hf-algoritmos"]],"links":[["OpenSearch: campos de autocomplete","https://opensearch.org/docs/field-types/supported-field-types/autocomplete/"],["Amazon Builders' Library: Caching challenges and strategies","https://aws.amazon.com/builders-library/caching-challenges-and-strategies/"]],"labs":[7]},{"id":"pagamentos","n":6,"g":"dinheiro","t":"Pagamentos idempotentes","q":"Como cobrar exatamente uma vez quando a rede, o cliente e o gateway podem falhar no meio do caminho?","nivel":"Avançado","horas":6,"cenario":"A assinatura Premium do Fitness Evolutivo virou um produto grande: cartão e Pix, cobrança recorrente e avulsa, numa escala de milhões de assinantes. O app chama POST /pagamentos, o backend chama um gateway de pagamento (PSP) e o PSP chama o banco. Qualquer elo pode cair depois de a cobrança acontecer e antes de a resposta voltar. O usuário aperta \"pagar\" de novo, o app refaz a chamada sozinho, o PSP manda o mesmo webhook três vezes. O case é sobre fazer o resultado ser o de uma cobrança só, sem depender de nada disso dar certo.","req":["Cobrar cartão (síncrono para o usuário) e Pix (assíncrono, com QR code e confirmação depois).","Repetir a mesma requisição nunca cobra duas vezes; repetir com corpo diferente e a mesma chave é erro.","Receber webhooks do PSP (autorizado, capturado, estornado, chargeback) e refletir no estado do pagamento.","Reembolso total e parcial.","Extrato contábil (ledger) que fecha com o PSP todo dia.","Avisar o resto do sistema (assinatura ativa, nota fiscal, e-mail) quando o pagamento muda de estado."],"nreq":["Pico de 2.500 pagamentos por segundo (Black Friday e virada de mês da recorrência).","p99 da API abaixo de 300 ms sem contar o PSP; o PSP leva de 300 ms a vários segundos.","Disponibilidade de 99,95% na criação de pagamentos.","Consistência forte no ledger: nenhuma entrada perdida, nenhuma duplicada, soma zero por transação.","Auditoria por 5 anos; dados de cartão nunca passam pelo backend (escopo PCI mínimo)."],"numeros":[["Pagamentos por dia","20 milhões","média de ~230/s; o pico é 10x a média"],["Linhas no ledger","20 mi × 3 entradas","60 milhões de linhas por dia, ~22 bilhões por ano"],["Tamanho do ledger","60 mi × ~300 bytes","~18 GB por dia, ~6,5 TB por ano antes de índices"],["Chaves de idempotência","20 mi × ~1 KB, guardadas por 7 dias","~140 GB em uso, renovando sozinhos"],["Webhooks recebidos","~3 por pagamento","60 milhões por dia, com rajadas quando o PSP reenvia em lote"]],"base":"A primeira versão que funciona é pequena: API Gateway na frente, um serviço em Go (Lambda ou ECS Fargate) com a lógica, Aurora PostgreSQL guardando pagamentos, chaves de idempotência e ledger, e uma fila SQS para os webhooks. O ponto central é que a chamada ao PSP não cabe numa transação de banco: o pagamento avança em fases atômicas, e cada fase grava no banco o que já aconteceu antes de tentar a próxima.","fluxo":["O app gera uma chave de idempotência (UUID) quando o usuário decide pagar e a manda no cabeçalho Idempotency-Key, igual em todas as tentativas.","API Gateway autentica (Cognito/JWT), aplica limite por usuário e chama o serviço de pagamentos.","Fase 1, numa transação no Aurora: grava a chave (único por usuário + chave) com o hash do corpo e cria o pagamento em CRIADO. Se a chave já existe, devolve a resposta guardada ou 409 se ainda está em andamento.","Fase 2, fora de transação: chama o PSP passando o id do pagamento como chave de idempotência do próprio PSP, com timeout curto.","Fase 3, nova transação: grava o resultado (AUTORIZADO, RECUSADO ou DESCONHECIDO), as entradas do ledger e um evento na tabela outbox; guarda a resposta na chave.","Um relay lê a outbox e publica no EventBridge; assinatura, nota fiscal e e-mail consomem de lá.","Webhooks do PSP entram por outro endpoint, são validados pela assinatura HMAC, vão para o SQS e um worker aplica a transição de estado se ela for válida.","Um job a cada minuto (EventBridge Scheduler) procura pagamentos presos em PROCESSANDO ou DESCONHECIDO e consulta o PSP."],"decisoes":[{"q":"Quem cria a chave de idempotência, e o que ela identifica?","e":"O cliente, uma por intenção de pagamento, reaproveitada em todas as tentativas.","por":"A chave precisa nascer antes da primeira tentativa, senão não existe nada para comparar quando a segunda chegar. Imagine o usuário no metrô: o app manda o POST, a conexão cai depois de o servidor cobrar, e o app tenta de novo 2 segundos depois. Se a chave nasceu no app quando ele tocou em \"pagar\", a segunda tentativa chega com a mesma chave e recebe a resposta da primeira. O servidor ainda guarda um hash do corpo junto da chave: mesma chave com corpo diferente é bug do cliente e devolve 422, em vez de cobrar o valor novo.","contra":"Deduplicar pelo conteúdo (mesmo usuário, mesmo valor, mesmos 5 minutos) parece dispensar a chave, mas junta duas compras legítimas iguais, como duas diárias de academia seguidas, e não segura um retry que chega 6 minutos depois. Gerar a chave no servidor só funciona se ele a devolver antes de cobrar, o que vira um passo extra (criar a intenção, depois confirmar): é o modelo PaymentIntent do Stripe, ótimo, mas são duas chamadas e dois estados a mais.","muda":"Se o cliente não é seu (uma API pública), exija a chave e documente a janela de validade; se é um fluxo em duas etapas, a intenção criada no servidor faz o papel da chave."},{"q":"Onde guardar a chave: junto do pagamento ou num armazenamento à parte?","e":"Na mesma transação do Aurora PostgreSQL que cria o pagamento.","por":"Quando a chave e o pagamento estão no mesmo banco, a fase 1 é uma transação só: ou os dois existem, ou nenhum. Não existe a janela em que a chave diz \"em andamento\" e o pagamento não foi criado, que é exatamente o estado que sobra quando um processo morre entre duas escritas em sistemas diferentes. Com dinheiro, essa atomicidade compra muita simplicidade na recuperação.","contra":"Uma tabela do DynamoDB com PutItem condicional (attribute_not_exists) é o padrão do Powertools for AWS Lambda e escala sem esforço, mas fica num sistema diferente do pagamento: você precisa de um estado EM_ANDAMENTO com prazo (lease) e de uma regra para quando o prazo vence com o resultado desconhecido. Também dá para usar a chave só como cache (ElastiCache), mas cache pode perder a entrada num failover, e aí a proteção some exatamente no dia ruim.","muda":"Se o estado do pagamento já mora no DynamoDB, guarde a chave lá, na mesma TransactWriteItems que cria o pagamento, e o argumento da atomicidade continua valendo."},{"q":"Como chamar o PSP, se a chamada não cabe numa transação?","e":"Fases atômicas, com o id do pagamento como chave de idempotência no PSP, e \"desconhecido\" como estado de primeira classe.","por":"A chamada externa pode demorar 8 segundos, e segurar uma transação aberta esse tempo trava linhas e esgota conexões no pico. Então o fluxo grava \"vou chamar o PSP\" (PROCESSANDO), chama, e grava o resultado noutra transação. Se o serviço morrer no meio, o pagamento fica em PROCESSANDO, e o job de recuperação pergunta ao PSP o que aconteceu. Como o PSP recebeu o id do pagamento como chave, refazer a chamada não cobra de novo. Timeout não é recusa: um timeout vira DESCONHECIDO e o app mostra \"estamos confirmando\", nunca \"falhou, tente de novo\".","contra":"Tratar timeout como falha é o erro clássico: o usuário tenta de novo com outra chave e paga duas vezes. Um commit distribuído (2PC) com o PSP não existe, nenhum PSP participa da sua transação. Fazer tudo síncrono e torcer custa pouco até o primeiro incidente com o PSP lento, quando aparecem centenas de cobranças duplicadas para estornar à mão.","muda":"Se o PSP não aceita chave de idempotência, antes de qualquer nova tentativa consulte o PSP pelo seu id de referência; sem consulta possível, não refaça automaticamente."},{"q":"O cliente espera a resposta (síncrono) ou recebe \"aceito\" e acompanha depois (assíncrono)?","e":"Cartão síncrono com limite de 10 segundos e queda para assíncrono; Pix sempre assíncrono.","por":"No cartão, o usuário está olhando a tela e quer saber se passou: a autorização costuma voltar em 1 a 3 segundos, então vale esperar. Se passar de 10 segundos, a API devolve 202 com o id do pagamento e o app passa a consultar (ou ouvir) o estado, sem que a requisição fique pendurada no API Gateway. No Pix não existe resposta imediata: o pagamento nasce AGUARDANDO_PIX com o QR code, e quem confirma é o webhook.","contra":"Tudo assíncrono deixa o backend mais simples e resistente, mas piora a experiência do cartão e empurra complexidade para o app (polling, estados intermediários). Tudo síncrono amarra a sua disponibilidade à do PSP: se ele fica lento, suas conexões e Lambdas ficam presos esperando.","muda":"Em pagamentos B2B ou lotes (folha, repasses), use só o modelo assíncrono com fila e relatório."},{"q":"Onde fica o ledger, e como ele garante que o dinheiro fecha?","e":"Aurora PostgreSQL, partidas dobradas, só inserção, com restrições no próprio banco.","por":"Cada movimento é uma transação com duas ou mais entradas que somam zero (débito no cliente, crédito na receita, crédito na taxa do PSP). O PostgreSQL dá o que um ledger precisa: transação ACID entre várias linhas, chave única para não duplicar, restrições e consultas de saldo por conta e período em SQL. As entradas nunca são alteradas; um estorno é uma nova transação com sinais invertidos, e o histórico conta a verdade inteira.","contra":"O DynamoDB tem transações de até 100 itens, mas não soma nem valida saldo, e consultas por período viram índices e agregações feitas à mão. O Amazon QLDB era o banco \"de ledger\" da AWS e foi descontinuado em julho de 2025, com recomendação de migrar para o Aurora PostgreSQL: um lembrete de que um serviço de nicho também é risco. O problema do Aurora é a conta quente: a conta \"receita\" recebe crédito de todo pagamento, e atualizar um saldo materializado nela vira fila de travas.","muda":"Se a conta quente aparecer, divida-a em N subcontas (receita-00 a receita-15) escolhidas por hash, e some na consulta; se o volume passar do que um cluster aguenta, fragmente o ledger por comerciante."},{"q":"Como avisar o resto do sistema sem perder nem inventar eventos?","e":"Outbox transacional no Aurora, com um relay que publica no EventBridge, e consumidores idempotentes.","por":"O evento \"pagamento capturado\" é gravado numa tabela outbox na mesma transação que muda o estado. Se a transação confirma, o evento existe; se não, não existe. Um relay (um worker no ECS que lê a outbox em ordem, ou CDC com o AWS DMS) publica no EventBridge e marca como enviado. Ele pode publicar duas vezes depois de uma queda, então cada consumidor guarda o id do evento já processado e ignora o repetido.","contra":"Publicar depois do commit (\"dual write\") perde o evento se o processo cair entre os dois passos, e a assinatura nunca é ativada. Publicar antes do commit inventa eventos de pagamentos que não aconteceram. Se o estado morasse no DynamoDB, o DynamoDB Streams seria a outbox pronta, com 24 horas de retenção.","muda":"Com muitos consumidores e necessidade de reprocessar dias de eventos, publique no Kinesis ou no MSK em vez do EventBridge, que não guarda histórico para reler."},{"q":"Como tratar os webhooks que chegam do PSP, repetidos e fora de ordem?","e":"Validar a assinatura, enfileirar no SQS e responder 200 rápido; um worker aplica só transições válidas da máquina de estados.","por":"O PSP reenvia quando você demora a responder, então o endpoint só valida o HMAC, grava na fila e devolve 200 em milissegundos. O worker usa o id do evento do PSP para ignorar repetidos e confere a transição: se o pagamento já está CAPTURADO, um AUTORIZADO atrasado não faz nada. A ordem deixa de importar porque o estado só anda para a frente.","contra":"Processar o webhook dentro da requisição prende o PSP enquanto você consulta o banco e chama outros serviços; se você passar do timeout dele, ele reenvia e a carga dobra. Uma fila FIFO com grupo por pagamento garante ordem, mas limita a vazão por grupo e não resolve o evento que o PSP mandou atrasado; a máquina de estados resolve os dois.","muda":"Se uma transição precisa de dados que só um evento intermediário traz, guarde o evento fora de ordem e reaplique quando o anterior chegar."},{"q":"Quem orquestra captura, antifraude, nota fiscal e reembolso?","e":"Step Functions Standard para o fluxo longo, com compensações (saga); eventos para o que é só notificação.","por":"A captura de um cartão pode acontecer dias depois da autorização, o antifraude pode pedir revisão humana e o reembolso tem que desfazer passos já feitos. O Step Functions Standard guarda o estado de cada execução por até um ano, executa cada transição uma vez e mostra o histórico de cada pagamento, o que ajuda muito num incidente. Cada passo que muda o mundo tem um passo de compensação (anular a autorização, estornar, cancelar a nota).","contra":"Coreografia pura (cada serviço reage a eventos) espalha a regra do fluxo por cinco serviços e ninguém enxerga onde um pagamento travou. O Express Workflow é mais barato, mas garante \"pelo menos uma vez\" e dura no máximo 5 minutos, o que não serve para captura em dois dias. Um orquestrador próprio com tabela de estados funciona, mas você reescreve timers, retries e histórico.","muda":"Com dezenas de milhões de execuções por dia, o preço por transição do Standard pesa; aí vale a máquina de estados no seu banco com um worker."},{"q":"Como entregar webhooks aos seus próprios clientes (comerciantes) sem que um lento derrube os outros?","e":"Fila por comerciante (ou por fragmento de comerciantes), retry com backoff e jitter por até 3 dias, payload assinado.","por":"Um comerciante com o servidor fora do ar faz as mensagens dele acumularem e serem reenviadas. Se todos dividem uma fila, os retries dele atrasam a entrega de todo mundo. Separar por comerciante, ou por grupos pequenos usando shuffle sharding, isola o estrago. O envio é sempre assinado (HMAC com segredo por comerciante) e carrega um id para o cliente deduplicar.","contra":"O EventBridge API Destinations faz a entrega com limite de taxa e retry por até 24 horas, o que resolve o começo sem código; perde no controle fino (retry por dias, painel de reenvio para o cliente, isolamento por cliente).","muda":"Poucos clientes e volume baixo: comece pelo API Destinations e troque quando o primeiro cliente lento atrapalhar os outros."},{"q":"Uma região só, ou várias?","e":"Uma região com Multi-AZ, e recuperação em outra região com Aurora Global Database e failover gerenciado.","por":"Dentro da região, o Aurora replica o armazenamento em três zonas e troca de instância em dezenas de segundos, sem perder transação confirmada. Entre regiões a réplica é assíncrona, com atraso típico de menos de um segundo: num desastre regional, você pode perder esse segundo, e a conciliação com o PSP recupera o que faltou. É o compromisso comum em pagamentos: uma região escreve, a outra está pronta.","contra":"Ativo-ativo em duas regiões com banco relacional comum abre a porta para o mesmo pagamento ser gravado nas duas (split brain). O Aurora DSQL (disponível desde maio de 2025) e as tabelas globais do DynamoDB com consistência forte multirregião (desde junho de 2025) oferecem escrita forte em várias regiões, ao preço de mais latência de escrita, controle de concorrência otimista (transações conflitantes abortam e precisam de retry) e restrições de recursos que você precisa conferir.","muda":"Se o requisito de disponibilidade for de quatro noves com RPO zero entre regiões, avalie o DSQL ou o DynamoDB multirregião com consistência forte e meça a latência de escrita."},{"q":"Se tudo é idempotente, por que ainda conciliar?","e":"Conciliação diária com o arquivo de liquidação do PSP, no S3, comparada ao ledger com Athena.","por":"\"Exatamente uma vez\" de ponta a ponta não existe: o que você constrói é \"pelo menos uma vez\" com deduplicação, e sempre sobra um caso que ninguém previu. O PSP manda todo dia o que liquidou; um job (Step Functions + Athena, ou Glue) cruza com o ledger por id e joga as diferenças numa fila de revisão. É a rede de proteção que transforma bug silencioso em alerta no dia seguinte.","contra":"Confiar só na idempotência funciona até o dia em que um webhook se perde, o PSP muda um código de status ou alguém corrige um dado à mão. Conciliar em tempo real é possível, mas os arquivos do PSP chegam uma vez por dia: o diário é o ritmo natural.","muda":"Em volumes muito altos, concilie por hora com os relatórios incrementais do PSP, se ele oferecer."},{"q":"Como manter o cartão fora do seu backend?","e":"Tokenização no cliente pelos campos hospedados do PSP; o backend só vê o token.","por":"Se o número do cartão nunca toca seus servidores, o escopo PCI cai para o mínimo e um vazamento do seu banco não expõe cartões. O app coleta o cartão num componente do PSP, recebe um token e é o token que chega ao POST /pagamentos. Segredos do PSP ficam no Secrets Manager, dados sensíveis criptografados com KMS.","contra":"Guardar cartão para cobrança recorrente no seu cofre exige auditoria PCI completa, HSM e um time dedicado. Só faz sentido se você é o PSP.","muda":"Se você precisar trocar de PSP sem pedir o cartão de novo, negocie portabilidade de tokens ou use um cofre de terceiros certificado."}],"dados":"Cinco tabelas no Aurora PostgreSQL carregam o case. Pagamentos tem o estado e a versão (para atualização com comparação, \"UPDATE ... WHERE versao = $1\"). Chaves de idempotência têm a chave, o hash do corpo, a resposta guardada e o prazo. O ledger tem transações e entradas, só inserção. A outbox tem os eventos ainda não publicados. Índices parciais (por exemplo, só pagamentos em PROCESSANDO) deixam o job de recuperação barato.","tabelas":[["pagamentos","id (UUID v7)","por id; por usuário e data; os presos em PROCESSANDO há mais de 2 minutos"],["chaves_idempotencia","usuario_id + chave (único)","por chave na entrada; apagadas depois de 7 dias"],["ledger_transacoes / ledger_entradas","id da transação; entradas por (conta, data)","saldo por conta e período; nunca UPDATE"],["outbox","id sequencial","o relay lê em ordem os não publicados"],["webhooks_recebidos","id do evento do PSP (único)","deduplicação de webhooks"]],"falhas":[["O PSP não responde em 10 segundos","O pagamento vira DESCONHECIDO, o app mostra \"confirmando\", o job consulta o PSP e resolve; o usuário não cobra de novo porque a chave é a mesma."],["O serviço morre entre a cobrança e a gravação do resultado","O pagamento fica em PROCESSANDO; o job de recuperação consulta o PSP pelo id e grava o resultado e o ledger."],["O PSP manda o mesmo webhook 5 vezes, fora de ordem","O id do evento deduplica, e a máquina de estados ignora transições para trás."],["Failover do Aurora no pico","Escritas falham por dezenas de segundos; a API devolve 503 com Retry-After e o app refaz com a mesma chave. RDS Proxy reduz o tempo de reconexão."],["Tempestade de retries de clientes","Backoff exponencial com jitter no SDK do app e limite por usuário no API Gateway; sem isso, os retries viram o próprio incidente."]],"custo":"Quase todo o custo de um sistema de pagamentos é a taxa do PSP, ordens de grandeza acima da infraestrutura. Na infraestrutura, o Aurora domina: instâncias grandes o bastante para o pico, Multi-AZ e uma réplica na região de recuperação. Lambda é barata em volume baixo; com milhares de requisições por segundo o dia inteiro, contêineres no Fargate ou no EC2 saem mais baratos e evitam o limite de concorrência. Guardar o ledger antigo no S3 (Parquet ou Iceberg) em vez de no Aurora corta o custo de armazenamento do histórico.","evolucao":[["v1 · até 10 pagamentos/s","Um serviço, um Aurora, chave e ledger na mesma transação, job de recuperação por cron."],["v2 · centenas por segundo","Outbox + EventBridge, Step Functions para captura e reembolso, filas por comerciante nos webhooks de saída, conciliação diária."],["v3 · milhares por segundo","Subcontas para as contas quentes, ledger antigo arquivado no S3 (Iceberg) e consultado no Athena, RDS Proxy, réplica em outra região."],["v4 · escala de PSP","Ledger fragmentado por comerciante (vários clusters), roteamento por célula, avaliação de DSQL ou DynamoDB multirregião para escrita forte entre regiões."]],"perguntas":["Por que timeout do PSP não pode ser tratado como recusa? Conte o que acontece com o usuário se for.","O que muda se a chave de idempotência morar num sistema diferente do pagamento?","Desenhe a máquina de estados do pagamento de cartão e diga quais transições um webhook atrasado não pode fazer.","Por que a outbox resolve o que publicar depois do commit não resolve?","Se tudo é idempotente, o que a conciliação ainda pega?","O que é uma conta quente no ledger e como você a divide?"],"pratica":{"t":"Uma API de pagamento que não cobra duas vezes","passos":["Em Go, um POST /pagamentos com Idempotency-Key, PostgreSQL local (Docker) e um PSP falso que demora e às vezes cai depois de cobrar.","Implemente as três fases atômicas e a tabela de chaves com hash do corpo.","Dispare 50 requisições simultâneas com a mesma chave e confira: uma cobrança no PSP falso, 49 respostas iguais à primeira.","Mate o processo entre a cobrança e a fase 3 e mostre o job de recuperação corrigindo o estado.","Opcional: troque o PostgreSQL pelo DynamoDB Local com TransactWriteItems e compare o código."],"pronto":["O teste de 50 tentativas passa 100 vezes seguidas","Nenhum caminho trata timeout como recusa","O ledger soma zero depois do teste de falha"]},"caps":[16,15,4,17],"livros":[["Kleppmann",8,"Transações","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch08.html","atomicidade, isolamento e por que transações distribuídas são raras","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"],["Kleppmann",9,"O problema com sistemas distribuídos","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch09.html","timeouts e o que não dá para saber pela rede","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"],["Kleppmann",12,"Processamento de fluxo","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch12.html","exactly-once e idempotência em fluxos","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"],["Richards e Ford",15,"Estilo de arquitetura orientado para eventos","https://www.oreilly.com/library/view/fundamentos-da-arquitetura/9798341637955/ch15.html","eventos, sagas e consistência eventual","Fundamentos da arquitetura de software, 2ª ed.","richards-ford"]],"links":[["Stripe: Designing robust and predictable APIs with idempotency","https://stripe.com/blog/idempotency"],["Amazon Builders' Library: Making retries safe with idempotent APIs","https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/"],["Amazon Builders' Library: Timeouts, retries, and backoff with jitter","https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/"],["AWS Prescriptive Guidance: Saga orchestration pattern","https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/saga-orchestration.html"],["DynamoDB global tables com consistência forte multirregião (anúncio)","https://aws.amazon.com/about-aws/whats-new/2025/06/amazon-dynamo-db-global-tables-multi-region-strong-consistency-generally-available"],["Amazon Aurora DSQL (anúncio da disponibilidade)","https://aws.amazon.com/about-aws/whats-new/2025/05/amazon-aurora-dsql-generally-available"]],"labs":[2,15,17]},{"id":"ingressos","n":7,"g":"dinheiro","t":"Venda de ingressos com pico (como a Ticketmaster)","q":"Como vender 60 mil lugares para 2 milhões de pessoas que chegam no mesmo minuto, sem vender o mesmo lugar duas vezes?","nivel":"Avançado","horas":5,"cenario":"O Fitness Evolutivo organiza uma maratona e vende as inscrições com kit numerado, e o mesmo sistema vende lugares para um evento num estádio. As vendas abrem às 10h. Às 9h59 há 2 milhões de pessoas com a página aberta e bots esperando. A capacidade de vender é limitada pelo estoque, não pelos servidores: escalar a frota não faz existirem mais lugares, só faz mais gente brigar pela mesma linha do banco.","req":["Escolher lugar no mapa (ou quantidade, em pista).","Reservar por 10 minutos enquanto paga.","Pagar e emitir o ingresso.","Liberar a reserva que venceu.","Ordem justa de atendimento e bloqueio de bots."],"nreq":["Nunca vender o mesmo lugar duas vezes.","O sistema não cai no pico; quem não pode ser atendido espera numa fila visível.","p99 de reservar abaixo de 500 ms para quem foi admitido."],"numeros":[["Pessoas no minuto da abertura","2 milhões","mais de 30 mil requisições por segundo só de abrir a página"],["Estoque","60 mil lugares","cada lugar disputado por ~33 pessoas em média, muito mais nos melhores setores"],["Vazão útil","60 mil vendas em ~20 minutos","~50 compras por segundo, o que pagamento e estoque precisam aguentar"]],"base":"A decisão que estrutura o case é separar quem entra de quem compra: uma sala de espera virtual recebe os 2 milhões e admite pessoas no ritmo que o estoque e o pagamento aguentam. Lá dentro, cada lugar é um item com estado, e a reserva é uma escrita condicional que só passa se o lugar estiver livre.","fluxo":["A página do evento é estática no CloudFront; antes da abertura, todos entram na sala de espera (Virtual Waiting Room on AWS ou equivalente) e recebem uma posição.","A sala admite N pessoas por minuto, entregando a cada uma um token assinado que a API de compra exige.","O mapa de lugares é lido de um cache com poucos segundos de defasagem.","Reservar é um UpdateItem condicional no DynamoDB: estado = LIVRE, ou RESERVADO com prazo vencido, vira RESERVADO por 10 minutos para aquela pessoa.","O pagamento segue o case de pagamentos idempotentes; aprovado, o lugar vira VENDIDO com outra escrita condicional (precisa estar reservado para a mesma pessoa).","Reservas vencidas voltam a LIVRE na próxima tentativa de reserva (a condição aceita prazo vencido) e por um varredor a cada minuto."],"decisoes":[{"q":"Escalar para aguentar todos ou fazer fila?","e":"Sala de espera virtual que admite no ritmo do estoque e do pagamento.","por":"Mesmo com infinitos servidores, 2 milhões de pessoas disputando 60 mil lugares geram uma tempestade de conflitos nas mesmas linhas, e 97% vão falhar de qualquer jeito. A sala de espera transforma o pico em fila: a pessoa vê a posição e o tempo estimado, e o sistema de compra recebe uma vazão que ele aguenta. A AWS tem uma solução pronta (Virtual Waiting Room on AWS) com API Gateway, Lambda, DynamoDB e ElastiCache, e tokens assinados que a sua API valida.","contra":"Auto scaling reage em minutos e não ajuda com um pico que dura segundos; pré-escalar resolve a frota, não a disputa no estoque. Sem fila, quem tem a conexão mais rápida (ou o bot) ganha, e o site parece quebrado para todo o resto.","muda":"Eventos com procura parecida com a oferta não precisam de sala de espera; um limite de taxa basta."},{"q":"Ordem de chegada ou sorteio?","e":"Sorteio entre quem chegou antes da abertura; ordem de chegada para quem chega depois.","por":"Na ordem de chegada pura, ganha quem tem a menor latência e os bots que atualizam a cada milissegundo. Sortear a posição de todos que estavam na sala antes das 10h torna a disputa justa para humanos e tira a vantagem de martelar a página. Quem chega depois entra no fim.","contra":"A ordem de chegada é mais fácil de explicar e gera a sensação de \"cheguei primeiro, fui atendido primeiro\", que algumas pessoas preferem.","muda":"Vendas sem pico de abertura (o estoque dura semanas) não precisam de sorteio."},{"q":"Como garantir que um lugar não seja vendido duas vezes?","e":"Cada lugar é um item no DynamoDB, e toda mudança de estado é uma escrita condicional.","por":"Reservar é \"mude para RESERVADO, por esta pessoa, até 10h12, se o estado for LIVRE ou se a reserva anterior venceu\". Duas pessoas tentando o mesmo lugar: uma escrita passa, a outra recebe falha de condição e o app mostra \"esse lugar acabou de ser escolhido\". Não há trava nem transação longa: a condição é avaliada de forma atômica no próprio item. Para vários lugares de uma vez (um grupo de 4), TransactWriteItems faz os 4 ou nenhum.","contra":"No Aurora PostgreSQL, SELECT ... FOR UPDATE SKIP LOCKED pega lugares livres sem esperar os travados, ótimo para \"me dê 2 lugares quaisquer neste setor\". O custo é segurar transações e conexões no pico, e um setor disputado vira fila de travas. É o exemplo de anomalia de escrita (write skew) do capítulo de transações: duas pessoas leem \"livre\" e as duas gravam \"meu\", se a checagem e a escrita não forem atômicas.","muda":"Venda de lugar não marcado em volume moderado: SKIP LOCKED no Aurora é simples e muito bom."},{"q":"Como fazer a reserva vencer em 10 minutos?","e":"Prazo gravado no item e checado na condição; um varredor só para limpar e avisar.","por":"O TTL do DynamoDB apaga itens vencidos em até alguns dias, não no minuto certo, então não serve para liberar lugar. Com o prazo gravado no item, a própria condição de reserva aceita \"RESERVADO com prazo vencido\" como livre: o lugar volta à disputa no segundo em que vence, sem depender de nenhum job. O varredor (EventBridge Scheduler a cada minuto) só atualiza o mapa e avisa quem perdeu a reserva.","contra":"Um temporizador por reserva (mensagem com atraso no SQS, ou um agendamento por reserva) funciona, mas acrescenta peças que podem falhar ou atrasar, e o lugar fica preso se o temporizador falhar.","muda":"Nunca dependa do TTL para algo que precisa acontecer no minuto certo."},{"q":"Pista sem lugar marcado: como decrementar um estoque de 20 mil sem uma linha quente?","e":"Dividir o estoque em N baldes (por exemplo, 50 baldes de 400) e reservar num balde sorteado com condição de saldo.","por":"Um contador único de 20 mil, decrementado com condição \"saldo >= 1\", recebe todas as compras: é uma partição quente que estoura o limite de escrita por partição. Com 50 baldes, cada compra sorteia um balde e decrementa lá; se o balde zerou, tenta outro. A soma dos baldes é o estoque.","contra":"Um contador só é exato e simples, e funciona com vazão de dezenas de compras por segundo. Com baldes, no fim da venda sobram unidades espalhadas e algumas tentativas a mais até achar um balde com saldo.","muda":"Vazão baixa: contador único. Vazão alta: baldes, e rebalancear os baldes perto do fim."},{"q":"Como juntar reserva, pagamento e emissão?","e":"Saga: reservar, pagar e confirmar; se o pagamento falhar ou a reserva vencer, liberar o lugar e estornar.","por":"Pagamento e estoque estão em sistemas diferentes e não cabem numa transação. A ordem reserva → pagamento → venda, com compensações (pagou e a reserva venceu? estorna; falhou o pagamento? libera), resolve os casos feios, como o pagamento aprovado 11 minutos depois. A venda só confirma se o lugar ainda está reservado para a mesma pessoa; senão, estorno automático e aviso.","contra":"Cobrar antes de reservar inverte o risco: pessoas pagam por lugares que não existem e você estorna em massa.","muda":"Se o PSP permite autorizar e capturar depois, autorize na reserva e capture na confirmação: o estorno vira só cancelar a autorização."},{"q":"Como lidar com bots?","e":"AWS WAF com Bot Control e desafios, limite por conta e por cartão, e a sala de espera exigindo token.","por":"Bots compram para revender. O WAF Bot Control identifica tráfego automatizado e pode desafiar com CAPTCHA; a sala de espera exige um token que só sai depois de passar pela fila; e o limite de ingressos por conta, por cartão e por documento torna o bot menos lucrativo.","contra":"Só limite por IP não segura bots com milhares de IPs residenciais.","muda":"Eventos de altíssima procura: inscrição prévia com verificação de identidade e sorteio, sem venda aberta."},{"q":"Como preparar a infraestrutura para o minuto da abertura?","e":"Teste de carga com o perfil real, cotas aumentadas antes e capacidade provisionada nas peças que não escalam na hora.","por":"Picos de segundos não dão tempo para escalar. Antes do evento: teste de carga com milhões de clientes simulados, pedido de aumento de cotas (concorrência de Lambda, limites de API), DynamoDB em modo provisionado alto ou pré-aquecido para a tabela do evento, e a página estática servida pelo CloudFront.","contra":"Confiar no sob demanda para um pico conhecido com hora marcada é apostar que a escala reativa chega a tempo.","muda":"Eventos pequenos: sob demanda e sem cerimônia."}],"dados":"Um item por lugar (ou por balde, na pista), as reservas e vendas registradas na saga, e o mapa servido de cache.","tabelas":[["lugares","evento_id#setor + lugar_id","UpdateItem condicional; Query por setor para o mapa"],["estoque_pista","evento_id + balde","decremento condicional num balde sorteado"],["pedidos","pedido_id; GSI por usuário","estado da saga, idempotência da compra"]],"falhas":[["Pagamento aprovado depois que a reserva venceu","A confirmação falha na condição; a saga estorna e avisa."],["A sala de espera admite rápido demais","Os conflitos e a fila do pagamento sobem; a taxa de admissão é ajustada pela vazão real do pagamento, não por um número fixo."],["Um setor recebe milhares de tentativas no mesmo segundo","As escritas condicionais falham rápido e barato; o app oferece o lugar livre mais próximo."],["O varredor de reservas atrasa","Nada acontece com o estoque, porque o vencimento é checado na própria condição."]],"custo":"O custo do pico é curto e alto: capacidade provisionada por algumas horas, a sala de espera e o WAF. Ao longo do ano, o sistema é pequeno. O custo que mais pesa é o de não preparar: um site fora do ar no minuto da venda.","evolucao":[["v1","Aurora com SKIP LOCKED para pista e reserva com prazo; serve eventos médios."],["v2","Lugares no DynamoDB com escrita condicional, saga com o pagamento, varredor."],["v3","Sala de espera, WAF Bot Control, baldes de estoque."],["v4","Inscrição prévia e sorteio para eventos de altíssima procura."]],"perguntas":["Por que escalar servidores não resolve uma venda de 60 mil lugares para 2 milhões?","Escreva a condição exata do UpdateItem de reservar, incluindo a reserva vencida.","Por que o TTL do DynamoDB não serve para vencer a reserva?","O que é write skew, e como a escrita condicional o evita aqui?"],"pratica":{"t":"Mil pessoas, cem lugares","passos":["DynamoDB Local com 100 lugares; em Go, 1.000 goroutines tentam reservar lugares sorteados ao mesmo tempo.","Confira que cada lugar tem um único dono e conte quantas tentativas falharam na condição.","Simule pagamentos que demoram mais que o prazo e mostre a saga estornando."],"pronto":["Zero lugares com dois donos em 100 execuções","Reservas vencidas voltam à disputa sem nenhum job rodando"]},"caps":[16,15,4,14],"livros":[["Kleppmann",8,"Transações","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch08.html","write skew e o exemplo da reserva dupla","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"],["Richards e Ford",15,"Estilo de arquitetura orientado para eventos","https://www.oreilly.com/library/view/fundamentos-da-arquitetura/9798341637955/ch15.html","sagas e compensação","Fundamentos da arquitetura de software, 2ª ed.","richards-ford"],["Burns",16,"Padrões de falha comuns","https://www.oreilly.com/library/view/projetando-sistemas-distribuidos/9798341637856/ch16.html","padrões de falha em picos","Projetando Sistemas Distribuídos, 2ª ed.","burns"]],"links":[["Virtual Waiting Room on AWS","https://aws.amazon.com/solutions/implementations/aws-virtual-waiting-room/"],["AWS Compute Blog: Introducing AWS Virtual Waiting Room","https://aws.amazon.com/blogs/compute/introducing-aws-virtual-waiting-room/"],["DynamoDB: write sharding","https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-sharding.html"]],"labs":[11],"reusa":"A reserva condicional é a mesma ideia do PutItem condicional do encurtador."},{"id":"chat","n":8,"g":"tempo-real","t":"Chat em tempo real (como WhatsApp e Discord)","q":"Como entregar mensagens em menos de um segundo para milhões de conexões abertas, sem perder nem duplicar nada?","nivel":"Avançado","horas":6,"cenario":"O app ganhou chat: conversas entre aluno e treinador e grupos de academia, alguns com dezenas de milhares de pessoas. Mensagens precisam chegar na hora para quem está online, chegar depois para quem está offline, aparecer na mesma ordem para todos e nunca sumir. A parte difícil é que, ao contrário de uma API comum, aqui o servidor precisa falar primeiro, e para isso mantém milhões de conexões abertas.","req":["Mensagens 1:1 e em grupo, com texto e mídia.","Entregue, recebida e lida (os tiques).","Histórico paginado e sincronização entre aparelhos.","Notificação push para quem está offline.","Presença (online, digitando)."],"nreq":["Entrega com p99 abaixo de 500 ms entre duas pessoas online na mesma região.","10 milhões de conexões simultâneas.","Nenhuma mensagem confirmada ao remetente pode ser perdida.","Ordem igual para todos os participantes de uma conversa."],"numeros":[["Mensagens","50 mi de pessoas × 40 por dia","2 bilhões por dia, ~23 mil/s na média, ~70 mil/s no pico"],["Conexões","20% das pessoas ativas ao mesmo tempo","~10 milhões de WebSockets abertos"],["Armazenamento","2 bi × ~200 bytes","~400 GB por dia, ~150 TB por ano sem mídia"],["Grupo grande","1 mensagem × 50 mil membros","50 mil entregas para uma escrita"]],"base":"Três peças separadas fazem o chat: a camada de conexões (que só segura WebSockets e repassa), o serviço de mensagens (que valida, numera, grava e decide para quem entregar) e o armazenamento do histórico. A regra que organiza tudo é que a mensagem é gravada antes de ser confirmada ao remetente e entregue aos outros; a entrega em tempo real é uma otimização, e a sincronização pelo histórico é a garantia.","fluxo":["O app abre um WebSocket com a camada de conexões (no começo, API Gateway WebSocket; em escala, uma frota no ECS atrás de um NLB).","O registro de conexões (Valkey, com TTL) guarda em que nó, ou em que connectionId, cada aparelho de cada usuário está.","O app manda a mensagem com um id gerado no cliente; o serviço de mensagens valida, atribui o número de sequência da conversa e grava no DynamoDB.","Gravada, o remetente recebe a confirmação (um tique), e o serviço publica a entrega para os aparelhos online dos destinatários.","Quem está offline recebe push (APNs/FCM pelo SNS ou pelo AWS End User Messaging) e, ao reconectar, pede ao histórico tudo depois da última sequência que viu.","Recebida e lida voltam como mensagens de controle pelo mesmo caminho e atualizam um marcador por usuário na conversa."],"decisoes":[{"q":"Quem segura as conexões?","e":"API Gateway WebSocket (ou AppSync Events) no começo; uma frota própria no ECS atrás de NLB quando passar de algumas centenas de milhares de conexões.","por":"O API Gateway WebSocket cuida de conexões, autenticação e escala sem servidor, e você responde a cada mensagem com uma Lambda e envia com a API de conexões. Mas a conexão dura no máximo 2 horas e cai depois de 10 minutos sem tráfego, então o app precisa reconectar e mandar batidas; e a cobrança é por minuto de conexão e por mensagem, o que, com 10 milhões de conexões o dia inteiro, vira uma conta alta. Uma frota própria de servidores Go segura centenas de milhares de conexões por máquina e custa uma fração disso, ao preço de operar deploy sem derrubar conexões, balanceamento e reconexão em massa.","contra":"O AppSync Events oferece canais de publicar e assinar gerenciados, ótimo para difusão (todos de um grupo recebem), menos para lógica por mensagem. O AWS IoT Core com MQTT aguenta milhões de conexões, tem QoS e sessão persistente, e é uma alternativa séria para mobile, com um modelo de tópicos e políticas que exige desenho próprio.","muda":"Se o chat é recurso secundário e com pouca gente ao mesmo tempo, fique no gerenciado para sempre."},{"q":"Como uma mensagem chega ao servidor que segura a conexão do destinatário?","e":"Registro de conexões no Valkey e publicação direcionada ao nó (ou pub/sub por usuário).","por":"Com uma frota, o destinatário está conectado em um nó específico. O registro (usuario → nó, por aparelho, com TTL renovado pelas batidas) diz para onde mandar, e o serviço publica no canal daquele nó. Com o API Gateway, o registro guarda o connectionId e o envio é uma chamada à API de conexões.","contra":"Fazer todos os nós ouvirem todas as mensagens (broadcast) não escala além de poucos nós. Guardar o registro no DynamoDB funciona e é durável, mas é dado efêmero que muda a cada reconexão, e o Valkey responde mais rápido e expira sozinho.","muda":"Em grupos enormes, troque o envio por usuário por canais de grupo que os nós assinam: uma publicação por nó, não por membro."},{"q":"Como guardar bilhões de mensagens e ler o histórico rápido?","e":"DynamoDB com partição por conversa e faixa de tempo, e ordenação pela sequência.","por":"O acesso é sempre \"as últimas N mensagens desta conversa, antes deste ponto\". Partição = conversa#balde (por exemplo, um balde por dia ou por semana, dependendo do volume da conversa) e ordenação = sequência. O balde impede que uma conversa antiga e ativa vire uma partição gigante e quente; é a mesma ideia que o Discord usou com canal e janela de tempo. Ler o histórico é uma Query na partição do balde atual e, se faltar, na do anterior.","contra":"O Amazon Keyspaces (Cassandra gerenciado) tem o mesmo modelo e é o caminho se o time já pensa em Cassandra. Banco relacional com tabela de mensagens funciona até alguns bilhões de linhas com particionamento por tempo, mas a escrita de 70 mil por segundo e o crescimento contínuo pedem fragmentação manual.","muda":"Se você precisa de busca por texto nas mensagens, alimente o OpenSearch pelo DynamoDB Streams (e lembre que, com criptografia de ponta a ponta, o servidor não consegue indexar)."},{"q":"Como garantir a mesma ordem para todos?","e":"Sequência por conversa atribuída pelo servidor
