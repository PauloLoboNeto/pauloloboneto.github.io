  var PITCH = {"grupos":[{"id":"msg","t":"Estrutura da mensagem","q":"A base para qualquer público: como organizar o que você vai dizer."},{"id":"exec","t":"Executivos","q":"A pergunta deles: o que você quer que eu decida?"},{"id":"eng","t":"Times de engenharia","q":"A pergunta deles: como funciona e por que assim?"},{"id":"palco","t":"Palestras técnicas","q":"A pergunta deles: por que eu deveria me importar?"}],"fw":[{"id":"minto","g":"msg","s":"PIR","n":"Pirâmide de Minto","x":"Pyramid Principle","o":"Barbara Minto, McKinsey, anos 1970","q":"Comece pela conclusão e organize os argumentos em níveis: cada ideia resume as que estão embaixo dela.","quando":"Qualquer comunicação em que quem ouve tem pouco tempo e precisa entender ou decidir rápido: e-mail para a diretoria, memo, primeiro slide, resposta a uma pergunta difícil. É a base de quase tudo nesta aba.","nao":"Quando o público resiste à conclusão e precisa ser conduzido até ela (use a Sequência de Monroe) ou numa palestra em que a descoberta faz parte da graça.","estrutura":["Topo: a resposta ou recomendação, numa frase.","Segundo nível: de 3 a 5 argumentos que sustentam o topo, agrupados de forma MECE.","Base: dados, fatos e análises que provam cada argumento.","Regra vertical: cada nível responde ao \"por quê?\" ou \"como?\" que o nível de cima provoca.","Regra horizontal: ideias do mesmo nível são do mesmo tipo e seguem uma ordem lógica (tempo, estrutura ou importância)."],"aplicar":["Escreva a pergunta que o público tem na cabeça (\"devemos trocar Java por Go nos BFFs?\").","Escreva a resposta em uma frase, com o verbo da decisão.","Liste tudo o que sustenta a resposta e agrupe em 3 a 5 blocos que não se sobrepõem.","Dê a cada bloco um título que seja uma afirmação, não um tema: \"Go reduz o custo de memória por pod\", e não \"Memória\".","Coloque a evidência de cada bloco embaixo dele e corte o que não sustenta nada.","Leia só o topo e os títulos: se a história fecha, a pirâmide está pronta."],"ex":"Pergunta: devemos adotar Go nos BFFs? Topo: \"Recomendo Go para os novos BFFs a partir do próximo trimestre; os atuais ficam em Java até a próxima reescrita.\" Argumentos: custo (menos memória por pod reduz a conta do cluster), operação (startup rápido melhora o autoscaling no pico) e risco controlado (piloto em um BFF de pouco tráfego, com rollback simples). Embaixo de cada um, o número medido no benchmark.","armadilhas":["Topo que é tema, não mensagem: \"Status do projeto\" não é conclusão.","Argumentos que se sobrepõem: o executivo percebe a repetição e desconfia do resto.","Guardar a recomendação para o fim por medo de rejeição: o executivo interrompe antes de chegar lá."],"combina":["scqa","mece","ghost","bluf"],"refs":[["Livro: The Pyramid Principle, Barbara Minto",""]]},{"id":"scqa","g":"msg","s":"SCQA","n":"SCQA e SCR","x":"Situação, Complicação, Questão, Resposta","o":"Barbara Minto (a introdução da pirâmide); SCR é a variante usada por consultorias","q":"Uma introdução em quatro tempos que dá o contexto mínimo para a resposta fazer sentido.","quando":"A abertura de qualquer apresentação ou documento para executivos: o primeiro parágrafo de um memo, o primeiro slide, o começo de um RFC.","nao":"Quando o público já conhece bem a situação: comece direto pela resposta (BLUF) e use a situação só se perguntarem.","estrutura":["S, Situação: o que é verdade e todos concordam (não é notícia).","C, Complicação: o que mudou ou ameaça a situação; é o motivo da reunião.","Q, Questão: a pergunta que a complicação levanta (muitas vezes fica implícita).","R, Resposta: a sua recomendação, que vira o topo da pirâmide.","SCR: a mesma ideia sem a questão explícita (Situação, Complicação, Resolução)."],"aplicar":["Escreva a situação em uma ou duas frases que ninguém na sala contestaria.","Escreva a complicação com um fato ou número concreto.","Formule a pergunta exatamente como o decisor a faria.","Responda em uma frase; se precisar de duas, a decisão ainda não está clara.","Leia em voz alta: em 30 segundos o ouvinte deve saber o que você quer."],"ex":"S: os BFFs rodam em Java no EKS e atendem bem o tráfego de hoje. C: na última campanha, o autoscaling demorou [x] minutos para reagir e o custo do cluster subiu [y]% no pico. Q: como atender o próximo pico sem dobrar o custo? R: migrar os BFFs de maior tráfego para Go, começando por um piloto em dezembro.","armadilhas":["Situação longa demais: vira aula de história e a atenção acaba antes da complicação.","Complicação vaga (\"temos desafios de escala\"): sem fato, não há urgência.","Resposta que não responde à questão que você mesmo formulou."],"combina":["minto","bluf","memo"],"refs":[["Livro: The Pyramid Principle, Barbara Minto (parte sobre introduções)",""]]},{"id":"mece","g":"msg","s":"MECE","n":"MECE e árvore de problemas","x":"Mutuamente Exclusivo, Coletivamente Exaustivo","o":"McKinsey; formalizado por Barbara Minto","q":"Uma regra para quebrar um problema em partes que não se sobrepõem e que, juntas, cobrem tudo.","quando":"Para montar os argumentos da pirâmide, diagnosticar uma causa (custo, latência, incidentes) e organizar opções. A árvore de problemas (issue tree) é o MECE aplicado em vários níveis.","nao":"Não é roteiro de apresentação, é a disciplina de organização por trás dele. Em temas abertos (cultura, inovação) não force a exaustividade: use \"outros\" com honestidade.","estrutura":["Mutuamente exclusivo: cada item cabe em uma única caixa.","Coletivamente exaustivo: nenhuma causa ou opção possível fica de fora.","Formas de cortar: por fórmula (custo = volume × custo unitário), por processo (etapas em sequência), por estrutura (camadas, componentes) ou por opostos (interno e externo, novo e existente).","Árvore de problemas: a pergunta no topo e ramos MECE embaixo, até chegar a hipóteses que um dado confirma ou derruba."],"aplicar":["Escreva a pergunta-raiz (\"por que o custo de infra subiu 40%?\").","Escolha um corte que garanta a exaustividade, de preferência uma fórmula.","Em cada ramo, desça um nível até virar algo mensurável.","Teste: algum item cabe em dois ramos? Existe causa que não cabe em nenhum?","Transforme as folhas em hipóteses e diga qual dado prova cada uma.","Na apresentação, mostre só os ramos que importam e diga com qual dado os outros foram descartados."],"ex":"O custo de infra subiu 40%. Corte por fórmula: custo = volume × eficiência × preço. Volume: chegaram mais requisições? (métricas do load balancer). Eficiência: cada requisição gasta mais CPU ou memória? (custo por mil requisições). Preço: o provedor mudou a tabela ou acabou um desconto? (fatura). Cada suspeita, como logs verbosos, pods superdimensionados ou retenção do Kafka, cai em exatamente um ramo.","armadilhas":["Listas que parecem MECE mas misturam níveis (\"banco de dados\", \"lentidão\", \"Kafka\").","Ramos sem dado que os prove: viram opinião.","Mostrar a árvore inteira para o executivo: leve a conclusão e os ramos relevantes."],"combina":["minto","wsn","memo"],"refs":[["Livro: The Pyramid Principle, Barbara Minto",""]]},{"id":"bluf","g":"msg","s":"BLUF","n":"BLUF","x":"Bottom Line Up Front","o":"Comunicação militar dos EUA, adotada em e-mails e memos corporativos","q":"A conclusão e o pedido vão na primeira linha; o resto é contexto para quem quiser.","quando":"E-mails, mensagens no chat, atualizações de status, escalonamentos e respostas a executivos que leem no celular entre uma reunião e outra.","nao":"Notícias delicadas sobre pessoas (feedback, desligamento) e públicos que precisam ser conduzidos até uma conclusão que contraria o que esperam.","estrutura":["Linha 1: a conclusão ou o pedido, com prazo (\"Preciso da sua aprovação até sexta para…\").","Linhas 2 a 4: o mínimo de contexto para decidir (impacto, custo, risco).","Depois: detalhes, anexos e links para quem quiser aprofundar."],"aplicar":["Escreva a mensagem como sairia naturalmente.","Ache a frase que diz o que você quer; em geral ela está no final.","Mova essa frase para o topo e reescreva com verbo de ação e prazo.","Corte do resto tudo o que não muda a decisão.","Use a mesma frase no assunto do e-mail."],"ex":"Assunto: Aprovação até sexta para o piloto de Go no BFF de simulação. Corpo: \"Preciso do seu ok até sexta para rodar um piloto de Go no BFF de simulação em dezembro. Custo: duas semanas de um engenheiro. Risco: baixo, com rollback em minutos. O benchmark está no link abaixo.\"","armadilhas":["Começar com \"Oi, tudo bem? Seguinte…\" e três parágrafos de contexto.","Pedido sem prazo ou sem dono.","Confundir BLUF com ser seco: dá para ser direto e cordial."],"combina":["scqa","prep","wsn"],"refs":[]},{"id":"prep","g":"msg","s":"PREP","n":"PREP","x":"Point, Reason, Example, Point","o":"Técnica clássica de oratória e de treinamento em comunicação","q":"Uma resposta curta em quatro movimentos: ponto, razão, exemplo e o ponto de novo.","quando":"Responder a uma pergunta de executivo em 30 a 60 segundos, intervir numa reunião, responder no Q&A de uma palestra, entrevistas.","nao":"Explicações que precisam de vários argumentos (use a pirâmide) ou decisões com trade-offs (use o memo de opções).","estrutura":["P, Ponto: a sua posição em uma frase.","R, Razão: o principal porquê.","E, Exemplo: um caso, um número ou uma evidência concreta.","P, Ponto: repita a posição, de preferência com o próximo passo."],"aplicar":["Antes de abrir a boca, decida a frase do ponto.","Escolha uma razão só, a mais forte.","Tenha 2 ou 3 exemplos prontos para os temas que você defende com frequência.","Feche repetindo o ponto: é ele que fica na memória."],"ex":"Pergunta do diretor: \"Go não vai dificultar a contratação?\" P: \"Não deve ser um problema.\" R: \"A linguagem é pequena, e quem programa em Java fica produtivo rápido.\" E: \"No piloto, dois devs sem experiência em Go colocaram o primeiro endpoint em produção em [n] semanas.\" P: \"Então dá para formar o time com quem já temos.\"","armadilhas":["Dar três razões fracas em vez de uma forte.","Esquecer o segundo P e terminar no exemplo, deixando a conclusão no ar."],"combina":["bluf","star"],"refs":[]},{"id":"wsn","g":"msg","s":"WSN","n":"What? So what? Now what?","x":"O quê? E daí? E agora?","o":"Terry Borton (1970), popularizado por Rolfe, Freshwater e Jasper (2001); adotado em relatórios de status","q":"Três perguntas que transformam dado em decisão: o fato, o que ele significa e o que fazer.","quando":"Status reports, revisão de métricas, atualização semanal para o gestor, resumo de incidente, retrospectiva.","nao":"Propostas novas que precisam de argumentação (use a pirâmide): o WSN serve para reportar e reagir.","estrutura":["What: o fato ou o dado, sem interpretação.","So what: por que isso importa (impacto no cliente, no prazo, no custo ou no risco).","Now what: a ação, com dono e data, ou a decisão de que você precisa."],"aplicar":["Para cada métrica ou evento, escreva uma linha para cada pergunta.","Se o \"so what\" for \"nada\", tire o item do relatório.","Junte os \"now what\" no final, como lista de decisões e próximos passos."],"ex":"What: o p99 do BFF de contratação subiu de [x] ms para [y] ms desde a última release. So what: estamos acima do SLO e a conversão no último passo caiu [z]%. Now what: rollback do componente novo hoje; investigação da causa com dono e prazo até quinta.","armadilhas":["Relatório só com \"what\": o gestor tem de fazer a análise sozinho.","\"Now what\" sem dono e sem data."],"combina":["bluf","mece"],"refs":[]},{"id":"star","g":"msg","s":"STAR","n":"STAR","x":"Situação, Tarefa, Ação, Resultado","o":"Entrevistas comportamentais; muito usado em avaliações de desempenho e postmortems","q":"Contar um caso real de forma completa e verificável, em quatro partes.","quando":"Entrevistas (comportamental e de system design), casos de impacto para promoção e avaliação, postmortems curtos, cases dentro de palestras.","nao":"Recomendações para o futuro: o STAR conta o que já aconteceu.","estrutura":["S, Situação: o contexto mínimo (onde, quando, qual era o problema).","T, Tarefa: qual era a sua responsabilidade ou meta.","A, Ação: o que você fez, em primeira pessoa e com as decisões explícitas.","R, Resultado: o efeito medido e o que você aprendeu."],"aplicar":["Reserve metade do tempo para a Ação: é nela que o ouvinte avalia você.","Use \"eu\" para as suas decisões e \"nós\" para o trabalho do time, sem inflar.","Feche com um número no Resultado e uma lição.","Tenha de 5 a 8 histórias prontas cobrindo liderança, conflito, falha, decisão técnica e impacto."],"ex":"S: o processamento diário de créditos pré-aprovados estourava a janela da madrugada. T: eu precisava garantir que terminasse antes das 6h. A: medi cada etapa, achei o gargalo na escrita e troquei inserts linha a linha por carga em lote com particionamento. R: a janela caiu de [x] h para [y] h, e a solução virou padrão para os outros pipelines.","armadilhas":["Situação longa e Ação curta.","Resultado sem número ou sem lição.","Contar o que o time fez sem dizer qual foi a sua decisão."],"combina":["prep","talk"],"refs":[]},{"id":"ghost","g":"msg","s":"DECK","n":"Ghost deck e títulos-ação","x":"Ghost deck / action titles","o":"Prática de consultorias estratégicas (McKinsey, BCG, Bain)","q":"Escreva só os títulos dos slides, cada um como uma frase-conclusão, e valide a história antes de fazer qualquer gráfico.","quando":"Antes de montar qualquer apresentação com mais de 5 slides, principalmente para executivos; também para revisar o deck de outra pessoa.","nao":"Palestras de palco no estilo Lessig ou Takahashi, em que o slide tem uma palavra e a frase está na sua fala.","estrutura":["Cada slide tem um título-ação: uma frase completa com a conclusão, em até duas linhas.","O corpo do slide só prova o título (gráfico, tabela, diagrama).","Lidos em sequência, os títulos contam a história inteira.","Slide fantasma: só o título e um rascunho do que vai prová-lo, antes de produzir qualquer coisa."],"aplicar":["Abra um documento, não o editor de slides, e escreva os títulos em lista.","Leia os títulos em voz alta: se a história não fecha, reordene ou corte.","Mostre a lista a alguém do público-alvo e pergunte o que falta.","Só então desenhe o corpo de cada slide, um por vez.","Na revisão final, cubra o corpo de cada slide: o título sozinho ainda se sustenta?"],"ex":"Títulos-tema: \"Contexto\", \"Arquitetura atual\", \"Benchmark\", \"Próximos passos\". Títulos-ação: \"Os BFFs consomem [x]% do custo do cluster\", \"O gargalo é a memória por pod, não a CPU\", \"Em Go o mesmo BFF usa [y]% menos memória no benchmark\", \"Um piloto de duas semanas confirma o ganho com risco baixo\".","armadilhas":["Títulos que são temas (\"Resultados\").","Corpo que prova outra coisa que não o título.","Pular o ghost deck e se apegar aos gráficos que já estão prontos."],"combina":["minto","ae"],"refs":[]},{"id":"memo","g":"exec","s":"MEMO","n":"Memo de decisão com opções","x":"Decision memo / options paper","o":"Prática de governo e consultoria; a versão com três opções é a mais usada","q":"Uma página com o problema, 2 ou 3 opções reais comparadas pelos mesmos critérios e uma recomendação.","quando":"Sempre que você precisa de uma decisão de alguém com mais poder: orçamento, prioridade, troca de tecnologia, aceitar um risco.","nao":"Quando só existe uma opção viável (aí é comunicado, não decisão) ou quando a decisão é do próprio time (use um ADR).","estrutura":["A decisão pedida e o prazo (BLUF).","O contexto em SCQA, curto.","Os critérios de comparação, combinados com o decisor: custo, prazo, risco, impacto no cliente, reversibilidade.","De 2 a 3 opções, incluindo \"não fazer nada\", com prós, contras e custo de cada uma.","A recomendação e o porquê.","Os riscos da recomendação, como serão mitigados e o que acontece se a decisão atrasar."],"aplicar":["Valide os critérios com o decisor antes de comparar: metade das discussões é sobre critérios.","Inclua sempre \"não fazer nada\", com o custo real de não agir.","Monte uma tabela opção × critério, com número sempre que existir.","Diga se a decisão é reversível: decisões reversíveis pedem menos análise.","Envie antes da reunião e use a reunião para decidir, não para ler."],"ex":"Decisão: a linguagem dos novos BFFs. Opção A, manter Java: custo zero de mudança, mas o custo do cluster continua. Opção B, Java com virtual threads e imagem nativa: ganho parcial, ferramental novo. Opção C, Go nos novos BFFs: o maior ganho medido, com curva de aprendizado. Recomendação: C com piloto, porque é reversível no nível de um BFF e tem o maior ganho de memória.","armadilhas":["Opções de palha (duas ruins e a sua): o executivo percebe e perde a confiança.","Critérios diferentes para cada opção.","Esconder o custo de não fazer nada."],"combina":["scqa","bluf","adr","mece"],"refs":[]},{"id":"sixpager","g":"exec","s":"6P","n":"Narrativa de seis páginas","x":"Six-pager (Amazon)","o":"Amazon; Jeff Bezos trocou slides por memos nas reuniões da liderança em 2004","q":"Um documento em prosa de até seis páginas, lido em silêncio no início da reunião e só então discutido.","quando":"Decisões de estratégia ou investimento, planejamento anual, propostas de arquitetura com muitos trade-offs: quando os argumentos precisam de um encadeamento que bullets não mostram.","nao":"Atualizações rápidas e públicos que não vão ler. Também não funciona se a reunião não reserva tempo de leitura.","estrutura":["Introdução: o propósito do documento e a pergunta.","Objetivos e princípios (tenets) que guiam a decisão.","O estado atual e o que aprendemos, com dados.","A proposta e as alternativas consideradas.","Riscos, custos, plano e o que vamos medir.","Apêndices com dados e FAQ (não contam nas seis páginas)."],"aplicar":["Escreva frases completas, sem bullets, com números no lugar de adjetivos.","Peça a alguém de fora que leia e marque onde ficou com dúvida.","Reserve de 15 a 20 minutos de leitura silenciosa no começo da reunião.","Na discussão, siga a ordem das dúvidas, não a do documento."],"ex":"Para propor uma arquitetura de referência de BFFs: tenets como \"o BFF não guarda estado de negócio\" e \"toda chamada externa tem timeout e circuit breaker\"; o estado atual com o inventário de BFFs e os incidentes; a proposta, com o C4 nível 2 no apêndice; as alternativas descartadas; e o plano de adoção por ondas.","armadilhas":["Slides disfarçados de texto (bullets com ponto final).","Seis páginas que poderiam ser duas: o limite é teto, não meta.","Discutir sem tempo de leitura, com ninguém tendo lido."],"combina":["prfaq","rfc","memo"],"refs":[["Livro: Working Backwards, Colin Bryar e Bill Carr",""]]},{"id":"prfaq","g":"exec","s":"PR","n":"PR-FAQ (Working Backwards)","x":"Press release + perguntas frequentes","o":"Amazon, processo Working Backwards","q":"Escreva o comunicado de lançamento antes de construir e responda às perguntas difíceis num FAQ.","quando":"Produtos novos, plataformas internas e capacidades que precisam de patrocínio, quando a pergunta do executivo é \"por que o cliente se importaria?\".","nao":"Mudanças puramente técnicas, sem efeito visível para um cliente interno ou externo: use memo ou RFC.","estrutura":["Título e subtítulo: o que é e para quem.","Resumo: o benefício em uma frase.","Problema: a dor do cliente hoje.","Solução: como o produto resolve a dor.","Citações ilustrativas de alguém da empresa e de um cliente.","Como começar a usar.","FAQ externo (perguntas do cliente) e FAQ interno (custo, riscos, dependências, métricas)."],"aplicar":["Escreva o press release em até uma página, na linguagem do cliente, sem jargão.","Liste as 10 perguntas que você menos gostaria de ouvir e responda no FAQ interno.","Se o press release não empolga, o problema está no produto, não no texto.","Revise com o time até o FAQ responder às objeções reais."],"ex":"Plataforma interna: \"Times de produto publicam um BFF novo em um dia, já com observabilidade, segurança e deploy.\" O cliente são os times de engenharia. FAQ interno: quem mantém o template? Quanto custa por mês? O que acontece com os BFFs que já existem?","armadilhas":["Press release cheio de tecnologia (\"agora com Kubernetes\") em vez de benefício.","FAQ interno só com perguntas fáceis."],"combina":["sixpager","psb"],"refs":[["Livro: Working Backwards, Colin Bryar e Bill Carr",""]]},{"id":"wardley","g":"exec","s":"MAP","n":"Mapas de Wardley","x":"Wardley Maps","o":"Simon Wardley, 2005","q":"Um mapa da cadeia de valor em que cada componente aparece na sua fase de evolução, do gênesis à commodity, para discutir estratégia.","quando":"Construir ou comprar, o que terceirizar, onde investir em diferencial, plataformas internas, mostrar por que algo deve virar serviço gerenciado.","nao":"Decisões táticas de curto prazo, ou quando o público não tem tempo de aprender a ler o mapa: leve a conclusão e deixe o mapa no apêndice.","estrutura":["Âncora no topo: o usuário e a necessidade dele.","Eixo vertical, a cadeia de valor: o que o usuário vê em cima, a infraestrutura embaixo.","Eixo horizontal, a evolução: gênesis, customizado, produto e commodity.","Movimento: setas mostram para onde cada componente está evoluindo.","Jogadas: o que fazer em cada fase (construir no gênesis, comprar na commodity)."],"aplicar":["Escreva o usuário e a necessidade.","Liste os componentes que atendem à necessidade e ligue as dependências.","Posicione cada componente na evolução junto com o time: a discussão é o valor.","Marque o que você constrói hoje e o mercado já vende como commodity: é candidato a comprar.","Marque o que é diferencial e ainda está no customizado: é onde investir.","Apresente uma decisão por mapa."],"ex":"Fitness Evolutivo. Usuário: quem treina; necessidade: registrar o treino rápido. Componentes: app, motor de progressão, catálogo de exercícios, autenticação, banco, filas, nuvem. Autenticação e filas já são commodity: usar serviço gerenciado. O motor de progressão é o diferencial e está no customizado: construir em Go.","armadilhas":["Usar o mapa como diagrama de arquitetura: ele não mostra deploy nem fluxo.","Posicionar sozinho: o mapa vale pela conversa.","Levar o mapa para uma reunião de 15 minutos sem conclusão."],"combina":["memo","c4","teamtop"],"refs":[["Learn Wardley Mapping","https://learnwardleymapping.com"]]},{"id":"psb","g":"exec","s":"PSB","n":"Problema, Solução, Benefício","x":"Problem–Solution–Benefit","o":"Estrutura clássica de comunicação persuasiva e de vendas","q":"Três blocos: a dor, como resolvê-la e o que o público ganha.","quando":"Pitch curto para um patrocinador, propostas de melhoria, defesa de uma ferramenta ou prática para outro time.","nao":"Decisões com alternativas reais (use o memo de opções): o PSB esconde as alternativas.","estrutura":["Problema: a dor nos termos do público, com número.","Solução: o que você propõe, em uma ou duas frases.","Benefício: o ganho para quem ouve, não para você nem para a tecnologia."],"aplicar":["Escreva o problema do jeito que o público o descreveria.","Descreva a solução sem jargão que o público não usa.","Traduza cada característica técnica em benefício (use FAB).","Feche com o pedido: o que você precisa para começar."],"ex":"Problema: cada BFF novo leva [n] semanas até estar pronto para produção. Solução: um template com observabilidade, segurança e pipeline prontos. Benefício: o time coloca o primeiro endpoint em produção na primeira semana.","armadilhas":["Benefício que é característica (\"é em Go\").","Problema que só quem apresenta sente."],"combina":["fab","monroe","prfaq"],"refs":[]},{"id":"fab","g":"exec","s":"FAB","n":"FAB","x":"Feature, Advantage, Benefit","o":"Técnica de vendas consultivas","q":"Traduz cada característica técnica em vantagem e depois em benefício para quem ouve.","quando":"Explicar escolhas técnicas para executivos, produto ou negócio; escrever a seção \"por quê\" de uma proposta.","nao":"Conversas entre engenheiros, em que a característica já é o argumento.","estrutura":["Feature: o que a solução tem ou faz.","Advantage: o que isso permite em relação ao que existe.","Benefit: o ganho concreto para o público (tempo, dinheiro, risco, cliente)."],"aplicar":["Liste as características que você ia citar.","Para cada uma, pergunte \"e daí?\" até chegar a algo que o público mede.","Na apresentação, fale o benefício primeiro e use a característica como prova."],"ex":"Feature: o binário Go sobe em milissegundos. Advantage: o autoscaling põe pods novos no ar quase na hora do pico. Benefit: menos erro para o cliente no pico e menos pods ociosos pagos fora dele.","armadilhas":["Parar na vantagem (\"escala melhor\") sem chegar ao que o público mede."],"combina":["psb","memo"],"refs":[]},{"id":"monroe","g":"exec","s":"MMS","n":"Sequência Motivada de Monroe","x":"Monroe's Motivated Sequence","o":"Alan H. Monroe, Purdue University, anos 1930","q":"Cinco passos para persuadir: atenção, necessidade, satisfação, visualização e ação.","quando":"Convencer um público cético ou que não pediu a mudança: adoção de uma prática, de uma plataforma nova, de um processo diferente.","nao":"Executivos que pediram uma recomendação: para eles, a resposta vem primeiro (pirâmide).","estrutura":["Atenção: um fato, um caso ou uma pergunta que prende.","Necessidade: o problema e quem ele afeta.","Satisfação: a solução e como ela atende à necessidade.","Visualização: como fica o futuro com a solução (e sem ela).","Ação: o que você pede, concreto e imediato."],"aplicar":["Abra com um incidente real ou um número que o público reconhece.","Mostre a necessidade com dados do próprio público.","Na visualização, descreva um dia de trabalho depois da mudança.","Termine com um pedido pequeno e fácil de aceitar."],"ex":"Atenção: \"No último incidente de madrugada, levamos [x] minutos para descobrir qual BFF estava lento.\" Necessidade: [n] incidentes no trimestre com o mesmo padrão. Satisfação: tracing distribuído padronizado em todos os BFFs. Visualização: o plantonista abre um trace e vê o serviço lento em um minuto. Ação: \"Topam adotar o template de observabilidade nos dois BFFs de vocês este mês?\"","armadilhas":["Pular a necessidade e ir direto para a solução.","Ação vaga (\"pensem nisso\")."],"combina":["psb","sparkline"],"refs":[]},{"id":"c4","g":"eng","s":"C4","n":"Modelo C4","x":"Context, Containers, Components, Code","o":"Simon Brown, criado entre 2006 e 2011","q":"Diagramas em quatro níveis de zoom, como um mapa: do sistema no mundo até o código.","quando":"Apresentar ou documentar uma arquitetura para qualquer público técnico. O nível 1 também funciona para executivos e produto.","nao":"Não mostra comportamento no tempo (use um diagrama de sequência ou dinâmico) nem decisões (use ADR).","estrutura":["Nível 1, Contexto: o sistema como uma caixa, as pessoas que o usam e os sistemas externos.","Nível 2, Containers: as aplicações e bancos que rodam separadamente (BFF, API, fila, banco) e como conversam.","Nível 3, Componentes: os blocos principais dentro de um container.","Nível 4, Código: classes e tabelas; quase sempre gerado pela IDE ou dispensado.","Diagramas de apoio: paisagem de sistemas, dinâmico e de deploy."],"aplicar":["Para executivos e produto, mostre só o nível 1.","Para engenharia, o nível 2 é o que mais rende; o 3 só para o container em discussão.","Toda caixa tem nome, tipo e responsabilidade em uma linha; toda seta tem verbo e protocolo (\"consulta o saldo via HTTPS/JSON\").","Inclua legenda e um título que diga o escopo.","Mantenha os diagramas como código (Structurizr DSL, C4-PlantUML ou Mermaid), no repositório."],"ex":"Fitness Evolutivo, nível 2: o aluno usa o app Next.js (SSR), que chama a API Go (\"registra a série\", HTTPS/JSON); a API grava no PostgreSQL e publica \"treino finalizado\" numa fila, consumida pelo worker Go de recordes.","armadilhas":["Misturar níveis no mesmo diagrama.","Setas sem rótulo.","Caixas com o nome da tecnologia e sem responsabilidade (\"Lambda\")."],"combina":["arc42","adr","rfc"],"refs":[["c4model.com","https://c4model.com"],["Richards e Ford · Cap. 23 · diagramação da arquitetura","https://www.oreilly.com/library/view/fundamentos-da-arquitetura/9798341637955/ch23.html"]]},{"id":"arc42","g":"eng","s":"A42","n":"arc42","x":"Template de documentação de arquitetura","o":"Gernot Starke e Peter Hruschka, 2005","q":"Um template de 12 seções para documentar uma arquitetura, dos objetivos aos riscos.","quando":"Documentar um sistema novo ou existente, padronizar a documentação entre times, preparar uma revisão de arquitetura.","nao":"Como roteiro de apresentação oral: o arc42 é a referência de onde você tira os slides, não os slides.","estrutura":["1 Introdução e objetivos · 2 Restrições · 3 Contexto e escopo","4 Estratégia da solução · 5 Visão de blocos · 6 Visão de execução","7 Visão de implantação · 8 Conceitos transversais · 9 Decisões de arquitetura","10 Requisitos de qualidade · 11 Riscos e dívida técnica · 12 Glossário"],"aplicar":["Preencha primeiro as seções 1, 3, 4 e 11: elas já dão a maior parte do valor.","Use o C4 nas seções 3, 5 e 7.","Na seção 9, aponte para os ADRs em vez de repeti-los.","Seção que não se aplica fica com \"não se aplica\": o template é cardápio, não obrigação."],"ex":"Revisão de uma API de crédito nova: objetivos de qualidade (p99, disponibilidade), restrições (regulatórias, stack aprovada), contexto em C4 nível 1, decisões com link para os ADRs e a lista de riscos que a revisão precisa discutir.","armadilhas":["Preencher tudo antes de qualquer conversa.","Documento que ninguém atualiza: amarre a manutenção às mudanças (o PR de arquitetura atualiza o arc42)."],"combina":["c4","adr","atam"],"refs":[["arc42.org","https://arc42.org"]]},{"id":"v41","g":"eng","s":"4+1","n":"Modelo 4+1 de Kruchten","x":"4+1 View Model","o":"Philippe Kruchten, 1995 (IEEE Software)","q":"Quatro visões da mesma arquitetura, cada uma para um tipo de interessado, amarradas por cenários.","quando":"Entender e ensinar a ideia de visões; sistemas grandes com interessados muito diferentes; contextos que exigem documentação formal.","nao":"Times que precisam de algo leve: o C4 cobre o mesmo terreno com menos cerimônia.","estrutura":["Lógica: funcionalidades e abstrações (para quem usa e analisa).","Desenvolvimento: módulos, pacotes e camadas (para quem programa).","Processo: concorrência, distribuição e desempenho (para quem integra).","Física: onde cada coisa roda (para quem opera).","+1, Cenários: casos de uso que atravessam as quatro visões e as validam."],"aplicar":["Escolha 2 ou 3 cenários críticos.","Para cada visão, pergunte qual interessado precisa dela.","Passe cada cenário pelas visões e veja se todas respondem."],"ex":"Cenário \"o aluno finaliza o treino offline\": na visão lógica, o agregado Treino; na de desenvolvimento, o módulo de sincronização; na de processo, a fila e a idempotência; na física, o service worker no celular e o worker Go na nuvem.","armadilhas":["Produzir as cinco visões por obrigação, sem um interessado para cada uma."],"combina":["iso42010","c4"],"refs":[["Artigo: Architectural Blueprints, The \"4+1\" View Model of Software Architecture (Kruchten, 1995)",""]]},{"id":"iso42010","g":"eng","s":"ISO","n":"ISO/IEC/IEEE 42010","x":"Descrição de arquitetura","o":"Norma internacional de 2011, sucessora da IEEE 1471; revisada em 2022","q":"A norma que formaliza o vocabulário: interessados, preocupações, pontos de vista e visões.","quando":"Ambientes regulados ou que exigem conformidade; para entender a teoria por trás de C4, 4+1 e arc42.","nao":"O dia a dia de um time de produto: use a ideia, não a cerimônia.","estrutura":["Stakeholders: quem tem interesse no sistema.","Concerns: o que cada um quer saber (custo, segurança, desempenho).","Viewpoint: a convenção usada para responder a um conjunto de preocupações (ex.: C4 nível 2).","View: o artefato concreto que segue o viewpoint para este sistema.","Rastreabilidade: cada preocupação é respondida por pelo menos uma visão."],"aplicar":["Antes de desenhar, liste os interessados e as preocupações de cada um.","Escolha uma visão para cada grupo de preocupações.","Na apresentação, abra dizendo qual preocupação o diagrama responde."],"ex":"Revisão de uma solução: segurança quer saber por onde trafega o dado pessoal (visão de fluxo de dados); operações quer saber onde roda e como escala (visão de deploy); produto quer saber o que muda para o cliente (contexto).","armadilhas":["Confundir viewpoint (a convenção) com view (o diagrama)."],"combina":["v41","arc42"],"refs":[]},{"id":"adr","g":"eng","s":"ADR","n":"ADR","x":"Architecture Decision Record","o":"Michael Nygard, 2011","q":"Um arquivo curto por decisão de arquitetura (contexto, decisão e consequências), versionado junto com o código.","quando":"Toda decisão difícil de reverter ou sobre a qual alguém vai perguntar \"por que fizemos assim?\" daqui a um ano: banco, padrão de integração, linguagem, estratégia de consistência.","nao":"Decisões triviais ou fáceis de reverter: o custo do registro tem de valer a pena.","estrutura":["Título numerado, no imperativo (\"ADR-012: Usar outbox para publicar eventos\").","Status: proposto, aceito, rejeitado ou substituído pelo ADR-NNN.","Contexto: as forças em jogo, inclusive as não técnicas.","Decisão: \"Vamos…\", na voz ativa.","Consequências: o que fica mais fácil e o que fica mais difícil.","Opcional (variante MADR): as opções consideradas e por que foram descartadas."],"aplicar":["Guarde em docs/adr/ no repositório, um arquivo Markdown por decisão.","Escreva no momento da decisão, não depois.","Nunca edite um ADR aceito: crie outro que o substitua.","Em revisões de solução, peça os ADRs das decisões mais caras de reverter.","Numa apresentação para engenheiros, um slide por ADR: contexto, decisão, consequência."],"ex":"ADR-007: Publicar \"treino finalizado\" via outbox. Contexto: o recorde era comemorado duas vezes e, às vezes, nunca. Decisão: gravar o evento na mesma transação do treino e publicá-lo com um relay. Consequências: entrega ao menos uma vez, consumidores precisam ser idempotentes e há uma tabela a mais para limpar.","armadilhas":["ADR escrito meses depois, reconstruindo a história.","Consequências só positivas.","ADR para tudo, que ninguém lê."],"combina":["rfc","c4","memo"],"refs":[["adr.github.io","https://adr.github.io"],["Richards e Ford · Cap. 21 · Decisões de arquitetura","https://www.oreilly.com/library/view/fundamentos-da-arquitetura/9798341637955/ch21.html"]]},{"id":"rfc","g":"eng","s":"RFC","n":"RFC e design doc","x":"Request for Comments / documento de design","o":"Inspirado nas RFCs da IETF; popularizado em empresas como Google e Uber","q":"Um documento que propõe uma mudança antes de construí-la e recolhe comentários de quem será afetado.","quando":"Mudanças que afetam vários times ou custam caro: serviço novo, migração, mudança de contrato, padrão transversal. É onde nasce o ADR.","nao":"Decisões locais de um time pequeno: uma conversa e um ADR bastam.","estrutura":["Resumo: o quê e por quê, em um parágrafo.","Contexto e problema, com dados.","Objetivos e não-objetivos (o que fica de fora de propósito).","Proposta: design, C4, contratos, dados, migração.","Alternativas consideradas.","Riscos, segurança, observabilidade e custo.","Plano de rollout e de rollback.","Perguntas em aberto."],"aplicar":["Escreva os não-objetivos: eles evitam metade das discussões.","Defina revisores obrigatórios e um prazo para comentários.","Responda aos comentários no documento, não em conversas paralelas.","Feche com a decisão registrada (vira ADR) e mude o status do RFC."],"ex":"RFC \"Template padrão de BFF em Go\". Objetivo: um BFF novo em produção em uma semana. Não-objetivo: migrar os BFFs existentes. Proposta: estrutura de pastas, middlewares de timeout e tracing, pipeline. Alternativa: Java com virtual threads. Rollout: dois times piloto.","armadilhas":["RFC de fato consumado: os comentários não mudam nada e o processo perde crédito.","Sem prazo para comentários, o RFC nunca fecha."],"combina":["adr","c4","sixpager"],"refs":[]},{"id":"atam","g":"eng","s":"ATAM","n":"ATAM","x":"Architecture Tradeoff Analysis Method","o":"Software Engineering Institute (SEI), Carnegie Mellon, 2000","q":"Um método de avaliação que parte dos atributos de qualidade e encontra os riscos, os pontos de sensibilidade e os trade-offs da arquitetura.","quando":"Revisões formais de arquiteturas críticas; numa versão leve, as sessões de revisão de solução.","nao":"Projeto pequeno ou fase muito inicial: o ATAM completo leva dias e envolve muita gente.","estrutura":["1 Apresentar o método.","2 Apresentar os direcionadores de negócio.","3 Apresentar a arquitetura.","4 Identificar as abordagens arquiteturais.","5 Montar a árvore de utilidade: atributos de qualidade e cenários priorizados (importância × dificuldade).","6 Analisar as abordagens contra os cenários.","7 Levantar e priorizar cenários com os interessados.","8 Analisar de novo com os cenários priorizados.","9 Apresentar os resultados: riscos, não-riscos, pontos de sensibilidade e trade-offs."],"aplicar":["Versão leve: peça ao time de 3 a 5 cenários de qualidade concretos (\"no pico de 10×, o p99 fica abaixo de 300 ms\").","Para cada cenário, pergunte qual decisão da arquitetura responde a ele.","Classifique o que encontrar: risco, ponto de sensibilidade (uma decisão afeta um atributo) ou trade-off (afeta dois em sentidos opostos).","Feche com a lista de riscos, com dono e prazo."],"ex":"Cenário: \"se o bureau de crédito ficar lento por dois minutos, a contratação continua para quem já tem análise\". Decisão analisada: chamada síncrona, sem cache. Resultado: risco alto; ponto de sensibilidade no timeout; trade-off entre o frescor da análise e a disponibilidade.","armadilhas":["Cenários vagos (\"o sistema deve ser rápido\").","Virar auditoria em vez de conversa: o time precisa sair melhor do que entrou."],"combina":["risk","wellarch","arc42"],"refs":[["Richards e Ford · Cap. 22 · Analisar o risco da arquitetura","https://www.oreilly.com/library/view/fundamentos-da-arquitetura/9798341637955/ch22.html"]]},{"id":"risk","g":"eng","s":"RISK","n":"Risk-storming","x":"Avaliação colaborativa de riscos","o":"Simon Brown","q":"Uma sessão visual em que cada pessoa marca sozinha os riscos sobre um diagrama C4 e depois o grupo converge.","quando":"Revisões de solução rápidas (de 60 a 90 minutos), antes de um go-live, ao herdar um sistema.","nao":"Quando ainda não existe diagrama: faça o C4 primeiro.","estrutura":["Desenhe a arquitetura (o C4 nível 2 é o ideal).","Identificação individual, em silêncio: cada pessoa marca riscos com post-its.","Convergência: junte os post-its iguais sobre o diagrama.","Classificação: probabilidade × impacto (baixo, médio, alto).","Mitigação: para os riscos altos, ação, dono e prazo."],"aplicar":["Use uma matriz 3 × 3 de probabilidade × impacto, com uma cor por nível.","Dê 10 minutos de silêncio na identificação: isso evita que a pessoa mais sênior ancore o grupo.","Sugira categorias: desempenho, segurança, custo, operação, dados e dependências.","Registre o resultado como lista de riscos no arc42 (seção 11)."],"ex":"Sobre o C4 nível 2 da API nova, três pessoas marcam o mesmo risco no cache distribuído (dado velho depois de uma mudança de taxa) e duas marcam a dependência de um bureau externo sem timeout. Os dois viram alto × alto, com dono e prazo.","armadilhas":["Discutir durante a identificação: o grupo perde a independência.","Sair sem dono para os riscos altos."],"combina":["c4","atam","arc42"],"refs":[["riskstorming.com","https://riskstorming.com"],["Richards e Ford · Cap. 22 · Analisar o risco da arquitetura","https://www.oreilly.com/library/view/fundamentos-da-arquitetura/9798341637955/ch22.html"]]},{"id":"wellarch","g":"eng","s":"WA","n":"AWS Well-Architected","x":"Os seis pilares","o":"Amazon Web Services, 2015; o pilar de sustentabilidade entrou em 2021","q":"Um conjunto de pilares e perguntas para revisar uma carga de trabalho na nuvem.","quando":"Revisão de soluções na AWS, checklist antes de produção, conversa com o time de nuvem. Os pilares também organizam bem uma apresentação de riscos.","nao":"No lugar da conversa de negócio: os pilares dizem como, não por quê.","estrutura":["Excelência operacional","Segurança","Confiabilidade","Eficiência de desempenho","Otimização de custos","Sustentabilidade"],"aplicar":["Use os pilares como sumário da revisão, um bloco por pilar.","Em cada pilar, escolha as 2 ou 3 perguntas mais relevantes para a carga.","Classifique os achados em risco alto ou médio, como na ferramenta oficial.","Feche com um plano de melhoria priorizado."],"ex":"Revisão do pipeline diário de créditos: confiabilidade (reprocessamento e DLQ), custo (instâncias spot no lote), segurança (criptografia dos arquivos e menor privilégio no IAM) e operação (alarme quando a janela estoura).","armadilhas":["Checklist mecânico, sem prioridade.","Revisar uma vez e nunca mais."],"combina":["atam","risk"],"refs":[["AWS Well-Architected","https://aws.amazon.com/architecture/well-architected/"]]},{"id":"eventstorming","g":"eng","s":"ES","n":"EventStorming","x":"Modelagem colaborativa do domínio","o":"Alberto Brandolini, 2013","q":"Um workshop com post-its em que negócio e engenharia descobrem o domínio a partir dos eventos que acontecem nele.","quando":"Início de projeto, domínio complexo ou mal entendido, busca de limites de contexto e de serviços, alinhamento entre negócio e engenharia.","nao":"Domínios simples e bem conhecidos (CRUD) ou quando as pessoas do negócio não podem participar.","estrutura":["Eventos de domínio (laranja), no passado: \"Proposta aprovada\".","Linha do tempo da esquerda para a direita.","Pontos quentes (rosa): dúvidas e conflitos.","Comandos (azul) e atores (amarelo) que disparam os eventos.","Políticas (\"sempre que… então…\"), sistemas externos e modelos de leitura.","No nível de design: agregados e limites de contexto."],"aplicar":["Comece pela visão geral (big picture): todos colam eventos, sem ordem.","Ordene a linha do tempo e marque os pontos quentes.","Use os pontos quentes como pauta da próxima conversa.","Desenhe os limites onde a linguagem muda: são candidatos a serviços.","Fotografe e transforme o resultado em C4 e ADRs."],"ex":"Contratação de crédito: \"Simulação feita\", \"Proposta enviada\", \"Análise aprovada\", \"Contrato assinado\", \"Valor liberado\". Ponto quente: quem cancela se a averbação falhar? Limites candidatos: Simulação, Análise, Formalização e Liberação.","armadilhas":["Começar pelos comandos ou pelo banco de dados.","Fazer só com engenheiros."],"combina":["c4","teamtop"],"refs":[["eventstorming.com","https://www.eventstorming.com"]]},{"id":"teamtop","g":"eng","s":"TT","n":"Team Topologies","x":"Topologias de times","o":"Matthew Skelton e Manuel Pais, 2019","q":"Um vocabulário para desenhar os times e as interações entre eles, a partir da Lei de Conway e da carga cognitiva.","quando":"Apresentar arquitetura e organização juntas, propor uma plataforma interna, explicar por que um serviço deve mudar de dono.","nao":"Discussões puramente técnicas, sem impacto em quem é dono do quê.","estrutura":["Quatro tipos de time: alinhado ao fluxo (stream-aligned), plataforma, habilitador (enabling) e subsistema complicado.","Três modos de interação: colaboração, X como serviço e facilitação.","Manobra inversa de Conway: desenhe os times para chegar à arquitetura desejada.","Carga cognitiva como limite do que um time consegue manter."],"aplicar":["Desenhe os times atuais e as interações com as formas do livro.","Sobreponha o C4 nível 2: cada container tem um dono claro?","Mostre o estado desejado e a transição.","Use para justificar uma plataforma interna: o que sai da carga dos times de fluxo."],"ex":"Proposta do template de BFF: os times de produto são alinhados ao fluxo; um time de plataforma oferece o template como serviço; um time habilitador acompanha a migração dos dois primeiros times durante um trimestre.","armadilhas":["Trocar os nomes dos times sem mudar as interações.","Plataforma que vira gargalo em vez de serviço."],"combina":["c4","wardley","eventstorming"],"refs":[["teamtopologies.com","https://teamtopologies.com"]]},{"id":"enterprise","g":"eng","s":"EA","n":"TOGAF, Zachman e ArchiMate","x":"Arquitetura corporativa","o":"Zachman (John Zachman, 1987), TOGAF (The Open Group, 1995), ArchiMate (padrão do The Open Group)","q":"Frameworks e linguagem para a arquitetura da empresa inteira: negócio, dados, aplicações e tecnologia.","quando":"Organizações grandes, bancos e governo; governança de portfólio; conversas com a arquitetura corporativa; mapas de capacidades para a diretoria.","nao":"O design de um sistema ou de um time: é pesado demais para esse nível.","estrutura":["TOGAF: o ciclo ADM (Architecture Development Method), com fase preliminar, visão, arquitetura de negócio, de sistemas de informação e de tecnologia, oportunidades, migração, governança da implementação e gestão de mudanças, tudo em volta da gestão de requisitos.","Zachman: uma matriz que cruza as perguntas (o quê, como, onde, quem, quando, por quê) com as perspectivas (do executivo a quem implementa). É uma taxonomia, não um processo.","ArchiMate: uma notação em camadas (negócio, aplicação e tecnologia) com as relações entre elas."],"aplicar":["Use o vocabulário ao falar com a arquitetura corporativa: capacidade de negócio, aplicação, serviço de tecnologia.","Para a diretoria, um mapa de capacidades pintado por criticidade costuma valer mais que qualquer diagrama técnico.","Ligue a sua solução às capacidades de negócio que ela atende."],"ex":"Mapa de capacidades de crédito: Simulação, Análise, Formalização, Liberação e Cobrança, pintadas por criticidade e por dívida técnica. A proposta de BFFs em Go aparece como melhoria na camada de aplicação das capacidades mais críticas.","armadilhas":["Aplicar o ADM inteiro em um projeto: vira burocracia.","Diagramas ArchiMate para quem não conhece a notação."],"combina":["wardley","c4","memo"],"refs":[["The Open Group · TOGAF","https://www.opengroup.org/togaf"]]},{"id":"sparkline","g":"palco","s":"SPK","n":"Sparkline","x":"O que é × o que poderia ser","o":"Nancy Duarte, livro Resonate (2010)","q":"A palestra alterna entre a realidade de hoje e o futuro possível, criando tensão, e termina num novo normal.","quando":"Keynotes, tech talks, apresentações de visão, lançamento interno de plataforma, all-hands.","nao":"Reuniões de decisão com executivos: eles querem a resposta primeiro.","estrutura":["Começo, o que é: o mundo que o público reconhece.","Primeiro ponto de virada: o chamado à aventura, o que poderia ser.","Meio: alterna várias vezes entre o que é e o que poderia ser.","Segundo ponto de virada: o chamado à ação.","Fim: o novo normal, como o mundo fica se o público agir.","Um momento S.T.A.R. (Something They'll Always Remember): uma demo, um dado chocante, uma história."],"aplicar":["Escreva uma frase de \"o que é\" e uma de \"o que poderia ser\".","Liste os contrastes (a dor de hoje × o alívio de amanhã) e alterne entre eles.","Planeje um único momento memorável; muitas vezes é a demo.","Termine com o que o público deve fazer na segunda-feira."],"ex":"Tech talk sobre observabilidade. O que é: o plantonista caçando logs em cinco consoles às 3h. O que poderia ser: um trace que mostra o serviço lento em um clique. Alterne com dois incidentes reais. Momento S.T.A.R.: injetar lentidão ao vivo e achá-la no trace em 10 segundos. Novo normal: todo serviço nasce com tracing.","armadilhas":["Só \"o que poderia ser\": vira propaganda.","Só \"o que é\": vira lamento."],"combina":["talk","ae","monroe"],"refs":[["Livro: Resonate, Nancy Duarte",""]]},{"id":"talk","g":"palco","s":"TALK","n":"Problema, Solução, Demo, Lições","x":"A estrutura de um tech talk","o":"Padrão consagrado em conferências de engenharia","q":"A espinha da maioria dos bons talks técnicos: uma dor real, como ela foi resolvida, a prova e o que levar para casa.","quando":"Meetups, conferências, apresentações internas de engenharia, demos de sprint e de prova de conceito.","nao":"Executivos: eles trocam a demo pelo resultado e querem a decisão.","estrutura":["Problema: um caso concreto, com números e consequências.","Por que as soluções óbvias não serviram.","Solução: a ideia central e a arquitetura (o C4 nível 2 basta).","Demo ou evidência: ao vivo, gravada ou com dados.","Lições: três aprendizados, inclusive o que deu errado.","Chamado: o que o público pode fazer amanhã."],"aplicar":["Escolha a ideia central e escreva-a em uma frase.","Grave a demo como plano B; ao vivo, tenha os dados prontos e não dependa da rede.","Mostre o que deu errado: é isso que dá credibilidade.","Divida o tempo mais ou menos assim: 20% problema, 40% solução, 20% demo, 20% lições e perguntas."],"ex":"\"Trocamos Java por Go nos BFFs.\" Problema: pods lentos para subir no pico. O óbvio: mais réplicas mínimas, mais custo. Solução: Go com o mesmo contrato. Demo: teste de carga lado a lado. Lições: o que doeu na migração e o que faríamos diferente.","armadilhas":["Começar pela solução ou pela tecnologia.","Demo sem plano B.","Dez lições: ninguém lembra de dez."],"combina":["sparkline","ae","star"],"refs":[]},{"id":"ae","g":"palco","s":"A-E","n":"Assertion-Evidence","x":"Afirmação + evidência","o":"Michael Alley (Penn State), a partir de pesquisas sobre slides em engenharia e ciência","q":"Cada slide tem como título uma frase-afirmação e, embaixo, uma evidência visual, sem bullets.","quando":"Apresentações técnicas e científicas, revisões de arquitetura, aulas: qualquer slide que precisa ser entendido e lembrado.","nao":"Material de referência para ler sozinho (use um documento) e formatos de palco ultrarrápidos.","estrutura":["Título: uma frase completa com a afirmação, em até duas linhas.","Corpo: a evidência visual (gráfico, diagrama, foto, equação).","Sem bullets: o detalhe vai na sua fala."],"aplicar":["Pegue cada slide com bullets e pergunte: qual frase eles defendem?","Escolha a evidência mais visual para essa frase.","Se não existe evidência, a afirmação é opinião: reescreva ou corte.","É o mesmo princípio dos títulos-ação do ghost deck."],"ex":"Título: \"O p99 do BFF em Go fica estável até [3×] o pico atual.\" Corpo: um gráfico de latência por carga com as duas linhas, Java e Go, e o pico atual marcado.","armadilhas":["Título longo demais, que vira parágrafo.","Evidência decorativa, que não prova a frase."],"combina":["ghost","talk","c4"],"refs":[["Livro: The Craft of Scientific Presentations, Michael Alley",""]]},{"id":"zen","g":"palco","s":"ZEN","n":"Presentation Zen","x":"Simplicidade, clareza e foco","o":"Garr Reynolds, livro Presentation Zen (2008)","q":"Princípios de design de slides (restrição, simplicidade, naturalidade) e o hábito de planejar no papel, longe do software.","quando":"Palestras e keynotes, em que você fala e o slide só apoia.","nao":"Decks que serão lidos sem você: o slide minimalista não se sustenta sozinho.","estrutura":["Planejamento analógico: papel e caneta antes do software.","A mensagem central testada com duas perguntas: qual é o ponto? Por que importa?","Slides com uma ideia, imagem forte e muito espaço vazio.","Slides para a sala e um documento separado para levar."],"aplicar":["Monte o roteiro em post-its, um por slide.","Corte texto até o slide ser entendido em 3 segundos.","Prepare um documento separado para quem quiser os detalhes."],"ex":"Abrir um talk sobre resiliência com a foto de uma fila na catraca às 18h e a frase \"todo mundo chega ao mesmo tempo\". O resto está na sua fala.","armadilhas":["Imagem bonita sem relação com a mensagem.","Usar o deck minimalista como documento depois."],"combina":["sparkline","ae"],"refs":[["Livro: Presentation Zen, Garr Reynolds",""]]},{"id":"curtos","g":"palco","s":"20×","n":"Pecha Kucha e Ignite","x":"Formatos de tempo fixo","o":"Pecha Kucha: Astrid Klein e Mark Dytham, Tóquio, 2003. Ignite: Seattle, 2006","q":"Slides que avançam sozinhos: 20 × 20 s no Pecha Kucha (6 min 40 s) e 20 × 15 s no Ignite (5 min).","quando":"Lightning talks, demos de hackathon e como treino de síntese e ritmo: é um ótimo exercício para aprender a cortar.","nao":"Assuntos que precisam de diagramas detalhados ou de perguntas no meio.","estrutura":["20 slides com avanço automático.","Uma ideia por slide, quase sem texto.","Roteiro escrito com o tempo de cada slide."],"aplicar":["Escreva a fala de cada slide em 2 ou 3 frases.","Ensaie com cronômetro até caber sem correr.","Se perder um slide, siga para o próximo; não tente voltar."],"ex":"Ignite de 5 minutos, \"Do Java ao Go em 20 slides\": 4 de problema, 8 de solução, 4 de números e 4 de lições.","armadilhas":["Slides com texto que o público tenta ler enquanto você fala."],"combina":["lessig","talk"],"refs":[["pechakucha.com","https://www.pechakucha.com"]]},{"id":"lessig","g":"palco","s":"LSG","n":"Métodos Lessig e Takahashi","x":"Slides em ritmo rápido","o":"Lawrence Lessig (palestras dos anos 2000) e Masayoshi Takahashi (comunidade Ruby do Japão)","q":"Muitos slides com uma palavra ou frase curta, sincronizados com a fala: o ritmo prende a atenção.","quando":"Keynotes, aberturas de evento, falas inspiracionais, talks com um argumento em sequência.","nao":"Apresentações com dados e diagramas para decidir.","estrutura":["Lessig: várias trocas por minuto; uma palavra, frase ou imagem por slide, no ritmo da fala.","Takahashi: texto enorme, poucas palavras e nenhuma imagem; cabe em qualquer editor."],"aplicar":["Escreva a fala completa.","Sublinhe a palavra-chave de cada frase: ela vira o slide.","Ensaie bastante: é o sincronismo que faz funcionar."],"ex":"\"Pico.\" \"Autoscaling.\" \"Dois minutos.\" \"Tarde demais.\" Quatro slides em oito segundos para abrir um talk sobre cold start.","armadilhas":["Usar sem ensaio: fala e slides se desencontram."],"combina":["curtos","sparkline"],"refs":[]}],"guia":[["Pedir uma decisão ou orçamento à diretoria",["bluf","scqa","memo","minto"]],["Atualizar o gestor sobre um projeto",["wsn","bluf"]],["Respo   function pDoc() { return S.estudo.pitch || {}; }
  function pChip(id) {

  function renderPitch() {

        '<ul class="pf-guia">' + PITCH.guia.map(function (s) {

      pBloco("_rot", "✓", "Roteiro de preparação", "8 passos para qualquer apresentação",
        '<ol class="pf-rot">' + PITCH.roteiro.map(function (r) { return "<li><b>" + r[0] + "</b><span>" + r[1] + "</span></li>"; }).join("") + "</ol>") +
      pBloco("_tres", "3×", "Uma proposta, três públicos", "o mesmo assunto com estruturas diferentes",
        '<p class="iam-q">' + PITCH.tres.t + "</p>" + PITCH.tres.itens.map(function (it) {
          return '<div class="pf-tres"><span class="pf-lab">' + it[0] + '</span><p class="st-p">' + it[1] + '</p><div class="pf-chips">' + it[2].map(pChip).join("") + "</div></div>";
        }).join("")) +
      "</div></section>";

    var filtros = [["todos", "Todos"], ["msg", "Mensagem"], ["exec", "Executivos"], ["eng", "Engenharia"], ["palco", "Palco"]];
    html += '<section class="section"><h2>Os frameworks <small>' + n + " em " + PITCH.grupos.length + ' grupos</small></h2><div class="pf-filtros" role="group" aria-label="Filtrar por público">' +
      filtros.map(function (x) { return '<button type="button" data-act="pfiltro" data-id="' + x[0] + '" aria-pressed="' + (pFiltro === x[0]) + '">' + x[1] + "</button>"; }).join("") +
      "</div></section>";

    PITCH.grupos.forEach(function (g) {
      if (pFiltro !== "todos" && pFiltro !== g.id) return;

      html += '<section class="section"><h2>' + g.t + " <small>" + fs.length + "</small></h2>" +
        '<p class="small muted pf-gq">' + g.q + '</p><div class="ia-mods">' +
        fs.map(function (f) { return pCard(f); }).join("") + "</div></section>";
    });
    return html;
  }

    if (pFiltro !== "todos" && pFiltro !== f.g) pFiltro = "todos";
    pAbertos[id] = 1;
    render();

  var CASES = {"grupos":[{"id":"plataforma","t":"Plataforma","q":"Peças que toda API usa: ids, cache na borda, limites."},{"id":"social","t":"Social e mídia","q":"Ler muito mais do que se escreve, e mover muitos bytes."},{"id":"tempo-real","t":"Tempo real","q":"Conexões abertas, filas e posições que mudam a cada segundo."},{"id":"dados","t":"Dados","q":"Índices, sincronização e contagem em escala."},{"id":"dinheiro","t":"Dinheiro e estoque","q":"Quando errar uma vez custa caro: idempotência, sagas e conciliação."}],"metodo":{"texto":"Um case é um treino de decisão, não de memorização. Leia o problema e os números e desenhe a sua versão no papel antes de abrir as decisões: quais serviços, onde fica o dado, o que é síncrono e o que vai para fila. Depois compare decisão a decisão e anote onde você escolheu diferente e se o seu motivo se sustenta diante do \"quando muda\". A construção é em Go, num repositório só com uma pasta por case; o gerador de carga do laboratório 1 mede todos. Uma semana depois de marcar o case como lido, as decisões voltam como cartões de revisão: você escreve a resposta antes de ver a do case. Redesenhar do zero em 30 minutos é opcional, e é o melhor teste.","passos":["Problema e números: 10 minutos, e refaça as contas.","Seu desenho no papel: 20 minutos, sem olhar as decisões.","Decisões: compare uma a uma e anote as diferenças.","Perguntas do case: responda sem consultar.","Construção em Go: um passo por vez, no repositório único.","Quando quiser: desenhe de novo do zero em 30 minutos e marque \"Desenhei sozinho\"."],"regua":"Toda decisão dos cases é pesada na mesma régua: latência (p99, não média), consistência (o que o usuário pode ver desatualizado, e por quanto tempo), disponibilidade (o que continua funcionando quando uma peça cai), custo (qual linha da fatura cresce com o volume), complexidade de operação (quem acorda de madrugada) e dependência de um serviço específico (o que acontece se ele mudar ou acabar, como aconteceu com o QLDB e com o Pinpoint). Uma decisão boa diz o que ganha, o que perde e em que condição a resposta muda.","aviso":"Fatos de serviços da AWS conferidos em novembro de 2026; limites e preços mudam, então confira a documentação e a AWS Pricing Calculator antes de usar um número numa decisão real."},"cases":[{"id":"encurtador","n":1,"g":"plataforma","t":"Encurtador de URL","q":"Como gerar bilhões de links curtos únicos e redirecionar em milissegundos de qualquer lugar do mundo?","nivel":"Introdutório","horas":3,"cenario":"O app compartilha treinos por links curtos (fit.ly/aB3x9Kq), e o serviço abriu para qualquer pessoa encurtar qualquer URL. É o case clássico para começar: parece trivial e esconde três decisões que aparecem em quase todo sistema, que são gerar ids únicos sem coordenação, servir leitura muito maior que escrita e decidir o que fica no caminho crítico.","req":["Criar um link curto para uma URL longa, com apelido opcional.","Redirecionar o link curto para a URL longa.","Expiração opcional.","Estatísticas de cliques por link.","Bloquear URLs maliciosas."],"nreq":["Redirecionamento com p99 abaixo de 50 ms no mundo inteiro.","Disponibilidade de 99,99% no redirecionamento.","Links não podem ser adivinhados em sequência.","Guardar links por 5 anos."],"numeros":[["Links novos","100 milhões por mês","~40/s na média"],["Redirecionamentos","100 leituras por escrita","~4 mil/s na média, ~40 mil/s no pico"],["Total guardado","100 mi × 12 × 5 anos","6 bilhões de links × ~500 bytes = ~3 TB"],["Espaço de ids","62 caracteres, 7 posições","62^7 ≈ 3,5 trilhões de códigos possíveis"]],"base":"A primeira versão é uma tabela de chave e valor e duas rotas: POST /links grava (código, URL) e GET /{codigo} lê e devolve um redirecionamento. Tudo que importa está nos detalhes: como o código nasce, o que fica em cache e onde a leitura é servida.","fluxo":["POST /links pelo API Gateway: o serviço gera um código aleatório de 7 caracteres e grava no DynamoDB com condição de que ele não exista; colisão, gera outro.","A URL passa por uma checagem de reputação de forma assíncrona; até lá, o link funciona, e se for maliciosa, é desativado.","GET fit.ly/{codigo} chega ao CloudFront; se a resposta está em cache, volta dali.","Sem cache, o CloudFront chama a origem (API Gateway + Lambda em Go, ou um serviço no ECS), que lê o DynamoDB e devolve 302 com Cache-Control de alguns minutos.","Os logs do CloudFront vão para o S3 (ou em tempo real para o Kinesis) e as estatísticas saem de lá, fora do caminho do redirecionamento."],"decisoes":[{"q":"Como gerar o código: aleatório, contador ou hash da URL?","e":"Aleatório de 7 caracteres em base62, gravado com escrita condicional, e nova tentativa na colisão.","por":"Não há coordenação entre servidores: cada um sorteia e o DynamoDB garante a unicidade com attribute_not_exists. A chance de colisão é a fração do espaço já usada: com 6 bilhões de 3,5 trilhões, cerca de 0,17% por tentativa, ou seja, quase sempre a primeira dá certo e a segunda resolve o resto. Um código aleatório também não deixa ninguém percorrer os links de todo mundo trocando uma letra.","contra":"Um contador (com faixas de mil ids reservadas por servidor numa tabela de contador) dá códigos curtos e zero colisão, mas os links ficam em sequência e adivinháveis, e o contador é um ponto central. O hash da URL (MD5 truncado) deduplica a mesma URL, o que é bom ou ruim (dois usuários querendo estatísticas separadas da mesma URL), e colide no truncamento, exigindo a mesma checagem condicional.","muda":"Se o código precisa ser o mais curto possível (6 caracteres ou menos) e enumerar não é problema, contador com faixas; embaralhe com uma permutação reversível para não ficar sequencial."},{"q":"Onde guardar?","e":"DynamoDB, chave pelo código, sob demanda, com TTL para expiração.","por":"O acesso é sempre por chave exata, a latência de um dígito em milissegundos é estável em qualquer volume, e não há servidor para dimensionar. O TTL apaga links expirados sem job. Com tabelas globais, a leitura acontece na região mais próxima.","contra":"O Aurora funcionaria com um índice único, e seria a escolha se houvesse consultas ricas (painel com filtros por usuário e data), que aqui ficam num armazenamento separado alimentado por eventos. Atenção: o TTL do DynamoDB não apaga na hora (pode levar dias), então o redirecionamento confere a data de expiração na leitura.","muda":"Se o volume for pequeno e você já tem um PostgreSQL, ele serve muito bem; o DynamoDB ganha quando a escala e a operação pesam."},{"q":"301 ou 302?","e":"302 com Cache-Control de alguns minutos.","por":"O 301 é permanente: o navegador guarda e nunca mais pergunta, então você perde a estatística dos cliques seguintes e não consegue mais mudar o destino ou desativar um link malicioso para quem já clicou. O 302 com cache curto deixa o CloudFront absorver a carga e mantém o controle.","contra":"O 301 economiza requisições e faz o segundo clique instantâneo, que é o que buscadores e quem não quer estatística preferem.","muda":"Links de domínio próprio que nunca mudam e sem estatística: 301."},{"q":"Onde o redirecionamento acontece: na região, na borda com Lambda@Edge ou com CloudFront Functions?","e":"CloudFront com cache na frente de uma origem regional; CloudFront Functions com KeyValueStore só para os links mais quentes.","por":"A maioria dos cliques se concentra em poucos links recentes, e o cache do CloudFront resolve esses na borda sem código. Para o resto, a origem regional lê o DynamoDB em poucos milissegundos. O CloudFront Functions com KeyValueStore lê chave e valor na própria borda, em menos de um milissegundo, mas o KeyValueStore é pequeno (megabytes, não terabytes): serve para os links de campanhas e os mais clicados, não para 6 bilhões.","contra":"O Lambda@Edge pode ler o DynamoDB de uma região a partir da borda, mas paga a ida até a região mesmo assim e custa mais que uma origem regional comum. Sem CDN, cada clique do mundo vai até a sua região.","muda":"Se a latência fora da região for crítica, tabelas globais do DynamoDB em várias regiões e origem por latência no Route 53."},{"q":"Estatística de cliques no caminho do redirecionamento?","e":"Não: logs do CloudFront para o S3 e consultas no Athena; logs em tempo real para o Kinesis se precisar de painel ao vivo.","por":"Gravar um contador a cada clique coloca uma escrita no caminho crítico e cria partição quente no link viral. Os logs já registram cada requisição, inclusive as respondidas pelo cache, que a origem nem vê. Agregar depois é mais barato e não afeta a latência.","contra":"Contar na origem perde os cliques servidos pelo cache e soma latência; contar na borda com código é caro.","muda":"Painel ao vivo para clientes pagantes: logs em tempo real do CloudFront para o Kinesis e agregação no Flink."},{"q":"Como impedir abuso?","e":"Limite de criação por conta e por IP com AWS WAF, checagem assíncrona de reputação da URL e desativação rápida.","por":"Encurtadores são usados para esconder phishing. Checar a URL de forma síncrona deixa a criação lenta e depende de um serviço externo; de forma assíncrona, o link nasce e é desativado em segundos se a URL for ruim, e o 302 com cache curto garante que a desativação vale rápido para todos.","contra":"Bloquear antes de criar é mais seguro e pior para o usuário honesto; muitos serviços combinam as duas coisas por nível de confiança da conta.","muda":"Contas novas ou anônimas: checagem síncrona; contas verificadas: assíncrona."}],"dados":"Uma tabela do DynamoDB faz quase tudo; as estatísticas vivem no S3 em Parquet.","tabelas":[["links","codigo","GetItem no redirecionamento; PutItem condicional na criação"],["links_por_usuario (GSI)","usuario_id + criado_em","listar os links de uma conta"],["S3 logs","particionado por data","Athena: cliques por link e dia"]],"falhas":[["Colisão de código","A escrita condicional falha e o serviço sorteia outro; o cliente não percebe."],["A região cai","O cache do CloudFront continua respondendo aos links quentes; com tabela global, a origem secundária assume."],["Um link vira campanha nacional","O cache absorve; a origem recebe uma requisição a cada poucos minutos por ponto de presença."],["URL maliciosa descoberta depois","Desativação no banco e invalidação no CloudFront; o 302 com cache curto limita a janela."]],"custo":"Com cache bem usado, o custo é quase todo de CloudFront por requisição e de armazenamento de logs. O DynamoDB sob demanda recebe só as leituras que o cache não respondeu. Gravar estatística por clique no banco multiplicaria a conta sem trazer nada que os logs não tragam.","evolucao":[["v1","API Gateway + Lambda + DynamoDB, sem CDN."],["v2","CloudFront com 302 e cache curto, logs no S3 e Athena."],["v3","WAF, checagem de reputação, tabelas globais em duas regiões."],["v4","KeyValueStore na borda para os links mais quentes, painel ao vivo para clientes pagantes."]],"perguntas":["Calcule a chance de colisão por tentativa quando 1 trilhão de códigos estiverem em uso.","Por que 302 e não 301, e quando 301 é melhor?","Por que o contador sequencial é ruim para segurança, e como embaralhar sem colidir?","O que o TTL do DynamoDB não garante, e como o redirecionamento lida com isso?"],"pratica":{"t":"Um encurtador em Go com DynamoDB Local","passos":["POST e GET em Go com PutItem condicional; gere códigos com crypto/rand.","Teste de colisão: reduza o código para 2 caracteres e veja os retries acontecendo.","Meça o p99 do GET com e sem um cache em memória de 10 mil entradas.","Opcional: CloudFront na frente de uma Lambda e compare o tempo do segundo clique."],"pronto":["Nenhuma colisão grava por cima de outra","O p99 do GET com cache fica abaixo de 5 ms no seu computador"]},"caps":[12,7,13],"livros":[["Kleppmann",4,"Armazenamento e recuperação","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch04.html","armazenamento chave e valor e índices","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"],["Kleppmann",7,"Fragmentação","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch07.html","fragmentação por chave","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"]],"links":[["CloudFront KeyValueStore","https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/kvs-with-functions.html"],["AWS: gestão de redirecionamentos HTTP na borda","https://aws.amazon.com/developer/application-security-performance/articles/http-redirections-management"],["Amazon Builders' Library: Caching challenges and strategies","https://aws.amazon.com/builders-library/caching-challenges-and-strategies/"]],"labs":[12,13],"reusa":"Comece aqui o repositório único: uma pasta por case em cmd/, o que for comum em internal/ e o gerador de carga do laboratório 1 em tools/, para medir todos os outros."},{"id":"ratelimit","n":2,"g":"plataforma","t":"Rate limiter distribuído","q":"Como limitar cada cliente a N requisições por minuto em 50 servidores, sem virar o gargalo que você queria evitar?","nivel":"Intermediário","horas":4,"cenario":"A API do Fitness Evolutivo abriu para parceiros (academias, relógios, apps de nutrição). Plano grátis com 100 requisições por minuto, plano pro com 10 mil, e alguns endpoints caros (relatórios) com limite próprio. Ao mesmo tempo, a API precisa se proteger de abuso e de um parceiro com bug que dispara 50 mil requisições por segundo. Um limitador mal feito vira o ponto único de falha da API inteira.","req":["Limite por cliente (chave de API) e por plano.","Limite por endpoint caro.","Limite por IP para tráfego anônimo.","Resposta 429 com quando tentar de novo.","Ajustar limites sem deploy."],"nreq":["Somar no máximo 1 a 2 ms à latência.","200 mil requisições por segundo no total.","Se o limitador cair, a API continua no ar.","Precisão de alguns por cento é aceitável."],"numeros":[["Chamadas ao limitador","200 mil req/s × 1 a 3 regras","200 a 600 mil verificações por segundo"],["Chaves ativas","50 mil clientes × 5 regras","250 mil contadores, poucos MB de memória"],["Latência extra","uma ida ao Valkey na mesma zona","perto de 1 ms"]],"base":"A primeira versão usa o que já existe: plano de uso com chave de API no API Gateway, e regras por IP no AWS WAF. Quando o produto precisa de limites por endpoint, por custo da operação ou exatos por cliente, entra um limitador próprio com o estado no ElastiCache (Valkey) e o algoritmo num script Lua atômico.","fluxo":["O AWS WAF na frente (CloudFront ou API Gateway) corta abuso por IP com regras por taxa e o Bot Control.","O API Gateway aplica o plano de uso da chave de API (taxa e rajada) e a cota mensal.","No serviço, um middleware em Go chama o script Lua no Valkey com a chave (cliente:endpoint) e o custo da requisição.","O script aplica o balde de fichas e devolve permitido ou negado e quanto falta para a próxima ficha.","Negado: 429 com Retry-After e os cabeçalhos de limite; permitido: segue, com o saldo nos cabeçalhos.","Se o Valkey não responder em 5 ms, o middleware decide sozinho com um limitador local por instância (falha aberta controlada)."],"decisoes":[{"q":"Onde limitar: na borda, no API Gateway ou na aplicação?","e":"Nas três camadas, cada uma com um papel.","por":"O WAF barra o abuso grosso (um IP fazendo milhares de requisições) antes de custar qualquer computação, mas conta por IP e em janelas de minutos, sem saber de planos. O plano de uso do API Gateway limita por chave de API com balde de fichas e cota mensal, o que resolve planos simples sem código; a própria AWS avisa que esse limite é de melhor esforço, não exato. A aplicação é o único lugar que conhece o custo de cada operação (um relatório vale 50 requisições comuns) e regras por endpoint.","contra":"Só na aplicação, o abuso grosso já consumiu conexões e computação antes de ser barrado. Só no API Gateway, não dá para dar pesos diferentes às operações nem limitar com precisão.","muda":"Se os planos são simples e a precisão não importa, o API Gateway e o WAF bastam; não construa o limitador próprio."},{"q":"Qual algoritmo?","e":"Balde de fichas (token bucket) ou GCRA, guardando só duas variáveis por chave.","por":"O balde de fichas permite rajadas curtas (até o tamanho do balde) e limita a taxa média, que é o comportamento que clientes legítimos esperam. Por chave, guarda-se só o saldo e o instante da última atualização; o script calcula quantas fichas entraram desde então. O GCRA é a mesma ideia com uma variável só (o instante teórico de chegada).","contra":"Janela fixa (contador por minuto) é a mais simples, mas deixa passar o dobro na virada do minuto (100 no fim de um e 100 no começo do outro). O log de janela deslizante é exato e guarda um registro por requisição, caro em memória. A janela deslizante por contadores (média ponderada de dois minutos) é um meio-termo bom quando você só tem contadores.","muda":"Se o requisito é cobrar por uso exato (faturamento), não use limitador: conte eventos num pipeline auditável."},{"q":"Onde guardar o estado?","e":"ElastiCache (Valkey) em modo cluster, com script Lua atômico por chave.","por":"A verificação precisa ler, calcular e gravar sem que outra requisição se intrometa. Um script Lua roda atômico no Valkey, numa ida e volta de cerca de 1 ms na mesma zona. Em modo cluster, as chaves se espalham pelos fragmentos, e a carga cresce somando nós.","contra":"O DynamoDB com escrita condicional funciona, mas cada verificação vira uma escrita cobrada e com mais latência; a 400 mil verificações por segundo, é caro. Guardar só em memória em cada servidor é rápido e grátis, mas cada um dos 50 servidores daria o limite inteiro: o cliente ganharia 50 vezes o que pagou.","muda":"Com poucos servidores e limites folgados, divida o limite pelo número de instâncias e limite só em memória; erra um pouco, custa zero."},{"q":"E se o Valkey cair?","e":"Falhar aberto, com um limitador local de emergência por instância.","por":"O limitador existe para proteger a API; se ele derrubar a API quando cair, virou o problema. Com timeout de poucos milissegundos, o middleware passa a decidir com um balde local por instância, com um limite conservador (o limite do cliente dividido pelo número de instâncias). A API fica no ar, com precisão menor por alguns minutos.","contra":"Falhar fechado (negar tudo) é a escolha só para operações em que estourar o limite causa dano real, como envio de SMS pago ou tentativas de senha.","muda":"Limites de segurança (login, recuperação de senha, SMS): falhe fechado."},{"q":"Como reduzir as idas ao Valkey em tráfego altíssimo?","e":"Lotes de fichas: cada instância pega 50 fichas de uma vez e gasta localmente.","por":"Um cliente com 10 mil requisições por minuto em 50 instâncias faria 10 mil idas ao Valkey por minuto. Se cada instância reserva fichas em lote e só volta quando acabam, as idas caem para centenas, ao custo de algumas fichas paradas numa instância enquanto outra nega. O erro fica limitado ao tamanho do lote.","contra":"Ir ao Valkey em toda requisição é exato e simples, e é o certo até a conta ou a latência incomodarem.","muda":"Clientes pequenos: sem lote. Clientes enormes: lote proporcional ao limite."},{"q":"Limitar taxa basta?","e":"Não: também limite requisições simultâneas por cliente e descarte carga por prioridade quando o sistema satura.","por":"Cem requisições por minuto de um relatório que leva 30 segundos são 50 em andamento ao mesmo tempo, prendendo conexões do banco. Um limite de concorrência por cliente (quantas em andamento) protege recursos lentos. E quando o sistema inteiro está saturado, descartar primeiro o tráfego menos importante (relatórios antes de check-in no treino) mantém o essencial no ar: é o que o Stripe descreve com os quatro tipos de limitador.","contra":"Só limite de taxa deixa passar o cliente que faz poucas requisições muito caras ao mesmo tempo.","muda":"APIs só de leituras rápidas e uniformes podem viver só com limite de taxa."},{"q":"Um limite global com várias regiões?","e":"Orçamento por região: o limite do cliente dividido entre as regiões, rebalanceado de tempos em tempos.","por":"Sincronizar um contador entre regiões a cada requisição soma dezenas de milissegundos. Dividindo o limite (70% na região principal do cliente, 30% na outra) e ajustando a cada minuto pelo uso real, cada região decide sozinha e o erro global fica pequeno.","contra":"Um contador global exato custa latência entre regiões em toda requisição; ninguém precisa disso para limite de API.","muda":"Se o cliente usa uma região só, todo o orçamento vai para ela."},{"q":"O que responder quando nega?","e":"429 com Retry-After e os cabeçalhos de limite (total, restante, quando renova).","por":"Um cliente que sabe quando tentar de novo espera em vez de martelar. Os cabeçalhos também deixam o cliente bem comportado desacelerar antes de bater no limite.","contra":"503 ou erro genérico faz o SDK do cliente tentar de novo na hora e piora a carga.","muda":"Nunca; e documente nos SDKs o backoff com jitter."}],"dados":"Duas chaves por regra e cliente no Valkey (saldo e último instante), com TTL igual ao tempo de encher o balde; limites por plano numa tabela do DynamoDB, em cache no serviço.","tabelas":[["rl:{cliente}:{regra} (Valkey)","hash com fichas e instante","script Lua por requisição"],["planos_limites (DynamoDB)","plano + regra","lidos na partida e a cada minuto"]],"falhas":[["O Valkey fica lento","Timeout de 5 ms e limitador local; alarme pelo uso do modo de emergência."],["Um cliente enorme concentra a carga numa chave","A chave fica num fragmento só; divida em sub-baldes (cliente#0 a #7) e some no limite."],["Relógios diferentes entre servidores","Use o tempo do próprio Valkey (TIME) dentro do script, não o do servidor."],["Um parceiro com bug manda 50 mil req/s","O WAF e o API Gateway seguram antes da aplicação; o limitador próprio nem chega a ver a maior parte."]],"custo":"O ElastiCache é pequeno (poucos GB, carga de CPU moderada), e o custo vem da vazão de comandos. O WAF cobra por regra e por milhão de requisições inspecionadas, e o API Gateway por requisição. O limitador próprio quase sempre custa menos que a computação que ele economiza ao barrar abuso.","evolucao":[["v1","Planos de uso do API Gateway e regras por IP no WAF."],["v2","Limitador próprio no Valkey para endpoints caros e custos por operação."],["v3","Limite de concorrência e descarte por prioridade."],["v4","Lotes de fichas e orçamento por região."]],"perguntas":["Mostre com números por que a janela fixa deixa passar o dobro na virada.","Por que o limitador deve falhar aberto na API e fechado no login?","O que o limite de concorrência protege que o de taxa não protege?","Por que guardar o estado em memória em cada servidor dá ao cliente 50 vezes o limite?"],"pratica":{"t":"Balde de fichas em Lua e Go","passos":["Script Lua de balde de fichas com custo por requisição e uso do TIME do Valkey.","Middleware em Go com timeout de 5 ms e queda para limitador local.","Teste com vegeta ou k6: 3 instâncias, limite de 100 por minuto, e meça quantas passam com e sem o Valkey."],"pronto":["Com o Valkey, passam entre 100 e 105 por minuto","Sem o Valkey, a API continua respondendo e o limite fica perto do conservador"]},"caps":[14,15,12],"livros":[["Burns",6,"Serviços replicados com balanceamento de carga","https://www.oreilly.com/library/view/projetando-sistemas-distribuidos/9798341637856/ch06.html","serviços replicados atrás de balanceador","Projetando Sistemas Distribuídos, 2ª ed.","burns"],["Burns",16,"Padrões de falha comuns","https://www.oreilly.com/library/view/projetando-sistemas-distribuidos/9798341637856/ch16.html","padrões de falha: sobrecarga e cascata","Projetando Sistemas Distribuídos, 2ª ed.","burns"]],"links":[["Stripe: Scaling your API with rate limiters","https://stripe.com/blog/rate-limiters"],["API Gateway: throttling de REST APIs","https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-request-throttling.html"],["Amazon Builders' Library: Workload iso
