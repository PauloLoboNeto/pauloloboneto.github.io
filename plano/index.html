eu livro\".","passos":["Escreva 15 perguntas: simples, de vários saltos, ambíguas e fora do livro.","Associe cada uma à variante que melhor a trata e diga por quê.","Desenhe a máquina de estados de um pipeline adaptativo com correção: classificar, buscar, avaliar, buscar de novo ou recusar.","Estime chamadas ao modelo e latência de cada caminho."],"meca":"A tabela de perguntas, a máquina de estados e o custo por caminho.","pronto":["Toda pergunta fora do livro termina em recusa ou em outra fonte, nunca em invenção","Cada caminho tem custo estimado"]},"fase":1},{"id":"RAG-5","t":"RAG com estrutura, e RAG contra contexto longo","q":"E quando a resposta depende do corpus inteiro, de relações entre as partes, ou nem precisa de busca?","prod":"Perguntas globais (\"quais os temas do livro?\") quebram o RAG por trechos; janelas longas e cache mudam a conta de quando buscar.","conceitos":"GraphRAG: entidades, comunidades, resumos e busca local ou global; LightRAG; RAPTOR e a árvore de resumos; RAG sobre dados estruturados (texto para SQL); contexto longo contra RAG; Cache-Augmented Generation; context rot.","leituras":[["graphrag:0","graphrag","Essential GraphRAG (Manning)","https://www.oreilly.com/search/?q=Essential%20GraphRAG","o livro é curto: leia as partes sobre grafos de conhecimento, o GraphRAG da Microsoft e o RAG agêntico","Bratanič e Hane · Essential GraphRAG (Manning), pela busca da O'Reilly","O'Reilly · Essential GraphRAG (Manning)",false],["huyen-ai:6:rag-alem-do-texto","huyen-ai","RAG e agentes","https://www.oreilly.com/library/view/engenharia-de-ia/9798341637870/ch06.html","a parte de RAG além do texto: dados tabulares, texto para SQL e multimodal","Chip Huyen, cap. 6 · RAG e agentes, a parte de RAG além do texto","O'Reilly · Engenharia de IA",true],["artigo:2404-16130","artigo","From Local to Global: A Graph RAG Approach to Query-Focused Summarization, o GraphRAG (Edge et al., 2024)","https://arxiv.org/abs/2404.16130","comunidades e respostas globais","From Local to Global: A Graph RAG Approach to Query-Focused Summarization, o GraphRAG (Edge et al., 2024)","Artigo · arXiv 2404.16130",false],["artigo:2401-18059","artigo","RAPTOR: Recursive Abstractive Processing for Tree-Organized Retrieval (Sarthi et al., 2024)","https://arxiv.org/abs/2401.18059","resumos em árvore para perguntas de vários níveis","RAPTOR: Recursive Abstractive Processing for Tree-Organized Retrieval (Sarthi et al., 2024)","Artigo · arXiv 2401.18059",false],["artigo:2410-05779","artigo","LightRAG: Simple and Fast Retrieval-Augmented Generation (Guo et al., 2024)","https://arxiv.org/abs/2410.05779","grafo mais leve e atualização incremental","LightRAG: Simple and Fast Retrieval-Augmented Generation (Guo et al., 2024)","Artigo · arXiv 2410.05779",false],["artigo:2407-16833","artigo","Retrieval Augmented Generation or Long-Context LLMs? A Comprehensive Study and Hybrid Approach (Li et al., 2024)","https://arxiv.org/abs/2407.16833","quando a janela longa ganha, e o roteamento entre os dois","Retrieval Augmented Generation or Long-Context LLMs? A Comprehensive Study and Hybrid Approach (Li et al., 2024)","Artigo · arXiv 2407.16833",false],["artigo:2412-15605","artigo","Don't Do RAG: When Cache-Augmented Generation is All You Need for Knowledge Tasks (Chan et al., 2024)","https://arxiv.org/abs/2412.15605","pré-carregar o conhecimento no cache","Don't Do RAG: When Cache-Augmented Generation is All You Need for Knowledge Tasks (Chan et al., 2024)","Artigo · arXiv 2412.15605",false]],"perguntas":["Por que o RAG por trechos não responde \"quais temas atravessam o livro inteiro?\"","Qual a diferença entre a busca local e a global no GraphRAG?","Quando o contexto longo dispensa o RAG, e quando ele sai mais caro e pior?","O que o CAG pressupõe sobre o tamanho e a mudança do conhecimento?"],"pratica":{"tipo":"exercicio","t":"A matriz de decisão","contexto":"Os seus documentos de estudo e o app.","passos":["Escreva três perguntas globais sobre o livro e explique por que o RAG por trechos erra cada uma.","Mostre como o GraphRAG e o RAPTOR responderiam a uma delas.","Monte a matriz: tamanho do corpus, frequência de mudança e tipo de pergunta, levando a RAG, GraphRAG, RAPTOR, CAG ou contexto longo.","Classifique três usos do app com a matriz: dúvidas sobre o livro, a base de 300 mil alimentos e o histórico de treinos do aluno."],"meca":"A matriz e as três classificações.","pronto":["Cada célula da matriz tem um porquê","As três classificações estão justificadas"]},"fase":1},{"id":"EVAL-1","t":"Avaliar sistemas com LLM","q":"Como saber, com evidência, que o sistema está bom e que uma mudança não piorou nada?","prod":"Sem avaliação, trocar modelo, prompt ou chunking é aposta. Com ela, vira teste que roda no CI e alerta que dispara em produção.","conceitos":"Análise de erros antes de métrica; avaliação com e sem referência; métrica exata contra juiz; LLM como juiz e seus vieses (posição, tamanho, autopreferência); concordância com humano; avaliação offline e online; desenvolvimento guiado por avaliação; teste de regressão.","leituras":[["huyen-ai:3","huyen-ai","Metodologia de avaliação","https://www.oreilly.com/library/view/engenharia-de-ia/9798341637870/ch03.html","a metodologia: o que dá e o que não dá para medir","Chip Huyen, cap. 3 · Metodologia de avaliação","O'Reilly · Engenharia de IA",true],["huyen-ai:4","huyen-ai","Avaliação de sistemas de IA","https://www.oreilly.com/library/view/engenharia-de-ia/9798341637870/ch04.html","critérios, escolha de métricas e o pipeline de avaliação","Chip Huyen, cap. 4 · Avaliação de sistemas de IA","O'Reilly · Engenharia de IA",true],["berryman:10","berryman","Evaluating LLM Applications","https://www.oreilly.com/library/view/prompt-engineering-for/9781098156145/ch10.html","avaliação offline e online de aplicações com LLM","Berryman e Ziegler, cap. 10 · Evaluating LLM Applications","O'Reilly · Prompt Engineering for LLMs",false],["artigo:2306-05685","artigo","Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena (Zheng et al., 2023)","https://arxiv.org/abs/2306.05685","os vieses do juiz e como mitigá-los","Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena (Zheng et al., 2023)","Artigo · arXiv 2306.05685",false],["post:hamel-evals","post","Hamel Husain: Your AI Product Needs Evals","https://hamel.dev/blog/posts/evals/","o processo: traces, análise de erros e níveis de teste","Hamel Husain: Your AI Product Needs Evals","Texto de engenharia",false],["post:yan-judges","post","Eugene Yan: Evaluating the Effectiveness of LLM-Evaluators","https://eugeneyan.com/writing/llm-evaluators/","o que a pesquisa diz sobre juízes","Eugene Yan: Evaluating the Effectiveness of LLM-Evaluators","Texto de engenharia",false]],"perguntas":["Por que começar pela leitura dos erros e não pela escolha da métrica?","Quais vieses um LLM juiz tem, e como cada um é mitigado?","Como você valida que o juiz concorda com você?","O que entra num teste de regressão de prompt, e o que faz ele falhar?"],"pratica":{"tipo":"exercicio","t":"O plano de avaliação","contexto":"O \"Pergunte ao seu livro\" desenhado no RAG-3.","passos":["Imagine 20 respostas ruins e agrupe as falhas numa taxonomia.","Para cada falha, escolha a medida: exata, por regra ou por juiz.","Escreva a rubrica do juiz como aprovado ou reprovado, com a crítica, e o plano para medir a concordância com os seus rótulos.","Defina o que roda a cada mudança, o que roda toda noite e o que se observa em produção."],"meca":"O plano de avaliação, em uma ou duas páginas.","pronto":["Toda falha da taxonomia tem uma medida","O juiz tem rubrica e plano de validação"]},"fase":1},{"id":"EVAL-2","t":"Avaliar RAG e avaliar agentes","q":"Como separar o erro da busca do erro da geração, e avaliar um agente que dá vários passos?","prod":"Medir só a resposta final esconde onde está o defeito; em agente, um acerto em uma tentativa não diz se ele acerta sempre.","conceitos":"Métricas de recuperação (recall@k, precisão@k, MRR, nDCG); RAGAS: fidelidade, relevância da resposta, precisão e recall de contexto; ARES; avaliação de agente pelo resultado ou pela trajetória; acerto de ferramenta e de argumentos; pass^k; simulação de usuário; custo e número de passos.","leituras":[["albada:9","albada","Validation and Measurement","https://www.oreilly.com/library/view/building-applications-with/9781098176495/ch09.html","validação e medição de sistemas agênticos","Michael Albada, cap. 9 · Validation and Measurement","O'Reilly · Building Applications with AI Agents",false],["llmops:7","llmops","Avaliação de LLMs","https://www.oreilly.com/library/view/llmops/9798341663817/ch07.html","avaliação na operação","Abi Aryan, cap. 7 · Avaliação de LLMs","O'Reilly · LLMOps (edição em português)",true],["artigo:2309-15217","artigo","RAGAS: Automated Evaluation of Retrieval Augmented Generation (Es et al., 2023)","https://arxiv.org/abs/2309.15217","as métricas e como cada uma é calculada","RAGAS: Automated Evaluation of Retrieval Augmented Generation (Es et al., 2023)","Artigo · arXiv 2309.15217",false],["artigo:2311-09476","artigo","ARES: An Automated Evaluation Framework for RAG Systems (Saad-Falcon et al., 2023)","https://arxiv.org/abs/2311.09476","juízes treinados e intervalos de confiança","ARES: An Automated Evaluation Framework for RAG Systems (Saad-Falcon et al., 2023)","Artigo · arXiv 2311.09476",false],["artigo:2406-12045","artigo","τ-bench: A Benchmark for Tool-Agent-User Interaction in Real-World Domains (Yao et al., 2024)","https://arxiv.org/abs/2406.12045","usuário simulado, regras de negócio e pass^k","τ-bench: A Benchmark for Tool-Agent-User Interaction in Real-World Domains (Yao et al., 2024)","Artigo · arXiv 2406.12045",false],["artigo:2308-03688","artigo","AgentBench: Evaluating LLMs as Agents (Liu et al., 2023)","https://arxiv.org/abs/2308.03688","onde os agentes falham","AgentBench: Evaluating LLMs as Agents (Liu et al., 2023)","Artigo · arXiv 2308.03688",false]],"perguntas":["Qual a diferença entre fidelidade e relevância da resposta?","Como o recall de contexto separa erro de busca de erro de geração?","O que o pass^k mede que o pass@1 esconde?","Quando avaliar a trajetória do agente, e quando só o resultado basta?"],"pratica":{"tipo":"exercicio","t":"Uma métrica para cada falha","contexto":"O RAG e um agente com ferramentas.","passos":["Liste oito falhas: busca que não acha, contexto certo com resposta errada, citação inventada, ferramenta errada, argumento errado, laço infinito, desistência cedo e acerto com custo dez vezes maior.","Para cada uma, escolha a métrica que a pega e onde medir: no componente ou de ponta a ponta.","Defina uma tarefa de agente e calcule, com números inventados, o pass@1 e o pass^4.","Escreva por que o pass@1 alto pode enganar."],"meca":"A tabela de falhas e métricas, e o exemplo de pass^k.","pronto":["Cada falha tem métrica e lugar de medição","Você explica o pass^k sem consultar"]},"fase":1},{"id":"TOOL-1","t":"Tool use: como o modelo usa ferramentas","q":"O que acontece quando um modelo \"chama\" uma ferramenta, e o que torna uma ferramenta fácil de usar para um agente?","prod":"O modelo não executa nada: ele escreve uma intenção estruturada, e o seu código executa. Ferramenta mal descrita ou com resposta inchada derruba a precisão e enche o contexto.","conceitos":"Function calling e saída estruturada; JSON Schema; quem executa e quem decide; Toolformer; ReAct; interface agente-computador; nomes, descrições, granularidade, respostas enxutas e erros que orientam; muitas ferramentas e recuperação de ferramentas; MCP e A2A como protocolos; menor privilégio.","leituras":[["albada:4","albada","Tool Use","https://www.oreilly.com/library/view/building-applications-with/9781098176495/ch04.html","tool use em sistemas de agentes","Michael Albada, cap. 4 · Tool Use","O'Reilly · Building Applications with AI Agents",false],["pai:10","pai","Interface dos LLMs com ferramentas externas","https://www.oreilly.com/library/view/concebe-grandes-aplicacoes/9798341637887/ch10.html","ligar o modelo a ferramentas externas","Suhas Pai, cap. 10 · Interface dos LLMs com ferramentas externas","O'Reilly · Concebe grandes aplicações de modelos de linguagem (Designing Large Language Model Applications)",true],["post:tools-for-agents","post","Anthropic: Writing effective tools for agents","https://www.anthropic.com/engineering/writing-tools-for-agents","como desenhar, descrever e avaliar ferramentas","Anthropic: Writing effective tools for agents","Texto de engenharia",false],["artigo:2302-04761","artigo","Toolformer: Language Models Can Teach Themselves to Use Tools (Schick et al., 2023)","https://arxiv.org/abs/2302.04761","aprender quando chamar uma ferramenta","Toolformer: Language Models Can Teach Themselves to Use Tools (Schick et al., 2023)","Artigo · arXiv 2302.04761",false],["artigo:2210-03629","artigo","ReAct: Synergizing Reasoning and Acting in Language Models (Yao et al., 2022)","https://arxiv.org/abs/2210.03629","pensar e agir intercalados","ReAct: Synergizing Reasoning and Acting in Language Models (Yao et al., 2022)","Artigo · arXiv 2210.03629",false],["artigo:2405-15793","artigo","SWE-agent: Agent-Computer Interfaces Enable Automated Software Engineering (Yang et al., 2024)","https://arxiv.org/abs/2405.15793","a interface agente-computador","SWE-agent: Agent-Computer Interfaces Enable Automated Software Engineering (Yang et al., 2024)","Artigo · arXiv 2405.15793",false],["artigo:2305-15334","artigo","Gorilla: Large Language Model Connected with Massive APIs (Patil et al., 2023)","https://arxiv.org/abs/2305.15334","muitas APIs e recuperação de ferramentas","Gorilla: Large Language Model Connected with Massive APIs (Patil et al., 2023)","Artigo · arXiv 2305.15334",false]],"perguntas":["Quem executa a ferramenta, e o que o modelo de fato produz?","Por que uma ferramenta grossa costuma funcionar melhor que várias finas?","O que uma boa mensagem de erro de ferramenta precisa dizer ao agente?","O que fazer quando o agente tem 80 ferramentas disponíveis?"],"pratica":{"tipo":"exercicio","t":"Redesenhar as ferramentas","contexto":"Um agente de estudo, só no papel, que trabalha sobre o livro Fundamentos que não mudam, a especificação e o seu plano de leitura.","passos":["Liste 12 ferramentas finas e ingênuas (listar capítulos, buscar capítulo por id, buscar trecho, marcar leitura como feita e outras).","Reduza para no máximo cinco ferramentas grossas, com nome, descrição e esquema de entrada.","Para cada uma, defina o que a resposta devolve e o que deixa de fora para poupar contexto, e as mensagens de erro.","Compare quatro organizações (lista plana, uma ferramenta grande, ferramentas por etapa e roteador em duas etapas) e escolha uma."],"meca":"As cinco definições de ferramenta e a comparação.","pronto":["Toda ferramenta tem descrição que um estranho entenderia","Cada erro diz ao agente o que fazer em seguida"]},"fase":1},{"id":"WF-1","t":"Workflows agênticos","q":"Quando um fluxo fixo resolve, e quando vale dar autonomia ao modelo?","prod":"Fluxo fixo é previsível, barato e testável; agente é flexível e caro. A maior parte dos casos de produção pede o fluxo, com autonomia só onde ela paga.","conceitos":"Workflow contra agente; encadeamento de prompts; roteamento; paralelização por seções e por votação; orquestrador e trabalhadores; avaliador e otimizador; humano no laço e pontos de aprovação; execução durável, checkpoints e passos idempotentes.","leituras":[["berryman:9","berryman","LLM Workflows","https://www.oreilly.com/library/view/prompt-engineering-for/9781098156145/ch09.html","workflows com LLM","Berryman e Ziegler, cap. 9 · LLM Workflows","O'Reilly · Prompt Engineering for LLMs",false],["albada:5","albada","Orchestration","https://www.oreilly.com/library/view/building-applications-with/9781098176495/ch05.html","orquestração","Michael Albada, cap. 5 · Orchestration","O'Reilly · Building Applications with AI Agents",false],["pai:13","pai","Padrões de conceção e arquitetura de sistemas","https://www.oreilly.com/library/view/concebe-grandes-aplicacoes/9798341637887/ch13.html","padrões de conceção e arquitetura de sistemas","Suhas Pai, cap. 13 · Padrões de conceção e arquitetura de sistemas","O'Reilly · Concebe grandes aplicações de modelos de linguagem (Designing Large Language Model Applications)",true],["post:effective-agents","post","Anthropic: Building effective agents","https://www.anthropic.com/engineering/building-effective-agents","os cinco padrões de workflow e quando usar agentes","Anthropic: Building effective agents","Texto de engenharia",false]],"perguntas":["Qual a diferença entre um workflow e um agente?","Quando usar orquestrador e trabalhadores em vez de paralelização simples?","Onde fica o humano no laço num fluxo que mexe em dinheiro ou saúde?","Por que cada passo de um fluxo longo precisa ser idempotente?"],"pratica":{"tipo":"exercicio","t":"O padrão certo para cada fluxo","contexto":"Funcionalidades possíveis do app.","passos":["Pegue seis fluxos: resumo semanal do treino, triagem da mensagem do aluno, plano alimentar com revisão do nutricionista, dúvida respondida pelo livro, migração de cinco anos de histórico e revisão do seu próprio capítulo.","Escolha o padrão de cada um e desenhe.","Marque onde um humano aprova, quais passos são idempotentes e onde há checkpoint.","Diga quais deles não precisam de LLM nenhum."],"meca":"Seis diagramas pequenos com as marcações.","pronto":["Cada escolha tem o porquê","Pelo menos um fluxo ficou sem agente, e você explica por quê"]},"fase":1},{"id":"AG-1","t":"Arquiteturas de agentes: raciocínio e planejamento","q":"Como um agente decide o próximo passo, e o que muda entre pensar antes, durante e depois de agir?","prod":"A arquitetura define o número de chamadas, a latência, o custo e como o agente erra. Escolher entre ReAct e planejar antes é uma decisão de produção.","conceitos":"O laço do agente: perceber, raciocinar, agir e observar; cadeia de pensamento; ReAct; planejar e executar; ia mal desenhada repete erros ou vaza dados entre usuários; multiagente multiplica tokens e cria decisões conflitantes. As duas escolhas pedem critério, não moda.","conceitos":"Memória de trabalho, episódica, semântica e procedural (CoALA); recuperação e reflexão sobre memórias; memória hierárquica, como num sistema operacional; supervisor, hierarquia, handoffs e debate; isolamento de contexto como vantagem; custo em tokens e coordenação; o argumento contra multiagentes.","leituras":[["albada:6","albada","Knowledge and Memory","https://www.oreilly.com/library/view/building-applications-with/9781098176495/ch06.html","conhecimento e memória","Michael Albada, cap. 6 · Knowledge and Memory","O'Reilly · Building Applications with AI Agents",false],["albada:8","albada","From One Agent to Many","https://www.oreilly.com/library/view/building-applications-with/9781098176495/ch08.html","de um agente para muitos","Michael Albada, cap. 8 · From One Agent to Many","O'Reilly · Building Applications with AI Agents",false],["artigo:2309-02427","artigo","Cognitive Architectures for Language Agents, o CoALA (Sumers et al., 2023)","https://arxiv.org/abs/2309.02427","o vocabulário de memória e ação","Cognitive Architectures for Language Agents, o CoALA (Sumers et al., 2023)","Artigo · arXiv 2309.02427",false],["artigo:2304-03442","artigo","Generative Agents: Interactive Simulacra of Human Behavior (Park et al., 2023)","https://arxiv.org/abs/2304.03442","memória, reflexão e recuperação","Generative Agents: Interactive Simulacra of Human Behavior (Park et al., 2023)","Artigo · arXiv 2304.03442",false],["artigo:2310-08560","artigo","MemGPT: Towards LLMs as Operating Systems (Packer et al., 2023)","https://arxiv.org/abs/2310.08560","memória em camadas","MemGPT: Towards LLMs as Operating Systems (Packer et al., 2023)","Artigo · arXiv 2310.08560",false],["artigo:2308-08155","artigo","AutoGen: Enabling Next-Gen LLM Applications via Multi-Agent Conversation (Wu et al., 2023)","https://arxiv.org/abs/2308.08155","agentes que conversam","AutoGen: Enabling Next-Gen LLM Applications via Multi-Agent Conversation (Wu et al., 2023)","Artigo · arXiv 2308.08155",false],["post:multi-agent-research","post","Anthropic: How we built our multi-agent research system","https://www.anthropic.com/engineering/multi-agent-research-system","orquestrador, subagentes em paralelo e o custo","Anthropic: How we built our multi-agent research system","Texto de engenharia",false],["post:dont-build-multi-agents","post","Cognition: Don't Build Multi-Agents","https://cognition.ai/blog/dont-build-multi-agents","o contraponto: contexto compartilhado e decisões conflitantes","Cognition: Don't Build Multi-Agents","Texto de engenharia",false]],"perguntas":["Dê um exemplo de memória episódica, semântica e procedural num agente do app.","Por que memória precisa de escopo por usuário, e o que acontece sem isso?","Em que tipo de tarefa vários agentes ganham de um só?","Qual o argumento da Cognition contra multiagentes, e quando ele vale?"],"pratica":{"tipo":"exercicio","t":"Um agente ou vários?","contexto":"Um assistente do aluno para dúvidas de treino, dieta e agenda.","passos":["Desenhe a versão com um agente só e memória.","Desenhe a versão com um supervisor e três especialistas.","Escreva o que cada um lembra (episódico, semântico, procedural), onde guarda e por quanto tempo.","Defenda as duas versões, uma com o texto da Anthropic e a outra com o da Cognition, e decida com critérios."],"meca":"Dois diagramas, a tabela de memória e a decisão.","pronto":["A memória tem escopo e prazo definidos","A decisão usa critérios, não preferência"]},"fase":1},{"id":"CTX-1","t":"Engenharia de contexto","q":"Com uma janela finita e uma atenção que piora com o tamanho, o que entra no contexto a cada passo?","prod":"Em agente de muitos passos, o contexto cresce até derrubar a qualidade e estourar o custo. Engenharia de contexto é decidir, a cada passo, o que entra, o que sai e o que fica guardado fora.","conceitos":"Contexto como recurso finito; context rot e lost in the middle; as partes do contexto (instruções, ferramentas, exemplos, histórico, resultados de ferramenta, memória e documentos); buscar na hora contra pré-carregar; compactação e resumo; anotações estruturadas fora da janela; subagentes para isolar contexto; prefixo estável e cache; limpar resultados antigos de ferramenta.","leituras":[["berryman:6","berryman","Assembling the Prompt","https://www.oreilly.com/library/view/prompt-engineering-for/9781098156145/ch06.html","montar o prompt: o que entra e em que ordem","Berryman e Ziegler, cap. 6 · Assembling the Prompt","O'Reilly · Prompt Engineering for LLMs",false],["berryman:5","berryman","Prompt Content","https://www.oreilly.com/library/view/prompt-engineering-for/9781098156145/ch05.html","o conteúdo do prompt","Berryman e Ziegler, cap. 5 · Prompt Content","O'Reilly · Prompt Engineering for LLMs",false],["huyen-ai:5","huyen-ai","Engenharia imediata (engenharia de prompt)","https://www.oreilly.com/library/view/engenharia-de-ia/9798341637870/ch05.html","a parte sobre contexto e instruções do sistema","Chip Huyen, cap. 5 · Engenharia imediata (engenharia de prompt)","O'Reilly · Engenharia de IA",true],["post:context-engineering","post","Anthropic: Effective context engineering for AI agents","https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","as técnicas para tarefas longas","Anthropic: Effective context engineering for AI agents","Texto de engenharia",false],["post:manus-context","post","Manus: Context Engineering for AI Agents: Lessons from Building Manus","https://manus.im/blog/Context-Engineering-for-AI-Agents-Lessons-from-Building-Manus","cache, sistema de arquivos como memória e manter os erros no contexto","Manus: Context Engineering for AI Agents: Lessons from Building Manus","Texto de engenharia",false],["post:context-rot","post","Chroma: Context Rot","https://www.trychroma.com/research/context-rot","como o desempenho cai com a entrada maior","Chroma: Context Rot","Texto de engenharia",false],["artigo:2307-03172","artigo","Lost in the Middle: How Language Models Use Long Contexts (Liu et al., 2023)","https://arxiv.org/abs/2307.03172","revisite com o olhar de agente","Lost in the Middle: How Language Models Use Long Contexts (Liu et al., 2023)","Artigo · arXiv 2307.03172",false]],"perguntas":["O que é context rot, e por que uma janela maior não resolve?","Quando buscar na hora é melhor do que pré-carregar?","O que muda no custo quando o prefixo do contexto fica estável?","Como um subagente ajuda a manter o contexto do agente principal limpo?"],"pratica":{"tipo":"exercicio","t":"O orçamento de tokens de um agente longo","contexto":"Um agente que trabalha 100 passos.","passos":["Desenhe o contexto nos passos 1, 30 e 90: o que fica, o que foi compactado, o que foi para as anotações e o que é buscado na hora.","Some os tokens de cada passo, com e sem compactação.","Estime o efeito no custo de manter o prefixo estável para o cache.","Escreva cinco regras de contexto para o agente."],"meca":"Os três desenhos, a soma de tokens e as cinco regras.","pronto":["O contexto do passo 90 cabe no orçamento que você definiu","Cada regra tem a fonte que a sustenta"]},"fase":1},{"id":"PROJ-1","t":"Projeto integrador, no papel","q":"Como juntar RAG, ferramentas, contexto, workflow e avaliação num sistema que dá para operar?","prod":"É o documento que você levaria a uma revisão de arquitetura antes de escrever uma linha de código.","conceitos":"Todos os anteriores, mais custo, latência, segurança, monitoramento e melhoria contínua.","leituras":[["huyen-ai:10","huyen-ai","Arquitetura de engenharia de IA e feedback do usuário","https://www.oreilly.com/library/view/engenharia-de-ia/9798341637870/ch10.html","arquitetura de uma aplicação de IA e o ciclo de feedback","Chip Huyen, cap. 10 · Arquitetura de engenharia de IA e feedback do usuário","O'Reilly · Engenharia de IA",true],["albada:10","albada","Mon thon-for-data/9781098104023/ch07.html","dados faltantes, duplicados e transformação","Wes McKinney, cap. 7 · Data Cleaning and Preparation","O'Reilly · Python for Data Analysis, 3rd Edition",false],["mckinney:10","mckinney","Data Aggregation and Group Operations","https://www.oreilly.com/library/view/python-for-data/9781098104023/ch10.html","groupby e agregações","Wes McKinney, cap. 10 · Data Aggregation and Group Operations","O'Reilly · Python for Data Analysis, 3rd Edition",false]],"extra":[["Dados do Open Food Facts","https://world.openfoodfacts.org/data"]],"pratica":{"t":"A base de alimentos por dentro","contexto":"Os alimentos vendidos no Brasil, da base aberta do Open Food Facts.","passos":["Carregue uma amostra dos produtos vendidos no Brasil e limpe faltantes e valores impossíveis.","Explore a proteína por 100 kcal por categoria, com outliers e correlações.","Calcule por bootstrap o intervalo de confiança da proteína média de duas categorias.","Faça um teste de permutação entre elas e escreva o que dá e o que não dá para concluir.","Planeje um teste A/B do horário do lembrete do café: tamanho da amostra para detectar 5 pontos de diferença."],"meca":"Intervalos, valor-p e o tamanho de amostra necessário.","pronto":["As conclusões vêm com intervalo e valor-p","Você escreve uma frase sobre o que a correlação não prova"]},"fase":2},{"id":"IA-3","t":"Machine learning de ponta a ponta","q":"Como saber se um modelo aprendeu algo, e não decorou?","prod":"Vazamento de dados e conjunto de teste reutilizado são as causas mais comuns de modelo que brilha no notebook e falha em produção.","conceitos":"Aprendizado supervisionado, divisão treino/validação/teste, validação cruzada, regressão linear e logística, métricas de classificação, overfitting, viés e variância, vazamento.","leituras":[["geron:1","geron","The Machine Learning Landscape","https://www.oreilly.com/library/view/hands-on-machine-learning/9798341607972/ch01.html","o mapa: tipos de aprendizado e os principai   var PITCH = {"grupos":[{"id":"msg","t":"Estrutura da mensagem","q":"A base para qualquer público: como organizar o que você vai dizer."},{"id":"exec","t":"Executivos","q":"A pergunta deles: o que você quer que eu decida?"},{"id":"eng","t":"Times de engenharia","q":"A pergunta deles: como funciona e por que assim?"},{"id":"palco","t":"Palestras técnicas","q":"A pergunta deles: por que eu deveria me importar?"}],"fw":[{"id":"minto","g":"msg","s":"PIR","n":"Pirâmide de Minto","x":"Pyramid Principle","o":"Barbara Minto, McKinsey, anos 1970","q":"Comece pela conclusão e organize os argumentos em níveis: cada ideia resume as que estão embaixo dela.","quando":"Qualquer comunicação em que quem ouve tem pouco tempo e precisa entender ou decidir rápido: e-mail para a diretoria, memo, primeiro slide, resposta a uma pergunta difícil. É a base de quase tudo nesta aba.","nao":"Quando o público resiste à conclusão e precisa ser conduzido até ela (use a Sequência de Monroe) ou numa palestra em que a descoberta faz parte da graça.","estrutura":["Topo: a resposta ou recomendação, numa frase.","Segundo nível: de 3 a 5 argumentos que sustentam o topo, agrupados de forma MECE.","Base: dados, fatos e análises que provam cada argumento.","Regra vertical: cada nível responde ao \"por quê?\" ou \"como?\" que o nível de cima provoca.","Regra horizontal: ideias do mesmo nível são do mesmo tipo e seguem uma ordem lógica (tempo, estrutura ou importância)."],"aplicar":["Escreva a pergunta que o público tem na cabeça (\"devemos trocar Java por Go nos BFFs?\").","Escreva a resposta em uma frase, com o verbo da decisão.","Liste tudo o que sustenta a resposta e agrupe em 3 a 5 blocos que não se sobrepõem.","Dê a cada bloco um título que seja uma afirmação, não um tema: \"Go reduz o custo de memória por pod\", e não \"Memória\".","Coloque a evidência de cada bloco embaixo dele e corte o que não sustenta nada.","Leia só o topo e os títulos: se a história fecha, a pirâmide está pronta."],"ex":"Pergunta: devemos adotar Go nos BFFs? Topo: \"Recomendo Go para os novos BFFs a partir do próximo trimestre; os atuais ficam em Java até a próxima reescrita.\" Argumentos: custo (menos memória por pod reduz a conta do cluster), operação (startup rápido melhora o autoscaling no pico) e risco controlado (piloto em um BFF de pouco tráfego, com rollback simples). Embaixo de cada um, o número medido no benchmark.","armadilhas":["Topo que é tema, não mensagem: \"Status do projeto\" não é conclusão.","Argumentos que se sobrepõem: o executivo percebe a repetição e desconfia do resto.","Guardar a recomendação para o fim por medo de rejeição: o executivo interrompe antes de chegar lá."],"combina":["scqa","mece","ghost","bluf"],"refs":[["Livro: The Pyramid Principle, Barbara Minto",""]]},{"id":"scqa","g":"msg","s":"SCQA","n":"SCQA e SCR","x":"Situação, Complicação, Questão, Resposta","o":"Barbara Minto (a introdução da pirâmide); SCR é a variante usada por consultorias","q":"Uma introdução em quatro tempos que dá o contexto mínimo para a resposta fazer sentido.","quando":"A abertura de qualquer apresentação ou documento para executivos: o primeiro parágrafo de um memo, o primeiro slide, o começo de um RFC.","nao":"Quando o público já conhece bem a situação: comece direto pela resposta (BLUF) e use a situação só se perguntarem.","estrutura":["S, Situação: o que é verdade e todos concordam (não é notícia).","C, Complicação: o que mudou ou ameaça a situação; é o motivo da reunião.","Q, Questão: a pergunta que a complicação levanta (muitas vezes fica implícita).","R, Resposta: a sua recomendação, que vira o topo da pirâmide.","SCR: a mesma ideia sem a questão explícita (Situação, Complicação, Resolução)."],"aplicar":["Escreva a situação em uma ou duas frases que ninguém na sala contestaria.","Escreva a complicação com um fato ou número concreto.","Formule a pergunta exatamente como o decisor a faria.","Responda em uma frase; se precisar de duas, a decisão ainda não está clara.","Leia em voz alta: em 30 segundos o ouvinte deve saber o que você quer."],"ex":"S: os BFFs rodam em Java no EKS e atendem bem o tráfego de hoje. C: na última campanha, o autoscaling demorou [x] minutos para reagir e o custo do cluster subiu [y]% no pico. Q: como atender o próximo pico sem dobrar o custo? R: migrar os BFFs de maior tráfego para Go, começando por um piloto em dezembro.","armadilhas":["Situação longa demais: vira aula de história e a atenção acaba antes da complicação.","Complicação vaga (\"temos desafios de escala\"): sem fato, não há urgência.","Resposta que não responde à questão que você mesmo formulou."],"combina":["minto","bluf","memo"],"refs":[["Livro: The Pyramid Principle, Barbara Minto (parte sobre introduções)",""]]},{"id":"mece","g":"msg","s":"MECE","n":"MECE e árvore de problemas","x":"Mutuamente Exclusivo, Coletivamente Exaustivo","o":"McKinsey; formalizado por Barbara Minto","q":"Uma regra para quebrar um problema em partes que não se sobrepõem e que, juntas, cobrem tudo.","quando":"Para montar os argumentos da pirâmide, diagnosticar uma causa (custo, latência, incidentes) e organizar opções. A árvore de problemas (issue tree) é o MECE aplicado em vários níveis.","nao":"Não é roteiro de apresentação, é a disciplina de organização por trás dele. Em temas abertos (cultura, inovação) não force a exaustividade: use \"outros\" com honestidade.","estrutura":["Mutuamente exclusivo: cada item cabe em uma única caixa.","Coletivamente exaustivo: nenhuma causa ou opção possível fica de fora.","Formas de cortar: por fórmula (custo = volume × custo unitário), por processo (etapas em sequência), por estrutura (camadas, componentes) ou por opostos (interno e externo, novo e existente).","Árvore de problemas: a pergunta no topo e ramos MECE embaixo, até chegar a hipóteses que um dado confirma ou derruba."],"aplicar":["Escreva a pergunta-raiz (\"por que o custo de infra subiu 40%?\").","Escolha um corte que garanta a exaustividade, de preferência uma fórmula.","Em cada ramo, desça um nível até virar algo mensurável.","Teste: algum item cabe em dois ramos? Existe causa que não cabe em nenhum?","Transforme as folhas em hipóteses e diga qual dado prova cada uma.","Na apresentação, mostre só os ramos que importam e diga com qual dado os outros foram descartados."],"ex":"O custo de infra subiu 40%. Corte por fórmula: custo = volume × eficiência × preço. Volume: chegaram mais requisições? (métricas do load balancer). Eficiência: cada requisição gasta mais CPU ou memória? (custo por mil requisições). Preço: o provedor mudou a tabela ou acabou um desconto? (fatura). Cada suspeita, como logs verbosos, pods superdimensionados ou retenção do Kafka, cai em exatamente um ramo.","armadilhas":["Listas que parecem MECE mas misturam níveis (\"banco de dados\", \"lentidão\", \"Kafka\").","Ramos sem dado que os prove: viram opinião.","Mostrar a árvore inteira para o executivo: leve a conclusão e os ramos relevantes."],"combina":["minto","wsn","memo"],"refs":[["Livro: The Pyramid Principle, Barbara Minto",""]]},{"id":"bluf","g":"msg","s":"BLUF","n":"BLUF","x":"Bottom Line Up Front","o":"Comunicação militar dos EUA, adotada em e-mails e memos corporativos","q":"A conclusão e o pedido vão na primeira linha; o resto é contexto para quem quiser.","quando":"E-mails, mensagens no chat, atualizações de status, escalonamentos e respostas a executivos que leem no celular entre uma reunião e outra.","nao":"Notícias delicadas sobre pessoas (feedback, desligamento) e públicos que precisam ser conduzidos até uma conclusão que contraria o que esperam.","estrutura":["Linha 1: a conclusão ou o pedido, com prazo (\"Preciso da sua aprovação até sexta para…\").","Linhas 2 a 4: o mínimo de contexto para decidir (impacto, custo, risco).","Depois: detalhes, anexos e links para quem quiser aprofundar."],"aplicar":["Escreva a mensagem como sairia naturalmente.","Ache a frase que diz o que você quer; em geral ela está no final.","Mova essa frase para o topo e reescreva com verbo de ação e prazo.","Corte do resto tudo o que não muda a decisão.","Use a mesma frase no assunto do e-mail."],"ex":"Assunto: Aprovação até sexta para o piloto de Go no BFF de simulação. Corpo: \"Preciso do seu ok até sexta para rodar um piloto de Go no BFF de simulação em dezembro. Custo: duas semanas de um engenheiro. Risco: baixo, com rollback em minutos. O benchmark está no link abaixo.\"","armadilhas":["Começar com \"Oi, tudo bem? Seguinte…\" e três parágrafos de contexto.","Pedido sem prazo ou sem dono.","Confundir BLUF com ser seco: dá para ser direto e cordial."],"combina":["scqa","prep","wsn"],"refs":[]},{"id":"prep","g":"msg","s":"PREP","n":"PREP","x":"Point, Reason, Example, Point","o":"Técnica clássica de oratória e de treinamento em comunicação","q":"Uma resposta curta em quatro movimentos: ponto, razão, exemplo e o ponto de novo.","quando":"Responder a uma pergunta de executivo em 30 a 60 segundos, intervir numa reunião, responder no Q&A de uma palestra, entrevistas.","nao":"Explicações que precisam de vários argumentos (use a pirâmide) ou decisões com trade-offs (use o memo de opções).","estrutura":["P, Ponto: a sua posição em uma frase.","R, Razão: o principal porquê.","E, Exemplo: um caso, um número ou uma evidência concreta.","P, Ponto: repita a posição, de preferência com o próximo passo."],"aplicar":["Antes de abrir a boca, decida a frase do ponto.","Escolha uma razão só, a mais forte.","Tenha 2 ou 3 exemplos prontos para os temas que você defende com frequência.","Feche repetindo o ponto: é ele que fica na memória."],"ex":"Pergunta do diretor: \"Go não vai dificultar a contratação?\" P: \"Não deve ser um problema.\" R: \"A linguagem é pequena, e quem programa em Java fica produtivo rápido.\" E: \"No piloto, dois devs sem experiência em Go colocaram o primeiro endpoint em produção em [n] semanas.\" P: \"Então dá para formar o time com quem já temos.\"","armadilhas":["Dar três razões fracas em vez de uma forte.","Esquecer o segundo P e terminar no exemplo, deixando a conclusão no ar."],"combina":["bluf","star"],"refs":[]},{"id":"wsn","g":"msg","s":"WSN","n":"What? So what? Now what?","x":"O quê? E daí? E agora?","o":"Terry Borton (1970), popularizado por Rolfe, Freshwater e Jasper (2001); adotado em relatórios de status","q":"Três perguntas que transformam dado em decisão: o fato, o que ele significa e o que fazer.","quando":"Status reports, revisão de métricas, atualização semanal para o gestor, resumo de incidente, retrospectiva.","nao":"Propostas novas que precisam de argumentação (use a pirâmide): o WSN serve para reportar e reagir.","estrutura":["What: o fato ou o dado, sem interpretação.","So what: por que isso importa (impacto no cliente, no prazo, no custo ou no risco).","Now what: a ação, com dono e data, ou a decisão de que você precisa."],"aplicar":["Para cada métrica ou evento, escreva uma linha para cada pergunta.","Se o \"so what\" for \"nada\", tire o item do relatório.","Junte os \"now what\" no final, como lista de decisões e próximos passos."],"ex":"What: o p99 do BFF de contratação subiu de [x] ms para [y] ms desde a última release. So what: estamos acima do SLO e a conversão no último passo caiu [z]%. Now what: rollback do componente novo hoje; investigação da causa com dono e prazo até quinta.","armadilhas":["Relatório só com \"what\": o gestor tem de fazer a análise sozinho.","\"Now what\" sem dono e sem data."],"combina":["bluf","mece"],"refs":[]},{"id":"star","g":"msg","s":"STAR","n":"STAR","x":"Situação, Tarefa, Ação, Resultado","o":"Entrevistas comportamentais; muito usado em avaliações de desempenho e postmortems","q":"Contar um caso real de forma completa e verificável, em quatro partes.","quando":"Entrevistas (comportamental e de system design), casos de impacto para promoção e avaliação, postmortems curtos, cases dentro de palestras.","nao":"Recomendações para o futuro: o STAR conta o que já aconteceu.","estrutura":["S, Situação: o contexto mínimo (onde, quando, qual era o problema).","T, Tarefa: qual era a sua responsabilidade ou meta.","A, Ação: o que você fez, em primeira pessoa e com as decisões explícitas.","R, Resultado: o efeito medido e o que você aprendeu."],"aplicar":["Reserve metade do tempo para a Ação: é nela que o ouvinte avalia você.","Use \"eu\" para as suas decisões e \"nós\" para o trabalho do time, sem inflar.","Feche com um número no Resultado e uma lição.","Tenha de 5 a 8 histórias prontas cobrindo liderança, conflito, falha, decisão técnica e impacto."],"ex":"S: o processamento diário de créditos pré-aprovados estourava a janela da madrugada. T: eu precisava garantir que terminasse antes das 6h. A: medi cada etapa, achei o gargalo na escrita e troquei inserts linha a linha por carga em lote com particionamento. R: a janela caiu de [x] h para [y] h, e a solução virou padrão para os outros pipelines.","armadilhas":["Situação longa e Ação curta.","Resultado sem número ou sem lição.","Contar o que o time fez sem dizer qual foi a sua decisão."],"combina":["prep","talk"],"refs":[]},{"id":"ghost","g":"msg","s":"DECK","n":"Ghost deck e títulos-ação","x":"Ghost deck / action titles","o":"Prática de consultorias estratégicas (McKinsey, BCG, Bain)","q":"Escreva só os títulos dos slides, cada um como uma frase-conclusão, e valide a história antes de fazer qualquer gráfico.","quando":"Antes de montar qualquer apresentação com mais de 5 slides, principalmente para executivos; também para revisar o deck de outra pessoa.","nao":"Palestras de palco no estilo Lessig ou Takahashi, em que o slide tem uma palavra e a frase está na sua fala.","estrutura":["Cada slide tem um título-ação: uma frase completa com a conclusão, em até duas linhas.","O corpo do slide só prova o título (gráfico, tabela, diagrama).","Lidos em sequência, os títulos contam a história inteira.","Slide fantasma: só o título e um rascunho do que vai prová-lo, antes de produzir qualquer coisa."],"aplicar":["Abra um documento, não o editor de slides, e escreva os títulos em lista.","Leia os títulos em voz alta: se a história não fecha, reordene ou corte.","Mostre a lista a alguém do público-alvo e pergunte o que falta.","Só então desenhe o corpo de cada slide, um por vez.","Na revisão final, cubra o corpo de cada slide: o título sozinho ainda se sustenta?"],"ex":"Títulos-tema: \"Contexto\", \"Arquitetura atual\", \"Benchmark\", \"Próximos passos\". Títulos-ação: \"Os BFFs consomem [x]% do custo do cluster\", \"O gargalo é a memória por pod, não a CPU\", \"Em Go o mesmo BFF usa [y]% menos memória no benchmark\", \"Um piloto de duas semanas confirma o ganho com risco baixo\".","armadilhas":["Títulos que são temas (\"Resultados\").","Corpo que prova outra coisa que não o título.","Pular o ghost deck e se apegar aos gráficos que já estão prontos."],"combina":["minto","ae"],"refs":[]},{"id":"memo","g":"exec","s":"MEMO","n":"Memo de decisão com opções","x":"Decision memo / options paper","o":"Prática de governo e consultoria; a versão com três opções é a mais usada","q":"Uma página com o problema, 2 ou 3 opções reais comparadas pelos mesmos critérios e uma recomendação.","quando":"Sempre que você precisa de uma decisão de alguém com mais poder: orçamento, prioridade, troca de tecnologia, aceitar um risco.","nao":"Quando só existe uma opção viável (aí é comunicado, não decisão) ou quando a decisão é do próprio time (use um ADR).","estrutura":["A decisão pedida e o prazo (BLUF).","O contexto em SCQA, curto.","Os critérios de comparação, combinados com o decisor: custo, prazo, risco, impacto no cliente, reversibilidade.","De 2 a 3 opções, incluindo \"não fazer nada\", com prós, contras e custo de cada uma.","A recomendação e o porquê.","Os riscos da recomendação, como serão mitigados e o que acontece se a decisão atrasar."],"aplicar":["Valide os critérios com o decisor antes de comparar: metade das discussões é sobre critérios.","Inclua sempre \"não fazer nada\", com o custo real de não agir.","Monte uma tabela opção × critério, com número sempre que existir.","Diga se a decisão é reversível: decisões reversíveis pedem menos análise.","Envie antes da reunião e use a reunião para decidir, não para ler."],"ex":"Decisão: a linguagem dos novos BFFs. Opção A, manter Java: custo zero de mudança, mas o custo do cluster continua. Opção B, Java com virtual threads e imagem nativa: ganho parcial, ferramental novo. Opção C, Go nos novos BFFs: o maior ganho medido, com curva de aprendizado. Recomendação: C com piloto, porque é reversível no nível de um BFF e tem o maior ganho de memória.","armadilhas":["Opções de palha (duas ruins e a sua): o executivo percebe e perde a confiança.","Critérios diferentes para cada opção.","Esconder o custo de não fazer nada."],"combina":["scqa","bluf","adr","mece"],"refs":[]},{"id":"sixpager","g":"exec","s":"6P","n":"Narrativa de seis páginas","x":"Six-pager (Amazon)","o":"Amazon; Jeff Bezos trocou slides por memos nas reuniões da liderança em 2004","q":"Um documento em prosa de até seis páginas, lido em silêncio no início da reunião e só então discutido.","quando":"Decisões de estratégia ou investimento, planejamento anual, propostas de arquitetura com muitos trade-offs: quando os argumentos precisam de um encadeamento que bullets não mostram.","nao":"Atualizações rápidas e públicos que não vão ler. Também não funciona se a reunião não reserva tempo de leitura.","estrutura":["Introdução: o propósito do documento e a pergunta.","Objetivos e princípios (tenets) que guiam a decisão.","O estado atual e o que aprendemos, com dados.","A proposta e as alternativas consideradas.","Riscos, custos, plano e o que vamos medir.","Apêndices com dados e FAQ (não contam nas seis páginas)."],"aplicar":["Escreva frases completas, sem bullets, com números no lugar de adjetivos.","Peça a alguém de fora que leia e marque onde ficou com dúvida.","Reserve de 15 a 20 minutos de leitura silenciosa no começo da reunião.","Na discussão, siga a ordem das dúvidas, não a do documento."],"ex":"Para propor uma arquitetura de referência de BFFs: tenets como \"o BFF não guarda estado de negócio\" e \"toda chamada externa tem timeout e circuit breaker\"; o estado atual com o inventário de BFFs e os incidentes; a proposta, com o C4 nível 2 no apêndice; as alternativas descartadas; e o plano de adoção por ondas.","armadilhas":["Slides disfarçados de texto (bullets com ponto final).","Seis páginas que poderiam ser duas: o limite é teto, não meta.","Discutir sem tempo de leitura, com ninguém tendo lido."],"combina":["prfaq","rfc","memo"],"refs":[["Livro: Working Backwards, Colin Bryar e Bill Carr",""]]},{"id":"prfaq","g":"exec","s":"PR","n":"PR-FAQ (Working Backwards)","x":"Press release + perguntas frequentes","o":"Amazon, processo Working Backwards","q":"Escreva o comunicado de lançamento antes de construir e responda às perguntas difíceis num FAQ.","quando":"Produtos novos, plataformas internas e capacidades que precisam de patrocínio, quando a pergunta do executivo é \"por que o cliente se importaria?\".","nao":"Mudanças puramente técnicas, sem efeito visível para um cliente interno ou externo: use memo ou RFC.","estrutura":["Título e subtítulo: o que é e para quem.","Resumo: o benefício em uma frase.","Problema: a dor do cliente hoje.","Solução: como o produto resolve a dor.","Citações ilustrativas de alguém da empresa e de um cliente.","Como começar a usar.","FAQ externo (perguntas do cliente) e FAQ interno (custo, riscos, dependências, métricas)."],"aplicar":["Escreva o press release em até uma página, na linguagem do cliente, sem jargão.","Liste as 10 perguntas que você menos gostaria de ouvir e responda no FAQ interno.","Se o press release não empolga, o problema está no produto, não no texto.","Revise com o time até o FAQ responder às objeções reais."],"ex":"Plataforma interna: \"Times de produto publicam um BFF novo em um dia, já com observabilidade, segurança e deploy.\" O cliente são os times de engenharia. FAQ interno: quem mantém o template? Quanto custa por mês? O que acontece com os BFFs que já existem?","armadilhas":["Press release cheio de tecnologia (\"agora com Kubernetes\") em vez de benefício.","FAQ interno só com perguntas fáceis."],"combina":["sixpager","psb"],"refs":[["Livro: Working Backwards, Colin Bryar e Bill Carr",""]]},{"id":"wardley","g":"exec","s":"MAP","n":"Mapas de Wardley","x":"Wardley Maps","o":"Simon Wardley, 2005","q":"Um mapa da cadeia de valor em que cada componente aparece na sua fase de evolução, do gênesis à commodity, para discutir estratégia.","quando":"Construir ou comprar, o que terceirizar, onde investir em diferencial, plataformas internas, mostrar por que algo deve virar serviço gerenciado.","nao":"Decisões táticas de curto prazo, ou quando o público não tem tempo de aprender a ler o mapa: leve a conclusão e deixe o mapa no apêndice.","estrutura":["Âncora no topo: o usuário e a necessidade dele.","Eixo vertical, a cadeia de valor: o que o usuário vê em cima, a infraestrutura embaixo.","Eixo horizontal, a evolução: gênesis, customizado, produto e commodity.","Movimento: setas mostram para onde cada componente está evoluindo.","Jogadas: o que fazer em cada fase (construir no gênesis, comprar na commodity)."],"aplicar":["Escreva o usuário e a necessidade.","Liste os componentes que atendem à necessidade e ligue as dependências.","Posicione cada componente na evolução junto com o time: a discussão é o valor.","Marque o que você constrói hoje e o mercado já vende como commodity: é candidato a comprar.","Marque o que é diferencial e ainda está no customizado: é onde investir.","Apresente uma decisão por mapa."],"ex":"Fitness Evolutivo. Usuário: quem treina; necessidade: registrar o treino rápido. Componentes: app, motor de progressão, catálogo de exercícios, autenticação, banco, filas, nuvem. Autenticação e filas já são commodity: usar serviço gerenciado. O motor de progressão é o diferencial e está no customizado: construir em Go.","armadilhas":["Usar o mapa como diagrama de arquitetura: ele não mostra deploy nem fluxo.","Posicionar sozinho: o mapa vale pela conversa.","Levar o mapa para uma reunião de 15 minutos sem conclusão."],"combina":["memo","c4","teamtop"],"refs":[["Learn Wardley Mapping","https://learnwardleymapping.com"]]},{"id":"psb","g":"exec","s":"PSB","n":"Problema, Solução, Benefício","x":"Problem–Solution–Benefit","o":"Estrutura clássica de comunicação persuasiva e de vendas","q":"Três blocos: a dor, como resolvê-la e o que o público ganha.","quando":"Pitch curto para um patrocinador, propostas de melhoria, defesa de uma ferramenta ou prática para outro time.","nao":"Decisões com alternativas reais (use o memo de opções): o PSB esconde as alternativas.","estrutura":["Problema: a dor nos termos do público, com número.","Solução: o que você propõe, em uma ou duas frases.","Benefício: o ganho para quem ouve, não para você nem para a tecnologia."],"aplicar":["Escreva o problema do jeito que o público o descreveria.","Descreva a solução sem jargão que o público não usa.","Traduza cada característica técnica em benefício (use FAB).","Feche com o pedido: o que você precisa para começar."],"ex":"Problema: cada BFF novo leva [n] semanas até estar pronto para produção. Solução: um template com observabilidade, segurança e pipeline prontos. Benefício: o time coloca o primeiro endpoint em produção na primeira semana.","armadilhas":["Benefício que é característica (\"é em Go\").","Problema que só quem apresenta sente."],"combina":["fab","monroe","prfaq"],"refs":[]},{"id":"fab","g":"exec","s":"FAB","n":"FAB","x":"Feature, Advantage, Benefit","o":"Técnica de vendas consultivas","q":"Traduz cada característica técnica em vantagem e depois em benefício para quem ouve.","quando":"Explicar escolhas técnicas para executivos, produto ou negócio; escrever a seção \"por quê\" de uma proposta.","nao":"Conversas entre engenheiros, em que a característica já é o argumento.","estrutura":["Feature: o que a solução tem ou faz.","Advantage: o que isso permite em relação ao que existe.","Benefit: o ganho concreto para o público (tempo, dinheiro, risco, cliente)."],"aplicar":["Liste as características que você ia citar.","Para cada uma, pergunte \"e daí?\" até chegar a algo que o público mede.","Na apresentação, fale o benefício primeiro e use a característica como prova."],"ex":"Feature: o binário Go sobe em milissegundos. Advantage: o autoscaling põe pods novos no ar quase na hora do pico. Benefit: menos erro para o cliente no pico e menos pods ociosos pagos fora dele.","armadilhas":["Parar na vantagem (\"escala melhor\") sem chegar ao que o público mede."],"combina":["psb","memo"],"refs":[]},{"id":"monroe","g":"exec","s":"MMS","n":"Sequência Motivada de Monroe","x":"Monroe's Motivated Sequence","o":"Alan H. Monroe, Purdue University, anos 1930","q":"Cinco passos para persuadir: atenção, necessidade, satisfação, visualização e ação.","quando":"Convencer um público cético ou que não pediu a mudança: adoção de uma prática, de uma plataforma nova, de um processo diferente.","nao":"Executivos que pediram uma recomendação: para eles, a resposta vem primeiro (pirâmide).","estrutura":["Atenção: um fato, um caso ou uma pergunta que prende.","Necessidade: o problema e quem ele afeta.","Satisfação: a solução e como ela atende à necessidade.","Visualização: como fica o futuro com a solução (e sem ela).","Ação: o que você pede, concreto e imediato."],"aplicar":["Abra com um incidente real ou um número que o público reconhece.","Mostre a necessidade com dados do próprio público.","Na visualização, descreva um dia de trabalho depois da mudança.","Termine com um pedido pequeno e fácil de aceitar."],"ex":"Atenção: \"No último incidente de madrugada, levamos [x] minutos para descobrir qual BFF estava lento.\" Necessidade: [n] incidentes no trimestre com o mesmo padrão. Satisfação: tracing distribuído padronizado em todos os BFFs. Visualização: o plantonista abre um trace e vê o serviço lento em um minuto. Ação: \"Topam adotar o template de observabilidade nos dois BFFs de vocês este mês?\"","armadilhas":["Pular a necessidade e ir direto para a solução.","Ação vaga (\"pensem nisso\")."],"combina":["psb","sparkline"],"refs":[]},{"id":"c4","g":"eng","s":"C4","n":"Modelo C4","x":"Context, Containers, Components, Code","o":"Simon Brown, criado entre 2006 e 2011","q":"Diagramas em quatro níveis de zoom, como um mapa: do sistema no mundo até o código.","quando":"Apresentar ou documentar uma arquitetura para qualquer público técnico. O nível 1 também funciona para executivos e produto.","nao":"Não mostra comportamento no tempo (use um diagrama de sequência ou dinâmico) nem decisões (use ADR).","estrutura":["Nível 1, Contexto: o sistema como uma caixa, as pessoas que o usam e os sistemas externos.","Nível 2, Containers: as aplicações e bancos que rodam separadamente (BFF, API, fila, banco) e como conversam.","Nível 3, Componentes: os blocos principais dentro de um container.","Nível 4, Código: classes e tabelas; quase sempre gerado pela IDE ou dispensado.","Diagramas de apoio: paisagem de sistemas, dinâmico e de deploy."],"aplicar":["Para executivos e produto, mostre só o nível 1.","Para engenharia, o nível 2 é o que mais rende; o 3 só para o container em discussão.","Toda caixa tem nome, tipo e responsabilidade em uma linha; toda seta tem verbo e protocolo (\"consulta o saldo via HTTPS/JSON\").","Inclua legenda e um título que diga o escopo.","Mantenha os diagramas como código (Structurizr DSL, C4-PlantUML ou Mermaid), no repositório."],"ex":"Fitness Evolutivo, nível 2: o aluno usa o app Next.js (SSR), que chama a API Go (\"registra a série\", HTTPS/JSON); a API grava no PostgreSQL e publica \"treino finalizado\" numa fila, consumida pelo worker Go de recordes.","armadilhas":["Misturar níveis no mesmo diagrama.","Setas sem rótulo.","Caixas com o nome da tecnologia e sem responsabilidade (\"Lambda\")."],"combina":["arc42","adr","rfc"],"refs":[["c4model.com","https://c4model.com"],["Richards e Ford · Cap. 23 · diagramação da arquitetura","https://www.oreilly.com/library/view/fundamentos-da-arquitetura/9798341637955/ch23.html"]]},{"id":"arc42","g":"eng","s":"A42","n":"arc42","x":"Template de documentação de arquitetura","o":"Gernot Starke e Peter Hruschka, 2005","q":"Um template de 12 seções para documentar uma arquitetura, dos objetivos aos riscos.","quando":"Documentar um sistema novo ou existente, padronizar a documentação entre times, preparar uma revisão de arquitetura.","nao":"Como roteiro de apresentação oral: o arc42 é a referência de onde você tira os slides, não os slides.","estrutura":["1 Introdução e objetivos · 2 Restrições · 3 Contexto e escopo","4 Estratégia da solução · 5 Visão de blocos · 6 Visão de execução","7 Visão de implantação · 8 Conceitos transversais · 9 Decisões de arquitetura","10 Requisitos de qualidade · 11 Riscos e dívida técnica · 12 Glossário"],"aplicar":["Preencha primeiro as seções 1, 3, 4 e 11: elas já dão a maior parte do valor.","Use o C4 nas seções 3, 5 e 7.","Na seção 9, aponte para os ADRs em vez de repeti-los.","Seção que não se aplica fica com \"não se aplica\": o template é cardápio, não obrigação."],"ex":"Revisão de uma API de crédito nova: objetivos de qualidade (p99, disponibilidade), restrições (regulatórias, stack aprovada), contexto em C4 nível 1, decisões com link para os ADRs e a lista de riscos que a revisão precisa discutir.","armadilhas":["Preencher tudo antes de qualquer conversa.","Documento que ninguém atualiza: amarre a manutenção às mudanças (o PR de arquitetura atualiza o arc42)."],"combina":["c4","adr","atam"],"refs":[["arc42.org","https://arc42.org"]]},{"id":"v41","g":"eng","s":"4+1","n":"Modelo 4+1 de Kruchten","x":"4+1 View Model","o":"Philippe Kruchten, 1995 (IEEE Software)","q":"Quatro visões da mesma arquitetura, cada uma para um tipo de interessado, amarradas por cenários.","quando":"Entender e ensinar a ideia de visões; sistemas grandes com interessados muito diferentes; contextos que exigem documentação formal.","nao":"Times que precisam de algo leve: o C4 cobre o mesmo terreno com menos cerimônia.","estrutura":["Lógica: funcionalidades e abstrações (para quem usa e analisa).","Desenvolvimento: módulos, pacotes e camadas (para quem programa).","Processo: concorrência, distribuição e desempenho (para quem integra).","Física: onde cada coisa roda (para quem opera).","+1, Cenários: casos de uso que atravessam as quatro visões e as validam."],"aplicar":["Escolha 2 ou 3 cenários críticos.","Para cada visão, pergunte qual interessado precisa dela.","Passe cada cenário pelas visões e veja se todas respondem."],"ex":"Cenário \"o aluno finaliza o treino offline\": na visão lógica, o agregado Treino; na de desenvolvimento, o módulo de sincronização; na de processo, a fila e a idempotência; na física, o service worker no celular e o worker Go na nuvem.","armadilhas":["Produzir as cinco visões por obrigação, sem um interessado para cada uma."],"combina":["iso42010","c4"],"refs":[["Artigo: Architectural Blueprints, The \"4+1\" View Model of Software Architecture (Kruchten, 1995)",""]]},{"id":"iso42010","g":"eng","s":"ISO","n":"ISO/IEC/IEEE 42010","x":"Descrição de arquitetura","o":"Norma internacional de 2011, sucessora da IEEE 1471; revisada em 2022","q":"A norma que formaliza o vocabulário: interessados, preocupações, pontos de vista e visões.","quando":"Ambientes regulados ou que exigem conformidade; para entender a teoria por trás de C4, 4+1 e arc42.","nao":"O dia a dia de um time de produto: use a ideia, não a cerimônia.","estrutura":["Stakeholders: quem tem interesse no sistema.","Concerns: o que cada um quer saber (custo, segurança, desempenho).","Viewpoint: a convenção usada para responder a um conjunto de preocupações (ex.: C4 nível 2).","View: o artefato concreto que segue o viewpoint para este sistema.","Rastreabilidade: cada preocupação é respondida por pelo menos uma visão."],"aplicar":["Antes de desenhar, liste os interessados e as preocupações de cada um.","Escolha uma visão para cada grupo de preocupações.","Na apresentação, abra dizendo qual preocupação o diagrama responde."],"ex":"Revisão de uma solução: segurança quer saber por onde trafega o dado pessoal (visão de fluxo de dados); operações quer saber onde roda e como escala (visão de deploy); produto quer saber o que muda para o cliente (contexto).","armadilhas":["Confundir viewpoint (a convenção) com view (o diagrama)."],"combina":["v41","arc42"],"refs":[]},{"id":"adr","g":"eng","s":"ADR","n":"ADR","x":"Architecture Decision Record","o":"Michael Nygard, 2011","q":"Um arquivo curto por decisão de arquitetura (contexto, decisão e consequências), versionado junto com o código.","quando":"Toda decisão difícil de reverter ou sobre a qual alguém vai perguntar \"por que fizemos assim?\" daqui a um ano: banco, padrão de integração, linguagem, estratégia de consistência.","nao":"Decisões triviais ou fáceis de reverter: o custo do registro tem de valer a pena.","estrutura":["Título numerado, no imperativo (\"ADR-012: Usar outbox para publicar eventos\").","Status: proposto, aceito, rejeitado ou substituído pelo ADR-NNN.","Contexto: as forças em jogo, inclusive as não técnicas.","Decisão: \"Vamos…\", na voz ativa.","Consequências: o que fica mais fácil e o que fica mais difícil.","Opcional (variante MADR): as opções consideradas e por que foram descartadas."],"aplicar":["Guarde em docs/adr/ no repositório, um arquivo Markdown por decisão.","Escreva no momento da decisão, não depois.","Nunca edite um ADR aceito: crie outro que o substitua.","Em revisões de solução, peça os ADRs das decisões mais caras de reverter.","Numa apresentação para engenheiros, um slide por ADR: contexto, decisão, consequência."],"ex":"ADR-007: Publicar \"treino finalizado\" via outbox. Contexto: o recorde era comemorado duas vezes e, às vezes, nunca. Decisão: gravar o evento na mesma transação do treino e publicá-lo com um relay. Consequências: entrega ao menos uma vez, consumidores precisam ser idempotentes e há uma tabela a mais para limpar.","armadilhas":["ADR escrito meses depois, reconstruindo a história.","Consequências só positivas.","ADR para tudo, que ninguém lê."],"combina":["rfc","c4","memo"],"refs":[["adr.github.io","https://adr.github.io"],["Richards e Ford · Cap. 21 · Decisões de arquitetura","https://www.oreilly.com/library/view/fundamentos-da-arquitetura/9798341637955/ch21.html"]]},{"id":"rfc","g":"eng","s":"RFC","n":"RFC e design doc","x":"Request for Comments / documento de design","o":"Inspirado nas RFCs da IETF; popularizado em empresas como Google e Uber","q":"Um documento que propõe uma mudança antes de construí-la e recolhe comentários de quem será afetado.","quando":"Mudanças que afetam vários times ou custam caro: serviço novo, migração, mudança de contrato, padrão transversal. É onde nasce o ADR.","nao":"Decisões locais de um time pequeno: uma conversa e um ADR bastam.","estrutura":["Resumo: o quê e por quê, em um parágrafo.","Contexto e problema, com dados.","Objetivos e não-objetivos (o que fica de fora de propósito).","Proposta: design, C4, contratos, dados, migração.","Alternativas consideradas.","Riscos, segurança, observabilidade e custo.","Plano de rollout e de rollback.","Perguntas em aberto."],"aplicar":["Escreva os não-objetivos: eles evitam metade das discussões.","Defina revisores obrigatórios e um prazo para comentários.","Responda aos comentários no documento, não em conversas paralelas.","Feche com a decisão registrada (vira ADR) e mude o status do RFC."],"ex":"RFC \"Template padrão de BFF em Go\". Objetivo: um BFF novo em produção em uma semana. Não-objetivo: migrar os BFFs existentes. Proposta: estrutura de pastas, middlewares de timeout e tracing, pipeline. Alternativa: Java com virtual threads. Rollout: dois times piloto.","armadilhas":["RFC de fato consumado: os comentários não mudam nada e o processo perde crédito.","Sem prazo para comentários, o RFC nunca fecha."],"combina":["adr","c4","sixpager"],"refs":[]},{"id":"atam","g":"eng","s":"ATAM","n":"ATAM","x":"Architecture Tradeoff Analysis Method","o":"Software Engineering Institute (SEI), Carnegie Mellon, 2000","q":"Um método de avaliação que parte dos atributos de qualidade e encontra os riscos, os pontos de sensibilidade e os trade-offs da arquitetura.","quando":"Revisões formais de arquiteturas críticas; numa versão leve, as sessões de revisão de solução.","nao":"Projeto pequeno ou fase muito inicial: o ATAM completo leva dias e envolve muita gente.","estrutura":["1 Apresentar o método.","2 Apresentar os direcionadores de negócio.","3 Apresentar a arquitetura.","4 Identificar as abordagens arquiteturais.","5 Montar a árvore de utilidade: atributos de qualidade e cenários priorizados (importância × dificuldade).","6 Analisar as abordagens contra os cenários.","7 Levantar e priorizar cenários com os interessados.","8 Analisar de novo com os cenários priorizados.","9 Apresentar os resultados: riscos, não-riscos, pontos de sensibilidade e trade-offs."],"aplicar":["Versão leve: peça ao time de 3 a 5 cenários de qualidade concretos (\"no pico de 10×, o p99 fica abaixo de 300 ms\").","Para cada cenário, pergunte qual decisão da arquitetura responde a ele.","Classifique o que encontrar: risco, ponto de sensibilidade (uma decisão afeta um atributo) ou trade-off (afeta dois em sentidos opostos).","Feche com a lista de riscos, com dono e prazo."],"ex":"Cenário: \"se o bureau de crédito ficar lento por dois minutos, a contratação continua para quem já tem análise\". Decisão analisada: chamada síncrona, sem cache. Resultado: risco alto; ponto de sensibilidade no timeout; trade-off entre o frescor da análise e a disponibilidade.","armadilhas":["Cenários vagos (\"o sistema deve ser rápido\").","Virar auditoria em vez de conversa: o time precisa sair melhor do que entrou."],"combina":["risk","wellarch","arc42"],"refs":[["Richards e Ford · Cap. 22 · Analisar o risco da arquitetura","https://www.oreilly.com/library/view/fundamentos-da-arquitetura/9798341637955/ch22.html"]]},{"id":"risk","g":"eng","s":"RISK","n":"Risk-storming","x":"Avaliação colaborativa de riscos","o":"Simon Brown","q":"Uma sessão visual em que cada pessoa marca sozinha os riscos sobre um diagrama C4 e depois o grupo converge.","quando":"Revisões de solução rápidas (de 60 a 90 minutos), antes de um go-live, ao herdar um sistema.","nao":"Quando ainda não existe diagrama: faça o C4 primeiro.","estrutura":["Desenhe a arquitetura (o C4 nível 2 é o ideal).","Identificação individual, em silêncio: cada pessoa marca riscos com post-its.","Convergência: junte os post-its iguais sobre o diagrama.","Classificação: probabilidade × impacto (baixo, médio, alto).","Mitigação: para os riscos altos, ação, dono e prazo."],"aplicar":["Use uma matriz 3 × 3 de probabilidade × impacto, com uma cor por nível.","Dê 10 minutos de silêncio na identificação: isso evita que a pessoa mais sênior ancore o grupo.","Sugira categorias: desempenho, segurança, custo, operação, dados e dependências.","Registre o resultado como lista de riscos no arc42 (seção 11)."],"ex":"Sobre o C4 nível 2 da API nova, três pessoas marcam o mesmo risco no cache distribuído (dado velho depois de uma mudança de taxa) e duas marcam a dependência de um bureau externo sem timeout. Os dois viram alto × alto, com dono e prazo.","armadilhas":["Discutir durante a identificação: o grupo perde a independência.","Sair sem dono para os riscos altos."],"combina":["c4","atam","arc42"],"refs":[["riskstorming.com","https://riskstorming.com"],["Richards e Ford · Cap. 22 · Analisar o risco da arquitetura","https://www.oreilly.com/library/view/fundamentos-da-arquitetura/9798341637955/ch22.html"]]},{"id":"wellarch","g":"eng","s":"WA","n":"AWS Well-Architected","x":"Os seis pilares","o":"Amazon Web Services, 2015; o pilar de sustentabilidade entrou em 2021","q":"Um conjunto de pilares e perguntas para revisar uma carga de trabalho na nuvem.","quando":"Revisão de soluções na AWS, checklist antes de produção, conversa com o time de nuvem. Os pilares também organizam bem uma apresentação de riscos.","nao":"No lugar da conversa de negócio: os pilares dizem como, não por quê.","estrutura":["Excelência operacional","Segurança","Confiabilidade","Eficiência de desempenho","Otimização de custos","Sustentabilidade"],"aplicar":["Use os pilares como sumário da revisão, um bloco por pilar.","Em cada pilar, escolha as 2 ou 3 perguntas mais relevantes para a carga.","Classifique os achados em risco alto ou médio, como na ferramenta oficial.","Feche com um plano de melhoria priorizado."],"ex":"Revisão do pipeline diário de créditos: confiabilidade (reprocessamento e DLQ), custo (instâncias spot no lote), segurança (criptografia dos arquivos e menor privilégio no IAM) e operação (alarme quando a janela estoura).","armadilhas":["Checklist mecânico, sem prioridade.","Revisar uma vez e nunca mais."],"combina":["atam","risk"],"refs":[["AWS Well-Architected","https://aws.amazon.com/architecture/well-architected/"]]},{"id":"eventstorming","g":"eng","s":"ES","n":"EventStorming","x":"Modelagem colaborativa do domínio","o":"Alberto Brandolini, 2013","q":"Um workshop com post-its em que negócio e engenharia descobrem o domínio a partir dos eventos que acontecem nele.","quando":"Início de projeto, domínio complexo ou mal entendido, busca de limites de contexto e de serviços, alinhamento entre negócio e engenharia.","nao":"Domínios simples e bem conhecidos (CRUD) ou quando as pessoas do negócio não podem participar.","estrutura":["Eventos de domínio (laranja), no passado: \"Proposta aprovada\".","Linha do tempo da esquerda para a direita.","Pontos quentes (rosa): dúvidas e conflitos.","Comandos (azul) e atores (amarelo) que disparam os eventos.","Políticas (\"sempre que… então…\"), sistemas externos e modelos de leitura.","No nível de design: agregados e limites de contexto."],"aplicar":["Comece pela visão geral (big picture): todos colam eventos, sem ordem.","Ordene a linha do tempo e marque os pontos quentes.","Use os pontos quentes como pauta da próxima conversa.","Desenhe os limites onde a linguagem muda: são candidatos a serviços.","Fotografe e transforme o resultado em C4 e ADRs."],"ex":"Contratação de crédito: \"Simulação feita\", \"Proposta enviada\", \"Análise aprovada\", \"Contrato assinado\", \"Valor liberado\". Ponto quente: quem cancela se a averbação falhar? Limites candidatos: Simulação, Análise, Formalização e Liberação.","armadilhas":["Começar pelos comandos ou pelo banco de dados.","Fazer só com engenheiros."],"combina":["c4","teamtop"],"refs":[["eventstorming.com","https://www.eventstorming.com"]]},{"id":"teamtop","g":"eng","s":"TT","n":"Team Topologies","x":"Topologias de times","o":"Matthew Skelton e Manuel Pais, 2019","q":"Um vocabulário para desenhar os times e as interações entre eles, a partir da Lei de Conway e da carga cognitiva.","quando":"Apresentar arquitetura e organização juntas, propor uma plataforma interna, explicar por que um serviço deve mudar de dono.","nao":"Discussões puramente técnicas, sem impacto em quem é dono do quê.","estrutura":["Quatro tipos de time: alinhado ao fluxo (stream-aligned), plataforma, habilitador (enabling) e subsistema complicado.","Três modos de interação: colaboração, X como serviço e facilitação.","Manobra inversa de Conway: desenhe os times para chegar à arquitetura desejada.","Carga cognitiva como limite do que um time consegue manter."],"aplicar":["Desenhe os times atuais e as interações com as formas do livro.","Sobreponha o C4 nível 2: cada container tem um dono claro?","Mostre o estado desejado e a transição.","Use para justificar uma plataforma interna: o que sai da carga dos times de fluxo."],"ex":"Proposta do template de BFF: os times de produto são alinhados ao fluxo; um time de plataforma oferece o template como serviço; um time habilitador acompanha a migração dos dois primeiros times durante um trimestre.","armadilhas":["Trocar os nomes dos times sem mudar as interações.","Plataforma que vira gargalo em vez de serviço."],"combina":["c4","wardley","eventstorming"],"refs":[["teamtopologies.com","https://teamtopologies.com"]]},{"id":"enterprise","g":"eng","s":"EA","n":"TOGAF, Zachman e ArchiMate","x":"Arquitetura corporativa","o":"Zachman (John Zachman, 1987), TOGAF (The Open Group, 1995), ArchiMate (padrão do The Open Group)","q":"Frameworks e linguagem para a arquitetura da empresa inteira: negócio, dados, aplicações e tecnologia.","quando":"Organizações grandes, bancos e governo; governança de portfólio; conversas com a arquitetura corporativa; mapas de capacidades para a diretoria.","nao":"O design de um sistema ou de um time: é pesado demais para esse nível.","estrutura":["TOGAF: o ciclo ADM (Architecture Development Method), com fase preliminar, visão, arquitetura de negócio, de sistemas de informação e de tecnologia, oportunidades, migração, governança da implementação e gestão de mudanças, tudo em volta da gestão de requisitos.","Zachman: uma matriz que cruza as perguntas (o quê, como, onde, quem, quando, por quê) com as perspectivas (do executivo a quem implementa). É uma taxonomia, não um processo.","ArchiMate: uma notação em camadas (negócio, aplicação e tecnologia) com as relações entre elas."],"aplicar":["Use o vocabulário ao falar com a arquitetura corporativa: capacidade de negócio, aplicação, serviço de tecnologia.","Para a diretoria, um mapa de capacidades pintado por criticidade costuma valer mais que qualquer diagrama técnico.","Ligue a sua solução às capacidades de negócio que ela atende."],"ex":"Mapa de capacidades de crédito: Simulação, Análise, Formalização, Liberação e Cobrança, pintadas por criticidade e por dívida técnica. A proposta de BFFs em Go aparece como melhoria na camada de aplicação das capacidades mais críticas.","armadilhas":["Aplicar o ADM inteiro em um projeto: vira burocracia.","Diagramas ArchiMate para quem não conhece a notação."],"combina":["wardley","c4","memo"],"refs":[["The Open Group · TOGAF","https://www.opengroup.org/togaf"]]},{"id":"sparkline","g":"palco","s":"SPK","n":"Sparkline","x":"O que é × o que poderia ser","o":"Nancy Duarte, livro Resonate (2010)","q":"A palestra alterna entre a realidade de hoje e o futuro possível, criando tensão, e termina num novo normal.","quando":"Keynotes, tech talks, apresentações de visão, lançamento interno de plataforma, all-hands.","nao":"Reuniões de decisão com executivos: eles querem a resposta primeiro.","estrutura":["Começo, o que é: o mundo que o público reconhece.","Primeiro ponto de virada: o chamado à aventura, o que poderia ser.","Meio: alterna várias vezes entre o que é e o que poderia ser.","Segundo ponto de virada: o chamado à ação.","Fim: o novo normal, como o mundo fica se o público agir.","Um momento S.T.A.R. (Something They'll Always Remember): uma demo, um dado chocante, uma história."],"aplicar":["Escreva uma frase de \"o que é\" e uma de \"o que poderia ser\".","Liste os contrastes (a dor de hoje × o alívio de amanhã) e alterne entre eles.","Planeje um único momento memorável; muitas vezes é a demo.","Termine com o que o público deve fazer na segunda-feira."],"ex":"Tech talk sobre observabilidade. O que é: o plantonista caçando logs em cinco consoles às 3h. O que poderia ser: um trace que mostra o serviço lento em um clique. Alterne com dois incidentes reais. Momento S.T.A.R.: injetar lentidão ao vivo e achá-la no trace em 10 segundos. Novo normal: todo serviço nasce com tracing.","armadilhas":["Só \"o que poderia ser\": vira propaganda.","Só \"o que é\": vira lamento."],"combina":["talk","ae","monroe"],"refs":[["Livro: Resonate, Nancy Duarte",""]]},{"id":"talk","g":"palco","s":"TALK","n":"Problema, Solução, Demo, Lições","x":"A estrutura de um tech talk","o":"Padrão consagrado em conferências de engenharia","q":"A espinha da maioria dos bons talks técnicos: uma dor real, como ela foi resolvida, a prova e o que levar para casa.","quando":"Meetups, conferências, apresentações internas de engenharia,
