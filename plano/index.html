 no momento de gravar.","por":"Relógio de celular não serve para ordenar: dois aparelhos discordam por segundos. O servidor atribui a próxima sequência da conversa (um contador por conversa, incrementado com escrita condicional, ou um único dono da conversa que numera) e todos ordenam por ela. O id gerado no cliente serve para outra coisa: deduplicar o reenvio.","contra":"Ids ordenáveis por tempo (ULID, Snowflake) evitam o contador, mas dois servidores com relógios um pouco diferentes podem inverter mensagens de um mesmo segundo. Num grupo de 50 mil pessoas muito ativo, o contador da conversa vira um ponto quente; aí um único processo dono do grupo, que numera em memória e grava em lote, resolve.","muda":"Se a ordem só importa por remetente (cada um vê as próprias mensagens em ordem), dispense a sequência global."},{"q":"Que garantia de entrega dar, e como evitar duplicata?","e":"Pelo menos uma vez, com deduplicação pelo id do cliente e sincronização pela última sequência vista.","por":"O app reenvia se não recebe a confirmação, e o servidor pode reentregar depois de uma queda. Com o id do cliente gravado de forma condicional, o reenvio vira no-op; e o app ignora mensagem com sequência que já tem. Ao reconectar, o app pede \"tudo depois da sequência N\", o que fecha qualquer buraco da entrega em tempo real.","contra":"Exatamente uma vez na rede não existe; quem promete isso esconde a deduplicação em algum lugar. Confiar só no push em tempo real perde mensagens a cada troca de rede.","muda":"Nunca: essa combinação é a base de qualquer chat confiável."},{"q":"Grupo grande: gravar uma cópia por membro (inbox) ou uma por conversa?","e":"Uma cópia por conversa; por membro, só o marcador de leitura e o contador de não lidas.","por":"Copiar a mensagem para a caixa de 50 mil membros transforma uma mensagem em 50 mil escritas. Guardando uma vez na conversa, cada membro lê a mesma partição, e o que é por pessoa (até onde leu, quantas não lidas) é pequeno e atualizado de forma preguiçosa.","contra":"A caixa por usuário (fan-out na escrita) facilita a lista de conversas e a sincronização entre aparelhos, e é a escolha em conversas 1:1 e grupos pequenos, onde o custo é baixo.","muda":"Conversas 1:1 e grupos de até algumas dezenas de pessoas: caixa por usuário é razoável e simplifica o app."},{"q":"Como mostrar presença sem tempestade de eventos?","e":"Presença efêmera no Valkey com TTL, consultada sob demanda; \"digitando\" só para quem está com a conversa aberta.","por":"Se cada mudança de online para offline fosse avisada a todos os contatos, uma pessoa com 500 contatos geraria 500 eventos a cada troca de rede. Em vez disso, a presença é uma chave com TTL renovada pelas batidas, e o app consulta a presença dos contatos que estão na tela. \"Digitando\" vai só para quem tem a conversa aberta, e não é gravado.","contra":"Presença exata e empurrada em tempo real para todos é cara e quase ninguém percebe a diferença.","muda":"Em grupos enormes, desligue presença individual e mostre só \"N online\"."},{"q":"E a criptografia de ponta a ponta?","e":"Decidir cedo: com ela, o servidor guarda só texto cifrado e perde busca e moderação no servidor.","por":"Com o protocolo Signal (o do WhatsApp), as chaves ficam nos aparelhos e o servidor só transporta e guarda bytes cifrados. Isso muda o desenho: busca vira local no aparelho, moderação depende de denúncia, e a sincronização de vários aparelhos exige cifrar uma vez por aparelho.","contra":"Sem ela, você ganha busca, moderação automática e backup simples, e assume a responsabilidade de guardar conversas legíveis.","muda":"Conversa entre aluno e treinador com dados de saúde pede, no mínimo, criptografia em repouso com KMS e controle de acesso estrito."},{"q":"Como mandar mídia?","e":"Upload direto para o S3 com URL pré-assinada; a mensagem carrega só a referência; entrega pelo CloudFront com URL assinada.","por":"Foto e áudio passando pelo WebSocket entupiriam a camada de conexões. O app sobe para o S3, manda a mensagem com o id do arquivo, e quem recebe baixa pelo CloudFront com uma URL assinada de curta duração.","contra":"Mídia pelo próprio WebSocket é simples e só funciona com arquivos minúsculos e pouca gente.","muda":"Nunca para mídia de verdade."}],"dados":"Mensagens no DynamoDB por conversa e balde, conversas e participantes em outra tabela, marcadores de leitura por usuário e conversa, registro de conexões e presença no Valkey.","tabelas":[["mensagens","conversa_id#balde + seq","Query das últimas N antes de um seq"],["mensagens_por_cliente","conversa_id + id_do_cliente","escrita condicional para deduplicar reenvio"],["participantes","conversa_id + usuario_id; GSI usuario_id","membros de um grupo; conversas de um usuário"],["leitura","usuario_id + conversa_id","última seq lida, não lidas"],["conexoes (Valkey)","usuario:{id} → nós e aparelhos, com TTL","roteamento da entrega"]],"falhas":[["Um nó da frota cai com 200 mil conexões","Os aparelhos reconectam em outros nós (com jitter no app, senão viram uma avalanche) e sincronizam pela última sequência; nada se perde porque tudo foi gravado antes de entregar."],["O Valkey perde o registro de conexões","As entregas em tempo real falham por alguns segundos; as batidas recriam o registro; as mensagens já estão no banco e chegam pela sincronização."],["Troca de rede no meio do envio","O app reenvia com o mesmo id; a escrita condicional deduplica."],["Grupo de 50 mil membros muito ativo","O contador da conversa vira ponto quente; um dono por grupo numera em memória e grava em lote."]],"custo":"Com o gerenciado, a linha principal é minuto de conexão e mensagem no API Gateway WebSocket; ela cresce com o tempo que as pessoas passam conectadas, não com o que fazem. Com frota própria, o custo vira máquinas e banda, e cai muito em escala. O armazenamento cresce sem parar: mensagens antigas podem ir para o S3 e ser buscadas sob demanda.","evolucao":[["v1","API Gateway WebSocket + Lambda + DynamoDB, entrega direta pelo connectionId."],["v2","Sequência por conversa, deduplicação, sincronização por cursor, push para offline."],["v3","Frota própria de conexões no ECS, registro no Valkey, baldes por tempo."],["v4","Usuários com região de origem, conversas entre regiões, arquivo frio no S3."]],"perguntas":["Por que a mensagem é gravada antes de ser entregue, e o que acontece se for o contrário?","Qual a diferença entre o id do cliente e a sequência da conversa, e para que serve cada um?","Por que o balde de tempo na chave de partição?","Quando a frota própria passa a valer mais que o API Gateway WebSocket?","Como evitar a avalanche de reconexões quando um nó cai?"],"pratica":{"t":"Um chat com sequência e sincronização","passos":["Servidor de WebSocket em Go (gorilla/websocket ou nhooyr) com dois nós e Valkey para registro e pub/sub.","Mensagens gravadas em DynamoDB Local com sequência por conversa e deduplicação pelo id do cliente.","Derrube um nó durante uma troca de 1.000 mensagens e confira que, depois da reconexão, os dois lados têm as mesmas mensagens na mesma ordem."],"pronto":["Zero perdas e zero duplicatas no teste de queda","Reconexão com jitter: sem pico de conexões no mesmo segundo"]},"caps":[13,11,16,14],"livros":[["Kleppmann",5,"Codificação e evolução","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch05.html","formatos de mensagem e evolução de esquema","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"],["Kleppmann",6,"Replicação","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch06.html","replicação e leitura das próprias escritas","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"],["Burns",7,"Serviços fragmentados","https://www.oreilly.com/library/view/projetando-sistemas-distribuidos/9798341637856/ch07.html","serviços fragmentados","Projetando Sistemas Distribuídos, 2ª ed.","burns"]],"links":[["Discord: How Discord stores trillions of messages","https://discord.com/blog/how-discord-stores-trillions-of-messages"],["API Gateway: cotas de WebSocket","https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-execution-service-websocket-limits-table.html"],["AppSync Events: protocolo WebSocket","https://docs.aws.amazon.com/appsync/latest/eventapi/event-api-websocket-protocol.html"]],"labs":[5,10]},{"id":"video","n":9,"g":"social","t":"Vídeo sob demanda (como o YouTube)","q":"Como receber, processar e entregar vídeos para milhões de pessoas, se transferir vídeo é o custo dominante?","nivel":"Avançado","horas":6,"cenario":"Criadores sobem vídeos de treino (de 30 segundos a 2 horas), e qualquer pessoa assiste em qualquer aparelho e rede, do 4G fraco ao Wi-Fi da academia. O sistema precisa aceitar uploads grandes que caem no meio, converter cada vídeo em várias resoluções, entregar com pouco atraso para começar a tocar e contar visualizações. Quase tudo que é difícil aqui é custo: computação para converter e, principalmente, banda para entregar.","req":["Upload de vídeos de até alguns GB, que retoma de onde parou.","Conversão para várias resoluções e formatos, com miniaturas.","Reprodução adaptativa (a qualidade muda com a rede).","Vídeos privados e não listados.","Contagem de visualizações e busca por título."],"nreq":["O vídeo começa a tocar em menos de 2 segundos para 90% das pessoas.","Um vídeo de 10 minutos fica disponível em até 10 minutos depois do upload.","Disponibilidade de 99,95% na reprodução.","Milhões de visualizações por dia, com picos quando um vídeo viraliza."],"numeros":[["Uploads","200 mil vídeos por dia × 10 min","~2 milhões de minutos de vídeo por dia para converter"],["Armazenamento novo","200 mil × ~1,5 GB (original + versões)","~300 TB por dia, ~100 PB por ano"],["Visualizações","50 mi de pessoas × 5 vídeos","250 milhões por dia"],["Banda de entrega","250 mi × 5 min × 3 Mbit/s","~28 PB por dia saindo pela CDN"],["Cauda longa","a maioria dos vídeos quase não é vista","poucos por cento dos vídeos respondem pela maior parte da banda"]],"base":"A primeira versão é um pipeline de eventos. O app sobe o arquivo direto para o S3, o S3 avisa que chegou, um fluxo no Step Functions manda o MediaConvert gerar as versões em HLS, grava os metadados e marca o vídeo como pronto. A reprodução nunca passa pelos seus servidores: o player pede o manifesto e os segmentos ao CloudFront, que busca no S3.","fluxo":["O app pede ao backend uma URL pré-assinada de upload multipart; o backend cria o registro do vídeo (ENVIANDO) no DynamoDB.","O app sobe as partes direto para o S3, em paralelo, e pode retomar as que falharem; ao final, conclui o multipart.","O evento do S3 vai para o EventBridge, que inicia o Step Functions do processamento.","O Step Functions valida o arquivo, cria o job no MediaConvert (escada de resoluções em HLS/CMAF e miniaturas) e espera o término pelo evento do MediaConvert.","As versões vão para um bucket de saída; os metadados (duração, resoluções, miniatura) vão para o DynamoDB e o vídeo vira PRONTO; o título vai para o OpenSearch.","O player busca o manifesto e os segmentos no CloudFront, com Origin Shield na frente do S3; vídeos privados usam cookies assinados.","O player manda batidas de visualização para uma API que escreve no Kinesis; um job no Flink agrega e atualiza os contadores."],"decisoes":[{"q":"Como receber arquivos grandes de redes ruins?","e":"Upload multipart direto para o S3 com URLs pré-assinadas por parte.","por":"Um vídeo de 2 GB por 4G cai no meio com frequência. Em partes de, por exemplo, 16 MB, o app sobe várias em paralelo, refaz só as que falharam e pode retomar no dia seguinte. Como o arquivo vai direto para o S3, seus servidores não carregam um byte de vídeo, e o API Gateway (que tem limite de tamanho de corpo) nem entra no caminho. O S3 Transfer Acceleration ajuda criadores longe da região.","contra":"Passar o vídeo pelo seu backend exige servidores com muita banda, memória para buffers e timeouts longos, só para repassar bytes ao S3. Um upload de corpo único não retoma: cai em 90% e começa do zero.","muda":"Para vídeos de poucos MB (stories curtos), um PUT pré-assinado simples basta."},{"q":"Quem converte o vídeo: MediaConvert, contêineres com FFmpeg ou Lambda?","e":"MediaConvert como padrão; FFmpeg em contêineres na Spot só se o volume justificar o time.","por":"O MediaConvert é gerenciado, escala sozinho, gera a escada de resoluções, HLS, DASH e CMAF, miniaturas e legendas, e cobra por minuto de saída. Para o começo e para picos imprevisíveis, ninguém precisa operar fila de codificação. A modalidade acelerada divide o vídeo e converte partes em paralelo, o que encurta vídeos longos.","contra":"FFmpeg no ECS ou no AWS Batch com instâncias Spot pode sair bem mais barato por minuto em volume gigante, e dá controle total do codificador, ao preço de operar filas, tratar interrupções da Spot e manter as versões do FFmpeg. Lambda tem 15 minutos e disco limitado: só funciona se você dividir o vídeo em pedaços e juntar depois, o que é construir um codificador distribuído.","muda":"Quando a conta do MediaConvert virar uma das maiores linhas da fatura e houver um time de mídia, migre o grosso do volume para FFmpeg na Spot e mantenha o MediaConvert para picos."},{"q":"Quais versões gerar, e em que codec?","e":"Uma escada em H.264 para todos os vídeos; HEVC ou AV1 só para os vídeos que passam de um limite de visualizações.","por":"O H.264 toca em qualquer aparelho. Codecs mais novos economizam uma boa fração da banda na mesma qualidade, mas custam bem mais para converter. Como a maioria dos vídeos quase não é vista, converter tudo em AV1 é gastar computação com vídeos que ninguém assiste. A regra \"converte de novo em AV1 quando passar de N mil visualizações\" coloca a computação onde a banda é gasta. A escada pode ser ajustada por vídeo: um treino filmado com câmera parada precisa de menos bits que um vídeo com muito movimento.","contra":"Uma escada fixa e um codec só são simples e previsíveis, e desperdiçam banda nos vídeos populares, que são justamente os que pesam na conta.","muda":"Se a plataforma é toda de vídeos muito vistos (catálogo curado), converta tudo nos codecs novos desde o início."},{"q":"Empacotar antes (segmentos prontos no S3) ou na hora (just-in-time)?","e":"Segmentos CMAF prontos no S3, servidos como arquivos estáticos.","por":"Com CMAF, os mesmos segmentos servem HLS (Apple) e DASH (Android, web), e o manifesto é um arquivo pequeno. Arquivos estáticos no S3 atrás do CloudFront são a forma mais barata e simples de servir, e o cache funciona sem surpresas.","contra":"O AWS Elemental MediaPackage empacota e aplica DRM na hora, o que economiza armazenamento quando você precisa de muitos formatos e de DRM de estúdio (Widevine, FairPlay, PlayReady), mas cobra por GB processado e adiciona uma peça no caminho de cada requisição que não está em cache.","muda":"Conteúdo licenciado com DRM obrigatório e vários formatos: MediaPackage. Conteúdo de criadores sem DRM: estático."},{"q":"Como entregar com pouco atraso e sem sobrecarregar a origem?","e":"CloudFront com Origin Shield, cache longo para segmentos e curto para manifestos.","por":"Segmentos nunca mudam depois de criados: cache de dias. Os manifestos podem mudar (uma resolução nova gerada depois), então cache de segundos ou minutos. O Origin Shield coloca uma camada de cache regional entre os pontos de presença e o S3, e um vídeo que viraliza em 400 cidades vira poucas leituras na origem, não 400.","contra":"Servir do S3 sem CDN é mais caro por GB e mais lento longe da região. Em escala de dezenas de PB por dia, empresas usam várias CDNs e contratos negociados; o desenho continua o mesmo, só muda o roteamento.","muda":"Em escala de grande plataforma, CDN própria nos provedores de internet (como o Open Connect da Netflix) entra na conta; não antes."},{"q":"Como proteger vídeos privados sem perder o cache?","e":"Cookies assinados do CloudFront por sessão, válidos para o caminho do vídeo.","por":"Uma URL assinada por segmento quebraria o cache (cada URL é diferente) e encheria o manifesto de assinaturas. O cookie assinado autoriza um prefixo (/videos/123/*) por algumas horas, e os segmentos continuam com a mesma URL para todos, então o cache funciona.","contra":"Esconder a URL não protege nada. Tokens na query string sem incluir o token na chave de cache funcionam, mas exigem configurar a política de cache com cuidado para não servir conteúdo privado a quem não tem acesso.","muda":"Para vídeos pagos de alto valor, DRM; cookie assinado impede o acesso, não a cópia."},{"q":"Em que classe do S3 guardar 100 PB por ano?","e":"Versões em S3 Intelligent-Tiering; o original em Glacier Instant Retrieval ou Flexible Retrieval depois de converter.","por":"A cauda longa é a regra: a maioria dos vídeos fica fria em semanas. O Intelligent-Tiering move sozinho os objetos sem acesso para camadas mais baratas e de volta quando alguém assiste, sem taxa de recuperação. O original só serve para converter de novo (um codec novo, um erro na escada), então pode ir para uma classe de arquivo.","contra":"Tudo no Standard é simples e caro com dezenas de PB. Regras de ciclo de vida por idade erram nos vídeos antigos que voltam a ser vistos. O Glacier Deep Archive é o mais barato, mas recuperar leva horas: só para originais que você aceita esperar.","muda":"Se você sabe exatamente quais vídeos esfriam (por exemplo, lives gravadas vistas só na primeira semana), regras de ciclo de vida explícitas saem mais baratas."},{"q":"Como contar visualizações sem escrever no banco a cada play?","e":"Batidas do player no Kinesis, agregadas por minuto no Flink, somadas a contadores no DynamoDB; número exibido aproximado.","por":"Uma escrita por visualização no pico de um vídeo viral é uma partição quente e uma conta alta. O player manda eventos (começou, 30 segundos, terminou) para o Kinesis; o Flink filtra robôs, deduplica e soma por vídeo por minuto; uma escrita por vídeo por minuto atualiza o contador. A tela mostra \"12 mil\", e ninguém sente falta da unidade.","contra":"Incrementar no banco a cada play é simples e não aguenta viralização. Contar só com logs do CloudFront no Athena é barato, mas atrasa horas e não diferencia quem assistiu de quem abriu e saiu.","muda":"Se a visualização vira pagamento ao criador, a contagem precisa de trilha de auditoria e reprocessamento: veja o case de agregação em tempo real."},{"q":"Onde guardar os metadados dos vídeos?","e":"DynamoDB por id do vídeo, com índice por canal e data; busca textual no OpenSearch alimentada por eventos.","por":"O acesso quente é \"dado o id, me dê título, duração, resoluções e miniatura\", milhões de vezes por dia: chave e valor, latência baixa e estável. A lista de vídeos de um canal usa um índice secundário. A busca por texto não pertence ao DynamoDB; o DynamoDB Streams alimenta o OpenSearch.","contra":"O Aurora serviria bem para metadados e permite consultas ricas, mas o volume de leitura por id pede réplicas e cache; com o DynamoDB, o cache vira opcional.","muda":"A parte de gestão de canais (contratos, monetização) é relacional e pode morar no Aurora, ao lado."},{"q":"Como orquestrar o processamento e saber onde cada vídeo parou?","e":"Step Functions acionado pelo evento do S3, com estado do vídeo no DynamoDB.","por":"Processar um vídeo é uma sequência com espera longa (a conversão leva minutos) e passos opcionais (moderação, legendas automáticas, nova conversão em AV1). O Step Functions espera o evento do MediaConvert sem gastar computação, refaz passos com backoff e mostra, por vídeo, em que etapa ele está, o que responde na hora ao criador que pergunta \"por que meu vídeo não aparece\".","contra":"Encadear Lambdas por eventos funciona, mas o estado de cada vídeo fica espalhado e ninguém sabe onde ele travou. Uma fila com workers próprios dá mais controle e mais código.","muda":"Em volume muito alto, o preço por transição do Standard pesa; o Express ou workers próprios entram para as partes curtas."}],"dados":"Metadados no DynamoDB (vídeo, canal, estado do processamento), contadores agregados numa tabela própria, busca no OpenSearch. No S3, um bucket de entrada (originais), um de saída (versões, organizadas por /videos/{id}/{resolucao}/) e um de eventos brutos do player (Parquet, para análise no Athena).","tabelas":[["videos","video_id","por id; GSI por canal + data"],["contadores_video","video_id#minuto e total por video_id","o total na tela; a série por minuto no painel do criador"],["S3 saída","/videos/{id}/{resolucao}/segmento.m4s","CloudFront com Origin Shield"]],"falhas":[["O upload cai em 80%","O app retoma só as partes que faltam; partes órfãs de uploads abandonados são apagadas por uma regra de ciclo de vida (AbortIncompleteMultipartUpload)."],["O MediaConvert falha num arquivo corrompido","O Step Functions marca FALHOU com o motivo e avisa o criador; não há retry infinito."],["Um vídeo viraliza","O CloudFront e o Origin Shield absorvem; a origem quase não sente. O contador agrega por minuto, sem partição quente."],["Uma região inteira cai","O CloudFront continua servindo o que está em cache; para o resto, replique as versões populares (S3 Replication) e use origin failover no CloudFront."]],"custo":"A banda de entrega domina, e de longe: dezenas de PB por dia custam muito mais que computação e armazenamento juntos, mesmo com preço negociado. Por isso as alavancas mais fortes são codecs eficientes nos vídeos populares, escada ajustada por conteúdo e cache bem configurado. Depois vem a conversão (por minuto de saída) e o armazenamento da cauda longa, que o Intelligent-Tiering e o arquivamento dos originais controlam.","evolucao":[["v1","Upload pré-assinado, MediaConvert com uma escada fixa em H.264, CloudFront, metadados no DynamoDB."],["v2","Multipart retomável, Step Functions, contagem pelo Kinesis e Flink, busca no OpenSearch, Intelligent-Tiering."],["v3","Escada por conteúdo, AV1 para vídeos populares, cookies assinados, Origin Shield, moderação automática."],["v4","Codificação própria na Spot para o volume, várias CDNs, réplica dos populares em mais regiões."]],"perguntas":["Refaça a conta de banda com 1080p a 5 Mbit/s e diga qual decisão do case mais reduz esse número.","Por que URL assinada por segmento quebra o cache, e como o cookie assinado resolve?","Quando vale sair do MediaConvert para FFmpeg próprio?","Por que converter em AV1 só os vídeos populares?","O que o Origin Shield muda quando um vídeo viraliza em 400 cidades ao mesmo tempo?"],"pratica":{"t":"Um pipeline de vídeo de uma tarde","passos":["Em Go, um endpoint que devolve URLs pré-assinadas de multipart e um cliente que sobe um vídeo em partes paralelas e retoma depois de interrompido.","Com FFmpeg local, gere três resoluções em HLS e toque com o hls.js num HTML simples.","Opcional, com cuidado com o custo: um job do MediaConvert com o mesmo vídeo, saída no S3 e CloudFront na frente; apague tudo no fim.","Meça o tamanho de cada resolução e calcule a banda mensal de mil visualizações em cada uma."],"pronto":["O upload retoma depois de você matar o cliente no meio","O player troca de resolução quando você limita a rede no navegador"]},"caps":[12,13,14,18],"livros":[["Kleppmann",11,"Processamento em lote","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch11.html","processamento em lote: o pipeline de conversão é um lote acionado por evento","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"],["Kleppmann",12,"Processamento de fluxo","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch12.html","fluxos de eventos para a contagem","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"],["Burns",12,"Processamento em lote acionado por eventos","https://www.oreilly.com/library/view/projetando-sistemas-distribuidos/9798341637856/ch12.html","processamento em lote acionado por eventos","Projetando Sistemas Distribuídos, 2ª ed.","burns"]],"links":[["Guidance for Video on Demand on AWS","https://aws.amazon.com/solutions/guidance/video-on-demand-on-aws/"],["AWS Networking & Content Delivery: serverless VOD workflow","https://aws.amazon.com/blogs/networking-and-content-delivery/serverless-video-on-demand-vod-workflow"],["AWS for M&E: plataforma de VOD segura","https://aws.amazon.com/blogs/media/creating-a-secure-video-on-demand-vod-platform-using-aws"]],"labs":[8]},{"id":"arquivos","n":10,"g":"dados","t":"Armazenamento e sincronização de arquivos (como o Dropbox)","q":"Como manter arquivos iguais em dez aparelhos, mandando só o que mudou, sem perder nada quando duas pessoas editam ao mesmo tempo?","nivel":"Avançado","horas":5,"cenario":"Treinadores guardam planilhas, vídeos e PDFs dos alunos numa pasta que sincroniza entre computador, celular e a conta do aluno. É o Dropbox: o arquivo muda num aparelho e aparece nos outros em segundos, mesmo se for um vídeo de 2 GB em que só um trecho mudou. O que torna o case difícil não é guardar bytes (o S3 faz isso), é o metadado: a árvore de pastas, as versões, os compartilhamentos e os conflitos.","req":["Subir e baixar arquivos de qualquer tamanho.","Sincronizar mudanças entre aparelhos, inclusive depois de dias offline.","Histórico de versões e lixeira por 30 dias.","Compartilhar pastas com permissões.","Resolver edições simultâneas sem perder nenhuma."],"nreq":["Mudança visível nos outros aparelhos em poucos segundos.","Nenhum arquivo confirmado pode ser perdido (durabilidade do S3).","Mandar pela rede só os blocos que mudaram."],"numeros":[["Dados lógicos","50 mi de contas × 10 GB","500 PB antes de deduplicação"],["Mudanças","50 mi × 20 arquivos alterados por dia","1 bilhão de mudanças de metadado por dia, ~12 mil/s"],["Blocos","blocos de 4 MB","um vídeo de 2 GB = 512 blocos; uma edição no meio muda 1 ou 2"]],"base":"Separar bytes de metadados. Os arquivos viram blocos endereçados pelo próprio hash, guardados no S3; o metadado (qual arquivo é feito de quais blocos, em que pasta, em que versão) mora num banco transacional, e cada mudança entra num diário por espaço de nomes. Sincronizar é pedir ao servidor \"o que mudou depois do cursor X\" e baixar só os blocos que você não tem.","fluxo":["O cliente divide o arquivo em blocos e calcula o SHA-256 de cada um.","Pergunta ao servidor quais desses hashes ele ainda não tem.","Sobe só os blocos que faltam, direto para o S3 com URLs pré-assinadas (chave = hash do bloco).","Confirma a nova versão: uma transação no Aurora grava a lista de blocos, a versão nova e uma entrada no diário do espaço de nomes, condicionada à versão anterior que o cliente conhecia.","Os outros aparelhos, com uma conexão de \"aviso\" aberta (long polling ou WebSocket), recebem \"mudou\" e pedem o diário depois do seu cursor.","Cada aparelho baixa pelo CloudFront só os blocos que não tem e remonta o arquivo."],"decisoes":[{"q":"Como dividir o arquivo em blocos?","e":"Blocos de tamanho variável definidos pelo conteúdo (content-defined chunking), com média de alguns MB.","por":"Com blocos fixos de 4 MB, inserir uma linha no começo de uma planilha desloca todos os bytes, e todos os blocos mudam: o arquivo inteiro sobe de novo. Com fronteiras escolhidas por um hash rolante do conteúdo, a inserção muda só o bloco onde aconteceu, e os seguintes continuam iguais. A deduplicação também melhora: o mesmo trecho em dois arquivos vira o mesmo bloco.","contra":"Blocos fixos são mais simples, previsíveis e bons para arquivos que mudam no lugar sem deslocar (imagens de disco, bancos de dados). Diferenças estilo rsync dentro do bloco economizam mais rede, a um custo de CPU no cliente.","muda":"Arquivos que só crescem no fim (logs) ou que mudam no lugar: blocos fixos bastam."},{"q":"Onde guardar os blocos?","e":"S3, com a chave igual ao hash do bloco, escrita condicional e Intelligent-Tiering.","por":"Endereçar pelo hash torna o bloco imutável e deduplicado de graça: se o hash já existe, não sobe de novo. A escrita condicional do S3 (If-None-Match, desde 2024) impede que duas subidas do mesmo bloco briguem. A maioria dos arquivos esfria logo depois de criada, e o Intelligent-Tiering move sozinho o que ninguém abre para camadas mais baratas.","contra":"Um objeto do S3 por arquivo inteiro é mais simples, mas toda mudança sobe o arquivo todo e não há deduplicação. Bilhões de objetos pequenos têm custo por requisição: juntar blocos pequenos em pacotes maiores (como o Magic Pocket do Dropbox faz) reduz isso em escala extrema.","muda":"Arquivos pequenos e que nunca mudam (fotos): um objeto por arquivo."},{"q":"Onde guardar o metadado?","e":"Aurora PostgreSQL, fragmentado por espaço de nomes (conta ou pasta compartilhada).","por":"Mover uma pasta com 10 mil arquivos, renomear e trocar permissões são operações sobre muitas linhas que precisam ser atômicas e consistentes. O PostgreSQL dá transações, restrições (dois arquivos com o mesmo nome na mesma pasta) e consultas por árvore. Cada espaço de nomes inteiro fica num fragmento, então uma transação nunca cruza fragmentos.","contra":"O DynamoDB escala a escrita sem esforço, mas mover uma pasta grande vira dezenas de transações de até 100 itens e uma lógica de consistência sua. Um banco único sem fragmentação para todo o serviço chega ao limite de escrita rápido.","muda":"Se o produto é só \"guardar e baixar\", sem pastas compartilhadas e movimentos grandes, o DynamoDB por arquivo fica mais simples."},{"q":"Como os aparelhos descobrem o que mudou?","e":"Diário por espaço de nomes com cursor crescente; um canal de aviso só diz \"mudou\".","por":"Cada confirmação acrescenta uma entrada ao diário do espaço de nomes com um número crescente. O aparelho guarda o último número que aplicou e pede \"tudo depois de N\": depois de 5 dias offline, ele recebe as mudanças em ordem e se põe em dia. O canal de aviso (long polling ou WebSocket) não carrega dados, só acorda o aparelho; se o aviso se perder, a próxima consulta periódica pega a mudança.","contra":"Empurrar o conteúdo das mudanças pelo canal em tempo real perde mudanças quando o aparelho está offline e exige reenvio. Comparar a árvore inteira com o servidor a cada sincronização é lento com 500 mil arquivos.","muda":"Nunca; diário com cursor é o padrão de qualquer sincronização confiável."},{"q":"Duas pessoas editaram o mesmo arquivo offline: e agora?","e":"Confirmação condicionada à versão anterior; quem perde vira uma \"cópia em conflito\", sem mesclar automaticamente.","por":"O cliente confirma \"versão 8, baseada na 7\". Se o servidor já está na 8 de outra pessoa, a condição falha, e o cliente grava a dele como \"planilha (cópia em conflito de Ana).xlsx\". Ninguém perde trabalho e ninguém recebe uma mescla automática errada de um arquivo binário.","contra":"Última escrita vence (pelo relógio) é simples e perde silenciosamente o trabalho de alguém. Mesclar automaticamente só funciona em formatos que o sistema entende (texto, documentos colaborativos com CRDT ou transformação operacional), que é outro produto.","muda":"Edição colaborativa em tempo real (como um editor de documentos) usa CRDT, não sincronização de arquivos."},{"q":"Deduplicar entre contas diferentes?","e":"Deduplicar dentro da conta (ou da organização), não entre contas.","por":"Se a deduplicação é global, subir um arquivo e ver que ele \"subiu instantâneo\" revela que outra pessoa já tem aquele arquivo, o que é um vazamento de informação. Dentro de uma conta, a economia ainda é grande (versões, cópias, arquivos repetidos), sem esse risco.","contra":"A deduplicação global economiza mais armazenamento, principalmente com arquivos populares, e é a escolha de serviços que priorizam custo sobre esse risco.","muda":"Com criptografia por conta (chaves diferentes), a deduplicação global nem é possível."},{"q":"Como apagar blocos sem apagar o que outro arquivo ainda usa?","e":"Coleta de lixo por marcação e varredura periódica, com prazo de carência, em vez de contador de referências.","por":"Um bloco pode estar em 50 arquivos e versões. Contadores de referência atualizados a cada mudança erram com falhas parciais (incrementou e caiu antes de confirmar) e apagam blocos ainda em uso. Uma varredura que marca todos os blocos referenciados por versões vivas e apaga os não marcados há mais de 30 dias é lenta, mas segura, e o prazo cobre uploads em andamento.","contra":"O contador de referências libera espaço na hora e é frágil exatamente onde o erro é irreversível.","muda":"Nunca apague um bloco sem carência."}],"dados":"Metadado no Aurora fragmentado por espaço de nomes; blocos no S3 pelo hash.","tabelas":[["arquivos","espaco_id + caminho (único)","árvore e renomeações"],["versoes","arquivo_id + versao","lista de hashes dos blocos; versão anterior para a condição"],["diario","espaco_id + seq","mudanças depois de um cursor"],["S3 blocos","sha256 do bloco","imutável; If-None-Match na escrita"]],"falhas":[["A rede cai no meio da subida","Os blocos que subiram ficam; o cliente pergunta de novo quais faltam e continua."],["O cliente confirma uma versão com um bloco que não subiu","O servidor confere a existência dos blocos antes de confirmar e recusa."],["Dois aparelhos confirmam ao mesmo tempo","A condição de versão deixa um vencer; o outro vira cópia em conflito."],["Um fragmento do Aurora cai","Só os espaços de nomes daquele fragmento ficam sem escrita durante o failover; os blocos continuam baixando pelo S3."]],"custo":"O armazenamento domina: PBs no S3, mesmo com deduplicação e Intelligent-Tiering. Depois vêm as requisições ao S3 (bilhões de blocos pequenos) e a transferência de download. Blocos maiores reduzem requisições e pioram a eficiência da sincronização: é o compromisso central do case.","evolucao":[["v1","Arquivo inteiro no S3, metadado no PostgreSQL, sincronização por varredura periódica."],["v2","Blocos pelo hash, só os que faltam, diário com cursor, aviso por long polling."],["v3","Blocos definidos pelo conteúdo, cópia em conflito, fragmentação do metadado por espaço de nomes."],["v4","Pacotes de blocos pequenos, coleta de lixo por marcação, armazenamento próprio em escala extrema."]],"perguntas":["Por que inserir uma linha no começo do arquivo é o pior caso para blocos fixos?","O que a escrita condicional do S3 resolve na subida de blocos?","Como o aparelho se põe em dia depois de 5 dias offline?","Por que deduplicar entre contas vaza informação?"],"pratica":{"t":"Sincronização por blocos em Go","passos":["Implemente blocos definidos pelo conteúdo (hash rolante tipo Rabin ou FastCDC) e compare com blocos fixos numa inserção no começo de um arquivo de 100 MB.","Servidor com PostgreSQL local para metadado e um diretório (ou MinIO) para blocos; diário com cursor.","Dois clientes editam o mesmo arquivo offline e sincronizam: confira a cópia em conflito."],"pronto":["A inserção no começo sobe menos de 1% dos bytes com blocos por conteúdo","Nenhuma edição perdida no teste de conflito"]},"caps":[6,4,16,8],"livros":[["Kleppmann",6,"Replicação","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch06.html","conflitos de escrita, última escrita vence e versões","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"],["Kleppmann",4,"Armazenamento e recuperação","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch04.html","armazenamento e recuperação","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"],["Kleppmann",3,"Modelos de dados e linguagens de consulta","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch03.html","modelos de dados para árvores","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"]],"links":[["Dropbox: Streaming file synchronization","https://dropbox.tech/infrastructure/streaming-file-synchronization"],["Dropbox: Broccoli, sincronizar mais rápido sincronizando menos","https://dropbox.tech/infrastructure/-broccoli--syncing-faster-by-syncing-less"],["Amazon S3: escritas condicionais (anúncio)","https://aws.amazon.com/about-aws/whats-new/2024/08/amazon-s3-conditional-writes"]],"labs":[8,4]},{"id":"corridas","n":11,"g":"tempo-real","t":"Corridas e geolocalização (como a Uber)","q":"Como saber onde está cada um de um milhão de motoristas a cada 4 segundos e achar o mais próximo em menos de um segundo?","nivel":"Avançado","horas":6,"cenario":"O app ganhou personal trainers a domicílio: o aluno pede um treino agora, e o sistema chama o treinador disponível mais próximo, como uma corrida. O case é o da Uber em escala: um milhão de parceiros online mandando a posição, pedidos chegando o tempo todo e um casamento que precisa considerar tempo de chegada, não só distância. A posição muda o tempo todo e quase nunca precisa ser guardada para sempre.","req":["Parceiros online mandam a posição periodicamente.","Achar parceiros disponíveis perto de um ponto.","Casar um pedido com um parceiro, sem dar o mesmo parceiro a dois pedidos.","Acompanhar a viagem em tempo real.","Preço dinâmico por região conforme oferta e procura."],"nreq":["Casamento em menos de 1 segundo depois de encontrar candidatos.","250 mil atualizações de posição por segundo.","Uma cidade com problema não afeta as outras."],"numeros":[["Atualizações de posição","1 milhão de parceiros ÷ 4 s","250 mil por segundo"],["Banda de entrada","250 mil × ~100 bytes","~25 MB/s, ~2 TB por dia"],["Pedidos","20 milhões por dia","~230/s na média, muito mais no pico de horário"],["Estado quente","1 milhão × (posição + estado)","poucos GB: cabe em memória"]],"base":"A posição atual mora em memória, num índice geográfico fragmentado por cidade; o histórico de posições vai para o S3 por um fluxo, sem passar pelo banco. O casamento é um serviço por cidade que busca candidatos no índice, calcula o tempo de chegada e reserva o parceiro com uma operação atômica.","fluxo":["O app do parceiro publica a posição a cada 4 s via MQTT no AWS IoT Core (ou numa frota própria de WebSocket).","Uma regra encaminha para o Kinesis Data Streams, com chave de partição pela célula H3 de resolução baixa (cidade/região).","Consumidores por cidade atualizam o índice no ElastiCache (Valkey): GEOADD da posição e o estado do parceiro, com TTL.","O Firehose copia o mesmo fluxo para o S3 (histórico, análise, rotas de viagem).","O pedido chega ao serviço de casamento da cidade, que busca candidatos com GEOSEARCH num raio, pede o tempo de chegada ao serviço de rotas e escolhe.","A reserva do parceiro é atômica (script Lua no Valkey, ou escrita condicional no DynamoDB): só passa se ele estiver DISPONIVEL.","A viagem é gravada no DynamoDB, e a posição durante a viagem vai ao aluno pelo mesmo canal de tempo real."],"decisoes":[{"q":"Como receber 250 mil posições por segundo?","e":"MQTT no AWS IoT Core, com regra para o Kinesis.","por":"Celulares em rede móvel trocam de antena e perdem conexão o tempo todo. O MQTT foi feito para isso: conexão leve, reconexão rápida, sessão persistente e mensagens pequenas. O IoT Core aguenta milhões de conexões, autentica cada aparelho e, por regra, entrega no Kinesis sem código no meio.","contra":"HTTP com uma requisição a cada 4 segundos funciona, mas paga cabeçalho, TLS e roteamento a cada posição, e no API Gateway paga por requisição: 250 mil por segundo é uma conta alta. Uma frota própria de WebSocket ou MQTT é mais barata em escala e é mais uma coisa para operar. Mandar direto do celular para o Kinesis exige credenciais da AWS no aparelho.","muda":"Frotas pequenas (milhares de parceiros): HTTP simples ou o Amazon Location Service com rastreadores gerenciados."},{"q":"Onde guardar a posição atual?","e":"Em memória no Valkey, com índice geográfico e TTL; nunca uma escrita por posição num banco durável.","por":"A posição só vale por segundos: guardar cada uma num banco durável é pagar durabilidade por um dado que vai ser jogado fora. O Valkey tem comandos geográficos (GEOADD e GEOSEARCH num raio) e responde em menos de um milissegundo; o TTL tira do índice quem parou de mandar posição (app fechado, túnel). Um cluster por região ou cidade mantém cada índice pequeno.","contra":"No DynamoDB, 250 mil escritas por segundo são 250 mil unidades de escrita por segundo, o dia inteiro, uma conta enorme para dado efêmero, e consultas por raio exigem montar o índice geográfico à mão (geohash na chave). O Amazon Location Service tem rastreadores gerenciados e geocercas, bom para frotas de empresa; em escala de milhões de posições por segundo, o custo por posição pesa.","muda":"Se você precisa de geocercas e histórico gerenciados para uma frota de milhares de veículos, o Location Service resolve sem construir nada."},{"q":"Como dividir o mapa: geohash, H3 ou S2?","e":"H3 para agregar e fragmentar (preço dinâmico, partição do fluxo); o raio do GEOSEARCH para buscar vizinhos.","por":"O H3 divide o mundo em hexágonos de vários tamanhos; todos os vizinhos de um hexágono ficam à mesma distância do centro, e a área das células é quase uniforme, o que torna \"oferta e procura por célula\" comparável entre regiões. É por isso que a Uber o criou. Para \"parceiros num raio de 3 km\", o GEOSEARCH do Valkey já resolve sem você lidar com células.","contra":"O geohash usa retângulos e tem o problema da borda: dois pontos a 10 metros podem ter prefixos diferentes, e a busca precisa olhar as 8 células vizinhas. O S2 (do Google) usa quadrados numa esfera, é ótimo para cobrir polígonos com células, e é menos natural para vizinhança uniforme.","muda":"Se o problema principal for cobrir áreas irregulares (zonas de entrega com formato livre), S2 ou polígonos do Location Service."},{"q":"Casar pelo mais próximo em linha reta ou pelo tempo de chegada?","e":"Candidatos pelo raio, escolha pelo tempo de chegada calculado por um serviço de rotas.","por":"Do outro lado de um rio ou de uma marginal, o mais próximo em linha reta pode estar a 20 minutos. O raio traz, digamos, 20 candidatos, e o serviço de rotas calcula o tempo de chegada de cada um (matriz de tempos, em uma chamada). O Amazon Location Service calcula matrizes de rotas; em escala, empresas rodam motores próprios (OSRM, Valhalla) com dados de trânsito.","contra":"Linha reta é instantânea e grátis, e erra justamente nas cidades onde o trânsito importa.","muda":"Em áreas pequenas e sem barreiras (um campus), linha reta basta."},{"q":"Casar na hora (guloso) ou em lotes?","e":"Lotes de 2 segundos por região, resolvendo os pedidos juntos.","por":"Casar cada pedido com o melhor parceiro naquele instante parece ótimo, mas dois pedidos que chegam com 1 segundo de diferença podem disputar o mesmo parceiro, e o segundo fica com um muito pior. Juntando os pedidos de 2 segundos de uma região e resolvendo como um problema de atribuição, o tempo médio de chegada cai para todos, ao custo de até 2 segundos a mais de espera.","contra":"O guloso é simples, sem espera e bom com pouca procura, quando quase nunca há disputa.","muda":"Pouca procura: guloso. Muita procura e muitos parceiros: lotes."},{"q":"Como garantir que um parceiro não receba dois pedidos?","e":"Reserva atômica: muda DISPONIVEL para OFERECIDO só se ele ainda estiver DISPONIVEL, com prazo para aceitar.","por":"Dois casamentos em paralelo podem escolher o mesmo parceiro. Um script Lua no Valkey (ou um UpdateItem condicional no DynamoDB, se o estado de disponibilidade morar lá) faz a checagem e a mudança juntas; quem perde escolhe o próximo candidato. A oferta tem prazo: se o parceiro não aceita em 15 segundos, volta a DISPONIVEL e o pedido vai para o próximo.","contra":"Ler o estado, decidir e depois gravar, em passos separados, vende o mesmo parceiro duas vezes no pico.","muda":"Nunca; é a mesma ideia do lugar no case de ingressos."},{"q":"Como isolar falhas entre cidades?","e":"Arquitetura em células: cada região metropolitana com seu fluxo, seu índice e seu serviço de casamento.","por":"Uma pessoa em São Paulo nunca casa com um parceiro em Recife. Separando por célula (uma região, uma partição do Kinesis, um cluster de Valkey, uma instância do casamento), um bug ou uma sobrecarga numa cidade não derruba as outras, e cada célula escala pelo próprio volume. Um roteador fino na entrada manda cada pedido para a célula certa.","contra":"Um índice global único é mais simples no começo e faz de qualquer problema um problema nacional.","muda":"Poucas cidades: uma célula só; separe quando a maior cidade começar a afetar as outras."},{"q":"Como calcular o preço dinâmico?","e":"Agregação por célula H3 e por minuto no Managed Service for Apache Flink, publicada num cache.","por":"O preço depende de pedidos e parceiros por célula no último minuto. O Flink lê o mesmo fluxo de posições e de pedidos, conta por célula em janelas de um minuto e publica o multiplicador. O casamento só lê o número pronto.","contra":"Calcular na hora de cada pedido, contando no índice, sobrecarrega o caminho quente com uma conta que muda devagar.","muda":"Cidades pequenas: preço fixo ou por faixa de horário."}],"dados":"Estado quente no Valkey por célula; viagens no DynamoDB; histórico de posições no S3, particionado por data e região.","tabelas":[["geo:{regiao} (Valkey)","conjunto geográfico de parceiros disponíveis","GEOSEARCH num raio"],["parceiro:{id} (Valkey)","estado, prazo da oferta, TTL","reserva atômica"],["viagens (DynamoDB)","viagem_id; GSI por aluno e por parceiro","estado da viagem e cobrança"],["S3 posições","data + região","Athena: rotas, análise de tempo de chegada"]],"falhas":[["Um parceiro entra num túnel","O TTL tira a posição do índice em segundos; ele não recebe pedidos com posição velha."],["Um nó do Valkey de uma cidade cai","A réplica assume; as posições se recompõem em 4 segundos pelas próximas atualizações."],["O serviço de rotas fica lento","O casamento cai para distância em linha reta com um fator de correção por região, e alarma."],["Pico de pedidos num show","A célula da cidade escala sozinha; o preço dinâmico sobe e equilibra a procura."]],"custo":"Entrada de posições (IoT Core por mensagem, Kinesis por shard) e o Valkey de cada cidade são as linhas principais. Guardar posições em banco durável seria a linha mais cara e é a que o desenho evita. O serviço de rotas, se for gerenciado e cobrado por cálculo, pesa em volume alto.","evolucao":[["v1","HTTP, posições no Valkey, casamento guloso por distância."],["v2","IoT Core e Kinesis, histórico no S3, tempo de chegada por rotas."],["v3","Células por cidade, lotes de casamento, preço dinâmico no Flink."],["v4","Previsão de procura por célula para posicionar parceiros antes dos pedidos."]],"perguntas":["Por que não gravar cada posição no DynamoDB? Faça a conta.","Qual o problema de borda do geohash, e como o H3 o evita?","Por que casar em lotes de 2 segundos pode melhorar o tempo médio de chegada?","O que é uma célula, e o que ela protege?"],"pratica":{"t":"Mil parceiros e um raio","passos":["Gere 10 mil parceiros falsos andando numa área e mande posições a cada 4 s para um serviço Go que atualiza o Valkey.","Implemente a busca por raio e a reserva atômica com Lua; dispare 500 pedidos simultâneos.","Use a biblioteca H3 para Go e conte pedidos e parceiros por célula a cada minuto."],"pronto":["Nenhum parceiro com dois pedidos","Parceiros que param de mandar posição somem do índice no TTL"]},"caps":[16,13,7,12],"livros":[["Kleppmann",7,"Fragmentação","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch07.html","fragmentação por região e partição quente","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"],["Burns",7,"Serviços fragmentados","https://www.oreilly.com/library/view/projetando-sistemas-distribuidos/9798341637856/ch07.html","serviços fragmentados","Projetando Sistemas Distribuídos, 2ª ed.","burns"],["Burns",8,"Dispersão/recolha","https://www.oreilly.com/library/view/projetando-sistemas-distribuidos/9798341637856/ch08.html","dispersão e recolha","Projetando Sistemas Distribuídos, 2ª ed.","burns"]],"links":[["Uber: H3, o índice geográfico hexagonal","https://www.uber.com/en/blog/h3/"],["ElastiCache: comandos suportados (incluindo os geográficos)","https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/SupportedCommands.html"]],"labs":[11],"reusa":"A reserva atômica com Lua usa a mesma técnica do balde de fichas do case de rate limit."},{"id":"agregacao","n":12,"g":"dados","t":"Agregação em tempo real (cliques em anúncios e visualizações)","q":"Como contar 10 bilhões de eventos por dia, com painel ao vivo e cobrança exata, se eventos chegam atrasados e repetidos?","nivel":"Avançado","horas":6,"cenario":"O app passou a exibir anúncios de marcas de suplemento e de academias, cobrando por clique, e os anunciantes querem um painel por minuto. O mesmo problema aparece em visualizações de vídeo pagas a criadores. Contar é fácil; contar certo é difícil: o celular manda o clique duas vezes, manda com 3 horas de atraso porque estava offline, robôs clicam, e a cobrança precisa bater com o que o painel mostrou.","req":["Receber eventos de clique e impressão.","Painel por anúncio e por minuto, com atraso de até 1 minuto.","Cobrança diária exata, auditável e reprocessável.","Descartar duplicatas e cliques fraudulentos.","Aceitar eventos atrasados."],"nreq":["Nenhum evento perdido depois de aceito.","O painel tolera pequenas diferenças; a cobrança não.","Pico de 350 mil eventos por segundo."],"numeros":[["Eventos","10 bilhões por dia","~115 mil/s na média, ~350 mil/s no pico"],["Volume bruto","10 bi × ~200 bytes","~2 TB por dia, comprimido bem menos em Parquet"],["Agregados","1 milhão de anúncios × 1.440 minutos","até ~1,4 bilhão de linhas por dia, na prática bem menos (só anúncios ativos)"]],"base":"Duas linhas paralelas sobre o mesmo log. Os eventos entram num fluxo durável (Kinesis ou MSK); um job no Flink agrega por minuto para o painel; o mesmo fluxo vai para o S3, que é a fonte da verdade, e a cobrança sai de um lote diário sobre o S3. O painel é rápido e quase exato; a fatura é exata e reprocessável. As duas são comparadas todo dia.","fluxo":["O app manda eventos com id único gerado no cliente para um endpoint de ingestão (ALB + serviço Go, em lotes), que grava no Kinesis Data Streams com chave pelo id do anúncio (com sufixo nos anúncios quentes).","O Firehose copia o fluxo bruto para o S3 em Parquet (ou tabelas Iceberg/S3 Tables), particionado por hora.","O Managed Service for Apache Flink lê o fluxo, deduplica pelo id do evento numa janela, filtra fraude por regras, agrega por anúncio em janelas de 1 minuto pelo horário do evento.","Os resultados são gravados por upsert (anúncio + minuto) no DynamoDB ou num banco analítico, e o painel lê de lá.","Todo dia, um job em lote (Athena, Glue ou EMR) recalcula o dia anterior a partir do S3, aplica as regras finais de fraude e gera a cobrança.","Um job compara o total do lote com o do fluxo por anúncio e alarma diferenças acima do esperado."],"decisoes":[{"q":"Kinesis Data Streams ou MSK (Kafka)?","e":"Kinesis em modo sob demanda para começar; MSK quando o time já opera Kafka ou precisa do ecossistema dele.","por":"O Kinesis é gerenciado por completo, cresce sozinho no modo sob demanda e se integra direto com Firehose, Flink e Lambda. A retenção vai de 24 horas a um ano, o que permite reprocessar dias. O MSK dá o Kafka completo (Kafka Connect, transações do Kafka, compactação de tópicos), com mais coisas para dimensionar.","contra":"Em volume muito alto e constante, o MSK provisionado costuma sair mais barato que o Kinesis por GB, e muitos times já conhecem o Kafka. O SQS não serve: não guarda ordem por chave nem deixa reler.","muda":"Se a empresa já tem Kafka e conectores, MSK desde o começo."},{"q":"Como escolher a chave de partição sem criar um shard quente?","e":"Id do anúncio, com sufixo aleatório (de 0 a N) nos anúncios de altíssimo volume.","por":"Agrupar por anúncio facilita a agregação, mas um anúncio de campanha nacional pode mandar mais eventos do que um shard aceita. Para esses (uma lista pequena, atualizada pelo próprio pipeline), a chave vira anuncio#3, e o Flink junta os pedaços numa segunda etapa.","contra":"Chave aleatória pura espalha bem e obriga o Flink a reagrupar tudo, gastando rede; chave pelo anúncio puro cria o shard quente.","muda":"Se nenhum anúncio passa de uma fração do limite de um shard, sem sufixo."},{"q":"Quem agrega: Flink, Lambda ou lote no S3?","e":"Managed Service for Apache Flink para o painel; lote no S3 para a cobrança.","por":"O Flink guarda estado (contagens por janela, ids já vistos), usa o horário do evento (não o de chegada), lida com atraso por marcas d'água e, com pontos de verificação (checkpoints), retoma depois de uma falha sem perder nem contar duas vezes o que estava no estado. É exatamente o que uma janela de 1 minuto com eventos fora de ordem precisa.","contra":"Lambda consumindo o Kinesis é simples para transformações por evento, mas não tem estado entre invocações: contar por janela exige guardar contagens num banco, com escritas por evento e retentativas que contam duas vezes. Só o lote (Firehose para o S3 e Athena a cada hora) é barato e exato, mas o painel fica com uma hora de atraso.","muda":"Se o painel aceita atraso de uma hora, dispense o Flink e faça só o lote: muito mais simples."},{"q":"Como não contar duas vezes?","e":"Id do evento gerado no cliente, deduplicado no Flink numa janela, e escrita idempotente (upsert por anúncio e minuto) no destino.","por":"O celular reenvia quando não recebe confirmação, e o Kinesis entrega pelo menos uma vez. O Flink guarda os ids vistos nas últimas horas (estado com TTL) e descarta os repetidos. Na saída, gravar \"anúncio 42, minuto 10:31 = 1.200\" (sobrescrevendo) em vez de \"some 1.200\" faz a reexecução depois de uma falha dar o mesmo resultado. É o \"exatamente uma vez no efeito\" que se consegue na prática; a Uber descreve um desenho parecido com Kafka, Flink e Pinot.","contra":"Incrementos na saída (ADD) duplicam a contagem quando o Flink reprocessa a partir do último checkpoint. Deduplicar para sempre exige estado infinito; a janela de horas é o compromisso, e o lote diário pega o que escapar.","muda":"Se o destino aceita transações com o checkpoint (sink transacional), a escrita pode ser incremental; o upsert continua mais simples."},{"q":"E os eventos que chegam com 3 horas de atraso?","e":"Janelas por horário do evento, tolerância de alguns minutos no fluxo, e o resto corrigido pelo lote diário.","por":"Uma marca d'água de, digamos, 2 minutos fecha a janela das 10:31 às 10:34 e publica. Eventos dessa janela que chegam depois disso podem atualizar o resultado por um tempo extra (allowed lateness), e os que chegam horas depois vão para uma saída lateral e são contados no lote do dia, que lê tudo do S3 pelo horário do evento. O painel fica um pouco abaixo do real e a fatura fica certa.","contra":"Esperar horas para fechar cada janela deixa o painel inútil; descartar os atrasados erra a fatura.","muda":"Se quase nada chega atrasado (eventos só do servidor), tolerância curta e sem saída lateral."},{"q":"Onde guardar os agregados para o painel?","e":"DynamoDB por anúncio e minuto para o painel simples; Pinot ou ClickHouse (em EC2/EKS) ou Redshift se o painel precisar de cortes arbitrários.","por":"Se o painel é \"cliques por minuto deste anúncio nas últimas 24 horas\", o acesso é por chave e intervalo: partição = anúncio, ordenação = minuto, no DynamoDB, barato e rápido. Quando o anunciante quer cortar por país, aparelho e idade, com somas em qualquer combinação, o problema vira banco analítico colunar.","contra":"Consultar direto o S3 com o Athena é ótimo para análise e lento demais para um painel que atualiza a cada minuto. Um banco relacional comum com 1 bilhão de linhas por dia vira o gargalo.","muda":"Cortes arbitrários e alta concorrência de consultas: banco OLAP; o Redshift serve se o time já está nele, com atenção à latência de ingestão."},{"q":"Fluxo e lote juntos (lambda) ou só fluxo (kappa)?","e":"Os dois sobre o mesmo log: fluxo para o painel, lote no S3 para a cobrança, comparados todo dia.","por":"A cobrança precisa ser reprocessável: uma regra de fraude nova muda o que foi cobrado ontem, e você roda o lote de novo sobre os dados brutos no S3. Manter os brutos imutáveis no S3 (Iceberg ou S3 Tables) dá essa capacidade de graça. O fluxo dá o painel ao vivo. A comparação diária entre os dois mostra quando um deles está errado.","contra":"Só fluxo (kappa) evita duas implementações da mesma regra, e reprocessar exige reler o log com retenção longa; é viável com Kafka de retenção longa, mais caro. Duas implementações da regra divergem com o tempo; usar a mesma biblioteca de regras nos dois jobs reduz isso.","muda":"Se não há cobrança (só painel interno), fique só com o fluxo."},{"q":"Como filtrar fraude?","e":"Regras rápidas no fluxo (mesmo aparelho clicando demais, IPs de datacenter) e modelos no lote antes de cobrar.","por":"O fluxo descarta o óbvio em tempo real para o painel não mostrar números absurdos. A decisão de cobrar usa mais contexto (padrões do dia inteiro, listas atualizadas), que só existe no lote. Os eventos descartados são guardados com o motivo, para o anunciante poder contestar.","contra":"Filtrar só no fluxo perde padrões que só aparecem no dia inteiro; filtrar só no lote deixa o painel inflado.","muda":"Volume pequeno e sem incentivo à fraude: regras simples no lote bastam."}],"dados":"Brutos no S3 em Parquet/Iceberg por hora; agregados por anúncio e minuto no DynamoDB; faturas no Aurora.","tabelas":[["S3 eventos brutos","data/hora do evento","lote diário e reprocessamento"],["agregados_minuto (DynamoDB)","anuncio_id + minuto","painel: Query num intervalo"],["faturas (Aurora)","anunciante + dia","cobrança e contestação"]],"falhas":[["O job do Flink reinicia","Retoma do último checkpoint; o upsert torna a reescrita idempotente."],["Um shard fica quente","O sufixo nos anúncios quentes espalha; alarme pela métrica de escrita do shard."],["O painel e a fatura divergem 5%","A comparação diária alarma; o lote é a verdade, e a diferença mostra um bug no fluxo ou uma regra que mudou."],["O consumidor fica para trás","O Kinesis guarda os eventos pela retenção; alarme pela idade do registro mais antigo (iterator age), não pelo volume."]],"custo":"Entrada (shards do Kinesis ou brokers do MSK), o Flink (unidades de processamento ligadas o tempo todo) e o armazenamento dos brutos são as linhas principais. O lote diário no Athena cobra por dado lido: Parquet particionado por hora e só as colunas necessárias mantêm isso barato.","evolucao":[["v1","Firehose para o S3 e Athena de hora em hora; sem painel ao vivo."],["v2","Kinesis + Flink com janelas por minuto, upsert no DynamoDB."],["v3","Deduplicação por id, atrasados por saída lateral, lote diário de cobrança e comparação."],["v4","Banco OLAP para cortes arbitrários, regras de fraude compartilhadas entre fluxo e lote."]],"perguntas":["Por que upsert e não incremento na saída do Flink?","O que é a marca d'água, e o que acontece com o evento que chega depois dela?","Por que a cobrança sai do lote e não do fluxo?","Como você escolheria a chave de partição para um anúncio de campanha nacional?"],"pratica":{"t":"Janelas e duplicatas sem nuvem","passos":["Gere 10 milhões de eventos com 2% de duplicatas e 1% atrasados até 3 horas, em Go.","Agregue por minuto em Go com janelas pelo horário do evento, marca d'água de 2 minutos e deduplicação com TTL.","Rode um lote sobre o arquivo completo e compare os totais por anúncio com os do fluxo."],"pronto":["O lote bate exatamente com a contagem esperada","O fluxo difere do lote só pelos atrasados além da tolerância"]},"caps":[14,16,1,8],"livros":[["Kleppmann",12,"Processamento de fluxo","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch12.html","janelas, horário do evento e exactly-once","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"],["Kleppmann",11,"Processamento em lote","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch11.html","processamento em lote e reprocessamento","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"],["Kleppmann",13,"Uma filosofia dos sistemas de fluxo","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch13.html","logs como fonte da verdade","Como projetar aplicativos com uso intensivo de dados, 2ª ed.","kleppmann"]],"links":[["Uber: Real-time exactly-once ad event processing","https://www.uber.com/en-US/blog/real-time-exactly-once-ad-event-processing/"],["Amazon Builders' Library: Avoiding insurmountable queue backlogs","https://aws.amazon.com/builders-library/avoiding-insurmountable-queue-backlogs/"],["DynamoDB: escolhendo o número de fragmentos para tabelas grandes","https://aws.amazon.com/blogs/database/choosing-the-right-number-of-shards-for-your-large-scale-amazon-dynamodb-table"]],"labs":[6]}]};

      '<ul class="esp-lista"><li><b>Aguardando</b> · ' + aguard.length + ' <span class="muted">nascem na primeira semana</span></li>' +

      "<li><b>Dominados</b> · " + dom.length + "</li><li><b>Suspensos</b> · " + sus.length + "</li>" + (dificeis.length ? '<li><b class="warn-t">Difíceis</b> · ' + dificeis.length + " <span class=\"muted\">3 erros ou mais</span></li>" : "") + "</ul>" +
      csTabela(["Origem", "Ativos", "Vencidos", "Dominados"], [["Backend", "backend"], ["IA", "ia"], ["Pitch", "pitch"]].map(function (o) {
        var as = ativos.filter(function (c) { return revOrigem(c) === o[1]; });
        return [o[0], as.length + "", as.filter(function (c) { return c.est.prox <= h0; }).length + "", dom.filter(function (c) { return revOrigem(c) === o[1]; }).length + ""];
      })) + "</div></section>";

    var prox = ativos.filter(function (c) { return c.est.prox > h0; }).sort(function (a, b) { return a.est.prox < b.est.prox ? -1 : a.est.prox > b.est.prox ? 1 : 0; }).slice(0, 6);
    if (prox.length) html += '<section class="section"><h2>Próximos a vencer</h2><div class="card est"><ul class="esp-lista">' + prox.map(function (c) {
      return "<li>" + dataCurta(c.est.prox) + ' · <span class="muted">' + esc(c.tit) + "</span></li>";
    }).join("") + "</ul></div></section>";
    if (sus.length || dom.length) {
      var lst = function (a) { return '<ul class="esp-lista rv-ls">' + a.map(function (c) { return "<li><span>" + esc(c.tit) + ' <span class="muted">· ' + esc(c.q) + '</span></span> <button type="button" class="link-btn" data-act="revreat" data-key="' + attr(c.key) + '">Reativar</button></li>'; }).join("") + "</ul>"; };
      html += '<section class="section"><div class="ia-mods">' +
        (sus.length ? apoioBloco("_rsus", "Susp", "Suspensos", plural(sus.length, "cartão", "cartões"), lst(sus)) : "") +
        (dom.length ? apoioBloco("_rdom", "Dom", "Dominados", plural(dom.length, "cartão", "cartões"), lst(dom)) : "") + "</div></section>";
    }
    return html;
  }

  /* ---------- Interações ---------- */
  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el || !app.contains(el)) return;
    var act = el.dataset.act, d;
    switch (act) {
      case "day":
        S.sel = el.dataset.date; render(); break;
      case "week":
        S.weekStart = addDays(S.weekStart, 7 * +el.dataset.dir);
        var wd = parseIso(S.sel).getDay();
        S.sel = iso(addDays(S.weekStart, wd === 0 ? 6 : wd - 1));
        render(); break;
      case "jump":
        e.preventDefault();
        var t = document.getElementById("treino");
        if (t) t.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
        break;
      case "meal":
        d = ensureDay(S.sel); d.refeicoes[el.dataset.id] = !d.refeicoes[el.dataset.id];
        scheduleSave("dias", S.sel); render(); break;
      case "creatina":
        d = ensureDay(S.sel); d.creatina = !d.creatina; scheduleSave("dias", S.sel); render(); break;
      case "agua":
        d = ensureDay(S.sel); d.agua = Math.max(0, Math.min(12, (d.agua || 0) + +el.dataset.dir));
        scheduleSave("dias", S.sel); render(); break;
      case "swim":
        d = ensureDay(S.sel); var i = +el.dataset.i; d.natacao.etapas[i] = !d.natacao.etapas[i];
        for (var k = 0; k < SWIM.length; k++) d.natacao.etapas[k] = !!d.natacao.etapas[k];
        scheduleSave("dias", S.sel); render(); break;
      case "swimcount":
        d = ensureDay(S.sel); d.natacao.principal = Math.max(0, Math.min(10, (d.natacao.principal || 0) + +el.dataset.dir));
        scheduleSave("dias", S.sel); render(); break;
      case "item":
        var cs = shopState(), m2 = clone(cs.marcados);
        m2[el.dataset.id] = !m2[el.dataset.id];
        if (!m2[el.dataset.id]) delete m2[el.dataset.id];
        saveShop({ marcados: m2, semanas: cs.semanas }); break;
      case "semanas":
        saveShop({ marcados: shopState().marcados, semanas: +el.dataset.w }); break;
      case "limpar":
        saveShop({ marcados: {}, semanas: shopState().semanas }); break;
      case "rest":
        startTimer(+el.dataset.sec, el.dataset.name); break;
      case "pfiltro":
        pFiltro = el.dataset.id; render(); break;
      case "pgo":
        pVai(el.dataset.id); break;
      case "csfiltro":
        csFiltro = el.dataset.id; render(); break;
      case "csgo":
        e.preventDefault(); csVai(el.dataset.id); break;
      case "csfoco":
        var dfc = S.estudo.cases = clone(S.estudo.cases) || {};
        dfc.foco = el.dataset.id; csAbertos[el.dataset.id] = 1; scheduleSave("estudo", "cases"); render(); break;
      case "cslido":
      case "cssoz":
        var dcs = S.estudo.cases = clone(S.estudo.cases) || {}, campoCs = act === "cslido" ? "lido" : "sozinho";
        dcs[campoCs] = dcs[campoCs] || {};
        if (dcs[campoCs][el.dataset.id]) delete dcs[campoCs][el.dataset.id]; else dcs[campoCs][el.dataset.id] = hoje();
        csAbertos[el.dataset.id] = 1; scheduleSave("estudo", "cases"); render(); break;
      case "cspasso":
        var dcp = S.estudo.cases = clone(S.estudo.cases) || {};
        dcp.passos = dcp.passos || {};
        if (dcp.passos[el.dataset.key]) delete dcp.passos[el.dataset.key]; else dcp.passos[el.dataset.key] = hoje();
        csAbertos[el.dataset.key.split(":")[0]] = 1; scheduleSave("estudo", "cases"); render(); break;
      case "rvfiltro":
        revFiltro = el.dataset.id; revUI = { key: "", txt: "", ver: false, nao: false }; render(); break;
      case "revsusp":
        revMudarEstado(el.dataset.key, "susp"); revUI = { key: "", txt: "", ver: false, nao: false }; render(); break;
      case "revreat":
        revMudarEstado(el.dataset.key, ""); render(); break;
      case "prev":
        var dpv = S.estudo.pitch = clone(S.estudo.pitch) || {};
        dpv.rev = dpv.rev || {};
        if (dpv.rev[el.dataset.id]) delete dpv.rev[el.dataset.id]; else dpv.rev[el.dataset.id] = hoje();
        pAbertos[el.dataset.id] = 1; scheduleSave("estudo", "pitch"); render(); break;
      case "blk":
        var rd0 = S.rotina[S.sel] = clone(S.rotina[S.sel]) || { feito: {} };
        rd0.feito = rd0.feito || {};
        if (rd0.feito[el.dataset.id]) delete rd0.feito[el.dataset.id]; else rd0.feito[el.dataset.id] = true;
        scheduleSave("rotina", S.sel); render(); break;
      case "lido":
        var pl1 = S.estudo.plano = clone(S.estudo.plano) || {};
        pl1.lidos = pl1.lidos || {};
        if (pl1.lidos[el.dataset.n]) delete pl1.lidos[el.dataset.n]; else pl1.lidos[el.dataset.n] = hoje();
        scheduleSave("estudo", "plano"); render(); break;
      case "lidol":
        var pl2 = S.estudo.plano = clone(S.estudo.plano) || {};
        pl2.lidosL = pl2.lidosL || {};
        if (pl2.lidosL[el.dataset.key]) delete pl2.lidosL[el.dataset.key]; else pl2.lidosL[el.dataset.key] = hoje();
        scheduleSave("estudo", "plano"); render(); break;
      case "labfeito":
        var pl3 = S.estudo.plano = clone(S.estudo.plano) || {};
        pl3.labsFeitos = pl3.labsFeitos || {};
        if (pl3.labsFeitos[el.dataset.n]) delete pl3.labsFeitos[el.dataset.n]; else pl3.labsFeitos[el.dataset.n] = hoje();
        csAbertos["lab:" + el.dataset.n] = 1; scheduleSave("estudo", "plano"); render(); break;
      case "tempo":
        tempoSel[el.dataset.aba] = tempoSel[el.dataset.aba] === el.dataset.v ? "" : el.dataset.v; render(); break;
      case "revver":
        revUI.ver = true; render(); break;
      case "revnaosei":
        revUI.ver = true; revUI.nao = true; render(); break;
      case "revok":
      case "revno":
        revRegistrar(revUI.key, act === "revok", revUI.txt);
        revUI = { key: "", txt: "", ver: false, nao: false }; render(); break;
      case "revdesfaz":
        revDesfazer(); revUI = { key: "", txt: "", ver: false, nao: false }; render(); break;
      case "ialido":
      case "iapasso":
        var di = S.estudo.ia = clone(S.estudo.ia) || {}, campoI = act === "ialido" ? "lidos" : "passos";
        di[campoI] = di[campoI] || {};
        if (di[campoI][el.dataset.key]) delete di[campoI][el.dataset.key]; else di[campoI][el.dataset.key] = hoje();
        if (el.dataset.mod) iaAbertoUI = el.dataset.mod; scheduleSave("estudo", "ia"); render(); break;
      case "iamod":
        var dm = S.estudo.ia = clone(S.estudo.ia) || {};
        dm.mods = dm.mods || {};
        if (dm.mods[el.dataset.id]) delete dm.mods[el.dataset.id]; else { dm.mods[el.dataset.id] = hoje(); if (dm.foco === el.dataset.id) delete dm.foco; }
        iaAbertoUI = ""; scheduleSave("estudo", "ia"); render(); break;
      case "iafoco":
        var dfo = S.estudo.ia = clone(S.estudo.ia) || {};
        dfo.foco = el.dataset.id; iaAbertoUI = el.dataset.id; scheduleSave("estudo", "ia"); render(); break;
      case "bkcopy":
        var bj = backupJson(), bt = document.getElementById("bk-txt"), bm = document.getElementById("bk-msg");
        try { localStorage.setItem("plano-ult-backup", hoje()); } catch (e2) { /* sem armazenamento local */ }
        var fallback = function () { bt.value = bj; bt.focus(); bt.select(); bm.textContent = "O texto do backup está no campo acima: selecione e copie."; };
        try { navigator.clipboard.writeText(bj).then(function () { bm.textContent = backupResumo(JSON.parse(bj)) + " Copiado (" + Math.max(1, Math.round(bj.length / 1024)) + " KB)."; }, fallback); } catch (e0) { fallback(); }
        break;
      case "bkrest":
        var rt = document.getElementById("bk-txt"), rm = document.getElementById("bk-msg"), rv = rt.value.trim();
        if (!rv) { rm.textContent = "Cole o texto do backup no campo antes."; rt.focus(); break; }
        if (!bkConfirmar) {
          try {
            var ro = JSON.parse(rv);
            if (!ro || ro.v !== 1) throw new Error("formato");
            bkConfirmar = true; el.textContent = "Toque de novo para confirmar";
            rm.textContent = backupResumo(ro) + " Restaurar substitui os registros das mesmas datas.";
          } catch (e3) { rm.textContent = "Esse texto não é um backup deste app."; }
          break;
        }
        bkConfirmar = false;
        try { var rn = restaurarBackup(rv); rt.value = ""; render(); var rm2 = document.getElementById("bk-msg"); if (rm2) rm2.textContent = rn + " registros restaurados."; }
        catch (e1) { el.textContent = "Restaurar"; rm.textContent = "Esse texto não é um backup deste app."; }
        break;
      case "delpeso":
        S.pesos[el.dataset.id] = null; scheduleSave("pesos", el.dataset.id);
        if (S.mode === "local") delete S.pesos[el.dataset.id];
        render(); break;
    }
  });

  app.addEventListener("input", function (e) {
    var inp = e.target;
    if (!inp.dataset || !inp.dataset.in) return;
    var exId = inp.dataset.ex, i = +inp.dataset.i, field = inp.dataset.in;
    var d = ensureDay(S.sel);
    var arr = d.series[exId] = d.series[exId] || [];
    while (arr.length <= i) arr.push({ kg: null, reps: null });
    arr[i] = arr[i] || { kg: null, reps: null };
    arr[i][field] = parseNum(inp.value);
    var row = inp.closest(".set");
    if (field === "reps" && arr[i].reps != null && arr[i].kg == null && row) {
      var kgIn = row.querySelector('[data-in="kg"]');
      var ph = kgIn ? parseNum(kgIn.placeholder) : null;
      if (kgIn && ph != null) { kgIn.value = fmt(ph); arr[i].kg = ph; }
    }
    if (row) row.classList.toggle("filled", arr[i].reps != null);
    // conta exercícios completos sem redesenhar a tela
    var card = inp.closest(".ex");
    if (card) {
      var exDef = WORKOUTS[activityOf(S.sel)].ex.filter(function (x) { return x.id === exId; })[0];
      var filled = arr.filter(function (s) { return s && s.reps != null; }).length;
      card.classList.toggle("done", exDef && filled >= exDef.s);
      var w = WORKOUTS[activityOf(S.sel)];
      var n = w.ex.filter(function (x) { var a = d.series[x.id] || []; return a.filter(function (s) { return s && s.reps != null; }).length >= x.s; }).length;
      var c = document.getElementById("ex-count"); if (c) c.textContent = n + " de " + w.ex.length + " feitos";
    }
    scheduleSave("dias", S.sel);
  });

  app.addEventListener("submit", function (e) {
    if (e.target.id !== "peso-form") return;
    e.preventDefault();
    var date = document.getElementById("pf-data").value || iso(today);
    var kg = parseNum(document.getElementById("pf-kg").value);
    var cint = parseNum(document.getElementById("pf-cint").value);
    if (kg == null && cint == null) { document.getElementById("pf-kg").focus(); return; }
    if (kg != null && (kg < 40 || kg > 200)) { document.getElementById("pf-kg").setCustomValidity("Confira o peso"); document.getElementById("pf-kg").reportValidity(); return; }
    var prev = S.pesos[date] || {};
    S.pesos[date] = { kg: kg != null ? kg : (prev.kg != null ? prev.kg : null), cintura: cint != null ? cint : (prev.cintura != null ? prev.cintura : null) };
    scheduleSave("pesos", date);
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    render();
  });
  app.addEventListener("change", function (e) { if (e.target.id === "pf-kg") e.target.setCustomValidity(""); });

  /* ---------- Abas ---------- */
  function readHash() {
    var h = (location.hash || "").replace("#", "");
    S.tab = (h === "peso" || h === "plano" || h === "compras" || h === "backend" || h === "ia" || h === "pitch" || h === "cartoes") ? h : (h === "cases" || h === "estudos") ? "backend" : "hoje";
  }
  window.addEventListener("hashchange", function () { readHash(); render(); window.scrollTo(0, 0); });

  /* ---------- Timer de descanso ---------- */
  var timerEl = document.getElementById("timer"), timerVal = document.getElementById("timer-value"), timerLab = document.getElementById("timer-label");
  var timerEnd = 0, timerTick = null, actx = null;
  function ensureAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = actx || new AC();
      if (actx.state === "suspended") actx.resume();
    } catch (e) { actx = null; }
  }
  function beep() {
    try {
      if (!actx) return;
      [0, 0.25].forEach(function (off) {
        var o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + off;
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
        o.connect(g); g.connect(actx.destination);
        o.start(t0); o.stop(t0 + 0.22);
      });
    } catch (e) { /* sem som */ }
  }
  function startTimer(sec, name) {
    ensureAudio();
    timerEnd = Date.now() + sec * 1000;
    timerLab.textContent = "Descanso · " + name;
    timerEl.classList.remove("end");
    timerEl.hidden = false;
    clearInterval(timerTick);
    timerTick = setInterval(tick, 250);
    tick();
  }
  function tick() {
    var left = (timerEnd - Date.now()) / 1000;
    if (left <= 0) {
      clearInterval(timerTick);
      timerVal.textContent = "0:00";
      timerLab.textContent = "Hora da próxima série";
      timerEl.classList.add("end");
      beep();
      return;
    }
    timerVal.textContent = mmss(left);
  }
  document.getElementById("timer-add").addEventListener("click", function () {
    if (timerEl.classList.contains("end")) { timerEl.classList.remove("end"); timerEnd = Date.now(); clearInterval(timerTick); timerTick = setInterval(tick, 250); }
    timerEnd += 30000; tick();
  });
  document.getElementById("timer-stop").addEventListener("click", function () { clearInterval(timerTick); timerEl.hidden = true; });

  /* ---------- Início ---------- */
  readHash();
  render();

  function applySnapshot(col, snap) {
    var store = S[col];
    var seen = {};
    snap.docs.forEach(function (doc) {
      seen[doc.id] = true;
      var key = col + "/" + doc.id;
      if (dirty.has(key) || writing.has(key)) return;
      store[doc.id] = clone(doc.data());
    });
    Object.keys(store).forEach(function (id) {
      var key = col + "/" + id;
      if (!seen[id] && !dirty.has(key) && !writing.has(key)) delete store[id];
    });
  }

  (function connect() {
    var use = window.claude && typeof window.claude.use === "function" ? window.claude.use : null;
    if (!use) { goLocal(); return; }
    Promise.resolve().then(function () { return use.call(window.claude, "db"); }).then(function (ns) {
      if (!ns) { goLocal(); return; }
      db = ns;
      S.mode = "cloud";
      var confirmed = { dias: false, pesos: false, compras: false, rotina: false, estudo: false };
      var slowTimer = setTimeout(function () { if (Object.keys(confirmed).some(function (c) { return !confirmed[c]; })) setStatus("slow"); }, 10000);
      ["dias", "pesos", "compras", "rotina", "estudo"].forEach(function (col) {
        db.collection(col).onSnapshot(function (snap) {
          applySnapshot(col, snap);
          if (!snap.metadata.fromCache && !confirmed[col]) {
            confirmed[col] = true;
            if (Object.keys(confirmed).every(function (c) { return confirmed[c]; })) { clearTimeout(slowTimer); if (!dirty.size && !writing.size) setStatus("saved"); }
          }
          requestRender();
        }, function (err) {
          clearTimeout(slowTimer);
          if (err && err.code === "unavailable") { setStatus("slow"); return; }
          goLocal();
        });
      });
    }).catch(function () { goLocal(); });
  })();
})();
</script>

if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
