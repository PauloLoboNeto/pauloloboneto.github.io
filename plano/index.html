o p95 subir.","a":["<code>GET /resumo-semana</code> com p95 de até 20 ms a 50 req/s, sem varrer o histórico do aluno","O resumo reflete uma série registrada em até 5 s (ou o atraso medido está registrado)","Recalcular não bloqueia a escrita de séries","Registro de decisão com o custo medido de cada estratégia: tempo de leitura, custo de escrita e atraso"]},"p2:BD-02":{"c":"Write skew do limite semanal reproduzido e resolvido, com retry de serialização","q":"Reproduza com duas sessões psql lado a lado em <code>READ COMMITTED</code>, <code>REPEATABLE READ</code> e <code>SERIALIZABLE</code>, e anote em qual nível o limite estoura.","a":["Teste em Go com 100 goroutines reservando para o mesmo aluno nunca passa de 3 aulas na semana","Registro com a tabela das duas sessões e a anomalia vista em cada nível","Retry de falha de serialização (SQLSTATE <code>40001</code>) com limite de tentativas e métrica","A versão que materializa o conflito (linha de contagem por aluno e semana) passa no mesmo teste sem <code>SERIALIZABLE</code>"]},"p2:AGE-02":{"c":"200 reservas concorrentes para 1 vaga: 1 confirmada, 199 recebem 409","q":"Dispare 200 reservas concorrentes contra uma raia com 1 vaga, usando k6, e conte as confirmadas. Se o resultado for maior que 1, o bug está reproduzido.","a":["200 reservas concorrentes para 1 vaga: 1 confirmada e 199 recebem 409","Aulas e raias diferentes não disputam lock entre si","O registro compara pelo menos duas estratégias medidas, com p95 e taxa de retry de cada uma"]},"p2:BD-03":{"c":"Deadlock reproduzido, lido no log e eliminado com ordem de lock","q":"Gere carga com reordenações em ordem aleatória sobre o mesmo treino; capture o deadlock no log e as linhas de <code>pg_locks</code> durante a espera.","a":["Zero deadlocks em 10 minutos de carga com reordenações concorrentes","Toda transação que trava várias linhas as trava em ordem fixa de id, com um teste que embaralha a entrada","Transações curtas: nenhuma chamada externa ou espera de usuário dentro delas","Tempo de espera por lock no dashboard, a partir de <code>pg_stat_activity</code>, e o erro <code>40P01</code> tratado com retry limitado"]},"p2:TRE-05":{"c":"Chaves de idempotência na mesma transação da sessão, com resposta repetida idêntica","q":"Dispare cinco <code>POST</code> iguais e simultâneos de \"Finalizar treino\" contra o mock e depois contra o Go. Conte quantas sessões aparecem no histórico e some o volume da semana.","a":["5 requisições iguais e simultâneas: 1 sessão, 1 evento, mesma resposta nas 5","A chave e a resposta ficam numa tabela de idempotência gravada na mesma transação da sessão","Um novo treino legítimo, com chave nova, gera nova sessão; passa também via <code>curl</code>"]},"p2:TRE-06":{"c":"Lost update reproduzido e resolvido com versão otimista e 409 explicado","q":"Escreva um teste em Go que abre a sessão em duas goroutines, altera séries diferentes e salva as duas com <code>UPDATE</code> direto. Mostre que uma alteração se perde, e repita 100 vezes para ver a frequência.","a":["O teste reproduz o lost update antes da correção, com a taxa de perdas medida","A linha da sessão tem uma coluna <code>versao</code>; o <code>UPDATE</code> só vale se a versão enviada for a atual","Quando a versão não bate, a API devolve 409 com a versão atual e a mensagem \"este treino foi alterado em outro aparelho\"","Com a correção, 100 execuções concorrentes não perdem nenhuma alteração confirmada","A decisão e a medição ficam no registro de decisão (ADR)"]},"p2:TRE-03":{"c":"Motor de progressão em Go sobre o histórico, com testes de tabela","q":"Escreva o histórico de quatro sessões do supino (8, 8, 8, 7; depois 8, 8, 8, 8) numa planilha e aplique a regra à mão. Anote cada caso de borda que a planilha não respondeu: série pulada, faixa mudada, equipamento sem incremento de 2,5 kg.","a":["O motor recebe o histórico e a faixa e devolve a próxima carga em gramas: 60000 permanece com 8, 8, 8, 7 e vira 62500 com 8, 8, 8, 8","O incremento é o menor disponível no equipamento (barra com anilha de 1,25 kg = 2500 g por par; máquina com pino de 5 kg)","Testes de tabela cobrem série pulada, sessão incompleta, faixa mudada e a semana leve","Dois cálculos com o mesmo histórico dão o mesmo resultado"]},"p2:DIE-02":{"c":"Substitutos por vizinho mais próximo em macros, com restrições e índice que não varre 300 mil linhas","q":"Calcule a distância entre o arroz e todos os alimentos da base por uma varredura linear e meça o tempo. Veja quantos dos dez primeiros são alimentos que o aluno não come.","a":["Os vizinhos mais próximos são calculados no espaço (carboidrato, proteína, gordura) em décimos de grama, com a quantidade ajustada para a mesma caloria","Alimentos restritos (maçã, mel) nunca aparecem, nem como segunda opção","A consulta não varre as 300 mil linhas: p95 abaixo de 50 ms a 50 req/s no k6, com <code>EXPLAIN ANALYZE</code> anexado"]},"p2:DIE-03":{"c":"Busca por prefixo e código de barras em 300 mil alimentos com p95 abaixo de 50 ms","q":"Rode a busca com <code>ILIKE</code> sobre os 300 mil alimentos num k6 a 50 req/s e meça o p95. Depois pesquise \"fra\" e \"frã\" e veja o que muda.","a":["Busca por prefixo e por código de barras com p95 abaixo de 50 ms a 50 req/s no k6, com <code>EXPLAIN ANALYZE</code> anexado","\"fra\" encontra \"frango grelhado\" mesmo sem acento; recentes são listados por aluno"]},"p2:EXE-05":{"c":"Grafo de equivalências em Go com BFS, restrições do aluno e resposta abaixo de 20 ms","q":"Liste à mão os três substitutos do leg press 45 para esse aluno. Depois tente descrevê-los em regras: o que os liga? Essa lista é o conjunto de teste.","a":["Botão \"Trocar\" na sessão de treino mostra os substitutos vindos do mock, e a troca mantém as séries já feitas (tela)","Grafo de equivalências entre exercícios em Go, com busca em largura, distância máxima e filtro pelas restrições do aluno (Go)","Resposta abaixo de 20 ms e nenhum substituto fora da restrição, testado com o aluno \"perna só em máquina\" (Go)","Resultado ordenado por distância no grafo; empates por ordem estável"]},"p2:EVO-01":{"c":"Médias móveis e regra de ajuste no Go, com série temporal bem indexada","q":"Semeie oito semanas de pesagens com ruído de ±1 kg em torno de uma tendência de 250 g por semana e faça a regra olhar só o último dia. Conte quantas vezes ela sugere ajuste sem necessidade; esse número é o que a média semanal deve derrubar.","a":["A média semanal usa a semana no fuso do aluno e dá o mesmo número que o mock para a série do seed","A regra sugere +130 kcal uma única vez por período parado e não repete enquanto a anterior não for aceita ou dispensada","A série de cinco anos de um aluno volta em p95 ≤ 20 ms, com índice por aluno e instante da medição"]},"p2:HOJ-02":{"c":"Agenda de refeições e treinos calculada no servidor com o fuso do aluno e relógio injetável nos testes","q":"Escreva um teste que calcula a agenda de um aluno de São Paulo e a mesma agenda depois de ele trocar o fuso para Lisboa, e outro que atravessa a virada do horário de verão. Veja quantas refeições mudam de instante sem mudar de hora local.","a":["Instantes guardados em UTC; refeições e treinos guardados como hora local mais o fuso IANA do aluno (<code>America/Sao_Paulo</code>)","A agenda do dia é calculada no servidor com as regras do tz database; viajar para Lisboa mantém café às 8h45 locais","Dia de mudança de horário gera as refeições uma vez cada, sem sumir nem duplicar","Durações medidas com relógio monotônico; o relógio é uma interface injetável e os testes usam um relógio falso"]},"p2:ROT-02":{"c":"Modelos de dia com RRULE expandidos no fuso do aluno, com exceções e testes de horário de verão","q":"(Go) Escreva a expansão ingênua: somar 7 dias em UTC a partir de segunda 8h15 em <code>America/Sao_Paulo</code>. Rode contra uma viagem a <code>America/New_York</code> que atravessa 8 de março de 2026, quando o horário de verão começa, e veja o bloco ir para 9h15 locais.","a":["A regra <code>FREQ=WEEKLY;BYDAY=MO,TU</code> às 8h15 produz ocorrências às 8h15 locais antes e depois da mudança de horário de verão, com instantes UTC diferentes","Horário local inexistente ou repetido na virada é resolvido por regra documentada, com teste","A expansão de uma semana de 7 dias lê só os modelos do aluno e as exceções do intervalo, em uma consulta"]},"p2:ROT-03":{"c":"Plano de estudo, sessões, capítulos lidos e progresso no Postgres, com a sugestão do próximo item e a leitura da semana calculadas no Go","q":"(Go) Sem escrever o planejador, monte à mão no Postgres a semana 4 do ciclo com 7h20 estudadas e um item feito fora de ordem. Descubra qual deve ser o \"próximo sugerido\" e se ele muda quando o aluno marca o item da semana seguinte antes de fechar o atual.","a":["O próximo sugerido é o primeiro item não feito na ordem da rota, e a mesma entrada dá sempre a mesma saída","A leitura da semana é derivada dos itens: a união dos capítulos dos dois itens, sem repetir, com os já lidos marcados; não existe \"capítulo atual\" gravado à parte","A semana 6 do ciclo é marcada como leve, com a meta reduzida, e o contador reinicia depois dela","Sessões e progresso persistem no Postgres, e o total de horas é a soma das sessões, não um contador solto"]},"p2:ROT-04":{"c":"Planejador de lotes em Go com a restrição de validade, testado com semanas de escritório diferentes","q":"(Go) Planeje com uma regra só: \"tudo na geladeira\". Rode para uma semana com escritório na segunda e na terça e liste as porções que seriam comidas no quarto dia ou depois.","a":["Nenhuma porção na geladeira é consumida mais de 3 dias depois de cozida, em qualquer combinação de dias de escritório","O total de porções cobre as refeições do plano até a próxima janela, sem sobra de mais de uma porção","Trocar um dia de escritório recalcula só as janelas afetadas"]},"p2:ROT-05":{"c":"Reorganização gulosa por prioridade com detecção de sobreposição, explicada ao aluno","q":"Escreva o dia da quarta com a reunião até 20h e rode um detector de sobreposição que só diz \"conflito\". Conte quantas decisões ainda dependem de uma pessoa para o dia ficar válido.","a":["Sobreposições são detectadas ordenando os blocos pelo início, em O(n log n), e dois blocos que só se tocam (um termina às 19h30, outro começa às 19h30) não conflitam","O sono às 23h30 nunca é movido; o treino é deslocado antes de ser cortado; o estudo é cortado antes do trabalho","A revisão encolhe até 25 min e nunca some","Nenhum bloco é movido para o domingo, e se não cabe em outro dia a resposta diz isso","Cada corte ou deslocamento vem com a razão (\"prática cortada: sono tem prioridade e acabaria às 23h40\")"]},"p2:BD-04":{"c":"Pool dimensionado, statement_timeout e pool separado para relatórios","q":"Dispare 15 relatórios simultâneos com o k6 e observe as estatísticas do pgxpool (espera para adquirir conexão) e as sessões ativas no <code>pg_stat_activity</code>.","a":["Tamanho do pool justificado pela Lei de Little com números medidos (vazão × tempo com a conexão)","<code>statement_timeout</code> e <code>idle_in_transaction_session_timeout</code> configurados, com o erro tratado na API","Pool separado para relatórios, de modo que o p95 de \"Hoje\" não muda com 15 relatórios rodando","O relatório sai do caminho quente: roda em segundo plano ou numa tabela de resumo pré-calculada"]},"p2:CON-01":{"c":"Data race achado com -race e resolvido com mutex, atomic ou canal, com benchmark","q":"Teste com 1.000 goroutines incrementando o mesmo contador; rode com e sem <code>-race</code> e compare o total final e o relatório do detector.","a":["<code>go test -race</code> limpo, rodando no <code>make verify</code>","Benchmark de <code>Mutex</code>, <code>RWMutex</code>, <code>atomic</code> e mapa fatiado com 1, 8 e 64 goroutines, com o gráfico no registro","O contador por academia usa a opção que o benchmark justifica, e o número nunca fica negativo","O estado em memória é reconstruído a partir dos check-ins abertos quando o processo reinicia"]},"p2:TRE-07":{"c":"Traces OpenTelemetry no Go, do handler à query e ao publish","q":"","a":["Painel com taxa, erros e p50/p95/p99 por endpoint","O trace de uma finalização mostra o handler HTTP, cada query do pgx e o publish do evento, cada um como um span","Alerta quando o p95 de \"Finalizar treino\" passa de 1 s por 2 min"]},"p2:CON-02":{"c":"Importação em pipeline com worker pool e errgroup, com o speedup medido","q":"Rode com 1, 4, 16, 64 e 256 workers e plote vazão e erros; ache onde a curva para de subir e quem passa a ser o gargalo (banco ou disco).","a":["Pipeline em estágios (ler, normalizar, gravar) com canais com buffer e workers por estágio, com a gravação em lotes","Cancelar com Ctrl+C para tudo em menos de 2 s, sem goroutine vazando (<code>goleak</code> no teste)","Erro numa linha não derruba a importação; as falhas saem num relatório","Speedup medido e explicado no registro, com o ponto em que deixa de escalar"]},"p2:CON-03":{"c":"Relatórios gerados por workers com fila, sem afetar a API, com pprof","q":"Gere os relatórios no processo da API e meça o p95 de \"Hoje\" durante o lote. Depois rode com <code>GOMAXPROCS</code> 1, 2, 4 e 8 e calcule o speedup.","a":["Relatórios gerados por workers dedicados, consumindo uma fila, em processo separado da API","O p95 da API não muda de forma mensurável enquanto o lote roda","Perfil de CPU no pprof e uma otimização tirada do perfil, não de palpite","Speedup medido e explicado no registro, separando a parte limitada por CPU (agregação) da limitada por I/O (consultas e gravação)"]},"p2:CON-04":{"c":"Cancelamento propagado do handler à query, sem goroutine órfã","q":"Dispare o envio de 40 séries, cancele a requisição no cliente e veja no <code>pg_stat_activity</code> que as queries seguem vivas.","a":["O <code>context.Context</code> da requisição chega do handler ao pgx; a query some do <code>pg_stat_activity</code> em menos de 1 s após o cancelamento","Teste com <code>goleak</code> mostra que nenhuma goroutine fica órfã depois do cancelamento","Orçamento de tempo por rota, dividido entre as chamadas internas por deadline","Cancelar no meio não deixa metade das séries gravadas: a transação desfaz tudo ou o lote é idempotente"]},"p2:ASS-03":{"c":"Timeouts, circuit breaker e bulkhead em volta do gateway, medidos com o gateway lento","q":"Ponha o gateway simulado em 8 s de latência, dispare 100 assinaturas por segundo e observe o número de goroutines, as conexões livres do pool e o p95 da rota \"Hoje\".","a":["Com o gateway em 8 s, a assinatura responde com p95 ≤ 300 ms, com o pagamento em PENDENTE","Cada chamada ao gateway tem timeout de 3 s e propaga o contexto: cancelar a requisição cancela a chamada","O circuit breaker abre após 5 falhas seguidas, testa em meio-aberto e fecha quando o gateway volta","O bulkhead limita a 20 chamadas simultâneas ao gateway; o p95 da rota \"Hoje\" não muda durante o teste","Goroutines e conexões livres do pool ficam estáveis durante a lentidão"]},"p2:AGE-04":{"c":"Check-in por QR assinado, validado sem banco, aguentando o pico com k6","q":"Escreva um teste k6 em TypeScript que simula 400 check-ins em 60 segundos contra a versão atual, com a consulta ao banco no caminho, e registre p95 e p99. Esse é o 4 s que vamos derrubar.","a":["O token do QR é assinado (Ed25519), com validade de 30 s, e a verificação não faz nenhuma consulta ao banco (contador de queries em zero no teste)","Token expirado ou adulterado recebe 401 em menos de 5 ms de CPU","Com 400 check-ins em 60 s, p95 ≤ 100 ms, e o serviço é stateless com 3 réplicas atrás do balanceador","O registro vai para uma fila e é gravado de forma idempotente por aluno e janela; com a fila fora do ar, a catraca ainda libera e o registro é recuperado depois","O k6 roda no CI com limite de p95 que quebra o build"]},"p2:MSG-01":{"c":"Consumidor de recordes idempotente, testado com reentrega","q":"Mate o consumidor com kill -9 entre o efeito e o ack, em loop, e conte as medalhas duplicadas no aluno do seed.","a":["Tabela de eventos processados (id do evento, consumidor) gravada na mesma transação do efeito; a duplicata é ignorada","Caos: 1.000 eventos de treino, consumidor morto 50 vezes, zero medalha duplicada e zero perdida","Registro apontando a linha exata do código em que a entrega pelo menos uma vez vira efeito único","Teste de reentrega no CI: o mesmo evento entregue três vezes produz um único recorde"]},"p2:MSG-02":{"c":"Ordem por aluno garantida pela chave de partição e eventos atrasados tratados","q":"Publique os eventos de um mesmo treino em partições diferentes (ou com dois consumidores numa fila) e reproduza a inversão.","a":["Chave de partição = id do aluno; os eventos de um aluno chegam na ordem em que foram gravados","Cada evento carrega um número de sequência por treino; o consumidor descarta o de sequência menor que a já aplicada e segura o que pula uma posição","Evento atrasado depois de \"treino.finalizado\" reabre o resumo e o recalcula, em vez de ser ignorado","Subir e derrubar consumidores do grupo (rebalance) sem inverter nem perder evento"]},"p2:MSG-03":{"c":"Outbox transacional com relay, sem perda nem vazamento","q":"Coloque um os.Exit entre o COMMIT e o publish, rode 1.000 treinos e conte quantos ficaram sem evento.","a":["O evento é gravado na tabela outbox na mesma transação do treino; o treino sem evento passa a ser impossível","Relay publica as linhas pendentes e as marca como enviadas; duas instâncias em paralelo não disputam as mesmas linhas nem inventam duplicata (a duplicata que sobrar é absorvida pelo MSG-01)","Caos: processo morto 50 vezes entre o commit e o publish, zero evento perdido","A outbox é limpa sem DELETE gigante (em lote ou por partição)"]},"p2:MSG-04":{"c":"Evolução do evento com compatibilidade nos dois sentidos, testada","q":"Publique a versão nova com o consumidor antigo rodando e veja o ranking absurdo.","a":["Contrato do evento versionado (Protobuf ou JSON Schema) e checado no CI contra a versão anterior","Regra registrada: só mudança compatível (campo novo opcional); mudar a unidade ou o significado exige evento novo (por exemplo \"treino.finalizado.v2\"), publicado em paralelo até migrar todos","Compatibilidade nos dois sentidos testada: consumidor novo lê evento antigo e consumidor antigo lê evento novo sem quebrar","Um consumidor novo reprocessa um dia de eventos a partir do offset zero, provando que o histórico serve de fonte"]},"p2:MSG-05":{"c":"SQS com visibilidade certa, DLQ e redrive no LocalStack","q":"No LocalStack, crie a fila com 30 s de visibilidade, rode dois workers e conte quantos lembretes saem por refeição; depois publique uma mensagem inválida e veja quantas vezes ela volta.","a":["O worker estende a visibilidade enquanto trabalha (ChangeMessageVisibility em heartbeat) e o efeito é idempotente, como no MSG-01","Long polling e leitura e exclusão em lote, com as requisições por mil mensagens anotadas antes e depois","DLQ com maxReceiveCount = 5 e redrive de volta para a fila depois de corrigir o bug","Alarme de profundidade da DLQ no Grafana"]},"p2:MSG-06":{"c":"Fan-out SNS para SQS com três consumidores independentes","q":"Ponha os três consumidores numa fila só e veja quem recebe cada mensagem e quanto o ranking espera.","a":["Um tópico SNS com uma fila SQS por consumidor (fan-out), cada fila com DLQ própria","Filter policy: o ranking só recebe treinos de alunos que aderiram a um desafio, filtrado no SNS, sem código no consumidor","Derrubar o resumo semanal por uma hora não atrasa os outros dois, e ele recupera o atraso sozinho ao voltar","Os três consumidores idempotentes, como no MSG-01"]},"p2:MSG-07":{"c":"Kafka com partições por aluno, consumer group e lag medido","q":"Suba 3 brokers, produza 5.000 eventos de treino com acks=1, derrube o líder no meio e conte as perdas; repita com acks=all. Depois escale o consumidor e conte os reprocessados.","a":["Chave = id do aluno, 12 partições, fator de replicação 3, min.insync.replicas=2 e acks=all com produtor idempotente: nenhuma perda ao derrubar um broker","Consumer group com commit de offset depois do efeito e rebalance cooperativo; o reprocessamento do rebalance é absorvido pela idempotência do MSG-01","Lag por grupo e partição no Grafana, com alerta acima de 30 s","Retenção por tempo no tópico de treinos, justificada por escrito"]},"p2:MSG-08":{"c":"ADR comparando fila, log e pub/sub para os fluxos do app","q":"Implemente o mesmo fluxo (\"treino finalizado\" até o recorde) na fila, no SNS com SQS e no Kafka, e meça a latência p99, as perdas no caos do MSG-01 e as linhas de código de cada um.","a":["Registro de decisão (ADR) com cada fluxo do app e a tecnologia escolhida por critério (ordem, replay, retenção, fan-out, quem opera), não por gosto","Custo estimado de cada opção para 50 mil alunos ativos, com as premissas escritas","O registro responde o que mudaria cada escolha (volume, replay, ordem, equipe de operação)","Tabela de decisão cruzando os resultados medidos do MSG-06 e do MSG-07"]},"p2:MSG-09":{"c":"Lembretes agendados com jitter e rate limit, sem thundering herd","q":"Com o k6, dispare 25 mil lembretes no mesmo segundo contra um provedor falso que aceita 500 por segundo, e meça quantos chegam, em quanto tempo e quantos retries a rajada gera.","a":["Agendamento com jitter: o lembrete de 8h45 sai espalhado numa janela de 5 minutos, sem passar do horário local de cada aluno","Rate limit no envio ao provedor, com as mensagens excedentes esperando em fila atrasada em vez de falhar","Retry com backoff exponencial e jitter, com teto de tentativas e DLQ","Provedor fora do ar por 2 minutos: nenhum lembrete perdido e nenhuma rajada de retry quando ele volta"]},"p2:ASS-04":{"c":"Webhook do gateway vira evento e chega ao SSE pelo outbox","q":"","a":["O webhook do gateway vira evento pelo outbox (MSG-03) e chega ao SSE","Webhook entregue duas vezes gera um só evento, e os ids dos eventos são crescentes por assinatura"]},"p2:ASS-05":{"c":"Retry com backoff e jitter pelo outbox, sem cobrança dupla","q":"","a":["As chamadas ao gateway caem para &lt; 1/s em até 10 s depois da queda","Pendentes processados em ≤ 5 min depois da volta, com 5 falhas seguidas indo para a DLQ visível no dashboard","Em 1.000 assinaturas durante a queda, nenhuma cobrança duplicada"]},"p2:AGE-03":{"c":"Fila de espera por aula com janela de 15 min, dirigida por eventos","q":"","a":["Cancelamento com 5 pessoas na fila: só o primeiro recebe o aviso, e a vaga fica reservada a ele","Sem confirmação em 15 minutos (relógio controlado no teste), a reserva expira e o segundo é avisado; o primeiro volta ao fim ou sai, conforme a regra definida","O evento de vaga liberada entregue duas vezes avisa uma vez só","Matar o consumidor no meio da passagem de vez não perde nem duplica o aviso","Fila vazia devolve a vaga ao público, e a ordem da fila é a do instante de entrada"]},"p2:ROT-06":{"c":"Resumo das 22h por aluno, dirigido por eventos e idempotente","q":"Faça o consumidor processar a mesma mensagem duas vezes, como acontece quando a fila reentrega por timeout, e veja o aluno receber dois resumos. Depois mude o fuso do perfil de um aluno para <code>Europe/Lisbon</code> e veja a que hora o job dispara.","a":["O resumo sai às 22h no fuso do aluno, e uma mudança de fuso reagenda o próximo disparo","Reentrega da mesma mensagem resulta em um só envio, com chave por aluno e data local","O conteúdo vem dos eventos do dia (blocos feitos, treino, estudo) e do plano de amanhã, sem varrer o histórico","Uma falha no envio vai para nova tentativa e, esgotada, para a DLQ, sem duplicar o resumo","O disparo de 50 mil alunos distribui a carga ao longo da hora, sem pico em um único segundo"]},"p2:DIS-01":{"c":"Fronteiras dos módulos revistas e um serviço extraído, com ADR","q":"Liste toda query que cruza as fronteiras (JOIN entre assinatura, cobrança e acesso) e toda transação que abrange as três.","a":["Fronteiras dos módulos redesenhadas no monólito modular, com dependências só por interface; teste de arquitetura no CI falhando em import proibido","Um serviço extraído em Go (o candidato mais óbvio é o acesso da catraca, por ter perfil de carga e deploy próprios) com banco próprio, chamado por API; nenhum JOIN cruza a fronteira","Migração estilo strangler: tráfego desviado por feature flag, com volta imediata","ADR com o mapa de contextos, a quanta resultante e o que ficou pior (latência, consistência, operação)"]},"p2:DIS-02":{"c":"Saga orquestrada com estado persistido e compensações idempotentes","q":"Injete falha em cada passo; depois mate o orquestrador entre os passos e anote o estado final de cada banco.","a":["Orquestrador com máquina de estados persistida; ao reiniciar, retoma do passo em que parou","Uma compensação idempotente e testada para cada passo (estornar, revogar o acesso, desatribuir os profissionais); as boas-vindas ficam por último, porque não têm compensação","Caos: falha em qualquer passo ou queda do orquestrador sempre termina em ATIVA ou CANCELADA, com cobrança e acesso conciliados","Cada comando do orquestrador carrega uma chave de idempotência, como no ASS-02"]},"p2:DIS-03":{"c":"Saga coreografada comparada com a orquestrada em ADR","q":"Reimplemente o fluxo do DIS-02 só com eventos, num branch, e tente responder \"em que passo está a assinatura do aluno 123?\".","a":["O fluxo coreografado passa no mesmo teste de caos do DIS-02","Todos os eventos de uma assinatura ligados no mesmo trace do OpenTelemetry por um correlation id","ADR comparando as duas versões em código, testes, acoplamento e tempo para diagnosticar uma falha","Consulta que lista as assinaturas paradas há mais de 10 minutos em algum passo"]},"p2:CON-05":{"c":"Job com SKIP LOCKED, desligamento gracioso e lease entre instâncias","q":"Suba 2 instâncias e conte quantas vezes cada vaga foi liberada; depois pause com <code>SIGSTOP</code> a instância que segura o lease, espere o TTL vencer e retome.","a":["Cada vaga liberada exatamente uma vez, com 2 instâncias e uma delas pausada no meio","Desligamento gracioso: no <code>SIGTERM</code>, o job termina o item em andamento em até 10 s e para de pegar novos","Fencing token: a escrita de quem perdeu o lease é recusada pelo banco","Registro explicando por que um lock com TTL sozinho não garante exclusão"]},"p2:ASS-02":{"c":"Renovação com eleição de dono, lease, fencing token e idempotência por ciclo","q":"Suba 3 réplicas e conte quantas vezes cada assinatura foi cobrada no ciclo. Depois pause com SIGSTOP a réplica que detém o lock, espere o TTL vencer, deixe outra assumir e retome a pausada.","a":["Cada assinatura é cobrada exatamente uma vez por ciclo, com 3 réplicas e uma delas pausada no meio","Fencing token: a escrita de quem perdeu a liderança é recusada pelo banco","A chave de idempotência é (assinatura, ciclo) e vai também ao gateway, de modo que um retry depois de timeout não cobra de novo","Registro explicando por que um lock com TTL sozinho não garante exclusão"]},"p2:DIS-04":{"c":"Modelo de leitura do painel alimentado por eventos, reconstruível","q":"Rode o painel junto com o k6 do registro de treino e meça o p95 do registro com e sem ele.","a":["Modelo de leitura separado (tabela desnormalizada por aluno e semana) alimentado pelos eventos da trilha MSG","Painel abre em menos de 300 ms para 40 alunos","Projeção reconstruída do zero a partir do log em menos de 10 minutos","O painel mostra \"atualizado há X s\", e o atraso da projeção aparece no dashboard"]},"p2:DIS-05":{"c":"Ledger de créditos com event sourcing e saldo projetado","q":"Tente responder \"por que meu saldo é 7?\" com o modelo atual para três alunos.","a":["O ledger guardado como eventos (comprado, usado, devolvido, expirado, estornado), com o saldo como projeção","Snapshot a cada 50 eventos, com saldo idêntico com e sem snapshot","Concorrência otimista no stream (versão esperada) impedindo o uso da mesma aula por duas reservas simultâneas, como na última vaga do AGE-02","Consulta de auditoria que lista, em ordem, todo evento do saldo de um aluno"]},"p2:DIS-06":{"c":"Cancelamento durante a saga com lock semântico e estados intermediários","q":"Dispare o cancelamento em cada passo da saga, com atrasos aleatórios, e anote o estado final do pagamento e da catraca.","a":["Estados intermediários explícitos (COBRANDO, CANCELANDO) e lock semântico: enquanto a saga está em curso, o cancelamento vira um pedido registrado, não uma escrita concorrente","Cancelamento durante a cobrança espera o resultado do gateway e depois compensa (estorna e revoga o acesso)","Caos: cancelamento em qualquer ponto da saga termina com pagamento e acesso conciliados, nunca cobrança sem acesso nem acesso sem cobrança","Cancelamento repetido pelo aluno não gera dois estornos"]},"p2:ROT-07":{"c":"Modelo de leitura semanal alimentado por eventos dos módulos","q":"(Go) Escreva a revisão como uma consulta que une estudo, treinos, refeições e pesagens, e meça o tempo com o histórico do seed de 5 anos. Anote quantas tabelas ela toca e o que quebra se um módulo mudar o schema.","a":["O modelo de leitura é uma linha por aluno e semana, atualizada por eventos dos módulos","Reprocessar os eventos de uma semana produz a mesma linha, e um evento repetido não soma duas vezes","Abrir a revisão lê uma linha, em p95 abaixo de 50 ms com o seed completo"]},"p2:BD-05":{"c":"Bloat medido e controlado com autovacuum, fillfactor e HOT updates","q":"Rode 1 hora de carga de updates com o autovacuum padrão e meça o tamanho da tabela, <code>n_dead_tup</code> e a fração de HOT updates em <code>pg_stat_user_tables</code>.","a":["Tamanho da tabela estável depois de 1 hora de carga","Mais de 90% dos updates como HOT, com <code>fillfactor</code> e índices ajustados","Registro explicando, com <code>xmin</code> e <code>xmax</code>, por que um <code>UPDATE</code> grava uma linha nova","Autovacuum configurado por tabela, com o tempo entre execuções visível no dashboard"]},"p2:BD-06":{"c":"Réplica de leitura com ler a própria escrita garantido","q":"Suba primário e réplica por streaming replication no Compose, injete atraso de rede na réplica e reproduza a leitura antiga.","a":["Lag da réplica no dashboard, a partir de <code>pg_stat_replication</code>","Ler a própria escrita: quem acabou de finalizar um treino o enxerga no histórico, por janela no primário ou esperando o LSN","Teste que falha sem a solução e passa com ela, com a réplica atrasada em 5 s","Leituras de outros alunos continuam indo para a réplica, com a fração medida"]},"p2:BD-07":{"c":"Séries particionadas por mês com BRIN e pruning medidos","q":"Meça a consulta do último mês, o gráfico de um aluno com cinco anos de dados e um <code>DELETE</code> de um ano inteiro na tabela única.","a":["Séries particionadas por mês, com partition pruning visível no <code>EXPLAIN</code> (só as partições do período aparecem)","Índice BRIN na data comparado ao B-tree, com tamanho e tempo medidos","Arquivar um mês é <code>DETACH PARTITION</code> mais exportação, sem <code>DELETE</code>","Registro com o que a chave de partição impede (unicidade global, chaves estrangeiras) e como você contornou"]},"p2:BD-08":{"c":"Restauração PITR ensaiada, com RPO e RTO medidos","q":"Na massa grande, rode o <code>DELETE</code> e tente voltar só com o <code>pg_dump</code> noturno; anote o que se perdeu e quanto tempo levou.","a":["Backup base e arquivamento contínuo do WAL (pgBackRest ou WAL-G), guardados num bucket do LocalStack","Restauração para um instante (PITR) um minuto antes do <code>DELETE</code>, com RPO de 5 min e RTO de 30 min medidos e registrados","Restauração ensaiada com cronômetro e repetida automaticamente toda semana, conferindo contagens e somas das tabelas principais","Registro dos passos do ensaio, de modo que outra pessoa consiga repetir sem você"]},"p2:BD-09":{"c":"Migração expand and contract com backfill em lotes, sem downtime","q":"Rode a migração direta com o k6 ligado e duas versões da API ao mesmo tempo; conte os erros 5xx e capture o lock no <code>pg_locks</code>.","a":["Migração em expandir e contrair (coluna nova, escrita nas duas, backfill em lotes, leitura na nova, remoção da antiga), com zero erro 5xx no k6 durante o deploy","Backfill em lotes de 10 mil linhas, retomável e sem segurar lock por mais de 100 ms","<code>CREATE INDEX CONCURRENTLY</code> para índices novos e <code>lock_timeout</code> em toda migração","A remoção da coluna antiga só acontece depois que nenhuma versão da API a lê, confirmado por métrica"]},"p2:SEC-01":{"c":"Autorização por recurso em toda consulta, com testes de acesso a dado alheio","q":"Com dois alunos de teste, percorra todos os endpoints de recurso (avaliação, peso, medidas, dieta, treino) trocando os ids de um pelos do outro e liste o que vaza.","a":["Todo endpoint de recurso do aluno filtra pelo dono, e id de outro aluno responde 404","Um teste gerado a partir do contrato do BASE-02 tenta o acesso cruzado em todos os endpoints e roda no make verify","Ids expostos não são sequenciais (UUIDv7), sem tratar isso como controle de acesso","Uma consulta nova sem filtro de dono faz o teste falhar"]},"p2:SEC-02":{"c":"Senhas com argon2id, sessões seguras e limite de tentativas","q":"Entre com uma senha fraca, copie o cookie para outro navegador, troque a senha e veja se o cookie copiado ainda funciona. Depois tente cem senhas seguidas numa conta.","a":["Senha guardada com argon2id e parâmetros registrados; senhas fracas recusadas","Sessão em cookie HttpOnly, Secure e SameSite=Lax, com expiração por inatividade e rotação do identificador no login; todas as sessões são revogadas quando a senha muda","Limite de tentativas por conta e por IP, com espera crescente e sem revelar se o e-mail existe","Passkeys (WebAuthn) como opção de entrada"]},"p2:SEC-03":{"c":"Papéis e vínculos aplicados no servidor e auditoria imutável","q":"Liste as ações sobre o aluno (ver peso, editar dieta, editar treino, exportar dados) e, para cada papel (aluno, treinador, nutricionista, gestor, suporte), teste no servidor quem consegue fazê-las hoje, com e sem vínculo.","a":["Papel e vínculo ativo, com consentimento do aluno, conferidos no servidor em toda leitura e escrita de dado de saúde","Trilha de auditoria só de acréscimo, com quem, o quê, quando, antes e depois, consultável por aluno e por recurso","A aplicação não consegue alterar nem apagar linhas da auditoria"]},"p2:SEC-04":{"c":"Exclusão por crypto-shredding cobrindo banco, eventos e modelo de leitura","q":"Faça o pedido de exclusão de um aluno de teste e procure o peso e o e-mail dele em tabelas, tópicos, projeções e no último backup restaurado.","a":["Dado de saúde cifrado com uma chave por aluno; na exclusão, a chave é apagada e os eventos antigos ficam ilegíveis","Tabelas e modelo de leitura apagam ou anonimizam o que é do aluno, e o pedido tem estado rastreável (recebido, em andamento, concluído) com data","Backups não são reescritos: a chave apagada os torna ilegíveis depois de restaurados","Exportação dos dados do aluno em JSON antes da exclusão, e lista documentada do que precisa ser mantido por obrigação legal, só com o mínimo exigido"]},"p2:SEC-05":{"c":"Rate limit por token bucket por IP e por conta, com 429 correto","q":"Rode o robô no k6 junto com a carga normal e meça o p95 da busca dos alunos reais com e sem o robô.","a":["Limite por IP e por conta com token bucket, com estado compartilhado entre as réplicas da API","Resposta 429 com Retry-After quando o limite estoura, sem consultar o banco","Com o robô ativo, o p95 dos alunos reais na busca não muda de forma mensurável","Requisições limitadas aparecem em métrica e no dashboard, com alerta"]},"pi:INT-01":{"c":"O front aponta para o Go mudando só a URL base, e a suíte e2e passa","q":"","a":["Cada divergência achada vira primeiro um caso no teste de contrato e só depois é corrigida, no Go ou no contrato"]},"pi:DIE-05":{"c":"O Go dispara o webhook de revalidação quando um alimento muda","q":"","a":["Na integração, o Go dispara o webhook de revalidação quando o alimento muda, com assinatura que o front confere","Se o webhook falhar, há nova tentativa e um registro do alimento pendente; o dado não fica velho em silêncio"]},"pi:TRE-07":{"c":"O trace começa no toque do front e vai até a query","q":"","a":["Painel com taxa, erros e p50/p95/p99 por endpoint","O trace de uma finalização mostra o handler HTTP, cada query do pgx e o publish do evento, cada um como um span","Alerta quando o p95 de \"Finalizar treino\" passa de 1 s por 2 min"]},"pi:PERF-01":{"c":"O RUM vai para o Go e vira p75 por página no Grafana","q":"Abra o Hoje e a Biblioteca com a rede limitada a 4G lento e CPU 6x mais lenta, e compare com a medição sem limitação no seu notebook. Anote a diferença de LCP antes de mexer em qualquer coisa.","a":["O endpoint de RUM grava as medidas e o p75 por página aparece no Grafana, separado por tipo de conexão (INT-01)","Medidas de usuários que não consentiram na coleta (CNT-03) são descartadas no servidor"]},"pi:SEC-02":{"c":"O login do front passa a usar a sessão do Go","q":"Entre com uma senha fraca, copie o cookie para outro navegador, troque a senha e veja se o cookie copiado ainda funciona. Depois tente cem senhas seguidas numa conta.","a":["Senha guardada com argon2id e parâmetros registrados; senhas fracas recusadas","Sessão em cookie HttpOnly, Secure e SameSite=Lax, com expiração por inatividade e rotação do identificador no login; todas as sessões são revogadas quando a senha muda","Limite de tentativas por conta e por IP, com espera crescente e sem revelar se o e-mail existe","Passkeys (WebAuthn) como opção de entrada"]},"pi:SEC-03":{"c":"O painel da Parte 1 passa a respeitar os papéis do Go","q":"Liste as ações sobre o aluno (ver peso, editar dieta, editar treino, exportar dados) e, para cada papel (aluno, treinador, nutricionista, gestor, suporte), teste no servidor quem consegue fazê-las hoje, com e sem vínculo.","a":["Papel e vínculo ativo, com consentimento do aluno, conferidos no servidor em toda leitura e escrita de dado de saúde","Trilha de auditoria só de acréscimo, com quem, o quê, quando, antes e depois, consultável por aluno e por recurso","A aplicação não consegue alterar nem apagar linhas da auditoria"]},"p3:PWA-01":{"c":"Manifesto, service worker e app shell offline com o treino do dia","q":"Com o app rodando contra o Go (INT-01), ative o modo avião no DevTools e abra <code>/hoje</code>. Anote o que quebra: o HTML, os scripts, a fonte ou a lista de exercícios. Cada falha é uma estratégia de cache que falta.","a":["Manifesto com nome, ícones de 192 e 512 px, <code>display: standalone</code> e <code>start_url</code> em <code>/hoje</code>; o navegador oferece \"Instalar\" e o app abre sem barra de endereço","Service worker faz precache do app shell; com a rede desligada, o <code>/hoje</code> abre em menos de 1 s e mostra o treino do dia","O treino do dia (exercícios, séries-alvo e carga sugerida em gramas) é baixado ao abrir o \"Hoje\" com rede e guardado para uso offline","Sem o treino baixado, a página offline diz isso e oferece o último treino concluído, em vez de um erro genérico","Sair da conta apaga os caches com dados do aluno, porque peso e dieta são dados de saúde"]},"p3:PWA-02":{"c":"Séries no IndexedDB com fila de sincronização idempotente","q":"Registre 8 séries com a rede desligada, feche a aba, ligue a rede e reenvie o lote duas vezes. Conte quantas séries existem no histórico: se passar de 8, o servidor não é idempotente.","a":["(tela) Cada série é gravada no IndexedDB antes de qualquer chamada de rede, com um UUID gerado no aparelho; o botão responde em menos de 100 ms mesmo offline","(tela) Uma fila de envio guarda os lotes pendentes e mostra \"3 séries aguardando sincronização\"; ao voltar a rede, esvazia sozinha, com recuo exponencial entre tentativas","(Go) O endpoint de sync aceita um lote com chave de idempotência por série; reenviar o mesmo lote cinco vezes grava 8 séries, não 40","(Go) Se parte do lote já foi gravada, a resposta diz o que entrou e o que já existia, e o cliente remove da fila só o que foi confirmado","(tela) Fechar o app no meio do envio e abrir de novo retoma sem perder nem duplicar (o mesmo teste do TRE-05, agora com a rede caindo)"]},"p3:PWA-03":{"c":"Web Push com VAPID enviado pelo Go, com preferências por tipo","q":"","a":["(tela) A permissão só é pedida depois de uma ação que a justifica, como ativar \"Lembrar do café\" nas preferências, com uma explicação antes do diálogo do navegador","(tela) Preferências por tipo (refeição, suplemento, treino, aula) e por horário, gravadas por aluno; desligar um tipo não desliga os outros","(Go) A inscrição Web Push do aparelho é guardada por aluno, com várias inscrições por conta; o envio usa chaves VAPID e remove a inscrição que o serviço de push devolve como expirada","(Go) O horário vem da hora local e do fuso do aluno: 8h45 em São Paulo chega às 8h45, inclusive na troca de horário de um aluno que viaja","(tela) Tocar na notificação abre o app na refeição ou no treino certo, e uma notificação já visualizada não reaparece"]},"p3:PWA-04":{"c":"Escritas concorrentes detectadas e mescladas por série","q":"Faça as duas edições offline e sincronize na ordem tablet, celular. Com last-writer-wins por treino inteiro, a edição do tablet some. Registre isso como teste vermelho.","a":["(Go) Cada treino carrega uma versão por aparelho (vetor de versões ou contador por réplica); o servidor detecta que duas escritas partiram da mesma base e não as trata como sequenciais","(Go) O merge é por série: cargas e repetições de séries diferentes se combinam; só a mesma série editada nos dois aparelhos é conflito real","(Go) O conflito real mantém as duas versões e marca a série, em vez de descartar uma pelo relógio do aparelho","(tela) O aluno vê \"esta série foi alterada em dois aparelhos\" com as duas opções e escolhe com um toque","(tela) O teste acima termina com a carga de 62500 g e a quarta série removida, sem perda"]},"p3:PERF-04":{"c":"Abertura do PWA instalado medida em campo e abaixo de 1,5 s","q":"Instale o PWA, feche-o, ative o modo avião e abra de novo; depois repita com rede 4G lenta. Meça o tempo até o treino do dia aparecer, em build de produção.","a":["App shell servido do cache pelo service worker, sem esperar a rede para pintar a estrutura (PWA-01)","Treino do dia pré-carregado no cache quando o app abre, para que o próximo acesso não dependa de rede","Código dividido por rota, com o JavaScript inicial de cada tela medido e registrado","Tempo de abertura do PWA instalado medido em campo, com p75 abaixo de 1,5 s"]},"p3:IMP-01":{"c":"Upload de FIT e GPX com parse em streaming e deduplicação","q":"","a":["(tela) Upload de arquivo FIT ou GPX com barra de progresso e prévia (data, distância, voltas) antes de confirmar","(Go) O arquivo é lido em streaming, sem carregar tudo na memória: um arquivo de 50 MB não passa de poucos MB de heap, medido no teste","(Go) Distância em metros e ritmo em segundos por 100 m, em inteiros; arquivo truncado ou com campos fora do perfil devolve erro claro, sem gravar atividade pela metade","(Go) A mesma atividade enviada duas vezes (mesmo hash do conteúdo, ou mesma origem, início e duração) resulta em uma só atividade; o segundo envio responde \"já importada\" com a referência da primeira","(tela) A natação importada aparece na semana de sábado, ao lado dos treinos de academia"]},"p3:IMP-02":{"c":"Importação em lote em etapas, com progresso e retomada","q":"Derrube o processo do Go na metade e rode de novo. Se as séries já gravadas aparecem em dobro, ou se nada foi gravado e o trabalho todo se perdeu, a retomada não existe.","a":["(Go) A importação roda em etapas (validar, normalizar, mapear exercícios, gravar), cada uma gravando o ponto em que parou; matar o processo e reiniciar continua da última etapa concluída","(Go) Cargas viram gramas inteiras (\"62,5\" vira 62500) e datas viram instantes UTC com o fuso do aluno; linha inválida vai para um relatório de rejeitadas, sem derrubar o lote","(Go) O mapeamento de exercícios usa o catálogo (EXE-02) e deixa os não reconhecidos para o aluno decidir","(tela) Progresso por etapa e por contagem (\"mapeando: 410 de 600 treinos\"), com opção de baixar as linhas rejeitadas","(Go) Rodar a importação duas vezes não duplica nenhum treino; o resultado final aparece no histórico do CNT-02"]},"p3:ROT-08":{"c":"Feed iCalendar da rotina gerado em Go, com token revogável","q":"(Go) Gere um <code>.ics</code> com horários em UTC, sem VTIMEZONE nem RRULE, e assine o feed no celular. Mude o modelo da segunda e veja o que acontece com os eventos antigos e com o horário depois de uma viagem de fuso.","a":["(Go) O feed valida contra a RFC 5545: linhas terminadas em CRLF, dobra de linha em 75 octetos, <code>UID</code> estável por bloco e <code>VTIMEZONE</code> do fuso do aluno","(Go) Uma exceção de viagem ou feriado vira <code>EXDATE</code> ou evento próprio, sem duplicar o bloco","(Go) O token tem 32 bytes aleatórios, é guardado como hash e um token revogado responde 404 no pedido seguinte","(Go) O token não aparece em log nem em trace","(tela) A tela mostra o link, um botão de copiar, as instruções de assinar e um botão de revogar que gera outro link"]},"p3:SOC-01":{"c":"Ranking incremental do desafio, com chave quente tratada","q":"Com k6 em TypeScript, simule 2 mil participantes terminando treino nos últimos 10 minutos do mês e meça o p95 da leitura do ranking. Anote quanto da latência vem do cálculo e quanto da contenção em uma linha só.","a":["(Go) O ranking é uma estrutura ordenada (por exemplo, sorted set por desafio), atualizada de forma incremental a cada treino finalizado, sem varrer as séries; ler o top 50 custa O(log n + 50)","(Go) O desafio é gravado uma vez por treino, com a mesma chave de idempotência do TRE-05 e do MSG-01: reenviar o evento não soma duas vezes","(Go) Empate é decidido por regra explícita (maior volume, depois quem atingiu primeiro), igual em toda leitura","(Go) A chave quente do fim do mês é tratada, por exemplo dividindo o contador em N partes somadas na leitura","(tela) O ranking mostra a posição do aluno mesmo fora do top 50 e atualiza sem recarregar a página; no teste, p95 da leitura abaixo de 100 ms"]},"p3:SOC-02":{"c":"Feed com fan-out na escrita e exceção para contas grandes","q":"","a":["(Go) Fan-out na escrita: ao finalizar um treino, o evento é distribuído para o feed de cada seguidor; abrir o feed é uma leitura de uma lista já pronta, p95 abaixo de 100 ms","(Go) Contas com mais de 1.000 seguidores usam fan-out na leitura: seus treinos são mesclados ao feed no momento de abrir, em vez de copiados 10 mil vezes","(Go) Um treino publicado e depois apagado ou ocultado some dos feeds; mostre como a regra chega aos feeds já copiados","(tela) Paginação por cursor, nunca por deslocamento: um treino novo no topo não repete nem pula item na página seguinte","(tela) O teste mede o custo de escrita (cópias por treino) e de leitura (consultas por abertura) nos dois modelos e mostra o ponto de virada"]}},"espinha":[["kleppmann",1,"Kleppmann","Soluções de compromisso na arquitetura de sistemas de dados","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch01.html","Como projetar aplicativos com uso intensivo de dados, 2ª ed.",false,[],2],["kleppmann",2,"Kleppmann","Definindo requisitos não funcionais","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch02.html","Como projetar aplicativos com uso intensivo de dados, 2ª ed.",false,["EXE-01","HOJ-01","TRE-07","AGE-04","PERF-01","PERF-02","PERF-04","SOC-02"],2],["kleppmann",3,"Kleppmann","Modelos de dados e linguagens de consulta","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch03.html","Como projetar aplicativos com uso intensivo de dados, 2ª ed.",false,["BASE-02","EXE-03","HOJ-03","DIE-01","EVO-01","ROT-02","ROT-03","ROT-07","AGE-01","DIS-04","DIS-05"],2],["kleppmann",4,"Klepp rof."],"meca":"Tempo e contadores de hardware de cada par.","pronto":["Cada diferença está explicada por cache, previsão de desvio ou coerência, com o número que prova"],"fontes":[["Ulrich Drepper: What Every Programmer Should Know About Memory","https://people.freebsd.org/~lstewart/articles/cpumemory.pdf"]]},"10":{"t":"Acompanhando o coletor","lang":"Go","h":3,"obj":"Ler o que o garbage collector faz e mudar o programa para alocar menos.","passos":["Escreva um programa que aloca muitos objetos pequenos de vida curta e alguns de vida longa.","Rode com GODEBUG=gctrace=1 e leia cada campo de uma linha.","Varie GOGC e GOMEMLIMIT e observe a frequência dos ciclos e o pico de memória.","Use -gcflags=-m para ver o que escapa para o heap e corrija dois casos.","Experimente sync.Pool no objeto mais alocado."],"meca":"Ciclos de GC por segundo, pico de heap e alocações por operação, antes e depois.","pronto":["As alocações por operação caem pela metade","Você explica o trade-off entre memória e CPU que o GOGC controla"],"fontes":[["Guia do garbage collector do Go","https://go.dev/doc/gc-guide"]]},"11":{"t":"Corrida, trava e contador","lang":"Go","h":3,"obj":"Provocar os defeitos clássicos de concorrência e corrigi-los com medição.","passos":["Escreva um contador compartilhado sem sincronização e rode com -race.","Corrija de três jeitos (mutex, atomic e contador fragmentado por núcleo) e faça benchmark de 1 a 64 goroutines.","Monte um worker pool com fila limitada, errgroup e cancelamento por context.","Provoque um deadlock com dois mutex travados em ordens diferentes e corrija com ordem fixa."],"meca":"ns/op dos três contadores por número de goroutines.","pronto":["-race limpo","A tabela mostra onde o mutex para de escalar","Cancelar o context encerra todos os workers"],"fontes":[["O modelo de memória do Go","https://go.dev/ref/mem"]]},"12":{"t":"Um cache que aguenta a debandada","lang":"Go","h":3,"obj":"Ver o stampede acontecer e controlá-lo.","passos":["Monte um cache em memória com TTL e evicção LRU (reaproveite o LRU do laboratório 7).","Ponha atrás dele uma origem lenta (50 ms) e dispare 1.000 goroutines pedindo a mesma chave no instante em que ela expira.","Acrescente singleflight.","Acrescente TTL com variação aleatória e renovação antecipada."],"meca":"Chamadas à origem por expiração e p99 dos clientes, antes e depois.","pronto":["A debandada cai de cerca de mil chamadas para uma","A taxa de acerto está medida"],"fontes":[["singleflight","https://pkg.go.dev/golang.org/x/sync/singleflight"]]},"13":{"t":"HTTP na mão, por cima do TCP","lang":"Go","h":4,"obj":"Ver o que acontece entre o socket e a resposta HTTP.","passos":["Escreva um servidor HTTP/1.1 mínimo sobre net.Listen: linha de requisição, cabeçalhos, Content-Length e conexão mantida viva.","Capture com tcpdump o handshake de três vias, o keep-alive e o encerramento.","Meça com curl -w as fases de conexão, TLS e primeiro byte contra um servidor HTTPS.","Ligue e desligue TCP_NODELAY numa resposta escrita em duas partes."],"meca":"Tempo de cada fase e o atraso do algoritmo de Nagle somado ao ACK atrasado.","pronto":["curl e o navegador conversam com o seu servidor","Você explica cada pacote da captura"],"fontes":[["RFC 9112: HTTP/1.1","https://www.rfc-editor.org/rfc/rfc9112"]]},"14":{"t":"Fila não resolve sobrecarga","lang":"Go","h":3,"obj":"Entender por que a fila só adia o problema e o que é backpressure.","passos":["Ponha um produtor a 300 mensagens por segundo e um consumidor a 200, com fila ilimitada, e acompanhe tamanho e latência.","Troque por uma fila limitada e teste três políticas: bloquear o produtor, descartar e responder 429.","Confira a lei de Little: itens na fila = taxa de chegada × tempo de espera.","Implemente o backpressure com canal de buffer limitado."],"meca":"Latência e memória ao longo do tempo em cada política.","pronto":["A fila ilimitada cresce sem fim e as limitadas ficam estáveis","A lei de Little bate com a medição"],"fontes":[["Fred Hébert: Queue gvector/pgvector"]],"pratica":{"t":"Pergunte ao seu livro","contexto":"Um RAG sobre o fundamentos-que-nao-mudam.html e o fitness-evolutivo.html.","passos":["Quebre os dois HTMLs por seção, com o título e a âncora de cada pedaço.","Gere embeddings multilíngues e guarde no Postgres com pgvector; junte com BM25 numa busca híbrida.","Responda citando a seção e a âncora de onde veio cada afirmação.","Dê ao agente duas ferramentas por um servidor MCP em Go: buscar no livro e ler o plano da semana a partir do backup."],"meca":"Em 10 perguntas, quantas citam a seção certa; latência p95 de ponta a ponta.","pronto":["Pelo menos 8 de 10 respostas citam a seção certa","O agente escolhe a ferramenta certa nas perguntas de teste"]}},{"id":"IA-8","t":"Avaliação: saber se melhorou","q":"Como provar que trocar o modelo, o prompt ou o chunking não piorou nada?","prod":"Sem avaliação, cada mudança é aposta; com ela, vira teste de regressão no CI.","conceitos":"Conjunto de avaliação, métricas de recuperação (recall@k, MRR), fidelidade da resposta, LLM como juiz, concordância com humano, testes de regressão.","leituras":[["huyen-ai",3,"Metodologia de avaliação","https://www.oreilly.com/library/view/engenharia-de-ia/9798341637870/ch03.html","como avaliar modelos abertos e o LLM como juiz"],["huyen-ai",4,"Avaliação de sistemas de IA","https://www.oreilly.com/library/view/engenharia-de-ia/9798341637870/ch04.html","critérios, métricas e pipeline de avaliação"],["llmops",7,"Avaliação de LLMs","https://www.oreilly.com/library/view/llmops/9798341663817/ch07.html","avaliação de LLMs na operação"]],"extra":[],"pratica":{"t":"Um conjunto de avaliação de verdade","contexto":"O RAG do IA-7.","passos":["Escreva 50 trincas de pergunta, resposta esperada e seção de origem.","Meça recall@5 e MRR da busca, e a fidelidade da resposta com um juiz e uma rubrica.","Rotule 20 casos você mesmo e meça a concordância do juiz com você.","Compare dois chunkings e dois modelos de embedding, e transforme a avaliaçã         var wk1 = "sem-" + iso(mondayOf(parseIso(S.sel)));
        var sd1 = clone(S.estudo[wk1]) || {};
        sd1.labs = sugerirLabs(sd1.labs || []); sd1.autoLab = true; S.estudo[wk1] = sd1; scheduleSave("estudo", wk1); render(); break;
      case "iadia":
        var rdi = S.rotina[S.sel] = clone(S.rotina[S.sel]) || { feito: {} };
        if (rdi.ia) delete rdi.ia; else rdi.ia = true;
        scheduleSave("rotina", S.sel); render(); break;
      case "ialido":
      case "iapasso":
        var di = S.estudo.ia = clone(S.estudo.ia) || {}, campoI = act === "ialido" ? "lidos" : "passos";
        di[campoI] = di[campoI] || {};
        if (di[campoI][el.dataset.key]) delete di[campoI][el.dataset.key]; else di[campoI][el.dataset.key] = S.sel;
        iaAbertoUI = el.dataset.mod || ""; scheduleSave("estudo", "ia"); render(); break;
      case "iamod":
        var dm = S.estudo.ia = clone(S.estudo.ia) || {};
        dm.mods = dm.mods || {};
        if (dm.mods[el.dataset.id]) delete dm.mods[el.dataset.id]; else { dm.mods[el.dataset.id] = S.sel; if (dm.foco === el.dataset.id) delete dm.foco; }
        iaAbertoUI = ""; scheduleSave("estudo", "ia"); render(); break;
      case "iafoco":
        var dfo = S.estudo.ia = clone(S.estudo.ia) || {};
        dfo.foco = el.dataset.id; iaAbertoUI = el.dataset.id; scheduleSave("estudo", "ia"); render(); break;
      case "lidol":
        var pl2 = S.estudo.plano = clone(S.estudo.plano) || {};
        pl2.lidosL = pl2.lidosL || {};
        if (pl2.lidosL[el.dataset.key]) delete pl2.lidosL[el.dataset.key]; else pl2.lidosL[el.dataset.key] = S.sel;
        scheduleSave("estudo", "plano"); render(); break;
      case "ciclo":
        var pc0 = S.estudo.plano = clone(S.estudo.plano) || {};
        pc0.inicio = iso(mondayOf(parseIso(S.sel))); scheduleSave("estudo", "plano"); render(); break;
      case "delpeso":
        S.pesos[el.dataset.id] = null; scheduleSave("pesos", el.dataset.id);
        if (S.mode === "local") delete S.pesos[el.dataset.id];
        render(); break;
    }
  });

  app.addEventListener("input", function (e) {
    var inp = e.target;
    if (!inp.dataset || !inp.dataset.in) return;
    var exId = inp.dataset.ex, i = +inp.dataset.i, field = inp.dataset.in;
    var d = ensureDay(S.sel);
    var arr = d.series[exId] = d.series[exId] || [];
    while (arr.length <= i) arr.push({ kg: null, reps: null });
    arr[i] = arr[i] || { kg: null, reps: null };
    arr[i][field] = parseNum(inp.value);
    var row = inp.closest(".set");
    if (field === "reps" && arr[i].reps != null && arr[i].kg == null && row) {
      var kgIn = row.querySelector('[data-in="kg"]');
      var ph = kgIn ? parseNum(kgIn.placeholder) : null;
      if (kgIn && ph != null) { kgIn.value = fmt(ph); arr[i].kg = ph; }
    }
    if (row) row.classList.toggle("filled", arr[i].reps != null);
    // conta exercícios completos sem redesenhar a tela
    var card = inp.closest(".ex");
    if (card) {
      var exDef = WORKOUTS[activityOf(S.sel)].ex.filter(function (x) { return x.id === exId; })[0];
      var filled = arr.filter(function (s) { return s && s.reps != null; }).length;
      card.classList.toggle("done", exDef && filled >= exDef.s);
      var w = WORKOUTS[activityOf(S.sel)];
      var n = w.ex.filter(function (x) { var a = d.series[x.id] || []; return a.filter(function (s) { return s && s.reps != null; }).length >= x.s; }).length;
      var c = document.getElementById("ex-count"); if (c) c.textContent = n + " de " + w.ex.length + " feitos";
    }
    scheduleSave("dias", S.sel);
  });

  app.addEventListener("submit", function (e) {
    if (e.target.id !== "peso-form") return;
    e.preventDefault();
    var date = document.getElementById("pf-data").value || iso(today);
    var kg = parseNum(document.getElementById("pf-kg").value);
    var cint = parseNum(document.getElementById("pf-cint").value);
    if (kg == null && cint == null) { document.getElementById("pf-kg").focus(); return; }
    if (kg != null && (kg < 40 || kg > 200)) { document.getElementById("pf-kg").setCustomValidity("Confira o peso"); document.getElementById("pf-kg").reportValidity(); return; }
    var prev = S.pesos[date] || {};
    S.pesos[date] = { kg: kg != null ? kg : (prev.kg != null ? prev.kg : null), cintura: cint != null ? cint : (prev.cintura != null ? prev.cintura : null) };
    scheduleSave("pesos", date);
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    render();
  });
  app.addEventListener("change", function (e) { if (e.target.id === "pf-kg") e.target.setCustomValidity(""); });
  app.addEventListener("change", function (e) {
    var sel = e.target.dataset && e.target.dataset.sel;
    if (!sel) return;
    var v = e.target.value;
    var wk = "sem-" + iso(mondayOf(parseIso(S.sel)));
    var campo = sel.charAt(0) === "l" ? "labs" : "itens";
    var sd = clone(S.estudo[wk]) || {}, it = (sd[campo] || []).slice(0, 2);
    while (it.length < 2) it.push("");
    it[sel.charAt(1) === "1" ? 0 : 1] = v;
    sd[campo] = it; if (campo === "labs") sd.autoLab = true; else sd.auto = true; S.estudo[wk] = sd;
    scheduleSave("estudo", wk);
    render();
  });

  /* ---------- Abas ---------- */
  function readHash() {
    var h = (location.hash || "").replace("#", "");
    S.tab = (h === "peso" || h === "plano" || h === "compras" || h === "rotina" || h === "ia") ? h : "hoje";
  }
  window.addEventListener("hashchange", function () { readHash(); render(); window.scrollTo(0, 0); });

  /* ---------- Timer de descanso ---------- */
  var timerEl = document.getElementById("timer"), timerVal = document.getElementById("timer-value"), timerLab = document.getElementById("timer-label");
  var timerEnd = 0, timerTick = null, actx = null;
  function ensureAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = actx || new AC();
      if (actx.state === "suspended") actx.resume();
    } catch (e) { actx = null; }
  }
  function beep() {
    try {
      if (!actx) return;
      [0, 0.25].forEach(function (off) {
        var o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + off;
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
        o.connect(g); g.connect(actx.destination);
        o.start(t0); o.stop(t0 + 0.22);
      });
    } catch (e) { /* sem som */ }
  }
  function startTimer(sec, name) {
    ensureAudio();
    timerEnd = Date.now() + sec * 1000;
    timerLab.textContent = "Descanso · " + name;
    timerEl.classList.remove("end");
    timerEl.hidden = false;
    clearInterval(timerTick);
    timerTick = setInterval(tick, 250);
    tick();
  }
  function tick() {
    var left = (timerEnd - Date.now()) / 1000;
    if (left <= 0) {
      clearInterval(timerTick);
      timerVal.textContent = "0:00";
      timerLab.textContent = "Hora da próxima série";
      timerEl.classList.add("end");
      beep();
      return;
    }
    timerVal.textContent = mmss(left);
  }
  document.getElementById("timer-add").addEventListener("click", function () {
    if (timerEl.classList.contains("end")) { timerEl.classList.remove("end"); timerEnd = Date.now(); clearInterval(timerTick); timerTick = setInterval(tick, 250); }
    timerEnd += 30000; tick();
  });
  document.getElementById("timer-stop").addEventListener("click", function () { clearInterval(timerTick); timerEl.hidden = true; });

  /* ---------- Início ---------- */
  readHash();
  render();

  function applySnapshot(col, snap) {
    var store = S[col];
    var seen = {};
    snap.docs.forEach(function (doc) {
      seen[doc.id] = true;
      var key = col + "/" + doc.id;
      if (dirty.has(key) || writing.has(key)) return;
      store[doc.id] = clone(doc.data());
    });
    Object.keys(store).forEach(function (id) {
      var key = col + "/" + id;
      if (!seen[id] && !dirty.has(key) && !writing.has(key)) delete store[id];
    });
  }

  (function connect() {
    var use = window.claude && typeof window.claude.use === "function" ? window.claude.use : null;
    if (!use) { goLocal(); return; }
    Promise.resolve().then(function () { return use.call(window.claude, "db"); }).then(function (ns) {
      if (!ns) { goLocal(); return; }
      db = ns;
      S.mode = "cloud";
      var confirmed = { dias: false, pesos: false, compras: false, rotina: false, estudo: false };
      var slowTimer = setTimeout(function () { if (Object.keys(confirmed).some(function (c) { return !confirmed[c]; })) setStatus("slow"); }, 10000);
      ["dias", "pesos", "compras", "rotina", "estudo"].forEach(function (col) {
        db.collection(col).onSnapshot(function (snap) {
          applySnapshot(col, snap);
          if (!snap.metadata.fromCache && !confirmed[col]) {
            confirmed[col] = true;
            if (Object.keys(confirmed).every(function (c) { return confirmed[c]; })) { clearTimeout(slowTimer); if (!dirty.size && !writing.size) setStatus("saved"); }
          }
          requestRender();
        }, function (err) {
          clearTimeout(slowTimer);
          if (err && err.code === "unavailable") { setStatus("slow"); return; }
          goLocal();
        });
      });
    }).catch(function () { goLocal(); });
  })();
})();
</script>

if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
