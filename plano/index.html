<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plano">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef2f2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e151b">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="robots" content="noindex">
<title>Plano de Treino e Dieta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: uma coluna para celular; abas no topo (Dia / Backend / IA / Pitch / Cartões / Compras / Peso / Plano); faixa da semana; cartões por bloco do dia; timer de descanso fixo embaixo. */
:root {
  --bg: #eef2f2;
  --surface: #ffffff;
  --ink: #13202a;
  --muted: #5b6a74;
  --line: #d9e1e3;
  --accent: #1456c4;
  --accent-soft: #e3ecfb;
  --accent-ink: #ffffff;
  --protein: #c0521b;
  --ok: #1d8049;
  --ok-soft: #e1f2e8;
  --warn: #a8670f;
  --warn-soft: #fbf0dc;
  --equip: #93a1a9;
  --pad: #c4ced2;
  --study: #6a48c9;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151b;
    --surface: #16212a;
    --ink: #e5ecef;
    --muted: #93a3ad;
    --line: #26343e;
    --accent: #5d9bff;
    --accent-soft: #1b2c47;
    --accent-ink: #0b1422;
    --protein: #f08a52;
    --ok: #4cc27f;
    --ok-soft: #173326;
    --warn: #e3aa52;
    --warn-soft: #3a2c14;
    --equip: #64757f;
    --pad: #34444f;
    --study: #a98bff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151b;
  --surface: #16212a;
  --ink: #e5ecef;
  --muted: #93a3ad;
  --line: #26343e;
  --accent: #5d9bff;
  --accent-soft: #1b2c47;
  --accent-ink: #0b1422;
  --protein: #f08a52;
  --ok: #4cc27f;
  --ok-soft: #173326;
  --warn: #e3aa52;
  --warn-soft: #3a2c14;
  --equip: #64757f;
  --pad: #34444f;
  --study: #a98bff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: .01em; margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 120px; }

/* Topo */
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 640px; margin: 0 auto; padding: 12px 16px 10px; display: grid; gap: 10px; }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.title-row h1 { font-size: 26px; line-height: 1; }
.status { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status[data-s="saved"]::before { background: var(--ok); }
.status[data-s="saving"]::before { background: var(--accent); }
.status[data-s="local"]::before, .status[data-s="slow"]::before { background: var(--warn); }
.status[data-s="error"]::before { background: var(--protein); }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.tabs a { text-align: center; text-decoration: none; color: var(--muted); font-weight: 600; padding: 7px 1px; border-radius: 7px; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs a[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

/* Semana */
.week { margin-top: 14px; display: grid; gap: 8px; }
.week-head { display: flex; align-items: center; justify-content: space-between; }
.week-head span { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
.icon-btn { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 18px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.day {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 6px 0 7px; display: grid; justify-items: center; gap: 2px; position: relative;
}
.day .dw { font-size: 12px; color: var(--muted); }
.day .dn { font-family: var(--font-display); font-size: 20px; font-weight: 600; line-height: 1; }
.day .act { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
.day .act.gym { color: var(--accent); }
.day .act.swim { color: var(--ok); }
.day .bar { width: 70%; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.day .bar i { display: block; height: 100%; background: var(--ok); width: var(--pct, 0%); }
.day.today { border-color: var(--ink); }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.day[aria-pressed="true"] .dw, .day[aria-pressed="true"] .dn, .day[aria-pressed="true"] .act { color: var(--accent-ink); }
.day[aria-pressed="true"] .bar { background: color-mix(in srgb, var(--accent-ink) 35%, transparent); }
.day[aria-pressed="true"] .bar i { background: var(--accent-ink); }

/* Cartões */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; }
.section { margin-top: 18px; display: grid; gap: 10px; }
.section > h2 { font-size: 22px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.section > h2 small { font-family: var(--font-body); font-size: 14px; color: var(--muted); font-weight: 400; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

.hero { margin-top: 14px; }
.hero .when { font-size: 14px; color: var(--muted); }
.hero h2 { font-size: 30px; line-height: 1.05; }
.hero .sub { color: var(--muted); font-size: 15px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { display: grid; gap: 4px; }
.stat .lab { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.stat .val { font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1; }
.stat .val small { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 400; }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: var(--pct, 0%); background: var(--accent); }
.meter.p i { background: var(--protein); }
.meter.w i { background: var(--ok); }
.jump { justify-self: start; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: 14px; text-decoration: none; }

/* Refeições */
.meals { display: grid; gap: 8px; }
.meal { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.check { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 17px; font-weight: 700; color: transparent; }
[aria-pressed="true"] > .check { background: var(--ok); border-color: var(--ok); color: #fff; }
.meal[aria-pressed="true"] { background: var(--ok-soft); border-color: transparent; }
.meal .mh { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.meal .mn { font-weight: 700; }
.meal .mt { font-size: 13px; color: var(--muted); white-space: nowrap; }
.meal .mi { font-size: 14px; color: var(--muted); margin-top: 2px; }
.meal .mk { font-size: 13px; margin-top: 4px; }
.meal .mk b { color: var(--protein); font-weight: 600; }

.extras { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.toggle { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.toggle[aria-pressed="true"] { background: var(--ok-soft); border-color: transparent; }
.water { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 6px; }
.water .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.water .row strong { font-family: var(--font-display); font-size: 22px; }
.step { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; line-height: 1; }

/* Treino */
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 8px; }
.ex.done { border-color: var(--ok); }
.ex-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ex-head h3 { font-size: 20px; line-height: 1.1; }
.ex-head .tg { font-size: 14px; color: var(--muted); white-space: nowrap; }
.pill { display: inline-block; font-size: 13px; padding: 4px 9px; border-radius: 7px; line-height: 1.3; }
.pill.up { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.pill.keep { background: var(--accent-soft); color: var(--accent); }
.pill.first { background: var(--warn-soft); color: var(--warn); }
.last { font-size: 14px; color: var(--muted); }
.sets { display: grid; gap: 6px; }
.set { display: grid; grid-template-columns: 26px 1fr 1fr 22px; gap: 8px; align-items: center; }
.set .sn { font-family: var(--font-display); font-size: 18px; color: var(--muted); text-align: center; }
.field { position: relative; }
.field input { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 9px 38px 9px 10px; font-size: 17px; font-variant-numeric: tabular-nums; }
.field input:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.field input::placeholder { color: var(--muted); opacity: .55; }
.field span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--muted); pointer-events: none; }
.set .ok { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); }
.set.filled .ok { background: var(--ok); border-color: var(--ok); }
.rest-btn { justify-self: start; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
.tip { font-size: 14px; color: var(--muted); }

/* Figuras */
.fx-box { background: var(--bg); border-radius: 10px; }
.fx { display: block; width: 100%; height: 136px; }
.fx line { stroke-linecap: round; }
.fx .eq { stroke: var(--equip); fill: none; }
.fx .pad { stroke: var(--pad); }
.fx .load { stroke: var(--accent); }
.fx .cable { stroke: var(--accent); opacity: .75; }
.fx .plate { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
.fx .hub, .fx .roller { fill: var(--accent); }
.fx .pulley { fill: var(--surface); stroke: var(--equip); stroke-width: 2; }
.fx .body line { stroke: var(--ink); }
.fx .body circle { fill: var(--ink); }
.fx .body .torso { fill: var(--ink); stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; }
.fx .ghost { opacity: .2; }

/* Natação */
.swim { display: grid; gap: 8px; }
.counter { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.counter strong { font-family: var(--font-display); font-size: 22px; min-width: 56px; text-align: center; }

/* Peso */
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.form .full { grid-column: 1 / -1; }
.form input { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 10px; font-size: 17px; width: 100%; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 12px; font-weight: 700; font-size: 16px; }
.advice { border-radius: 10px; padding: 12px; display: grid; gap: 4px; }
.advice strong { font-family: var(--font-display); font-size: 19px; font-weight: 600; }
.advice.ok { background: var(--ok-soft); }
.advice.warn { background: var(--warn-soft); }
.advice.info { background: var(--accent-soft); }
.chart svg { width: 100%; height: auto; display: block; }
.entries { display: grid; }
.entry { display: grid; grid-template-columns: 1fr auto auto 32px; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
.entry:first-child { border-top: 0; }
.del { width: 30px; height: 30px; border: 0; background: transparent; color: var(--muted); font-size: 18px; border-radius: 6px; }

/* Plano */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 2px; }
.tile .v { font-family: var(--font-display); font-size: 24px; font-weight: 600; line-height: 1; }
.tile .l { font-size: 12px; color: var(--muted); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.prose p { margin: 0; max-width: 65ch; }
.prose { display: grid; gap: 8px; }

/* Compras */
.shop-top { display: grid; gap: 10px; }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; justify-self: start; }
.seg button { border: 0; background: transparent; border-radius: 6px; padding: 6px 12px; font-weight: 600; color: var(--muted); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.shop-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.link-btn { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 6px 0; font-size: 14px; }
.qty { font-family: var(--font-display); font-size: 19px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.meal[aria-pressed="true"] .qty, .meal[aria-pressed="true"] .mn { color: var(--muted); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }

/* Rotina */
.meter.s i { background: var(--study); }
.tl { list-style: none; margin: 0; padding: 6px 14px; display: block; }
.blk { display: grid; grid-template-columns: 44px 14px minmax(0, 1fr) 32px; gap: 10px; align-items: start; padding: 10px 0; position: relative; }
.blk::before { content: ""; position: absolute; left: 60px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.blk:first-child::before { top: 16px; }
.blk:last-child::before { bottom: auto; height: 16px; }
.blk .t { font-family: var(--font-display); font-size: 17px; font-weight: 600; line-height: 1.05; text-align: right; padding-top: 1px; }
.blk .t small { display: block; font-family: var(--font-body); font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 2px; }
.blk .dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; background: var(--surface); border: 2.5px solid var(--k); position: relative; z-index: 1; justify-self: center; }
.blk.done .dot { background: var(--k); }
.blk .b { min-width: 0; display: grid; gap: 2px; }
.blk .bh { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.blk .bt { font-weight: 700; }
.blk .kind { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--k); }
.blk .bd { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.blk .bd strong { color: var(--ink); }
.blk .bd a, .refs a { color: var(--accent); font-weight: 600; }
.blk.done .bt { color: var(--muted); }
.blk.skip { opacity: .55; }
.blk.now .t { color: var(--k); }
.nowtag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; background: var(--k); color: var(--surface); border-radius: 5px; padding: 1px 6px; }
.nowtag.soft { background: transparent; color: var(--k); box-shadow: inset 0 0 0 1px var(--k); }
.k-estudo { --k: var(--study); }
.k-treino { --k: var(--accent); }
.k-refeicao { --k: var(--protein); }
.k-cozinha { --k: var(--warn); }
.k-lazer { --k: var(--ok); }
.k-sono, .k-trabalho, .k-livre, .k-tarefa { --k: var(--muted); }
.cbtn { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 16px; font-weight: 700; color: transparent; padding: 0; }
.cbtn[aria-pressed="true"], .cbtn.ro[data-on="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.cbtn.ro { opacity: .7; }
.est { gap: 12px; }
.fld { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.fld select { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 10px; font-size: 15px; }
.refs { display: block; line-height: 1.6; }
.pillbtn { justify-self: start; border: 1px solid var(--ok); color: var(--ok); background: transparent; border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: 14px; }
.pillbtn[aria-pressed="true"] { background: var(--ok-soft); }
.est-actions { display: flex; gap: 16px; flex-wrap: wrap; }
.story { list-style: none; margin: -4px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.st { padding: 12px 14px; display: grid; gap: 8px; border-top: 1px solid var(--line); min-width: 0; }
.st:first-child { border-top: 0; }
.st-h { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--study); }
.st-n { width: 22px; height: 22px; border-radius: 50%; background: var(--study); color: var(--surface); display: grid; place-items: center; font-size: 12px; letter-spacing: 0; flex: none; }
.st-src { font-size: 13px; color: var(--muted); margin-top: -4px; }
.caps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.caps li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: start; font-size: 15px; }
.caps .ct { display: grid; gap: 2px; min-width: 0; }
.caps .ct b { font-weight: 600; }
.caps .cq { font-size: 13px; color: var(--muted); line-height: 1.35; }
.caps li.lido .ct b { color: var(--muted); }
.caps .cm { font-size: 13px; color: var(--muted); padding-top: 2px; }
.bks { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.bks li { display: grid; gap: 2px; min-width: 0; }
.bk-t { font-size: 12px; color: var(--muted); }
.bks a { color: var(--accent); font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.bk-w { font-size: 13px; color: var(--muted); line-height: 1.35; }
.st-p { margin: 0; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
.acc { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
.st code { font-size: .9em; background: var(--surface); border: 1px solid var(--line); padding: 0 4px; border-radius: 4px; }
.warn-t { color: var(--warn); font-weight: 600; }
.pre { display: grid; gap: 4px; border: 1px solid var(--warn); border-left-width: 4px; border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.4; background: color-mix(in srgb, var(--warn) 9%, var(--surface)); overflow-wrap: anywhere; }
.pre-h { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--warn); }
.pre a { color: var(--accent); font-weight: 600; }

      if (x < 0.4) p = x / 0.4; else if (x < 0.5) p = 1; else if (x < 0.9) p = 1 - (x - 0.5) / 0.4; else p = 0;
      return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    }
    function loop(ms) {
      var t = phase(ms);
      visible.forEach(function (g) { g.innerHTML = FIG.frame(g.getAttribute("data-fig"), t, false); });
      raf = visible.size ? requestAnimationFrame(loop) : null;
    }
    function attach(root) {
      if (reduce || !("IntersectionObserver" in window)) return;
      if (io) io.disconnect();

      io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {

        });
        if (visible.size && !raf) raf = requestAnimationFrame(loop);
      });

  /* ---------- Utilidades ---------- */
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function parseIso(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
  function mondayOf(d) { var wd = d.getDay(); return addDays(d, wd === 0 ? -6 : 1 - wd); }
  function fmt(n, dec) {
    if (n == null || isNaN(n)) return "";
    var v = dec != null ? n.toFixed(dec) : String(Math.round(n * 100) / 100);
    return v.replace(".", ",");
  }

  function parseNum(s) {
    if (s == null) return null;
    var v = parseFloat(String(s).replace(",", ".").trim());
    return isNaN(v) ? null : v;
  }

  var today = new Date();
  var S = {
    dias: {},
    pesos: {},
    compras: {},
    rotina: {},
    estudo: {},
    sel: iso(today),
    weekStart: mondayOf(today),

  };
  var db = null;
  var LS_KEY = "plano-paulo-v1";

  function blankDay() {
    return { refeicoes: {}, creatina: false, agua: 0, series: {}, natacao: { etapas: [], principal: 0 } };
  }
  function getDay(id) { return S.dias[id] || blankDay(); }
  function ensureDay(id) {
    if (!S.dias[id]) S.dias[id] = blankDay();

    d.series = d.series || {};

  /* ---------- Salvamento ---------- */
  var statusEl = document.getElementById("status");
  var STATUS_TEXT = {
    connecting: "Conectando…",
    saved: "Salvo",
    saving: "Salvando…",
    slow: "Dados ainda não carregaram",
    local: "Só neste aparelho",
    error: "Erro ao salvar"
  };
  function setStatus(s) {
    statusEl.dataset.s = s;
    statusEl.textContent = STATUS_TEXT[s] || "";
  }

  var dirty = new Set();
  var writing = new Set();
  var saveTimer = null;

  function scheduleSave(col, id) {
    dirty.add(col + "/" + id);
    if (S.mode === "local") { saveLocal(); dirty.clear(); return; }
    setStatus("saving");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 700);
  }
  function flush() {
    clearTimeout(saveTimer);
    var keys = Array.from(dirty);
    dirty.clear();
    return keys.reduce(function (p, key) { return p.then(function () { return writeOne(key); }); }, Promise.resolve())
      .then(function () {
        if (!dirty.size && !writing.size && S.mode === "cloud" && statusEl.dataset.s === "saving") setStatus("saved");
      });
  }
  function writeOne(key, retried) {
    if (S.mode === "local") { saveLocal(); return Promise.resolve(); }
    if (writing.has(key)) { dirty.add(key); return Promise.resolve(); }
    writing.add(key);
    var parts = key.split("/");
    var body = (S[parts[0]] || {})[parts[1]];
    var ref = db.doc(key);
    var op = body ? ref.set(clone(body)) : ref.delete();
    return op.then(function () {
      if (!body && parts[0] === "pesos") delete S.pesos[parts[1]];
    }).catch(function (e) {
      var code = e && e.code;
      if (code === "unavailable" && !retried) {
        writing.delete(key);
        return new Promise(function (r) { setTimeout(r, 800 + Math.random() * 800); }).then(function () { return writeOne(key, true); });
      }
      if (code === "invalid_argument" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed" || code === "revoked") {
        goLocal();
        return;
      }
      dirty.add(key);
      setStatus("error");
    }).then(function () {
      writing.delete(key);
      if (dirty.size && S.mode === "cloud") { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1500); }
    });
  }
  function saveLocal() {
    try {
      var pesos = {};
      Object.keys(S.pesos).forEach(function (k) { if (S.pesos[k]) pesos[k] = S.pesos[k]; else delete S.pesos[k]; });
      localStorage.setItem(LS_KEY, JSON.stringify({ dias: S.dias, pesos: pesos, compras: S.compras, rotina: S.rotina, estudo: S.estudo }));
    } catch (e) { /* sem armazenamento local */ }
  }
  function loadLocal() {
    try {
      var raw = localStorage.getItem(LS_KEY);

      S.dias = o.dias || {};
      S.pesos = o.pesos || {};
      S.compras = o.compras || {};
      S.rotina = o.rotina || {};
      S.estudo = o.estudo || {};

  }

    if (S.mode === "local") return;
    S.mode = "local";
    var pendingDias = S.dias, pendingPesos = S.pesos, pendingCompras = S.compras, pendingRotina = S.rotina, pendingEstudo = S.estudo;
    loadLocal();
    // mantém o que já estava na tela
    Object.keys(pendingDias).forEach(function (k) { S.dias[k] = pendingDias[k]; });
    Object.keys(pendingPesos).forEach(function (k) { if (pendingPesos[k]) S.pesos[k] = pendingPesos[k]; });
    Object.keys(pendingCompras).forEach(function (k) { S.compras[k] = pendingCompras[k]; });
    Object.keys(pendingRotina).forEach(function (k) { S.rotina[k] = pendingRotina[k]; });
    Object.keys(pendingEstudo).forEach(function (k) { S.estudo[k] = pendingEstudo[k]; });

  /* ----- Dia ----- */
  function mealsDone(d) { return MEALS.filter(function (m) { return d.refeicoes && d.refeicoes[m.id]; }); }

  function renderWeek() {
    var ws = S.weekStart, we = addDays(ws, 6);
    var label = ws.getDate() + (ws.getMonth() !== we.getMonth() ? " " + MON_S[ws.getMonth()] : "") + "–" + we.getDate() + " " + MON_S[we.getMonth()];

  function renderHoje() {

    else if (act === "folga") { title = "Descanso"; sub = "Mesma dieta e creatina; só não treina"; }
    else { title = WORKOUTS[act].nome; sub = WORKOUTS[act].ex.length + " exercícios · 60–70 min · por volta das 18h30"; }

    html += '<section class="card hero"><div><div class="when">' + DOW[d.getDay()] + ", " + d.getDate() + " de " + MON[d.getMonth()] + (id === iso(today) ? " · hoje" : "") + '</div>' +

  function lastSession(exId, beforeId) {

  function adviceFor(ex, last) {
    if (!last) {
      if (ex.kind === "tempo") return { cls: "first", text: "Segure " + ex.min + " s com boa postura e suba até " + ex.max + " s.", kg: null };
      return { cls: "first", text: "Primeira vez: escolha um peso que deixe 1–2 repetições sobrando.", kg: null };
    }

        } else {

            '<span class="field"><input id="in-' + ex.id + '-' + i + '-reps" type="text" inputmode="numeric" data-in="reps" data-ex="' + ex.id + '" data-i="' + i + '" value="' + (has ? fmt(st.reps) : "") + '" placeholder="' + ex.min + '–' + ex.max + '" aria-label="Série ' + (i + 1) + ', repetições"><span>reps</span></span>';

  /* ----- Peso ----- */
  function weekly() {
    var groups = {};
    Object.keys(S.pesos).forEach(function (k) {
      var e = S.pesos[k];
      if (!e || e.kg == null) return;
      var w = iso(mondayOf(parseIso(k)));
      (groups[w] = groups[w] || []).push(e.kg);
    });
    return Object.keys(groups).sort().map(function (w) {
      var a = groups[w];
      return { week: w, avg: a.reduce(function (s, x) { return s + x; }, 0) / a.length, n: a.length };
    });
  }
  function weeksBetween(a, b) { return Math.round((parseIso(b) - parseIso(a)) / (7 * 864e5)); }

  function advice(ws) {
    if (ws.length < 3) {
      return { cls: "info", t: "Ainda formando a tendência", d: "Registre o peso por pelo menos 3 semanas (segunda, quarta e sexta). Com isso dá para saber se é hora de ajustar as calorias." };
    }
    var a = ws[ws.length - 3], b = ws[ws.length - 2], c = ws[ws.length - 1];
    var r1 = (b.avg - a.avg) / Math.max(1, weeksBetween(a.week, b.week));
    var r2 = (c.avg - b.avg) / Math.max(1, weeksBetween(b.week, c.week));
    if (r1 > 0.5 && r2 > 0.5) return { cls: "warn", t: "Subindo rápido demais", d: "Mais de 0,5 kg por semana há duas semanas. Tire 50 g de arroz do almoço e do jantar (~130 kcal) e reavalie em duas semanas." };
    if (c.avg - a.avg < 0.2) return { cls: "warn", t: "Peso parado", d: "A média quase não mudou em duas semanas. Some 50 g de arroz no almoço e no jantar (~130 kcal) e reavalie em duas semanas." };
    return { cls: "ok", t: "No ritmo", d: "A meta é ~0,25 kg por semana (≈1 kg por mês). Mantenha o plano como está." };
  }

  function chart(ws) {
    if (ws.length < 2) return '<p class="small muted" style="margin:0">O gráfico aparece a partir da segunda semana com pesagens.</p>';
    var pts = ws.slice(-10);
    var W = 340, H = 170, L = 40, R = 14, T = 16, B = 28;
    var vals = pts.map(function (p) { return p.avg; });
    var lo = Math.floor((Math.min.apply(null, vals) - 0.3) * 2) / 2;
    var hi = Math.ceil((Math.max.apply(null, vals) + 0.3) * 2) / 2;
    if (hi - lo < 1) hi = lo + 1;
    function x(i) { return L + (pts.length === 1 ? 0 : i * (W - L - R) / (pts.length - 1)); }
    function y(v) { return T + (hi - v) * (H - T - B) / (hi - lo); }
    var grid = "", ticks = [lo, (lo + hi) / 2, hi];
    ticks.forEach(function (v) {
      grid += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)" stroke-width="1"/>' +
        '<text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + fmt(v, 1) + '</text>';
    });
    var line = pts.map(function (p, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.avg).toFixed(1); }).join(" ");
    var area = line + " L" + x(pts.length - 1).toFixed(1) + " " + (H - B) + " L" + x(0).toFixed(1) + " " + (H - B) + " Z";
    var labels = pts.map(function (p, i) {
      if (pts.length > 6 && i % 2 && i !== pts.length - 1) return "";
      return '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + shortDate(p.week) + '</text>';
    }).join("");
    var lp = pts[pts.length - 1], li = pts.length - 1;
    var dots = pts.map(function (p, i) { return '<circle cx="' + x(i) + '" cy="' + y(p.avg) + '" r="' + (i === li ? 5 : 3) + '" fill="' + (i === li ? "var(--accent)" : "var(--surface)") + '" stroke="var(--accent)" stroke-width="2"/>'; }).join("");
    return '<div class="chart"><svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Média semanal do peso">' + grid +
      '<path d="' + area + '" fill="var(--accent)" opacity="0.10"/><path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>' +
      dots + '<text x="' + Math.min(x(li), W - R - 2) + '" y="' + (y(lp.avg) - 10) + '" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">' + fmt(lp.avg, 1) + ' kg</text>' + labels + '</svg></div>';
  }

  function renderPeso() {
    var ws = weekly(), adv = advice(ws);
    var entries = Object.keys(S.pesos).filter(function (k) { return S.pesos[k]; }).sort().reverse();
    var lastWaist = null;
    entries.some(function (k) { if (S.pesos[k].cintura != null) { lastWaist = { d: k, v: S.pesos[k].cintura }; return true; } return false; });
    var html = '<section class="section"><h2>Registrar</h2><form class="card form" id="peso-form" autocomplete="off">' +
      '<label class="full">Data<input id="pf-data" type="date" value="' + iso(today) + '" max="' + iso(today) + '"></label>' +
      '<label>Peso (kg)<input id="pf-kg" type="text" inputmode="decimal" placeholder="80,0"></label>' +
      '<label>Cintura (cm)<input id="pf-cint" type="text" inputmode="decimal" placeholder="opcional"></label>' +
      '<button class="primary full" type="submit">Salvar pesagem</button>' +
      '<p class="small muted full" style="margin:0">Pese segunda, quarta e sexta, em jejum e depois do banheiro. Cintura a cada duas semanas, no mesmo ponto da avaliação.</p>' +
      '</form></section>';
    html += '<section class="section"><h2>Tendência <small>média por semana</small></h2><div class="card">' +
      '<div class="advice ' + adv.cls + '"><strong>' + adv.t + '</strong><span class="small">' + adv.d + '</span></div>' + chart(ws) +
      '<p class="small muted" style="margin:0">Referência da avaliação de 03/12/2025: 77,7 kg, 18,5% de gordura e cintura de 88 cm.' +
      (lastWaist ? " Última cintura: " + fmt(lastWaist.v) + " cm (" + shortDate(lastWaist.d) + ")." : "") + '</p></div></section>';
    html += '<section class="section"><h2>Pesagens <small>' + entries.length + '</small></h2><div class="card">';
    if (!entries.length) html += '<p class="small muted" style="margin:0">Nenhuma pesagem ainda. Comece com a de hoje.</p>';
    else {
      html += '<div class="entries">' + entries.slice(0, 40).map(function (k) {
        var e = S.pesos[k], d = parseIso(k);

          '<span class="muted num small">' + (e.cintura != null ? fmt(e.cintura) + " cm" : "") + '</span>' +
          '<button type="button" class="del" data-act="delpeso" data-id="' + k + '" aria-label="Apagar pesagem de ' + shortDate(k) + '">×</button></div>';
      }).join("") + '</div>';
    }
    return html + "</div></section>";
  }

  /* ----- Compras ----- */
  function shopState() {
    var c = S.compras.lista || {};
    return { marcados: c.marcados || {}, semanas: c.semanas === 2 ? 2 : 1 };
  }
  function qtyText(it, w) {
    if (it.q == null) return "";
    var q = it.q * w;
    if (it.u === "g" && q >= 1000) return fmt(Math.round(q / 10) / 100) + " kg";
    if (it.u === "ml" && q >= 1000) return fmt(Math.round(q / 10) / 100) + " L";
    return fmt(Math.round(q * 100) / 100) + " " + it.u;
  }
  function renderCompras() {
    var st = shopState(), w = st.semanas;

    var html = '<section class="section"><h2>Lista de compras <small>' + got + " de " + all.length + ' no carrinho</small></h2>' +
      '<div class="card shop-top"><div class="shop-actions">' +

      html += '<section class="section"><h2>' + g.sec + ' <small>' + n + "/" + g.items.length + '</small></h2><div class="meals">';

      html += '</div></section>';

  }

tos importantes de sistemas distribuídos","https://www.oreilly.com/library/view/projetando-sistemas-distribuidos/9798341637856/ch02.html","semântica de entrega","Projetando Sistemas Distribuídos, 2ª ed.",false,"burns"]],"PWA-04":[["Kleppmann",6,"Replicação","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch06.html","escritas concorrentes e conflitos","Como projetar aplicativos com uso intensivo de dados, 2ª ed.",false,"kleppmann"],["Kleppmann",10,"Consistência e consenso","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch10.html","consistência e ordem entre réplicas","Como projetar aplicativos com uso intensivo de dados, 2ª ed.",false,"kleppmann"]],"IMP-01":[["Kleppmann",5,"Codificação e evolução","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch05.html","codificação binária, esquemas e evolução de formato","Como projetar aplicativos com uso intensivo de dados, 2ª ed.",false,"kleppmann"]],"IMP-02":[["Kleppmann",11,"Processamento em lote","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch11.html","processamento em lote e tolerância a falhas","Como projetar aplicativos com uso intensivo de dados, 2ª ed.",false,"kleppmann"],["Richards e Ford",12,"Estilo de arquitetura do oleoduto","https://www.oreilly.com/library/view/fundamentos-da-arquitetura/9798341637955/ch12.html","arquitetura em pipeline, filtros e transformadores","Fundamentos da arquitetura de software, 2ª ed.",false,"richards-ford"]],"SOC-01":[["Head First Algoritmos",8,"Algoritmos gulosos","https://www.oreilly.com/library/view/head-first-algorithms/9781098174071/ch08.html","heaps e fila de prioridade, base de estruturas ordenadas","Head First: Algoritmos e Estruturas de Dados",true,"hf-algoritmos"],["Burns",7,"Serviços fragmentados","https://www.oreilly.com/library/view/projetando-sistemas-distribuidos/9798341637856/ch07.html","hot shards e partição por chave","Projetando Sistemas Distribuídos, 2ª ed.",false,"burns"]],"SOC-02":[["Kleppmann",2,"Definindo requisitos não funcionais","https://www.oreilly.com/library/view/como-projetar-aplicativos/0642572336226/ch02.html","o caso da timeline de rede social, fan-out e latência em percentis","Como projetar aplicativos com uso intensivo de dados, 2ª ed.",false,"kleppmann"]]},"pratica":{"p1:BASE-01":{"c":"As telas do protótipo navegáveis contra o mock com estado, com os cenários de falha","q":"Desligue o mock no meio de uma sessão de treino e veja o que a tela faz. Depois ligue, um de cada vez, os cenários de falha: sem rede, gateway de pagamento recusando, vaga esgotada na reserva da aula, latência de 3 s e queda do canal de status. Anote qual tela trava, qual mostra erro útil e qual mente ao aluno.","a":["Contrato OpenAPI cobrindo treino, dieta, evolução, agenda, assinatura e conta; trocar o mock pelo Go muda só a URL base","Mock em Hono (TypeScript) que guarda sessões, séries, refeições, pesagens, reservas e assinaturas em memória, com o status de pagamento avançando sozinho no tempo","Cenários de falha ligados por cabeçalho ou painel de dev: sem rede, gateway recusa, vaga esgotada, latência alta e canal de status caindo","Toda resposta do mock é validada contra o OpenAPI nos testes (tela) e as telas do protótipo navegam entre si pelos mesmos links (tela)","O repositório nasce como monorepo, com <code>apps/web</code> e um cliente gerado do OpenAPI em <code>packages/api-client</code>"]},"p1:BASE-03":{"c":"Make verify do front: lint, tipos, unitários, contrato contra o mock e e2e com axe","q":"Pegue um item já \"pronto\" e rode os testes do jeito que o último colega rodou: lint, tipos, unitários, contrato, e2e. Cronometre e veja quantos passos alguém esquece.","a":["<code>make verify</code> roda lint, tipos, testes unitários, testes de contrato contra o mock e os e2e com axe em menos de 5 min (tela)","<code>go test -race</code>, os testes de contrato do Go e um k6 de 30 s entram no mesmo <code>make verify</code> quando o BASE-02 existe (Go)","O CI roda exatamente o mesmo comando e bloqueia o merge quando ele falha","Todo aceite escrito nos itens seguintes vira um teste que este comando executa; item sem teste não está pronto"]},"p1:DS-01":{"c":"Identidade e tokens em camadas, no Storybook","q":"Faça um grep por cores, tamanhos de fonte e espaçamentos fixos nas telas já prontas e conte quantos valores distintos existem para \"o mesmo\" verde e para o mesmo espaço entre o título e a lista de séries.","a":["Identidade documentada no Storybook: logo e área de respiro, paleta, tipografia, escala de espaçamento, raios, sombras, movimento e tom de voz dos textos","Tokens em três camadas: primitivos (<code>green-600</code>), semânticos (<code>color.action.primary</code>) e de componente (<code>button.primary.bg</code>); o componente só lê semântico ou de componente","Uma fonte única, em JSON no formato do W3C Design Tokens, gera CSS custom properties para a web e para o PWA (Style Dictionary ou script próprio em TypeScript)","Um valor fixo de cor ou espaçamento fora dos tokens falha o lint no <code>make verify</code>"]},"p1:CSS-01":{"c":"Escopo de estilos escolhido e medido","q":"Reproduza com CSS global e veja no DevTools quantas regras disputam o título do diário e qual especificidade venceu; depois navegue da biblioteca para o diário e de volta e observe a ordem mudar.","a":["O mesmo Card de exercício feito em CSS Modules, Tailwind e vanilla-extract, num branch, com o CSS entregue por página medido em KB comprimidos","A escolha registrada, funcionando em Server Components sem runtime de estilo no cliente","Lint que impede seletor global fora do arquivo de base"]},"p1:EXE-01":{"c":"A grade em CSR, SSR, SSG e ISR, medida lado a lado e registrada","q":"Meça com o mock respondendo em 300 ms, rede 4G lenta e CPU 4x mais lenta. Rode <code>curl</code> em cada rota e procure o nome de um exercício no HTML: em CSR ele não está lá.","a":["O mesmo componente de grade é usado nas quatro rotas; só muda como os dados chegam","Tabela no Registro de decisão com TTFB, FCP, LCP, INP, CLS, JS enviado e \"o <code>curl</code> traz o nome do exercício?\", pela mediana de 5 execuções","Uma frase por modo dizendo em que tela do app ele será usado","A variante com estático e ilha dinâmica (PPR) medida ao lado das quatro, mesmo que não entre na rota final"]},"p1:EXE-02":{"c":"As 1.500 páginas geradas, com vídeo que não derruba o LCP","q":"Rode o build completo e cronometre. Depois abra uma página no Lighthouse mobile com o vídeo carregando junto do HTML e anote o LCP; ele costuma ser o próprio vídeo.","a":["Build em até 3 min, gerando só os N exercícios mais acessados","Exercício fora do build abre com HTML completo na primeira visita, e a segunda vem do cache","O vídeo tem poster com dimensões reservadas e só começa a carregar perto da viewport ou ao toque; LCP no celular de até 2,5 s","<code>curl</code> na página traz nome, músculos e passos da execução no HTML"]},"p1:EXE-03":{"c":"Filtros por grupo muscular e equipamento, com estado na URL, como únicas partes client","q":"Marque a grade como <code>\"use client\"</code> e meça o JS enviado no bundle analyzer. Esse é o número a vencer. Depois olhe quantos componentes realmente reagem a clique.","a":["Filtros por equipamento e grupo muscular, chips e ordenação são as únicas partes client; a grade e os cards são Server Components","O estado dos filtros vive na URL (<code>?equip=maquina&amp;grupo=quadriceps</code>): recarregar, compartilhar e voltar funcionam","JS da página de até 120 KB gzip, medido no bundle analyzer","INP de até 200 ms com CPU 4x mais lenta"]},"p1:EXE-04":{"c":"Campo \"Buscar exercício\" com debounce, cancelamento e sem corrida entre respostas","q":"Faça a busca com <code>ILIKE '%termo%'</code> sem índice e rode <code>EXPLAIN ANALYZE</code> com os três termos acima. Registre o tempo e o plano; é a linha de base.","a":["Campo \"Buscar exercício\" com debounce de 200 ms, cancelamento da requisição anterior e resposta velha nunca sobrescrevendo a nova (tela)","\"supino inclinad\" encontra \"Supino Inclinado com Halteres\" e \"leg 45\" encontra \"Leg Press 45°\" (Go)","Full-text com <code>unaccent</code>, <code>pg_trgm</code> e sinônimos, com o índice certo, e p95 abaixo de 50 ms a 50 req/s no k6 (Go)","<code>EXPLAIN ANALYZE</code> anexado ao Registro de decisão"]},"p1:HOJ-01":{"c":"Shell estático com treino do dia, próxima refeição e peso como ilhas dinâmicas","q":"Faça a tela inteira em SSR, com a API do mock em 300 ms, e meça o LCP no celular com CPU 4x mais lenta. Depois reparta: o que depende do aluno e o que é igual para todos?","a":["Shell estático (cabeçalho, navegação, esqueleto do dia) com treino do dia, próxima refeição e peso como ilhas dinâmicas em <code>&lt;Suspense&gt;</code>","A home continua pré-renderizada, conferido no output do build","LCP no celular de até 1,5 s e CLS de até 0,1: cada ilha reserva o espaço do conteúdo final","Ilhas dinâmicas completas em até 300 ms depois do carregamento, com o mock em latência normal"]},"p1:DIE-04":{"c":"Páginas de alimento sob demanda, com as mais buscadas no build","q":"","a":["Build gera só as páginas mais buscadas (por exemplo, as 2.000 primeiras) e termina em no máximo 3 min","Alimento fora do build abre com HTML completo na primeira visita, sem esqueleto vazio","A segunda visita ao mesmo alimento vem do cache","Alimento inexistente devolve 404 de verdade, com status correto, e não uma página em branco","Cada página tem título, descrição e dados estruturados da tabela nutricional por 100 g"]},"p1:DIE-05":{"c":"Revalidação por tag disparada pelo mock quando um alimento muda","q":"","a":["Quando o mock avisa que um alimento mudou, só a página dele é revalidada por tag, e o valor novo aparece em até 10 s, sem deploy","Alterar um alimento não regera os outros 299.999"]},"p1:PERF-01":{"c":"Web-vitals enviando LCP, INP e CLS ao mock, com orçamento na CI","q":"Abra o Hoje e a Biblioteca com a rede limitada a 4G lento e CPU 6x mais lenta, e compare com a medição sem limitação no seu notebook. Anote a diferença de LCP antes de mexer em qualquer coisa.","a":["A biblioteca web-vitals envia LCP, INP e CLS reais ao mock, com a rota, o tipo de conexão e o elemento responsável por cada LCP ruim (HOJ-01)","Orçamento por página na CI (Lighthouse CI) que reprova o PR que piorar LCP ou CLS"]},"p1:PERF-02":{"c":"Vídeos, imagens e fontes sem salto de layout","q":"Grave a carga da tela Exercício no painel Performance e marque quando aparecem o texto, a fonte e o vídeo. Ative o realce de mudanças de layout e veja o que se mexe.","a":["Vídeo e imagens com dimensões reservadas (aspect-ratio ou width e height) e poster no lugar do vídeo até ele iniciar","Imagens com next/image e sizes corretos; só a principal com prioridade alta, as demais lazy","Fonte da marca com next/font, subset e fallback ajustado (size-adjust), sem salto na troca","CLS de campo abaixo de 0,1 na tela Exercício, medido pelo PERF-01"]},"p1:CNT-01":{"c":"Cadastro, login, recuperação de senha e perfil com horários e restrições","q":"","a":["Cadastro, login, recuperação de senha e perfil desenhados no protótipo e batendo com ele","Peso e altura viram 80000 g e 1750 mm no contrato; os horários são enviados com o fuso (America/Sao_Paulo), não como instante UTC","E-mail repetido e senha fraca mostram o erro que o mock devolve, em texto ligado ao campo","Maçã e mel entram como alimentos vetados e perna só em máquina como restrição; o DIE-02 e o EXE-05 devem usá-los","A sessão do mock fica num cookie HttpOnly, nunca no localStorage; sair limpa o cache da conta"]},"p1:TRE-01":{"c":"Sessão com séries, cargas, referência da última vez e registro otimista","q":"Com o DevTools em \"Slow 3G\", registre as quatro séries do supino seguidas. Anote quanto tempo cada toque leva para aparecer na tela e o que acontece quando o mock devolve erro na terceira série.","a":["Cada série é registrada em no máximo dois toques depois da primeira: o campo já vem preenchido com a carga e as repetições da última sessão","Alvos de toque de pelo menos 48 px e teclado numérico (<code>inputmode=\"numeric\"</code>), usáveis com o polegar e uma mão","O registro é otimista: a série aparece na hora e, se o envio falhar, fica marcada como \"pendente\" com nova tentativa, sem sumir","O descanso começa sozinho ao registrar a série, sem toque extra","Carga trafega em gramas inteiras (62,5 kg = 62500); a tela só formata"]},"p1:TRE-02":{"c":"Cronômetro com âncora absoluta, Wake Lock e aviso no fim, sem drift com a tela bloqueada","q":"Inicie um descanso de 90 s com um <code>setInterval</code> que soma 1 a cada segundo, bloqueie a tela por 60 s e desbloqueie. Compare o valor mostrado com o tempo real e registre o drift.","a":["O descanso guarda o instante absoluto do fim (início + 90 s) e a cada quadro mostra <code>fim − agora</code>; nunca incrementa um contador","Com a tela bloqueada por 60 s, ao voltar o cronômetro mostra o valor correto, com erro de no máximo 1 s","O Wake Lock mantém a tela acesa durante o descanso e é liberado ao fim ou ao sair da tela","No fim, o aparelho vibra e dispara uma notificação quando a aba estiver em segundo plano","Medir intervalos usa <code>performance.now</code>, que não salta com ajuste do relógio de parede; o instante gravado no histórico fica em UTC"]},"p1:TRE-03":{"c":"Sugestão de carga da próxima sessão e aviso de semana leve, com as regras vindas do mock","q":"Escreva o histórico de quatro sessões do supino (8, 8, 8, 7; depois 8, 8, 8, 8) numa planilha e aplique a regra à mão. Anote cada caso de borda que a planilha não respondeu: série pulada, faixa mudada, equipamento sem incremento de 2,5 kg.","a":["A sessão mostra \"suba para 62,5 kg\" e o aviso de semana leve, vindos do contrato, sem recalcular na tela"]},"p1:TRE-04":{"c":"Calculadora de anilhas por lado, gulosa e com programação dinâmica, com os casos em que o guloso falha","q":"Implemente o guloso e rode em dois conjuntos: o comum e outro com anilhas de 4, 3 e 1 kg, para 6 kg por lado. Anote o resultado do guloso e o ótimo.","a":["A calculadora recebe a carga alvo em gramas, o peso da barra e o conjunto de anilhas, e devolve as anilhas por lado","No conjunto comum, 62500 g retornam 20 kg e 1,25 kg por lado","Com anilhas de 4, 3 e 1 kg para 6 kg por lado, o guloso devolve 4 + 1 + 1 (três anilhas) e a programação dinâmica devolve 3 + 3 (duas), o mínimo","Se a carga for impossível com as anilhas existentes, a tela mostra a carga viável mais próxima abaixo, sem travar","Tudo em gramas inteiras, sem float"]},"p1:TRE-05":{"c":"\"Finalizar treino\" com chave de idempotência gerada no cliente e retry seguro","q":"Dispare cinco <code>POST</code> iguais e simultâneos de \"Finalizar treino\" contra o mock e depois contra o Go. Conte quantas sessões aparecem no histórico e some o volume da semana.","a":["A chave de idempotência é gerada no cliente ao abrir a sessão e reenviada em todo retry; o botão fica travado enquanto a requisição está em andamento","Depois de um timeout, o retry devolve a mesma sessão, sem criar outra"]},"p1:EXE-05":{"c":"Botão \"Trocar\" na sessão com os substitutos vindos do mock","q":"Liste à mão os três substitutos do leg press 45 para esse aluno. Depois tente descrevê-los em regras: o que os liga? Essa lista é o conjunto de teste.","a":["Botão \"Trocar\" na sessão de treino mostra os substitutos vindos do mock, e a troca mantém as séries já feitas (tela)","Grafo de equivalências entre exercícios em Go, com busca em largura, distância máxima e filtro pelas restrições do aluno (Go)","Resposta abaixo de 20 ms e nenhum substituto fora da restrição, testado com o aluno \"perna só em máquina\" (Go)","Resultado ordenado por distância no grafo; empates por ordem estável"]},"p1:DIE-01":{"c":"Refeições do dia com horário, marcação e anel de calorias e macros","q":"","a":["A tela lista as cinco refeições com horário na hora local do aluno, quantidades por alimento e os suplementos fixos (5 g de creatina no café, 30 g de whey na ceia)","Marcar um item como comido atualiza o anel de calorias e macros do dia contra a meta (~3.000 kcal, 170 g de proteína)","Os totais vêm do contrato (macros em décimos de grama); a tela só soma o que foi marcado e formata, nunca refaz a conta da refeição","A próxima refeição fica em destaque; a que já passou do horário sem marcação aparece como atrasada","Todo controle tem rótulo e funciona só com teclado; o anel tem alternativa em texto (\"2.150 de 3.000 kcal\")"]},"p1:DIE-02":{"c":"Trocar um alimento da refeição por equivalentes, sem mostrar o que o aluno não come","q":"Calcule a distância entre o arroz e todos os alimentos da base por uma varredura linear e meça o tempo. Veja quantos dos dez primeiros são alimentos que o aluno não come.","a":["A troca mostra a quantidade equivalente (100 g de arroz ↔ 150 g de batata-doce ↔ 90 g de macarrão) e não exibe o que o aluno não come","Trocar atualiza o anel do dia com os novos macros"]},"p1:DIE-03":{"c":"Busca de alimento por prefixo, recentes e código de barras pela câmera","q":"Rode a busca com <code>ILIKE</code> sobre os 300 mil alimentos num k6 a 50 req/s e meça o p95. Depois pesquise \"fra\" e \"frã\" e veja o que muda.","a":["A busca mostra recentes e favoritos antes de digitar e atualiza os resultados a cada tecla, sem perder a resposta mais nova para uma antiga","Quando <code>BarcodeDetector</code> existir, a câmera lê o código; senão, há campo manual","Estado vazio, carregando e erro têm texto próprio"]},"p1:EVO-01":{"c":"Pesagens, medidas e bioimpedância com média semanal e a sugestão de ajuste","q":"Semeie oito semanas de pesagens com ruído de ±1 kg em torno de uma tendência de 250 g por semana e faça a regra olhar só o último dia. Conte quantas vezes ela sugere ajuste sem necessidade; esse número é o que a média semanal deve derrubar.","a":["O campo aceita \"80,4\" e envia 80400 gramas; cintura vai em milímetros; nenhum float chega ao contrato","O gráfico mostra as pesagens diárias e a média semanal como duas séries, e a sugestão aparece com o motivo (\"média parada há 2 semanas\") e os botões aceitar e dispensar"]},"p1:CNT-02":{"c":"Lista virtualizada com paginação por cursor e posição restaurada","q":"Carregue as 700 sessões em lista simples e meça os nós no DOM e os quadros por segundo com CPU 4x mais lenta. Depois sincronize uma sessão nova com a página 3 aberta e veja o que repete.","a":["No máximo 100 sessões no DOM ao mesmo tempo, com ≥ 55 fps na rolagem com CPU 4x mais lenta","Paginação por cursor (data de finalização e id): com uma sessão sincronizada no meio da navegação, nenhuma repetida e nenhuma perdida","A sessão recém-finalizada (TRE-05) aparece no topo sem duplicar quando a lista é recarregada","Voltar da sessão mantém a posição da lista e o que já estava carregado","A lista é navegável pelo teclado e o leitor de tela anuncia o total"]},"p1:CNT-03":{"c":"Consentimento, compartilhamento com profissionais, exportar e pedir exclusão","q":"","a":["Consentimentos separados por finalidade (peso e medidas, bioimpedância, dieta), sem caixa única de \"aceito tudo\", e recusar não quebra nenhuma tela","O compartilhamento é por profissional e por tipo de dado; revogar tem efeito na próxima requisição do mock","A tela mostra quem tem acesso a quê e desde quando","\"Baixar meus dados\" e \"Excluir minha conta\" abrem um pedido com status, sem prometer um prazo que o mock não deu","A medição de uso (web-vitals) só começa depois do aceite explícito"]},"p1:ROT-01":{"c":"Linha do tempo do dia com o bloco de agora, o próximo e a marcação do que foi feito","q":"Monte a segunda-feira à mão, com os blocos fixos no código da tela, e avance o relógio do mock com <code>POST /__mock/relogio</code> de 18h para 19h05. Anote o que precisa mudar na tela para o bloco de agora trocar sem recarregar e o que acontece com um bloco que cruza a meia-noite, como o sono.","a":["Cada dia é uma sequência ordenada de blocos sem sobreposição, com início e fim formatados no fuso do aluno, e a segunda mostra o metrô de 8h15 às 8h55 e a academia às 19h","O bloco de agora e o próximo ficam destacados e trocam sozinhos quando o relógio do mock avança, sem recarregar a página","Marcar um bloco como feito é otimista, volta ao estado anterior se o envio falhar e pode ser desfeito","A tela de uma semana com 8 tipos de bloco passa no axe sem violação séria e funciona só com teclado, sem depender da cor para distinguir o tipo"]},"p1:ROT-02":{"c":"Editor dos tipos de dia e das exceções (feriado, viagem, semana leve), com a regra vinda do mock","q":"(Go) Escreva a expansão ingênua: somar 7 dias em UTC a partir de segunda 8h15 em <code>America/Sao_Paulo</code>. Rode contra uma viagem a <code>America/New_York</code> que atravessa 8 de março de 2026, quando o horário de verão começa, e veja o bloco ir para 9h15 locais.","a":["O editor mostra os cinco tipos de dia, o tipo de cada dia da semana e as exceções, e salvar o modelo atualiza a semana do ROT-01","Uma exceção de viagem ou feriado tem data inicial e final e aparece na semana sobre o modelo"]},"p1:ROT-03":{"c":"Itens da semana com a leitura de cada um, sugestão do próximo na rota, horas contra a meta e semana leve","q":"(Go) Sem escrever o planejador, monte à mão no Postgres a semana 4 do ciclo com 7h20 estudadas e um item feito fora de ordem. Descubra qual deve ser o \"próximo sugerido\" e se ele muda quando o aluno marca o item da semana seguinte antes de fechar o atual.","a":["A tela mostra os dois itens da semana, cada um com os capítulos que pede e quais já foram lidos, o próximo item sugerido e as horas da semana contra 9h30","Marcar a prática do item como feita marca como lidos os capítulos dele que ainda não estavam","Marcar uma sessão de estudo atualiza as horas e o próximo item sem recarregar"]},"p1:ROT-04":{"c":"Plano das janelas de cozinha com porções para geladeira e congelador e o lembrete de descongelar","q":"(Go) Planeje com uma regra só: \"tudo na geladeira\". Rode para uma semana com escritório na segunda e na terça e liste as porções que seriam comidas no quarto dia ou depois.","a":["O plano mostra, por janela, as porções cozidas, quantas vão à geladeira e quantas ao congelador","O lembrete de passar a marmita do congelador para a geladeira aparece na véspera do dia em que ela será comida"]},"p1:AGE-01":{"c":"Grade da semana com reservar, cancelar e lista de espera","q":"","a":["A grade mostra a semana no fuso do aluno, com aulas e raias por horário, e abre já na semana atual","Cada célula tem um estado em texto, além da cor: livre, últimas vagas (com o número), lotada, reservada por você, na fila (com a posição)","Reservar e cancelar respondem na hora e voltam ao estado anterior, com aviso, se o servidor recusar","Cancelar pede confirmação e mostra o que acontece com a vaga e com a fila","Lotada oferece \"Entrar na lista de espera\"; o fluxo inteiro funciona só com teclado e leitor de tela"]},"p1:AGE-02":{"c":"O 409 da última vaga explicado e a oferta da lista de espera","q":"Dispare 200 reservas concorrentes contra uma raia com 1 vaga, usando k6, e conte as confirmadas. Se o resultado for maior que 1, o bug está reproduzido.","a":["O 409 explica que a última vaga acabou de ser ocupada e oferece entrar na lista de espera, mantendo a aula e o horário escolhidos","Toque duplo no botão não envia duas reservas; a segunda tentativa reaproveita a mesma chave de idempotência"]},"p1:ASS-01":{"c":"Planos, cupom, Pix com QR e contagem regressiva, cartão e resumo","q":"","a":["A assinatura é desenhada no protótipo antes do código, e a tela bate com ele","O total vem do contrato em centavos (7990 ou 79900, menos o cupom); a tela só formata e nunca recalcula","Cupom recusado mostra o motivo que o mock devolve: vencido, já usado ou fora do plano","O Pix mostra o código copia e cola, o QR e a contagem de 30 minutos no fuso do aluno; o cartão mostra o resumo antes do botão de confirmar","Todo campo tem rótulo e erro em texto ligado a ele, e o fluxo funciona só com teclado"]},"p1:ASS-04":{"c":"Status do pagamento pelo SSE do mock, com reconexão e fallback","q":"","a":["A mudança de status aparece em ≤ 2 s depois do evento","A rede cai por 30 s e volta: a tela reconecta com Last-Event-ID e não perde nem repete o evento","Se o SSE falhar, a tela cai para polling a cada 3 s; no máximo 1 conexão por aba e nenhuma com a aba oculta há mais de 1 min"]},"p1:ASS-05":{"c":"PENDENTE durante a queda simulada e \"Tentar outro pagamento\" no RECUSADO","q":"","a":["Durante a queda a tela mostra PENDENTE com texto claro (\"estamos confirmando\") e sem botão de pagar de novo","No RECUSADO aparece \"Tentar outro pagamento\", que gera uma nova chave de idempotência"]},"p1:DS-02":{"c":"Modo escuro e marca da academia parceira trocando só o mapa semântico","q":"Troque só o mapa de semânticos para um tema escuro e liste todo componente que ficou ilegível ou com contraste errado; depois faça o mesmo com a paleta de uma academia fictícia.","a":["Tema escuro e marca da academia parceira trocam apenas tokens semânticos; nenhum componente muda","Nenhum flash de tema errado na primeira pintura, inclusive nas páginas estáticas; sem preferência salva, o tema segue o sistema do aparelho","Teste automático de contraste: todo par texto/fundo semântico passa AA (4,5:1) nos dois temas e em todas as marcas do seed","A marca é escolhida pela academia do aluno, não por um parâmetro que o usuário possa editar na URL"]},"p1:DS-03":{"c":"Card, Botão e Campo com a API nova","q":"Liste as combinações de props realmente usadas nas telas e quantas delas o Storybook cobre; some as que nunca foram renderizadas juntas.","a":["Card reescrito como componente composto (<code>Card</code>, <code>Card.Media</code>, <code>Card.Series</code>, <code>Card.Badge</code>) ou com slots, cobrindo todas as telas sem prop booleana nova","Variantes declaradas num só lugar e tipadas; uma combinação inválida não compila","Botão e Campo com todos os estados (hover, foco visível, desabilitado, carregando, erro), usáveis só com teclado e com leitor de tela","O Campo de carga em quilos mostra \"62,5 kg\" mas entrega 62500 gramas, e o rótulo e a mensagem de erro são lidos juntos ao focar"]},"p1:CMP-02":{"c":"Só o que interage como Client Component, com o JS medido","q":"Meça o JS entregue e o tempo de hidratação da sessão de treino com tudo no cliente, num celular de gama média com rede lenta.","a":["Só o que interage é Client Component (registro de série, cronômetro, teclado numérico); a lista de exercícios continua no servidor e entra como <code>children</code>","Um Client Component que recebe Server Components como <code>children</code>, como o painel lateral da sessão mostrando a lista renderizada no servidor","Nenhum módulo de acesso a dados chega ao cliente por acidente (<code>server-only</code> nesses módulos)","JS da rota de Treino ≤ 120 KB comprimidos, medido antes e depois e registrado"]},"p1:CSS-03":{"c":"Card por container queries na grade, na sessão e no painel","q":"Coloque o card nos três contêineres com a mesma largura de tela e capture os três.","a":["O card se adapta pelo próprio contêiner (container queries), sem prop de tamanho","Tipografia e espaçamento fluidos a partir dos tokens, com <code>clamp()</code>, sem saltos entre breakpoints","Na biblioteca e na sessão de treino, o card tem a mesma estrutura nas larguras de 280, 360 e 640 px, com capturas no Storybook","Cada contêiner declara <code>container-type</code>, e a regra fica documentada junto do componente"]},"p1:PERF-03":{"c":"Filtro sem tarefa longa, com INP de campo abaixo de 200 ms","q":"Grave a interação no painel Performance com CPU 4x mais lenta, ache a tarefa longa e veja se o tempo foi gasto no handler, no cálculo do filtro ou na renderização da lista.","a":["O checkbox responde na hora e a lista atualiza logo depois, com useTransition ou useDeferredValue","Nenhuma tarefa acima de 50 ms disparada pelo filtro no perfil; o cálculo longo é quebrado com scheduler.yield","INP de campo abaixo de 200 ms no diário, medido pelo PERF-01","A lista usa os mesmos dados do DIE-03, sem duplicar a busca"]},"p1:PRO-01":{"c":"Telas de treinador, nutricionista, gestor e suporte, com papéis vindos do mock","q":"","a":["Telas de treinador (adesão, cargas, próximos treinos), nutricionista (dieta e substituições), gestor (avisos) e suporte (assinaturas), desenhadas antes","O menu e as ações vêm dos papéis que o mock devolve: trocar o papel esconde o que não é dele, e a ação proibida chamada direto recebe 403","A lista de 40 alunos mostra só quem compartilhou aquele dado; aluno que revogou some na próxima carga","Toda alteração pede confirmação e mostra quem mudou o quê e quando, a partir do registro de auditoria do mock","Nenhum código do painel entra no bundle nem no cache das telas do aluno"]},"p1:CMP-01":{"c":"Hoje por blocos, editados no painel do gestor","q":"Simule cinco pedidos do gestor e meça quanto cada um leva do pedido ao ar com deploy.","a":["O Hoje vem de um JSON de blocos (tipo + props) como união discriminada em TypeScript, validada por schema; cada tipo tem um componente registrado","Bloco desconhecido ou inválido não derruba a página: é omitido e vai para o log","Só os blocos presentes entram no bundle (import por tipo), e o Hoje continua pré-renderizado, com revalidação por tag quando o gestor publica no painel do PRO-01","A refeição e o treino do dia seguem fixos no código; o gestor compõe apenas o que vem depois deles"]},"p1:CMP-03":{"c":"Visualização rápida do exercício como rota interceptada","q":"Faça o modal com estado local e veja o que acontece ao recarregar, ao voltar e ao compartilhar o link.","a":["Modal por rota paralela com interceptação: a URL é a do exercício, voltar fecha o modal e recarregar abre a página completa","Filtros do EXE-03, grade e modal com <code>loading</code> e <code>error</code> próprios, sem um derrubar o outro","Foco preso no modal e devolvido ao card ao fechar; <code>Esc</code> fecha","Abrir o link direto e abrir pelo modal mostram o mesmo conteúdo, vindo da mesma rota"]},"p1:CSS-02":{"c":"Player de terceiro isolado em camadas e Shadow DOM","q":"Carregue o player na página do exercício e liste o que vazou nos dois sentidos; meça o LCP com e sem ele.","a":["O CSS do app organizado em <code>@layer</code> (reset, tokens, componentes, utilitários), com o CSS de terceiros numa camada de prioridade menor","O player isolado em Shadow DOM, com o registro dizendo o que o isolamento custa em acessibilidade e em SEO","O LCP da página do exercício continua ≤ 2,5 s: o player carrega sob demanda e o pôster ocupa o espaço reservado","Nenhum <code>!important</code> fora da camada de utilitários"]},"p1:DS-04":{"c":"Versões e regressão visual na CI","q":"Faça a mudança e rode a captura de tela de cada componente nos temas do DS-02; anote o que ela pega e o que deixa passar, como animações e fontes carregando tarde.","a":["Pacote versionado em semver com changelog gerado por Changesets; mudança visual é ao menos minor, quebra de API é major","Regressão visual por componente, tema e marca na CI, com aprovação explícita de cada diferença","Token ou componente obsoleto marcado como deprecated, com aviso no lint e data de remoção","Política de breaking change escrita num registro de decisão: o que conta como quebra e quantas versões o aviso dura"]},"p1:EVO-02":{"c":"Volume por grupo muscular e cargas por exercício com redução de pontos e INP baixo","q":"Renderize os 40 mil pontos em SVG com CPU 4x mais lenta no DevTools e grave o perfil. Anote o tempo de renderização inicial, o número de nós no DOM e o INP ao passar o dedo pela série.","a":["O servidor entrega a série já agregada por semana; o cliente nunca recebe os 40 mil pontos brutos de uma vez","O cliente reduz para no máximo 800 pontos com LTTB, preservando picos e vales, e recalcula ao dar zoom","SVG até 2.000 pontos e canvas acima disso, escolhido por uma regra em código e testada","INP de campo abaixo de 200 ms ao arrastar o dedo, sem tarefa longa acima de 50 ms no perfil","Cada ponto é alcançável pelo teclado e a mesma série está disponível como tabela, com valores lidos pelo leitor de tela"]},"p1:ROT-07":{"c":"Tela de revisão juntando estudo, treino, dieta e peso, com dados do mock","q":"(Go) Escreva a revisão como uma consulta que une estudo, treinos, refeições e pesagens, e meça o tempo com o histórico do seed de 5 anos. Anote quantas tabelas ela toca e o que quebra se um módulo mudar o schema.","a":["A tela mostra horas de estudo contra 9h30, itens fechados, treinos e natação feitos, refeições marcadas, média de peso e pendências da semana","Uma semana sem pesagem mostra \"sem dados\" na média, não zero"]},"p2:BASE-02":{"c":"Monólito modular em Go respondendo ao contrato, com Postgres, migrações e seed do Dia 0","q":"Rode a suíte de contrato do front contra o Go vazio e conte quantos testes falham. Essa lista é o seu backlog de endpoints, e é melhor descobri-la agora do que na integração.","a":["A mesma suíte de testes de contrato passa no mock e no Go","<code>docker compose up</code> sobe Postgres, migrações, seed do Dia 0 e a API, do zero, em menos de 2 min","Monólito modular com módulos treino, dieta, evolução, agenda, assinatura e conta; um módulo não importa o pacote interno de outro (checado por teste de arquitetura)","Carga em gramas, peso em gramas, medidas em milímetros e dinheiro em centavos, sempre inteiros, tanto no esquema quanto no JSON"]},"p2:BASE-03":{"c":"Go test -race, testes de contrato do Go e um k6 de 30 s entram no make verify","q":"Pegue um item já \"pronto\" e rode os testes do jeito que o último colega rodou: lint, tipos, unitários, contrato, e2e. Cronometre e veja quantos passos alguém esquece.","a":["<code>make verify</code> roda lint, tipos, testes unitários, testes de contrato contra o mock e os e2e com axe em menos de 5 min (tela)","<code>go test -race</code>, os testes de contrato do Go e um k6 de 30 s entram no mesmo <code>make verify</code> quando o BASE-02 existe (Go)","O CI roda exatamente o mesmo comando e bloqueia o merge quando ele falha","Todo aceite escrito nos itens seguintes vira um teste que este comando executa; item sem teste não está pronto"]},"p2:BD-01":{"c":"EXPLAIN ANALYZE e índices certos para os filtros da biblioteca e do histórico","q":"Rode <code>EXPLAIN (ANALYZE, BUFFERS)</code> antes de criar qualquer índice e anote linhas estimadas contra reais, buffers lidos e o nó mais caro do plano.","a":["P95 da listagem filtrada abaixo de 50 ms com a massa grande, medido no k6","O plano usa index scan ou index-only scan, e o registro explica por que a ordem das colunas do índice composto importa","Um índice parcial para exercícios ativos e um índice de cobertura para a listagem, com o tamanho de cada um comparado ao índice completo","Um índice que você criou e o planner ignorou, com o motivo (seletividade ou estatística desatualizada)"]},"p2:EXE-04":{"c":"Busca com full-text, trigramas e sinônimos no Postgres, com p95 abaixo de 50 ms","q":"Faça a busca com <code>ILIKE '%termo%'</code> sem índice e rode <code>EXPLAIN ANALYZE</code> com os três termos acima. Registre o tempo e o plano; é a linha de base.","a":["Campo \"Buscar exercício\" com debounce de 200 ms, cancelamento da requisição anterior e resposta velha nunca sobrescrevendo a nova (tela)","\"supino inclinad\" encontra \"Supino Inclinado com Halteres\" e \"leg 45\" encontra \"Leg Press 45°\" (Go)","Full-text com <code>unaccent</code>, <code>pg_trgm</code> e sinônimos, com o índice certo, e p95 abaixo de 50 ms a 50 req/s no k6 (Go)","<code>EXPLAIN ANALYZE</code> anexado ao Registro de decisão"]},"p2:HOJ-03":{"c":"Resumo semanal por aluno sem varrer o histórico, com o custo de cada estratégia medido","q":"Gere o histórico de 5 anos de um aluno (cerca de 3 treinos por semana, 20 séries cada) e rode a consulta de resumo com <code>EXPLAIN ANALYZE</code>. Depois rode a mesma consulta com 50 req/s no k6 e veja o p95 subir.","a":["<code>GET /resumo-semana</code> com p95 de até 20 ms a 50 req/s, sem varrer o histórico do aluno","O resumo reflete uma série registrada em até 5 s (ou o atraso medido está registrado)","Recalcular não bloqueia a escrita de séries","Registro de decisão com o custo medido de cada estratégia: tempo de leitura, custo de escrita e atraso"]},"p2:BD-02":{"c":"Write skew do limite semanal reproduzido e resolvido, com retry de serialização","q":"Reproduza com duas sessões psql lado a lado em <code>READ COMMITTED</code>, <code>REPEATABLE READ</code> e <code>SERIALIZABLE</code>, e anote em qual nível o limite estoura.","a":["Teste em Go com 100 goroutines reservando para o mesmo aluno nunca passa de 3 aulas na semana","Registro com a tabela das duas sessões e a anomalia vista em cada nível","Retry de falha de serialização (SQLSTATE <code>40001</code>) com limite de tentativas e métrica","A versão que materializa o conflito (linha de contagem por aluno e semana) passa no mesmo teste sem <code>SERIALIZABLE</code>"]},"p2:AGE-02":{"c":"200 reservas concorrentes para 1 vaga: 1 confirmada, 199 recebem 409","q":"Dispare 200 reservas concorrentes contra uma raia com 1 vaga, usando k6, e conte as confirmadas. Se o resultado for maior que 1, o bug está reproduzido.","a":["200 reservas concorrentes para 1 vaga: 1 confirmada e 199 recebem 409","Aulas e raias diferentes não disputam lock entre si","O registro compara pelo menos duas estratégias medidas, com p95 e taxa de retry de cada uma"]},"p2:BD-03":{"c":"Deadlock reproduzido, lido no log e eliminado com ordem de lock","q":"Gere carga com reordenações em ordem aleatória sobre o mesmo treino; capture o deadlock no log e as linhas de <code>pg_locks</code> durante a espera.","a":["Zero deadlocks em 10 minutos de carga com reordenações concorrentes","Toda transação que trava várias linhas as trava em ordem fixa de id, com um teste que embaralha a entrada","Transações curtas: nenhuma chamada externa ou espera de usuário dentro delas","Tempo de espera por lock no dashboard, a partir de <code>pg_stat_activity</code>, e o erro <code>40P01</code> tratado com retry limitado"]},"p2:TRE-05":{"c":"Chaves de idempotência na mesma transação da sessão, com resposta repetida idêntica","q":"Dispare cinco <code>POST</code> iguais e simultâneos de \"Finalizar treino\" contra o mock e depois contra o Go. Conte quantas sessões aparecem no histórico e some o volume da semana.","a":["5 requisições iguais e simultâneas: 1 sessão, 1 evento, mesma resposta nas 5","A chave e a resposta ficam numa tabela de idempotência gravada na mesma transação da sessão","Um novo treino legítimo, com chave nova, gera nova sessão; passa também via <code>curl</code>"]},"p2:TRE-06":{"c":"Lost update reproduzido e resolvido com versão otimista e 409 explicado","q":"Escreva um teste em Go que abre a sessão em duas goroutines, altera séries diferentes e salva as duas com <code>UPDATE</code> direto. Mostre que uma alteração se perde, e repita 100 vezes para ver a frequência.","a":["O teste reproduz o lost update antes da correção, com a taxa de perdas medida","A linha da sessão tem uma coluna <code>versao</code>; o <code>UPDATE</code> só vale se a versão enviada for a atual","Quando a versão não bate, a API devolve 409 com a versão atual e a mensagem \"este treino foi alterado em outro aparelho\"","Com a correção, 100 execuções concorrentes não perdem nenhuma alteração confirmada","A decisão e a medição ficam no registro de decisão (ADR)"]},"p2:TRE-03":{"c":"Motor de progressão em Go sobre o histórico, com testes de tabela","q":"Escreva o histórico de quatro sessões do supino (8, 8, 8, 7; depois 8, 8, 8, 8) numa planilha e aplique a regra à mão. Anote cada caso de borda que a planilha não respondeu: série pulada, faixa mudada, equipamento sem incremento de 2,5 kg.","a":["O motor recebe o histórico e a faixa e devolve a próxima carga em gramas: 60000 permanece com 8, 8, 8, 7 e vira 62500 com 8, 8, 8, 8","O incremento é o menor disponível no equipamento (barra com anilha de 1,25 kg = 2500 g por par; máquina com pino de 5 kg)","Testes de tabela cobrem série pulada, sessão incompleta, faixa mudada e a semana leve","Dois cálculos com o mesmo histórico dão o mesmo resultado"]},"p2:DIE-02":{"c":"Substitutos por vizinho mais próximo em macros, com restrições e índice que não varre 300 mil linhas","q":"Calcule a distância entre o arroz e todos os alimentos da base por uma varredura linear e meça o tempo. Veja quantos dos dez primeiros são alimentos que o aluno não come.","a":["Os vizinhos mais próximos são calculados no espaço (carboidrato, proteína, gordura) em décimos de grama, com a quantidade ajustada para a mesma caloria","Alimentos restritos (maçã, mel) nunca aparecem, nem como segunda opção","A consulta não varre as 300 mil linhas: p95 abaixo de 50 ms a 50 req/s no k6, com <code>EXPLAIN ANALYZE</code> anexado"]},"p2:DIE-03":{"c":"Busca por prefixo e código de barras em 300 mil alimentos com p95 abaixo de 50 ms","q":"Rode a busca com <code>ILIKE</code> sobre os 300 mil alimentos num k6 a 50 req/s e meça o p95. Depois pesquise \"fra\" e \"frã\" e veja o que muda.","a":["Busca por prefixo e por código de barras com p95 abaixo de 50 ms a 50 req/s no k6, com <code>EXPLAIN ANALYZE</code> anexado","\"fra\" encontra \"frango grelhado\" mesmo sem acento; recentes são listados por aluno"]},"p2:EXE-05":{"c":"Grafo de equivalências em Go com BFS, restrições do aluno e resposta abaixo de 20 ms","q":"Liste à mão os três substitutos do leg press 45 para esse aluno. Depois tente descrevê-los em regras: o que os liga? Essa lista é o conjunto de teste.","a":["Botão \"Trocar\" na sessão de treino mostra os substitutos vindos do mock, e a troca mantém as séries já feitas (tela)","Grafo de equivalências entre exercícios em Go, com busca em largura, distância máxima e filtro pelas restrições do aluno (Go)","Resposta abaixo de 20 ms e nenhum substituto fora da restrição, testado com o aluno \"perna só em máquina\" (Go)","Resultado ordenado por distância no grafo; empates por ordem estável"]},"p2:EVO-01":{"c":"Médias móveis e regra de ajuste no Go, com série temporal bem indexada","q":"Semeie oito semanas de pesagens com ruído de ±1 kg em torno de uma tendência de 250 g por semana e faça a regra olhar só o último dia. Conte quantas vezes ela sugere ajuste sem necessidade; esse número é o que a média semanal deve derrubar.","a":["A média semanal usa a semana no fuso do aluno e dá o mesmo número que o mock para a série do seed","A regra sugere +130 kcal uma única vez por período parado e não repete enquanto a anterior não for aceita ou dispensada","A série de cinco anos de um aluno volta em p95 ≤ 20 ms, com índice por aluno e instante da medição"]},"p2:HOJ-02":{"c":"Agenda de refeições e treinos calculada no servidor com o fuso do aluno e relógio injetável nos testes","q":"Escreva um teste que calcula a agenda de um aluno de São Paulo e a mesma agenda depois de ele trocar o fuso para Lisboa, e outro que atravessa a virada do horário de verão. Veja quantas refeições mudam de instante sem mudar de hora local.","a":["Instantes guardados em UTC; refeições e treinos guardados como hora local mais o fuso IANA do aluno (<code>America/Sao_Paulo</code>)","A agenda do dia é calculada no servidor com as regras do tz database; viajar para Lisboa mantém café às 8h45 locais","Dia de mudança de horário gera as refeições uma vez cada, sem sumir nem duplicar","Durações medidas com relógio monotônico; o relógio é uma interface injetável e os testes usam um relógio falso"]},"p2:ROT-02":{"c":"Modelos de dia com RRULE expandidos no fuso do aluno, com exceções e testes de horário de verão","q":"(Go) Escreva a expansão ingênua: somar 7 dias em UTC a partir de segunda 8h15 em <code>America/Sao_Paulo</code>. Rode contra uma viagem a <code>America/New_York</code> que atravessa 8 de março de 2026, quando o horário de verão começa, e veja o bloco ir para 9h15 locais.","a":["A regra <code>FREQ=WEEKLY;BY
